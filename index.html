<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Héctor Mayol</title>
<meta name="description" content="Tarjeta de presentación de Héctor Mayol, chófer repartidor en Voldistribución Baleares (Mallorca).">
<style>
  /* Tarjeta centrada sobre fondo de mar, con ola en la cabecera */
  :root {
    --mar-oscuro: #0b3c5d;
    --mar: #1167a8;
    --turquesa: #1fb5c4;
    --fondo-1: #0b3c5d;
    --fondo-2: #082a42;
    --tarjeta: #ffffff;
    --chip: #eef5f9;
    --campo: #f8fbfd;
    --borde: #e3ebf2;
    --texto: #12263a;
    --texto-suave: #4f6378;
    --acento-texto: #1167a8;
    --whatsapp: #1a8f47;
    --sobre-color: #ffffff;
    --aviso-fondo: #12263a;
    --aviso-texto: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fondo-1: #071f31;
      --fondo-2: #04131f;
      --tarjeta: #0f2a40;
      --chip: #173a56;
      --campo: #12324b;
      --borde: #23496a;
      --texto: #e8f1f8;
      --texto-suave: #a5bccf;
      --acento-texto: #5fc8e0;
      --aviso-fondo: #e8f1f8;
      --aviso-texto: #0b3c5d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --fondo-1: #071f31;
    --fondo-2: #04131f;
    --tarjeta: #0f2a40;
    --chip: #173a56;
    --campo: #12324b;
    --borde: #23496a;
    --texto: #e8f1f8;
    --texto-suave: #a5bccf;
    --acento-texto: #5fc8e0;
    --aviso-fondo: #e8f1f8;
    --aviso-texto: #0b3c5d;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    color: var(--texto);
    background:
      radial-gradient(circle at 15% 10%, rgba(31,181,196,.35), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(17,103,168,.45), transparent 50%),
      linear-gradient(160deg, var(--fondo-1), var(--fondo-2));
    background-color: var(--fondo-2);
  }

  .tarjeta {
    width: 100%;
    max-width: 420px;
    background: var(--tarjeta);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.5);
    animation: entrar .6s ease-out;
  }
  @keyframes entrar {
    from { transform: translateY(16px); }
    to   { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tarjeta { animation: none; }
    * { transition: none !important; }
  }

  .cabecera {
    position: relative;
    height: 120px;
    background: linear-gradient(120deg, var(--mar), var(--turquesa));
  }
  /* Ola decorativa */
  .cabecera svg {
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 100%;
    height: 40px;
    fill: var(--tarjeta);
  }

  .avatar {
    width: 112px;
    height: 112px;
    margin: -64px auto 0;
    position: relative;
    border-radius: 50%;
    border: 5px solid var(--tarjeta);
    background: linear-gradient(135deg, var(--mar-oscuro), var(--mar));
    color: var(--sobre-color);
    display: grid;
    place-items: center;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 1px;
    box-shadow: 0 8px 20px rgba(11,60,93,.3);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .contenido { padding: 16px 28px 28px; text-align: center; }

  h1 { font-size: 26px; font-weight: 700; text-wrap: balance; }
  .puesto { margin-top: 4px; color: var(--acento-texto); font-weight: 600; }
  .empresa { margin-top: 2px; color: var(--texto-suave); font-size: 15px; }

  .datos {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 20px 0 24px;
    list-style: none;
  }
  .datos li {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--chip);
    font-size: 13.5px;
  }
  .datos svg { width: 15px; height: 15px; color: var(--acento-texto); flex: none; }

  .email {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 6px 6px 16px;
    border: 1px solid var(--borde);
    border-radius: 14px;
    background: var(--campo);
  }
  .email span {
    flex: 1;
    min-width: 0;
    text-align: left;
    font-size: 15px;
    overflow-wrap: anywhere;
    user-select: all;
  }

  button, .boton {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    transition: transform .15s, box-shadow .15s, background .2s;
  }
  button:active, .boton:active { transform: scale(.97); }
  button:focus-visible, .boton:focus-visible { outline: 3px solid var(--turquesa); outline-offset: 2px; }

  .copiar {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: var(--mar);
    color: var(--sobre-color);
    font-size: 14px;
    font-weight: 600;
    flex: none;
  }
  .copiar:hover { background: var(--mar-oscuro); }
  .copiar.ok { background: var(--whatsapp); }
  .copiar-icono {
    display: grid; place-items: center; flex: none;
    width: 40px; height: 40px;
    background: transparent; color: var(--acento-texto);
  }
  .copiar-icono:hover { background: var(--chip); }
  .copiar-icono.ok { color: var(--whatsapp); }
  .copiar-icono svg { width: 18px; height: 18px; }
  .correo { display: flex; width: 100%; margin-top: 10px; background: var(--mar); }
  .copiar svg { width: 16px; height: 16px; }

  .acciones {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .boton {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    color: var(--sobre-color);
  }
  .boton svg { width: 18px; height: 18px; }
  .boton:hover { box-shadow: 0 6px 16px rgba(0,0,0,.18); transform: translateY(-1px); }
  .llamar { background: var(--mar-oscuro); }
  .guardar { display: flex; width: 100%; margin-top: 10px; background: var(--chip); color: var(--acento-texto); border: 1px solid var(--borde); }
  .whatsapp { background: var(--whatsapp); }

  .telefono { margin-top: 14px; color: var(--texto-suave); font-size: 14px; }
  .telefono strong { color: var(--texto); font-weight: 600; user-select: all; }


  .aviso {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 20px);
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--aviso-fondo);
    color: var(--aviso-texto);
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  .aviso.visible { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 380px) {
    .contenido { padding: 16px 18px 24px; }
    .email { flex-direction: column; align-items: stretch; padding: 10px; }
    .email span { text-align: center; }
    .copiar { justify-content: center; }
  }
</style>
</head>
<body>

<main class="tarjeta">
  <div class="cabecera">
    <svg viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 20 C 80 45, 160 0, 240 18 S 360 35, 400 15 L400 40 L0 40 Z"/>
    </svg>
  </div>

  <!-- Para poner foto: sustituir "HM" por <img src="..." alt="Héctor Mayol"> -->
  <div class="avatar">HM</div>

  <div class="contenido">
    <h1>Héctor Mayol</h1>
    <p class="puesto">Chófer repartidor</p>
    <p class="empresa">Voldistribución Baleares</p>

    <ul class="datos">
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
        Mallorca
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M8.5 13.5 7 22l5-3 5 3-1.5-8.5"/></svg>
        20 años de experiencia
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2"/><path d="M14 10h4M14 14h4"/></svg>
        Carné A, B, C · CAP
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        Español
      </li>
    </ul>

    <div class="email">
      <span id="email">hectormayol@gmail.com</span>
      <button class="copiar-icono" id="copiar" type="button" aria-label="Copiar email" title="Copiar email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
    </div>

    <a class="boton correo" href="mailto:hectormayol@gmail.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      Enviar email
    </a>

    <div class="acciones">
      <a class="boton llamar" href="tel:+34615561830">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
        Llamar
      </a>
      <a class="boton whatsapp" href="https://wa.me/34615561830" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-.9 1.2-.3.2-.6.1a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.6-2c-.2-.3 0-.5.1-.6l.4-.5.3-.5v-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.7 3.7 0 0 0-1.1 2.7 6.5 6.5 0 0 0 1.3 3.4 14.6 14.6 0 0 0 5.6 5c2.1.8 2.1.6 2.5.5a3.3 3.3 0 0 0 2.2-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.2-.3-.2-.6-.4zM12 21.8a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8zm8.4-18.3A11.8 11.8 0 0 0 1.8 17.7L.1 24l6.4-1.7A11.8 11.8 0 0 0 24 12a11.7 11.7 0 0 0-3.6-8.5z"/></svg>
        WhatsApp
      </a>
    </div>

    <button class="boton guardar" id="guardar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>
      Guardar contacto
    </button>

    <p class="telefono">Tel. <strong>615 561 830</strong></p>

  </div>
</main>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script>
  const EMAIL = "hectormayol@gmail.com";
  const boton = document.getElementById("copiar");
    const aviso = document.getElementById("aviso");

  function mostrarAviso(texto) {
    aviso.textContent = texto;
    aviso.classList.add("visible");
    clearTimeout(mostrarAviso.t);
    mostrarAviso.t = setTimeout(() => aviso.classList.remove("visible"), 2000);
  }

  // Alternativa para navegadores que no permiten la API del portapapeles
  function copiarAntiguo(texto) {
    const campo = document.createElement("textarea");
    campo.value = texto;
    campo.style.position = "fixed";
    campo.style.opacity = "0";
    document.body.appendChild(campo);
    campo.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    campo.remove();
    return ok;
  }

  // Si no se puede copiar, deja el email seleccionado para copiarlo a mano
  function seleccionarEmail() {
    const rango = document.createRange();
    rango.selectNodeContents(document.getElementById("email"));
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(rango);
  }

  async function copiar(texto) {
    try { await navigator.clipboard.writeText(texto); return true; }
    catch { return copiarAntiguo(texto); }
  }

  boton.addEventListener("click", async () => {
    if (await copiar(EMAIL)) {
      boton.classList.add("ok");
      mostrarAviso("Email copiado");
      setTimeout(() => boton.classList.remove("ok"), 2000);
    } else {
      seleccionarEmail();
      mostrarAviso("Email seleccionado: cópialo a mano");
    }
  });

  // Descarga la ficha de contacto (.vcf) para guardarla en la agenda del móvil
  document.getElementById("guardar").addEventListener("click", () => {
    const vcard = [
      "BEGIN:VCARD", "VERSION:3.0",
      "N;CHARSET=UTF-8:Mayol;Héctor;;;", "FN;CHARSET=UTF-8:Héctor Mayol",
      "ORG;CHARSET=UTF-8:Voldistribución Baleares", "TITLE;CHARSET=UTF-8:Chófer repartidor",
      "TEL;TYPE=CELL:+34615561830", "EMAIL;TYPE=INTERNET:hectormayol@gmail.com",
      "ADR;TYPE=WORK;CHARSET=UTF-8:;;;Mallorca;;;España", "END:VCARD", ""
    ].join("\r\n");
    const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Hector-Mayol.vcf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    mostrarAviso("Abre el archivo descargado para guardar el contacto");
  });
</script>

</body>
</html>
