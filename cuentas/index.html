function calc(list){
  const t={ingreso:0,fijo:0,variable:0,neutro:0,cat:{}};
  list.forEach(x=>{
    const c=catById(x.categoria);const g=c.grupo||'variable';
    const v=g==='ingreso'?(x.tipo==='ingreso'?x.importe:-x.importe):(x.tipo==='gasto'?x.importe:-x.importe);
    t[g]=(t[g]||0)+v;t.cat[c.id]=(t.cat[c.id]||0)+v;
  });
  t.gastos=t.fijo+t.variable;t.ahorro=t.ingreso-t.gastos;
  return t;
}

/* ===================== navegación y render ===================== */
function ir(v){vista=v;render();window.scrollTo(0,0)}
function render(sinGuardarForm){
  if(!sinGuardarForm&&vista==='apuntar'&&$('#fImp'))leerForm();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===vista));
  const f={apuntar:vApuntar,movs:vMovs,resumen:vResumen,importar:vImportar,ajustes:vAjustes}[vista];
  $('#app').innerHTML=f();
  estadoSync();
  if($('#mercaBox'))cargarMercadona(vm.y+'-'+pad(vm.m+1));
}

/* ===================== Productos de Mercadona (desde la hoja de Google) ===================== */
const GRUPO_ICONO={'Carne y pescado':'🥩','Fruta y verdura':'🥦','Lácteos y huevos':'🥛','Pan y bollería':'🍞','Despensa':'🥫','Café':'☕','Bebidas':'🥤','Limpieza y hogar':'🧽','Higiene':'🧴','Suplementos':'💊','Mascotas':'🐾','Otros':'📦'};
let mercaCache={};
async function cargarMercadona(mes){
  let d=mercaCache[mes];
  if(!d){
    try{d=await llamar({accion:'mercadona',mes});mercaCache[mes]=d}
    catch(e){const b=$('#mercaBox');if(b)b.innerHTML='<h2>🛒 Dentro de Mercadona</h2><p class="muted small">No se han podido cargar los productos ahora.</p>';return}
  }
  const b=$('#mercaBox');if(!b||vm.y+'-'+pad(vm.m+1)!==mes)return;
  const grupos=Object.entries(d.grupos||{}).sort((a,z)=>z[1]-a[1]);
  if(!grupos.length){b.innerHTML='<h2>🛒 Dentro de Mercadona</h2><p class="muted small">Aún no hay productos leídos de los tickets de este mes.</p>';return}
  const tot=grupos.reduce((a,g)=>a+g[1],0),max=grupos[0][1];
  b.innerHTML='<h2>🛒 Dentro de Mercadona</h2><p class="muted small" style="margin-top:-6px">'+d.tickets+' tickets · '+eur(tot)+'</p>'
   +grupos.map(([g,v])=>'<div class="bline"><div class="bhead"><span>'+(GRUPO_ICONO[g]||'📦')+' '+esc(g)+'</span><span><b>'+eur(v)+'</b> <small class="muted">'+Math.round(v/tot*100)+' %</small></span></div><div class="bar"><i style="width:'+(v/max*100)+'%"></i></div></div>').join('')
   +(d.top&&d.top.length?'<h3>Lo que más gastas</h3>'+d.top.slice(0,6).map(p=>'<div class="bhead small" style="padding:4px 0"><span>'+(GRUPO_ICONO[p.grupo]||'📦')+' '+esc(p.producto)+' <span class="muted">×'+p.veces+'</span></span><span>'+eur(p.total)+'</span></div>').join(''):'')
   +(d.subidas&&d.subidas.length?'<h3>📈 Ha subido de precio</h3>'+d.subidas.map(s=>'<div class="bhead small" style="padding:4px 0"><span>'+esc(s.producto)+'</span><span style="color:var(--neg)">'+eur(s.antes)+' → '+eur(s.ahora)+(s.kg?'/kg':'')+'</span></div>').join(''):'');
}
let toastT=null;
function toast(msg,deshacer){
  const t=$('#toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(deshacer?'<button id="tUndo">Deshacer</button>':'');
  t.classList.remove('hidden');
  if(deshacer)$('#tUndo').onclick=()=>{deshacer();t.classList.add('hidden')};
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),deshacer?6000:3200);
}
function abrir(){$('#modal').classList.remove('hidden')}
function cerrar(){$('#modal').classList.add('hidden')}
function monthNav(){
  const etiqueta=modoRes==='ano'&&vista==='resumen'?String(vm.y):MESES[vm.m]+' '+vm.y;
  return '<div class="mnav"><button onclick="mover(-1)" aria-label="Anterior">‹</button><b>'+etiqueta+'</b><button onclick="mover(1)" aria-label="Siguiente">›</button></div>';
}
function mover(d){
  if(modoRes==='ano'&&vista==='resumen'){vm.y+=d}
  else{vm.m+=d;if(vm.m<0){vm.m=11;vm.y--}if(vm.m>11){vm.m=0;vm.y++}}
  render();
}
function signo(m){const c=catById(m.categoria);if(c.grupo==='neutro')return ['','neu'];const entra=c.grupo==='ingreso'?m.tipo==='ingreso':m.tipo!=='gasto';return entra?['+','pos']:['−','neg']}
function itemMov(m){
  const c=catById(m.categoria);const [s,cls]=signo(m);
  const det=[m.nota,fechaCorta(m.fecha),m.quien,m.origen&&m.origen!=='manual'?m.origen:''].filter(Boolean).map(esc).join(' · ');
  return '<button class="mov" onclick="editar(\''+m.id+'\')"><span class="ic">'+c.icono+'</span><span class="mt"><b>'+esc(c.nombre)+(m.sub?' · '+esc(m.sub):'')+'</b><small>'+det+'</small></span><span class="amt '+cls+'">'+s+eur(m.importe)+'</span></button>';
}
function catOptions(sel,conVacio){
  const grupos=[['variable','Gastos del día a día'],['fijo','Recibos y gastos fijos'],['ingreso','Ingresos'],['neutro','No cuentan (traspasos)']];
  return (conVacio?'<option value="">— Elige categoría —</option>':'')+grupos.map(([g,t])=>'<optgroup label="'+t+'">'+cfg.cats.filter(c=>c.grupo===g&&(!c.oculta||c.id===sel)).map(c=>'<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+c.icono+' '+esc(c.nombre)+'</option>').join('')+'</optgroup>').join('');
}
const personasOpts=sel=>(sel!==undefined&&!cfg.personas.includes(sel)?'<option value="'+esc(sel||'')+'" selected>'+(sel?esc(sel):'—')+'</option>':'')+cfg.personas.map(p=>'<option'+(p===sel?' selected':'')+'>'+esc(p)+'</option>').join('');

   +'<div class="amount"><input id="fImp" inputmode="decimal" placeholder="0,00" autocomplete="off" value="'+esc(form.imp)+'" onkeydown="if(event.key===\'Enter\')guardar()"><span>€</span></div>'
   +atajos+cats+subs

   +'<label>Nota (opcional)<input id="fNota" placeholder="Ej: Mercadona, regalo cumple…" value="'+esc(form.nota)+'"></label>'

   +(ultimos.length?'<section class="card"><h2>Últimos apuntes</h2>'+ultimos.map(itemMov).join('')+'</section>':'<section class="card muted small">Aún no hay apuntes. Escribe un importe, toca una categoría y pulsa Guardar.</section>');

function setTipo(t){form.tipo=t;form.cat=null;form.sub='';render()}
function selCat(id){form.cat=form.cat===id?null:id;form.sub='';render()}
function selSub(i){const c=catById(form.cat);const s=c.subs[i];form.sub=form.sub===s?'':s;render()}
function guardar(){
  leerForm();
  const v=parseNum(form.imp);
  if(!v){toast('Escribe el importe');$('#fImp').focus();return}
  if(!form.cat){toast('Toca una categoría');return}
  const m=addMov({fecha:form.fecha||hoy(),tipo:form.tipo,importe:v,categoria:form.cat,sub:form.sub,nota:form.nota,quien:form.quien||yo,origen:'manual'});
  form={tipo:form.tipo,cat:null,sub:'',imp:'',nota:'',fecha:form.fecha,quien:form.quien};
  render(true);
  toast('Guardado: '+catById(m.categoria).nombre+' '+eur(m.importe),()=>{updMov(m.id,{borrado:true});render(true)});
}
function usarAtajo(i){
  const a=cfg.atajos[i];
  if(a.importe){
    const m=addMov({tipo:'gasto',importe:a.importe,categoria:a.cat,nota:a.nombre,quien:yo});
    render();toast('Guardado: '+a.nombre+' '+eur(a.importe),()=>{updMov(m.id,{borrado:true});render(true)});
  }else{form.tipo='gasto';form.cat=a.cat;form.sub='';render();$('#fImp').focus()}
}

function listaHTML(){
  const q=norm(filtroTxt);
  const list=deMes(vm.y,vm.m).filter(m=>(!filtroCat||m.categoria===filtroCat)&&(!q||norm(m.nota+' '+catById(m.categoria).nombre+' '+m.sub+' '+m.quien).includes(q)))
    .sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.creado-a.creado);
  if(!list.length)return '<p class="muted small">No hay movimientos.</p>';
  let out='',dia='';
  list.forEach(m=>{if(m.fecha!==dia){dia=m.fecha;out+='<div class="day">'+fechaCorta(dia)+'</div>'}out+=itemMov(m)});
  return out;
}
function vMovs(){
  const t=calc(deMes(vm.y,vm.m));

}

/* ===================== RESUMEN ===================== */
function pendientesFijos(y,m,t){
  const list=deMes(y,m);
  return cfg.fijos.filter(f=>(!f.mes||f.mes===m+1)&&!list.some(x=>x.categoria===f.cat)).map(f=>{
    const imp=f.porcentaje?r2(t.ingreso*f.porcentaje/100):f.importe;
    return Object.assign({},f,{sugerido:imp});
  });
}
function donut(items,total){
  const R=54,C=2*Math.PI*R;let off=0;
  const segs=items.map(it=>{const len=total>0?it.v/total*C:0;const s='<circle r="'+R+'" cx="70" cy="70" fill="none" stroke="'+it.col+'" stroke-width="22" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';off+=len;return s}).join('');
  return '<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="Reparto de gastos"><circle r="'+R+'" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="22"/>'+segs+'<text x="70" y="66" text-anchor="middle" class="dt1">Gastos</text><text x="70" y="84" text-anchor="middle" class="dt2">'+eur0(total)+'</text></svg>';
}
function vResumen(){
  const seg='<div class="seg" style="margin-bottom:12px"><button class="'+(modoRes==='mes'?'on':'')+'" onclick="modoRes=\'mes\';render()">Mes</button><button class="'+(modoRes==='ano'?'on':'')+'" onclick="modoRes=\'ano\';render()">Año</button></div>';
  return seg+monthNav()+(modoRes==='mes'?resumenMes():resumenAno());
}
function resumenMes(){
  const t=calc(deMes(vm.y,vm.m));
  const pm=vm.m===0?{y:vm.y-1,m:11}:{y:vm.y,m:vm.m-1};
  const tp=calc(deMes(pm.y,pm.m));
  let h='<div class="kpis"><div class="kpi"><small>Ingresos</small><b class="pos">'+eur(t.ingreso)+'</b></div><div class="kpi"><small>Gastos</small><b>'+eur(t.gastos)+'</b></div><div class="kpi"><small>Ahorro</small><b class="'+(t.ahorro>=0?'pos':'neg')+'">'+eur(t.ahorro)+'</b></div></div>';
  const pend=pendientesFijos(vm.y,vm.m,t);
  if(pend.length){
    h+='<section class="card"><h2>Recibos fijos sin apuntar</h2><p class="muted small" style="margin-top:-6px">Confirma el importe y pulsa ✓. Si un mes no toca, ignóralo.</p>'
     +pend.map(f=>{const c=catById(f.cat);return '<div class="pend"><span class="ic">'+c.icono+'</span><span class="pn">'+esc(c.nombre)+(f.porcentaje?'<br><small class="muted">'+f.porcentaje+' % de los ingresos</small>':'')+'</span><input id="p_'+f.id+'" inputmode="decimal" value="'+(f.sugerido?String(f.sugerido).replace('.',','):'')+'" placeholder="Importe"><button class="btn sm" onclick="apuntarFijo(\''+f.id+'\')">✓</button></div>'}).join('')+'</section>';
  }
  const gastosCat=cfg.cats.filter(c=>(c.grupo==='variable'||c.grupo==='fijo')&&(t.cat[c.id]||0)>0).map(c=>({c,v:t.cat[c.id]})).sort((a,b)=>b.v-a.v);
  if(gastosCat.length){
    const top=gastosCat.slice(0,8).map((x,i)=>({lab:x.c.icono+' '+x.c.nombre,v:x.v,col:PALETA[i%PALETA.length]}));
    const resto=gastosCat.slice(8).reduce((a,x)=>a+x.v,0);
    if(resto>0)top.push({lab:'Resto',v:resto,col:PALETA[9]});
    const tot=top.reduce((a,x)=>a+x.v,0);
    h+='<section class="card"><h2>¿En qué se ha ido el dinero?</h2><div class="donutbox">'+donut(top,tot)+'<div class="legend">'+top.map(x=>'<div><i style="background:'+x.col+'"></i><span>'+esc(x.lab)+'</span><b>'+eur0(x.v)+'</b></div>').join('')+'</div></div></section>';
  }
  const vars=visibles('variable');
  const maxV=Math.max(1,...vars.map(c=>t.cat[c.id]||0));
  h+='<section class="card"><h2>Gastos del día a día</h2><p class="muted small" style="margin-top:-6px">Total '+eur(t.variable)+' · mes anterior '+eur(tp.variable)+'</p>'
   +vars.map(c=>{
     const v=t.cat[c.id]||0,p=c.presupuesto||0,prev=tp.cat[c.id]||0;
     const pct=p?Math.min(100,v/p*100):v/maxV*100;
     const col=p?(v>p?'var(--neg)':v>p*.8?'var(--warn)':'var(--pos)'):'var(--brand)';
     const dif=v-prev;const comp=prev||v?(dif>0.5?'▲ '+eur0(dif):dif<-0.5?'▼ '+eur0(-dif):'='):'';
     return '<div class="bline"><div class="bhead"><span>'+c.icono+' '+esc(c.nombre)+'</span><span><b>'+eur(v)+'</b>'+(p?' <small class="muted">de '+eur0(p)+'</small>':'')+'</span></div><div class="bar"><i style="width:'+pct+'%;background:'+col+'"></i></div>'+(comp?'<small class="muted">vs mes anterior: '+comp+'</small>':'')+'</div>';
   }).join('')+'</section>';
  if(sync.url&&sync.clave&&(t.cat.super||0)>0)h+='<section class="card" id="mercaBox"><h2>🛒 Dentro de Mercadona</h2><p class="muted small">Cargando productos…</p></section>';
  const fijos=visibles('fijo').filter(c=>t.cat[c.id]);
  h+='<section class="card"><h2>Recibos fijos</h2><p class="muted small" style="margin-top:-6px">Total '+eur(t.fijo)+'</p>'+(fijos.length?fijos.map(c=>'<div class="bline"><div class="bhead"><span>'+c.icono+' '+esc(c.nombre)+'</span><span>'+eur(t.cat[c.id])+'</span></div></div>').join(''):'<p class="muted small">Ninguno apuntado este mes.</p>')+'</section>';
  const ings=visibles('ingreso').filter(c=>t.cat[c.id]);
  if(ings.length)h+='<section class="card"><h2>Ingresos</h2>'+ings.map(c=>'<div class="bline"><div class="bhead"><span>'+c.icono+' '+esc(c.nombre)+'</span><span class="pos">'+eur(t.cat[c.id])+'</span></div></div>').join('')+'</section>';
  if(Math.abs(t.neutro)>0.005)h+='<p class="muted small">🔁 Movimientos entre cuentas / inversión este mes (no cuentan): '+eur(Math.abs(t.neutro))+'</p>';
  return h;
}
function apuntarFijo(fid){
  const f=cfg.fijos.find(x=>x.id===fid);if(!f)return;
  const v=parseNum($('#p_'+fid).value);if(!v){toast('Escribe el importe');return}
  const esteMes=vm.y===new Date().getFullYear()&&vm.m===new Date().getMonth();
  const fecha=esteMes?hoy():vm.y+'-'+pad(vm.m+1)+'-01';
  addMov({fecha,tipo:'gasto',importe:v,categoria:f.cat,nota:'Recibo fijo',quien:yo,origen:'fijo'});
  render();toast(catById(f.cat).nombre+' apuntado');
}
function barras(series){
  const W=340,H=160,base=130,max=Math.max(1,...series.flatMap(s=>s.vals));
  let g='';
  for(let i=0;i<12;i++){
    const x0=14+i*27;
    series.forEach((s,k)=>{const hgt=Math.max(0,s.vals[i])/max*110;g+='<rect x="'+(x0+k*10)+'" y="'+(base-hgt)+'" width="9" height="'+hgt+'" rx="2" fill="'+s.col+'"><title>'+MESES[i]+': '+eur(s.vals[i])+'</title></rect>'});
    g+='<text x="'+(x0+9)+'" y="146" text-anchor="middle" class="tlabel">'+MCORTO[i]+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="Ingresos y gastos por mes"><line x1="10" x2="'+(W-6)+'" y1="'+base+'" y2="'+base+'" stroke="var(--line)"/>'+g+'</svg>';
}
function resumenAno(){
  const meses=[...Array(12)].map((_,i)=>calc(deMes(vm.y,i)));
  const t=calc(deAno(vm.y));
  const conDatos=meses.filter(x=>x.ingreso||x.gastos).length||1;
  let acc=0;

const STOP=new Set(['COMPRA','COMPRAS','TARJ','TARJETA','PAGO','PAGOS','CON','DEL','LOS','LAS','RECIBO','RECIBOS','TRANSF','TRANSFERENCIA','CARGO','ADEUDO','OPERACION','CONTACTLESS','APPLE','GOOGLE','PAY','BIZUM','ESP','PALMA','MALLORCA','CARD','TRANSACTION','PURCHASE','DEBITO','CREDITO','VISA','MASTERCARD','FECHA','REF','REFERENCIA','EUR','ENVIADO','RECIBIDO']);
function claveConcepto(con){return palabras(con).filter(w=>w.length>=3&&!/\d/.test(w)&&!STOP.has(w)).slice(0,2).join(' ')}
function sugerir(con){
  const ws=new Set(palabras(con));
  for(const r of cfg.reglas){const rp=palabras(r.texto);if(rp.length&&rp.every(p=>ws.has(p)||[...ws].some(w=>w.startsWith(p)&&p.length>=4)))return r.cat}
  return '';
}
async function leerTexto(f){
  const buf=await f.arrayBuffer();
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}
}
function parseCSV(txt){
  const lineas=txt.split(/\r?\n/).slice(0,10).join('\n');
  const cuenta=ch=>(lineas.match(new RegExp(ch==='\t'?'\\t':'\\'+ch,'g'))||[]).length;
  const sep=[';',',','\t'].sort((a,b)=>cuenta(b)-cuenta(a))[0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cell);cell=''}
    else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}
    else cell+=ch;
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}
async function leerArchivo(f){
  if(!f)return;
  const n=f.name.toLowerCase();
  if(n.endsWith('.pdf')){toast('Los PDF aún no. Descarga el extracto en Excel o CSV.');return}
  let rows;
  try{
    if(n.endsWith('.csv')||n.endsWith('.txt'))rows=parseCSV(await leerTexto(f));
    else{
      if(!window.XLSX){toast('No se pudo cargar el lector de Excel. Revisa la conexión.');return}
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
    }
  }catch(e){toast('No he podido leer el archivo');return}
  imp.raw=rows.filter(r=>Array.isArray(r));imp.nombre=f.name;imp.map=detectar(imp.raw);construirFilas();render();
}
function detectar(rows){
  let h=-1;
  for(let i=0;i<Math.min(rows.length,40);i++){
    const r=rows[i].map(norm);
    if(r.some(x=>/FECHA|DATE/.test(x))&&r.some(x=>/IMPORTE|CANTIDAD|AMOUNT|CARGO|ABONO|DEBE|HABER/.test(x))){h=i;break}
  }
  const head=h>=0?rows[h].map(norm):[];
  const find=(re,ex)=>head.findIndex(x=>re.test(x)&&!(ex&&ex.test(x)));
  let fecha=find(/OPERACION|CONTABLE/);if(fecha<0||!/FECHA|DATE|F\./.test(head[fecha]))fecha=find(/FECHA|DATE/);
  let concepto=find(/CONCEPTO|DESCRIPCION|DETALLE|MOVIMIENTO|COMERCIO|DESCRIPTION|NAME|BENEFICIARIO|NOMBRE/);
  const importe=find(/IMPORTE|CANTIDAD|AMOUNT/,/SALDO|BALANCE/);
  const cargo=find(/CARGO|DEBE|ADEUDO/),abono=find(/ABONO|HABER/);
  if(h<0){fecha=0;concepto=1;return {h:-1,fecha,concepto,importe:2,cargo:-1,abono:-1}}
  if(concepto<0)concepto=head.findIndex((x,i)=>i!==fecha&&i!==importe&&i!==cargo&&i!==abono);
  return {h,fecha,concepto,importe,cargo,abono};
}
function buscarDup(fecha,importe,tipo,usados){
  const t=new Date(fecha).getTime();
  return movs.find(m=>!m.borrado&&(!m.importKey||String(m.importKey).startsWith('gmail|'))&&!usados.has(m.id)&&m.tipo===tipo&&Math.abs(m.importe-importe)<0.01&&Math.abs(new Date(m.fecha).getTime()-t)<=3*864e5);
}
function construirFilas(){
  const {h,fecha,concepto,importe,cargo,abono}=imp.map;
  const out=[],usados=new Set(),veces={};
  imp.raw.slice(h+1).forEach(r=>{
    const f=parseFecha(r[fecha]);if(!f)return;
    let v=importe>=0?parseNum(r[importe]):(parseNum(r[abono])||0)-Math.abs(parseNum(r[cargo])||0);
    if(!v)return;
    const con=String(r[concepto]??'').trim();
    const tipo=v<0?'gasto':'ingreso';
    const base=imp.banco+'|'+f+'|'+norm(con)+'|'+r2(v);
    veces[base]=(veces[base]||0)+1;
    const key=base+'#'+veces[base];
    const ya=movs.some(m=>!m.borrado&&m.importKey===key);
    const dup=ya?null:buscarDup(f,Math.abs(r2(v)),tipo,usados);
    if(dup)usados.add(dup.id);
    out.push({fecha:f,concepto:con,importe:Math.abs(r2(v)),tipo,cat:sugerir(con),key,estado:ya?'ya':dup?'dup':'nuevo',dupTxt:dup?catById(dup.categoria).nombre+' '+eur(dup.importe)+' ('+fechaCorta(dup.fecha)+')':'',ok:!ya&&!dup});
  });
  imp.filas=out.sort((a,b)=>a.fecha.localeCompare(b.fecha));
}

  if(!imp.filas.length)return h+'<section class="card muted small">No encuentro movimientos con esas columnas. Ábrelas arriba y elige cuál es la fecha, el concepto y el importe.</section>';
  const n={nuevo:0,dup:0,ya:0};imp.filas.forEach(f=>n[f.estado]++);
  const sinCat=imp.filas.filter(f=>f.ok&&!f.cat).length;
  h+='<section class="card"><h2>'+imp.filas.length+' movimientos</h2><p class="small" style="margin-top:-4px">✅ '+n.nuevo+' nuevos · <span class="badge w">'+n.dup+' posibles repetidos</span> · '+n.ya+' ya importados</p>'
   +(sinCat?'<p class="small" style="color:var(--warn)">⚠️ '+sinCat+' sin categoría. Elige una: la app lo recordará para la próxima vez.</p>':'')
   +'<div id="ifilas">'+filasHTML()+'</div>'

  return h;
}

function cambiarCatImp(i,v){
  const f=imp.filas[i];f.cat=v;if(!v)return;
  const clave=claveConcepto(f.concepto);
  if(clave){
    const r=cfg.reglas.find(x=>norm(x.texto)===clave);
    if(r)r.cat=v;else cfg.reglas.unshift({texto:clave,cat:v});
    saveCfg();
    let otras=0;
    imp.filas.forEach((g,j)=>{if(j!==i&&!g.cat&&claveConcepto(g.concepto)===clave){g.cat=v;otras++}});
    toast('Aprendido: «'+clave+'» → '+catById(v).nombre+(otras?' (y '+otras+' más)':''));
  }
  $('#ifilas').innerHTML=filasHTML();
}
function importarSeleccion(){
  const sel=imp.filas.filter(f=>f.ok);

  sel.forEach(f=>movs.push(nuevoMov({fecha:f.fecha,tipo:f.tipo,importe:f.importe,categoria:f.cat||(f.tipo==='gasto'?'extras':'otros_ing'),nota:f.concepto,quien:yo,origen:imp.banco,importKey:f.key})));

  imp={banco:imp.banco,raw:null,map:null,filas:[],nombre:''};
  vista='movs';render();toast(sel.length+' movimientos importados');
}

/* ===================== Excel y copias ===================== */
function exportarExcel(y){
  if(!window.XLSX){toast('No se pudo cargar el generador de Excel');return}
  const wb=XLSX.utils.book_new();
  const meses=[...Array(12)].map((_,i)=>calc(deMes(y,i)));
  const filas=[['CUENTAS '+y,...MESES.map(m=>m.toUpperCase()),'TOTAL']];
  const suma=a=>r2(a.reduce((x,z)=>x+z,0));
  const tot={};
  [['INGRESOS','ingreso',1],['RECIBOS FIJOS','fijo',-1],['GASTOS DEL DÍA A DÍA','variable',-1],['NO CUENTAN (traspasos, inversión)','neutro',-1]].forEach(([t,g,s])=>{
    filas.push([t]);const acc=Array(12).fill(0);
    cfg.cats.filter(c=>c.grupo===g).forEach(c=>{const v=meses.map(x=>r2(s*(x.cat[c.id]||0)));if(c.oculta&&!suma(v.map(Math.abs)))return;filas.push([c.nombre,...v,suma(v)]);v.forEach((z,i)=>acc[i]+=z)});
    tot[g]=acc.map(r2);filas.push(['TOTAL '+t,...tot[g],suma(tot[g])]);filas.push([]);
  });
  const gastos=tot.fijo.map((x,i)=>r2(x+tot.variable[i]));
  const ahorro=tot.ingreso.map((x,i)=>r2(x+gastos[i]));
  let a=0;const acum=ahorro.map(x=>r2(a+=x));
  filas.push(['TOTAL GASTOS',...gastos,suma(gastos)],['AHORRO DEL MES',...ahorro,suma(ahorro)],['AHORRO ACUMULADO',...acum,acum[11]]);
  const ws=XLSX.utils.aoa_to_sheet(filas);ws['!cols']=[{wch:30},...Array(13).fill({wch:12})];
  XLSX.utils.book_append_sheet(wb,ws,'RESUMEN '+y);
  const vars=cfg.cats.filter(c=>c.grupo==='variable');
  for(let i=0;i<12;i++){
    const l=deMes(y,i);if(!l.length)continue;
    const colum=vars.map(c=>l.filter(m=>m.categoria===c.id).map(m=>r2(m.tipo==='gasto'?-m.importe:m.importe)));
    const alto=Math.max(0,...colum.map(c=>c.length));
    const hoja=[['',...vars.map(c=>c.nombre.toUpperCase())]];
    for(let k=0;k<alto;k++)hoja.push(['',...colum.map(c=>c[k]??'')]);
    hoja.push(['TOTAL',...colum.map(c=>suma(c))]);
    const w=XLSX.utils.aoa_to_sheet(hoja);w['!cols']=[{wch:8},...vars.map(()=>({wch:13}))];
    XLSX.utils.book_append_sheet(wb,w,MESES[i].toUpperCase());
  }
  const lista=deAno(y).sort((p,q)=>p.fecha.localeCompare(q.fecha)).map(m=>{const c=catById(m.categoria);const[s]=signo(m);return {Fecha:m.fecha,Categoría:c.nombre,Grupo:{variable:'Día a día',fijo:'Recibo fijo',ingreso:'Ingreso',neutro:'No cuenta'}[c.grupo]||'',Detalle:m.sub,Nota:m.nota,Importe:r2(s==='−'?-m.importe:m.importe),Quién:m.quien,Origen:m.origen}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(lista.length?lista:[{Fecha:'',Categoría:'',Importe:''}]),'MOVIMIENTOS');
  XLSX.writeFile(wb,'Cuentas_'+y+'.xlsx');
}
function descargar(nombre,texto,tipo){const b=new Blob([texto],{type:tipo});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function descargarCopia(){descargar('copia_cuentas_'+hoy()+'.json',JSON.stringify({version:1,fecha:new Date().toISOString(),movs,cfg},null,1),'application/json');toast('Copia descargada')}
async function restaurarCopia(f){
  if(!f)return;
  try{
    const d=JSON.parse(await f.text());if(!Array.isArray(d.movs))throw 0;
    let n=0;
    d.movs.forEach(r=>{const i=movs.findIndex(m=>m.id===r.id);if(i<0){movs.push({...r,pend:true});n++}else if((r.modificado||0)>(movs[i].modificado||0)){movs[i]={...r,pend:true};n++}});
    if(d.cfg&&(d.cfg.modificado||0)>(cfg.modificado||0)){cfg=d.cfg;store.set('cc_cfg',cfg)}
    saveMovs();programarSync();render();toast('Copia restaurada: '+n+' movimientos recuperados');
  }catch(e){toast('Ese archivo no es una copia válida')}
}

/* ===================== Sincronización con Google ===================== */
let syncTimer=null,sincronizando=false;
function estadoSync(){
  const dot=$('#syncDot'),txt=$('#syncTxt');if(!dot)return;
  const pend=movs.some(m=>m.pend);
  let col='#9ca3af',t='Sin nube';
  if(sync.url){if(sincronizando){col='#2563eb';t='Guardando…'}else if(sync.error){col='#dc2626';t='Error nube'}else if(pend){col='#d97706';t='Pendiente'}else{col='#16a34a';t='En la nube'}}
  dot.style.background=col;txt.textContent=t;
}
function programarSync(){estadoSync();if(!sync.url||!sync.clave)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sincronizar(false),2000)}
async function llamar(cuerpo){
  const r=await fetch(sync.url,{method:'POST',body:JSON.stringify(Object.assign({clave:sync.clave},cuerpo))});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Respuesta no válida');return j;
}
async function probarNube(){
  if(!sync.url||!sync.clave){toast('Pon la URL y la clave');return}
  try{await llamar({accion:'probar'});toast('✅ Conexión correcta');}catch(e){toast('❌ No conecta: '+(e.message||e))}
}
async function sincronizar(manual){
  if(!sync.url||!sync.clave){if(manual){vista='ajustes';render();toast('Conecta primero tu hoja de Google')}return}
  if(sincronizando)return;
  sincronizando=true;estadoSync();
  try{
    const enviar=movs.filter(m=>m.pend).map(m=>{const c=Object.assign({},m);delete c.pend;return c});
    const j=await llamar({accion:'sync',desde:sync.desde||0,movs:enviar,cfg});
    const enviados=new Map(enviar.map(m=>[m.id,m.modificado]));
    movs.forEach(m=>{if(m.pend&&enviados.get(m.id)===m.modificado)m.pend=false});
    (j.movs||[]).forEach(r=>{
      r.importe=Number(r.importe)||0;r.borrado=r.borrado===true||String(r.borrado).toUpperCase()==='TRUE';
      r.creado=Number(r.creado)||0;r.modificado=Number(r.modificado)||0;r.id=String(r.id);r.fecha=String(r.fecha).slice(0,10);delete r.srv;
      const i=movs.findIndex(m=>m.id===r.id);
      if(i<0)movs.push(Object.assign(r,{pend:false}));
      else if(!(movs[i].pend&&movs[i].modificado>r.modificado))movs[i]=Object.assign(r,{pend:false});
    });
    if(j.cfg&&(Number(j.cfg.modificado)||0)>(Number(cfg.modificado)||0)){cfg=j.cfg;store.set('cc_cfg',cfg)}
    sync.desde=j.ahora;sync.ultimaOk=Date.now();sync.error='';mercaCache={};
    store.set('cc_sync',sync);saveMovs();
    if(manual)toast('☁️ Todo guardado en la nube');
    const ocupado=document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName);
    if(!ocupado&&$('#modal').classList.contains('hidden')&&vista!=='importar')render();
  }catch(e){
    sync.error=String(e&&e.message||e);store.set('cc_sync',sync);
    if(manual)toast('No se pudo sincronizar: '+sync.error);
  }finally{sincronizando=false;estadoSync()}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sincronizar(false)});
setInterval(()=>sincronizar(false),5*60*1000);

render();
sincronizar(false);
</script>
