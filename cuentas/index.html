<style>
:root{--bg:#f3f5f4;--card:#ffffff;--ink:#14201d;--muted:#5f6d69;--line:#e1e7e5;--brand:#0f766e;--brand-ink:#ffffff;--soft:#e3f2ef;--neg:#b91c1c;--pos:#15803d;--warn:#b45309;--warnbg:#fef3c7;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05)}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}

input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px}

.need select{border-color:var(--warn);border-width:2px}
.crow{display:grid;grid-template-columns:46px 1fr 92px 50px;gap:6px;align-items:center;margin-top:6px}
.crow input{margin:0;padding:8px}.crow .ico{text-align:center;padding:8px 2px}.crow label{margin:0;display:flex;gap:4px;align-items:center;font-size:12px}
.frow{display:grid;grid-template-columns:1fr 92px 100px 36px;gap:6px;align-items:center;margin-top:6px;font-size:14px}

.x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}

code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:13px}

<body>

<script>
/* ===================== utilidades ===================== */
const $=s=>document.querySelector(s);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MCORTO=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const PALETA=['#0f766e','#2563eb','#d97706','#db2777','#7c3aed','#16a34a','#dc2626','#0891b2','#ca8a04','#64748b'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((Number(n)||0)*100)/100;
const eur=n=>r2(n).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const eur0=n=>Math.round(Number(n)||0).toLocaleString('es-ES')+' €';
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy=()=>ymd(new Date());
const fechaCorta=f=>{const p=String(f).split('-');return p.length===3?(+p[2])+' '+MCORTO[+p[1]-1]:f};
const norm=x=>String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const palabras=x=>norm(x).replace(/[^A-Z0-9Ñ ]/g,' ').split(/\s+/).filter(Boolean);

const memoria={};
const store={
  get(k,d){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return k in memoria?memoria[k]:d},
  set(k,v){memoria[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

function parseNum(v){
  if(typeof v==='number')return v;
  let s=String(v??'').replace(/[€\s\u00a0]/g,'').replace(/EUR/i,'');
  if(!s)return 0;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(s.endsWith('-')){neg=true;s=s.slice(0,-1)}
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
  else if(lc>-1){s=s.replace(/\.(?=\d{3})/g,'').replace(',','.')}
  else if(ld>-1&&/^-?\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}
  const n=parseFloat(s);
  return isNaN(n)?0:(neg?-Math.abs(n):n);
}
function parseFecha(v){
  if(v instanceof Date&&!isNaN(v))return ymd(v);
  if(typeof v==='number'&&v>20000&&v<80000){return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10)}
  const s=String(v??'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;if(+m[2]>12)return null;return y+'-'+pad(m[2])+'-'+pad(m[1])}
  return null;
}

/* ===================== datos iniciales (sacados de tu Excel) ===================== */
/* Recibos fijos: se apuntan solos el día de cobro. auto:'ultimo' = importe del último recibo visto en el banco */
function FIJOS_V2(){return [
  {id:uid(),cat:'alquiler',importe:728.92,mes:0,dia:1},
  {id:uid(),cat:'pension',importe:300,mes:0,dia:1},
  {id:uid(),cat:'luz',importe:null,mes:0,dia:3,auto:'ultimo'},
  {id:uid(),cat:'mutua',importe:null,mes:0,dia:3,auto:'ultimo'},
  {id:uid(),cat:'gimnasio',importe:65,mes:0,dia:5},
  {id:uid(),cat:'compassion',importe:30,mes:0,dia:6},
  {id:uid(),cat:'diezmo',porcentaje:10,mes:0,dia:6},
  {id:uid(),cat:'vodafone',importe:65.64,mes:0,dia:22}
]}
const REGLAS_FIJOS=[['GABRIEL SALAS','alquiler'],['RHEMA','diezmo'],['ENERGIA XXI','luz'],['AXA SEGUROS','mutua'],['FIT FORCE','gimnasio'],['MANUELA CERDAN','pension']];
function defaultCfg(){
  const C=(id,nombre,icono,grupo,extra)=>Object.assign({id,nombre,icono,grupo,presupuesto:0,oculta:false},extra||{});
  const R=(texto,cat)=>({texto,cat});
  return {
    cats:[
      C('super','Súper','🛒','variable',{presupuesto:600}),
      C('amazon','Amazon','📦','variable',{subs:['Café','Cosas de casa','Suplementos','Otros']}),
      C('comidas','Comidas fuera','🍽️','variable'),
      C('desayunos','Desayunos','☕','variable'),
      C('gasolina','Gasolina','⛽','variable',{presupuesto:100}),
      C('parking','Parking','🅿️','variable'),
      C('ocio','Ocio','🎉','variable'),
      C('deporte','Deporte','🏃','variable'),
      C('casa','Cosas de casa','🏠','variable'),
      C('ropa','Ropa','👕','variable'),
      C('farmacia','Farmacia','💊','variable'),
      C('suplementacion','Suplementación','💪','variable'),
      C('medico','Médico / Nutricionista','🩺','variable'),
      C('vacaciones','Vacaciones','✈️','variable'),
      C('extras','Extras','✨','variable'),
      C('alquiler','Alquiler','🔑','fijo'),
      C('diezmo','Diezmo','⛪','fijo'),
      C('ofrendas','Ofrendas','🙏','fijo'),
      C('vodafone','Vodafone','📱','fijo'),
      C('mutua','Seguro de salud (AXA)','🩺','fijo'),
      C('compassion','Compassion','🤝','fijo'),
      C('luz','Luz y gas','💡','fijo'),
      C('gas','Gas','🔥','fijo',{oculta:true}),
      C('gimnasio','Gimnasio','🏋️','fijo'),
      C('pension','Pensión alimenticia','👧','fijo'),
      C('seguro_coche','Seguro coche','🚗','fijo'),
      C('seguro_hogar','Seguro hogar','🏡','fijo'),
      C('impuestos','Impuestos y tasas','🏛️','fijo'),
      C('itv','ITV y taller','🔧','fijo'),
      C('nomina_h','Nómina Héctor','💼','ingreso'),
      C('nomina_i','Nómina Irene','💼','ingreso'),
      C('pagas','Pagas extra','🎁','ingreso'),
      C('hacienda','Hacienda','🧾','ingreso'),
      C('otros_ing','Otros ingresos','💶','ingreso'),
      C('traspaso','Traspaso entre cuentas','🔁','neutro'),
      C('pago_tarjeta','Pago de la tarjeta','💳','neutro'),
      C('inversion','Inversión / ahorro','📈','neutro')
    ],
    fijos:FIJOS_V2(),
    fijosV:2,
    reglas:[
      R('MERCADONA','super'),R('LIDL','super'),R('ALDI','super'),R('EROSKI','super'),R('CARREFOUR','super'),R('CONSUM','super'),R('SUPERMERCADO','super'),R('HIPERCENTRO','super'),
      R('AMAZON','amazon'),R('AMZN','amazon'),
      R('REPSOL','gasolina'),R('CEPSA','gasolina'),R('GALP','gasolina'),R('SHELL','gasolina'),R('PETRONIEVES','gasolina'),R('GASOLINERA','gasolina'),R('ESTACION SERVICIO','gasolina'),
      R('PARKING','parking'),R('APARCAMIENTO','parking'),
      R('FARMACIA','farmacia'),
      R('VODAFONE','vodafone'),R('ENDESA','luz'),R('IBERDROLA','luz'),R('NATURGY','gas'),
      R('DECATHLON','deporte'),R('ZARA','ropa'),R('PRIMARK','ropa'),
      R('IKEA','casa'),R('LEROY MERLIN','casa'),R('BAUHAUS','casa'),
      R('RESTAURANTE','comidas'),R('CAFETERIA','desayunos'),
      R('AGRUPACIO','mutua'),R('COMPASSION','compassion'),R('ALQUILER','alquiler'),
      R('AEAT','hacienda'),R('AGENCIA TRIBUTARIA','hacienda'),
      R('AJUNTAMENT','impuestos'),R('AYUNTAMIENTO','impuestos'),R('ATIB','impuestos'),R('ITV','itv'),
      R('TRADE REPUBLIC','traspaso'),R('TRASPASO','traspaso')
    ],
    atajos:[
      {id:uid(),nombre:'Café',importe:1.5,cat:'desayunos'},
      {id:uid(),nombre:'Súper',importe:null,cat:'super'},
      {id:uid(),nombre:'Gasolina',importe:null,cat:'gasolina'},
      {id:uid(),nombre:'Parking',importe:null,cat:'parking'}
    ],
    cuentas:[{id:'bankinter',nombre:'Bankinter casa (Irene)',tipo:'dia',saldo:null,fecha:'',ts:0,iban4:'4755'},{id:'bankinter_h',nombre:'Bankinter Héctor',tipo:'personal',saldo:null,fecha:'',ts:0,iban4:'2084'},{id:'tr',nombre:'Trade Republic',tipo:'ahorro',saldo:null,fecha:'',ts:0}],
    nominaSig:{dia:20},
    personas:['Héctor','Irene'],
    modificado:0
  };
}

/* ===================== estado ===================== */
let movs=store.get('cc_movs',[]);
let cfg=store.get('cc_cfg',null)||defaultCfg();
/* Añade las categorías nuevas de serie a una configuración ya guardada (sin tocar lo demás) */
function asegurarCats(c){
  const base=defaultCfg().cats;let cambio=false;
  base.forEach((d,i)=>{
    if(c.cats.some(x=>x.id===d.id))return;
    const prev=base.slice(0,i).reverse().find(p=>c.cats.some(x=>x.id===p.id));
    const pos=prev?c.cats.findIndex(x=>x.id===prev.id)+1:c.cats.length;
    c.cats.splice(pos,0,d);cambio=true;
  });
  if(!c.nominaSig){c.nominaSig={dia:20};cambio=true}
  if((Number(c.fijosV)||0)<2){

  }
  if(!Array.isArray(c.cuentas))c.cuentas=[];
  defaultCfg().cuentas.forEach((d,i)=>{if(!c.cuentas.some(x=>x.id===d.id)){c.cuentas.splice(Math.min(i,c.cuentas.length),0,d);cambio=true}});
  const bk=c.cuentas.find(x=>x.id==='bankinter');if(bk&&bk.nombre==='Bankinter'){bk.nombre='Bankinter casa (Irene)';cambio=true}
  defaultCfg().cuentas.forEach(d=>{const x=c.cuentas.find(y=>y.id===d.id);if(x&&d.iban4&&!x.iban4){x.iban4=d.iban4;cambio=true}});
  // Transferencias entre vuestras cuentas = traspasos (van delante para que ganen a otras palabras)
  if(!Array.isArray(c.reglas))c.reglas=[];
  ['HECTOR JAVIER MAYOL','IRENE SANS MEDIANO'].forEach(t=>{if(!c.reglas.some(r=>norm(r.texto)===t)){c.reglas.unshift({texto:t,cat:'traspaso'});cambio=true}});
  if(cambio){c.modificado=(Number(c.modificado)||0)+1;store.set('cc_cfg',c)}
  return c;
}

  if(dia&&esNomina(m)&&Number(f.slice(8,10))>=dia){const y=+f.slice(0,4),mm=+f.slice(5,7);return mm===12?(y+1)+'-01':y+'-'+pad(mm+1)}

/* Cálculo: gastos positivos = dinero que sale; una devolución resta del gasto */
function calc(list){
  const t={ingreso:0,fijo:0,variable:0,neutro:0,cat:{}};
  list.forEach(x=>{
    const c=catById(x.categoria);const g=c.grupo||'variable';
    const v=g==='ingreso'?(x.tipo==='ingreso'?x.importe:-x.importe):(x.tipo==='gasto'?x.importe:-x.importe);
    t[g]=(t[g]||0)+v;t.cat[c.id]=(t.cat[c.id]||0)+v;
  });
  t.gastos=t.fijo+t.variable;t.ahorro=t.ingreso-t.gastos;
  return t;
}

/* ===================== SALDO Y LO QUE QUEDA ===================== */
/* De qué cuenta sale cada apunte: todo es de la cuenta de casa salvo lo importado de otras cuentas y la pensión (cuenta de Héctor) */
const cuentaCat=cat=>cat==='pension'?'bankinter_h':'bankinter';
const cuentaDe=m=>m.origen==='Trade Republic'?'tr':m.origen==='Bankinter Héctor'?'bankinter_h':m.origen==='Bankinter'?'bankinter':cuentaCat(m.categoria);
function saldoCuenta(c){
  if(!c||c.saldo===null||c.saldo===undefined||c.saldo==='')return null;
  let s=Number(c.saldo)||0;
  movs.forEach(m=>{
    if(m.borrado||cuentaDe(m)!==c.id)return;
    const f=String(m.fecha);
    const ts=Number(c.ts)||0;
    if(f>hoy())return;
    if(f>c.fecha||(ts&&(Number(m.creado)||0)>ts&&f>=ymd(new Date(ts))))s+=m.tipo==='ingreso'?m.importe:-m.importe;
  });
  return r2(s);
}
function quedaMes(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  const bk=cfg.cuentas.find(c=>c.tipo==='dia');
  if(saldoCuenta(bk)===null)return null;
  // Dinero para el mes: la cuenta de casa + las cuentas personales (de ahí se pasa a casa); el ahorro va aparte
  const incl=cfg.cuentas.filter(c=>(c.tipo==='dia'||c.tipo==='personal')&&saldoCuenta(c)!==null);
  const ids=new Set(incl.map(c=>c.id));
  const partes=incl.map(c=>({nombre:c.nombre,saldo:saldoCuenta(c)}));
  const saldo=r2(partes.reduce((a,x)=>a+x.saldo,0));
  const t=calc(deMes(y,m));
  const pend=pendientesFijos(y,m,t).filter(f=>ids.has(cuentaCat(f.cat)));
  // Recibos ya apuntados para más adelante este mes (aún no cobrados) + los que faltan por apuntar
  const pref0=y+'-'+pad(m+1),h0=hoy();
  const refF=id=>(incl.find(c=>c.id===id)||{}).fecha||'';
  const futuros=movs.filter(x=>!x.borrado&&ids.has(cuentaDe(x))&&x.tipo==='gasto'&&!(x.categoria&&catById(x.categoria).grupo==='neutro')&&String(x.fecha).startsWith(pref0)&&x.fecha>h0&&x.fecha>refF(cuentaDe(x))).reduce((a,x)=>a+x.importe,0);
  const fijos=r2(futuros+pend.reduce((a,f)=>a+(Number(f.sugerido)||0),0));
  const sinImporte=pend.filter(f=>!f.sugerido&&!f.porcentaje).map(f=>catById(f.cat).nombre);
  const queda=r2(saldo-fijos);
  const fin=new Date(y,m+1,0).getDate(),dias=fin-d.getDate()+1;
  const gastado=Math.max(0,t.gastos);
  const total=gastado+Math.max(queda,0);
  const pref=y+'-'+pad(m+1);
  const delAhorro=r2(movs.filter(x=>!x.borrado&&cuentaDe(x)==='tr'&&x.tipo==='gasto'&&String(x.fecha).startsWith(pref)).reduce((a,x)=>a+x.importe,0));

function generarFijos(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth(),ym=y+'-'+pad(m+1),fin=new Date(y,m+1,0).getDate();
  let cambio=false;
  (cfg.fijos||[]).forEach(f=>{
    if(!f.dia||(f.mes&&f.mes!==m+1))return;
    const id='fx_'+f.cat+'_'+ym;
    const ex=movs.find(x=>x.id===id);
    const ingresos=()=>calc(deMes(y,m)).ingreso;
    if(ex){ // el diezmo se recalcula mientras nadie lo haya cambiado a mano
      if(f.porcentaje&&!ex.borrado&&String(ex.nota).endsWith(AUTO)){const v=r2(ingresos()*f.porcentaje/100);if(v>0&&Math.abs(v-ex.importe)>=0.01){Object.assign(ex,{importe:v,modificado:Date.now(),pend:true});cambio=true}}
      return;
    }
    if(movs.some(x=>!x.borrado&&x.categoria===f.cat&&String(x.fecha).startsWith(ym)))return; // ya está (banco o a mano)
    let imp=f.porcentaje?r2(ingresos()*f.porcentaje/100):(f.auto==='ultimo'?(ultimoImporteBanco(f.cat,ym)??f.importe):f.importe);
    if(!imp||imp<=0)return;
    const mv=nuevoMov({fecha:ym+'-'+pad(Math.min(f.dia,fin)),tipo:'gasto',importe:imp,categoria:f.cat,nota:(f.porcentaje?'Diezmo '+f.porcentaje+' %':'Recibo fijo')+AUTO,quien:yo,origen:'fijo'});
    mv.id=id;movs.push(mv);cambio=true;
  });
  if(cambio){saveMovs();programarSync()}
}

async function leerTexto(f){
  const buf=await f.arrayBuffer();
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}
}
function parseCSV(txt){
  const lineas=txt.split(/\r?\n/).slice(0,10).join('\n');
  const cuenta=ch=>(lineas.match(new RegExp(ch==='\t'?'\\t':'\\'+ch,'g'))||[]).length;
  const sep=[';',',','\t'].sort((a,b)=>cuenta(b)-cuenta(a))[0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cell);cell=''}
    else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}
    else cell+=ch;
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}
async function leerArchivo(f){
  if(!f)return;
  const n=f.name.toLowerCase();
  if(n.endsWith('.pdf')){await leerPdf(f);return}
  let rows;
  try{
    if(n.endsWith('.csv')||n.endsWith('.txt'))rows=parseCSV(await leerTexto(f));
    else{
      if(!window.XLSX){toast('No se pudo cargar el lector de Excel. Revisa la conexión.');return}
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
    }
  }catch(e){toast('No he podido leer el archivo');return}
  rows=rows.filter(r=>Array.isArray(r));
  const bx=bankinterExcel(rows);
  if(bx){
    const c=cfg.cuentas.find(x=>x.iban4&&x.iban4===bx.iban4);
    imp.banco=c?(c.id==='bankinter_h'?'Bankinter Héctor':c.id==='tr'?'Trade Republic':'Bankinter'):(imp.banco==='Bankinter Héctor'?'Bankinter Héctor':'Bankinter');
    imp.raw=bx.filas;imp.nombre=f.name;imp.pdfFin=bx.fin;imp.map=detectar(imp.raw);construirFilas();render();
    toast((c?c.nombre:'Bankinter')+': '+(bx.filas.length-1)+' movimientos'+(bx.pend?' ('+bx.pend+' pendientes)':''));
    return;
  }
  imp.raw=rows;imp.nombre=f.name;imp.pdfFin=null;imp.map=detectar(imp.raw);construirFilas();render();
}
/* Excel de Bankinter: tabla de pendientes (compras con tarjeta aún sin cargar) + tabla de movimientos con saldo */
function bankinterExcel(rows){
  const txt=r=>r.map(x=>String(x??'').trim());
  const iH=rows.findIndex(r=>{const t=txt(r).map(norm);return t[0]==='FECHA CONTABLE'&&t[1]==='FECHA VALOR'&&/DESCRIP/.test(t[2])&&t[3]==='IMPORTE'&&t[4]==='SALDO'});
  if(iH<0)return null;
  const cab=rows.slice(0,5).map(r=>txt(r).join(' ')).join(' ');
  const ib=cab.replace(/\s/g,'').match(/ES\d{22}/);
  const filas=[['FECHA','CONCEPTO','IMPORTE','SALDO','PENDIENTE']];
  let pend=0,sumPend=0;
  const iP=rows.findIndex((r,i)=>i<iH&&(t=>norm(t[0])==='FECHA'&&/DESCRIP/.test(norm(t[1]))&&norm(t[2])==='IMPORTE')(txt(r)));
  if(iP>=0)for(let i=iP+1;i<iH;i++){
    const t=txt(rows[i]);if(!t[0])break;
    const v=parseNum(rows[i][2]);if(!v)continue;
    const m=t[1].match(/^(.*?)\s*(\d{2})\/(\d{2})\/(\d{2})$/);
    filas.push([m?'20'+m[4]+'-'+m[3]+'-'+m[2]:parseFecha(rows[i][0]),(m?m[1]:t[1]).replace(/\s+/g,' ').trim(),r2(v),'','SI']);
    pend++;sumPend+=v;
  }
  const lib=[];
  for(let i=iH+1;i<rows.length;i++){
    const r=rows[i],t=txt(r);const fc=parseFecha(r[0]);if(!fc)continue;
    const v=parseNum(r[3]);if(!v)continue;
    const sal=t[4]!==''?r2(parseNum(r[4])):null;
    filas.push([parseFecha(r[1])||fc,t[2].replace(/\s+/g,' '),r2(v),sal,'']);
    lib.push({fc,v,sal});
  }
  // Saldo más reciente: el orden del archivo se deduce de los propios saldos
  let fin=null;
  if(lib.length){

const MES_PDF={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,sept:9,set:9,oct:10,nov:11,dic:12,jan:1,apr:4,aug:8,dec:12};
const esImportePdf=s=>/^-?\d{1,3}(\.\d{3})*,\d{2}\s*€?(\s*-)?$/.test(String(s).trim());
/* items: [{p,x,y,w,s}] (y crece hacia arriba, como en PDF). Devuelve filas tipo hoja: cabecera + [fecha, concepto, importe, saldo] */
function pdfTradeRepublic(items){
  const filas=[['FECHA','CONCEPTO','IMPORTE','SALDO']];
  const paginas=[...new Set(items.map(i=>i.p))].sort((a,b)=>a-b);
  let col=null;
  paginas.forEach(p=>{
    const it=items.filter(i=>i.p===p);
    const h=k=>it.find(i=>i.s.trim().toUpperCase()===k)||it.find(i=>i.s.trim().toUpperCase().startsWith(k));
    const tr=h('TRANSACCIONES DE CUENTA'),en=h('ENTRADA DE'),sa=h('SALIDA DE');
    const ba=it.filter(i=>i.s.trim().toUpperCase()==='BALANCE').sort((a,b)=>b.y-a.y)[0];
    if(en&&sa&&ba)col={en:en.x+en.w/2,sa:sa.x+sa.w/2,ba:ba.x+ba.w/2,top:(tr?tr.y:en.y+20)};
    if(!col)return;
    const fin=h('RESUMEN DEL BALANCE');const bajo=fin?fin.y:0;const alto=(tr||en)?Math.min(col.top,(en||{y:9999}).y-3):9999;
    const zona=it.filter(i=>i.y<alto&&i.y>bajo);
    const imps=zona.filter(i=>esImportePdf(i.s));
    const ys=[...new Set(imps.map(i=>Math.round(i.y)))].sort((a,b)=>b-a);
    ys.forEach(y=>{
      const fila=imps.filter(i=>Math.abs(i.y-y)<2);
      const cerca=c=>fila.map(i=>({i,d:Math.abs(i.x+i.w/2-c)}));
      let ent=0,sal=0,bal=null;
      fila.forEach(i=>{const c=i.x+i.w/2;const d={en:Math.abs(c-col.en),sa:Math.abs(c-col.sa),ba:Math.abs(c-col.ba)};const k=Object.keys(d).sort((a,b)=>d[a]-d[b])[0];const v=parseNum(i.s);if(k==='en')ent+=v;else if(k==='sa')sal+=v;else bal=v});
      const resto=zona.filter(i=>!esImportePdf(i.s)&&Math.abs(i.y-y)<=9);
      const dm=resto.map(i=>i.s.trim().toLowerCase().match(/^(\d{1,2})\s+([a-z]{3,4})\.?$/)).find(Boolean);
      const an=resto.map(i=>i.s.trim().match(/^(\d{4})$/)).find(Boolean);
      if(!dm||!MES_PDF[dm[2]]||(!ent&&!sal))return;
      const fecha=(an?an[1]:new Date().getFullYear())+'-'+pad(MES_PDF[dm[2]])+'-'+pad(dm[1]);
      const xDesc=Math.min(col.en,col.sa)-25;
      const tipo=resto.filter(i=>i.x>95&&i.x<150).map(i=>i.s.trim()).join(' ');
      const desc=resto.filter(i=>i.x>=150&&i.x<xDesc).sort((a,b)=>b.y-a.y||a.x-b.x).map(i=>i.s.trim()).join(' ');
      filas.push([fecha,[tipo,desc].filter(Boolean).join(' · '),r2(ent-sal),bal]);
    });
  });
  return filas;
}
function pdfBankinter(items){
  const filas=[['FECHA','CONCEPTO','IMPORTE','SALDO']];let fin=null;
  const paginas=[...new Set(items.map(i=>i.p))].sort((a,b)=>a-b);
  let col=null;
  paginas.forEach(p=>{
    const it=items.filter(i=>i.p===p);
    const h=re=>it.find(i=>re.test(i.s.trim()));
    const ca=h(/^Cargos/i),ab=h(/^Abonos/i),sa=it.find(i=>/^Saldo$/i.test(i.s.trim())),de=h(/^Descripci/i),fv=h(/^Fecha valor/i);
    if(ca&&ab&&sa)col={ca:ca.x+ca.w,ab:ab.x+ab.w,sa:sa.x+sa.w,de:de?de.x:180,fv:fv?fv.x:125,top:ca.y};
    if(!col)return;
    const fechas=it.filter(i=>i.y<col.top&&i.x<col.fv-20&&/^\d{2}-\d{2}-\d{2}$/.test(i.s.trim()));
    fechas.forEach(fi=>{
      const fila=it.filter(i=>Math.abs(i.y-fi.y)<2);
      const fval=fila.find(i=>i!==fi&&Math.abs(i.x-col.fv)<15&&/^\d{2}-\d{2}-\d{2}$/.test(i.s.trim()));
      let car=0,abo=0,sal=null;
      fila.filter(i=>esImportePdf(i.s)&&i.x>col.de+60).forEach(i=>{const r=i.x+i.w;const d={ca:Math.abs(r-col.ca),ab:Math.abs(r-col.ab),sa:Math.abs(r-col.sa)};const k=Object.keys(d).sort((a,b)=>d[a]-d[b])[0];const v=parseNum(i.s);if(k==='ca')car+=v;else if(k==='ab')abo+=v;else sal=v});
      if(!car&&!abo)return;
      // Saldo negativo: Bankinter pone el signo detrás ("1,11 -")
      if(sal!==null&&fila.some(i=>/^-$/.test(i.s.trim())&&i.x>col.ab))sal=-sal;
      const desc=fila.filter(i=>i.x>=col.de-2&&i.x<col.ca-60&&!esImportePdf(i.s)&&!/^-$/.test(i.s.trim())).sort((a,b)=>a.x-b.x).map(i=>i.s.trim()).join(' ');
      const aFecha=s=>{const m=s.trim().match(/^(\d{2})-(\d{2})-(\d{2})$/);return '20'+m[3]+'-'+m[2]+'-'+m[1]};
      const fc=aFecha(fi.s),fecha=fval?aFecha(fval.s):fc;
      filas.push([fecha,desc,r2(abo-car),sal]);
      if(sal!==null&&(!fin||fc>=fin.fecha))fin={fecha:fc,saldo:sal};
    });
  });
  return {filas,fin};
}

let pdfjsCarga=null;
function cargarPdfjs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(!pdfjsCarga)pdfjsCarga=new Promise((ok,mal)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok(window.pdfjsLib)};sc.onerror=()=>{pdfjsCarga=null;mal(new Error('sin conexión'))};document.head.appendChild(sc)});
  return pdfjsCarga;
}

function detectar(rows){
  let h=-1;
  for(let i=0;i<Math.min(rows.length,40);i++){
    const r=rows[i].map(norm);
    if(r.some(x=>/FECHA|DATE/.test(x))&&r.some(x=>/IMPORTE|CANTIDAD|AMOUNT|CARGO|ABONO|DEBE|HABER/.test(x))){h=i;break}
  }
  const head=h>=0?rows[h].map(norm):[];
  const find=(re,ex)=>head.findIndex(x=>re.test(x)&&!(ex&&ex.test(x)));
  let fecha=find(/OPERACION|CONTABLE/);if(fecha<0||!/FECHA|DATE|F\./.test(head[fecha]))fecha=find(/FECHA|DATE/);
  let concepto=find(/CONCEPTO|DESCRIPCION|DETALLE|MOVIMIENTO|COMERCIO|DESCRIPTION|NAME|BENEFICIARIO|NOMBRE/);
  const importe=find(/IMPORTE|CANTIDAD|AMOUNT/,/SALDO|BALANCE/);
  const cargo=find(/CARGO|DEBE|ADEUDO/),abono=find(/ABONO|HABER/),saldo=find(/SALDO|BALANCE/),pend=find(/^PENDIENTE$/);
  if(h<0){fecha=0;concepto=1;return {h:-1,fecha,concepto,importe:2,cargo:-1,abono:-1,saldo:-1}}
  if(concepto<0)concepto=head.findIndex((x,i)=>i!==fecha&&i!==importe&&i!==cargo&&i!==abono);
  return {h,fecha,concepto,importe,cargo,abono,saldo,pend};
}
function buscarDup(fecha,importe,tipo,usados){
  const t=new Date(fecha).getTime();
  const libre=m=>!m.borrado&&(!m.importKey||/^(gmail|pend)\|/.test(String(m.importKey)))&&!usados.has(m.id)&&m.tipo===tipo&&Math.abs(m.importe-importe)<0.01;
  const dias=m=>Math.abs(new Date(m.fecha).getTime()-t)/864e5;
  // Mismo importe en ±3 días, o un recibo fijo confirmado con ✓ en las 3 semanas de alrededor (el banco puede cobrarlo otro día)
  return movs.find(m=>libre(m)&&dias(m)<=3)||movs.find(m=>libre(m)&&m.origen==='fijo'&&dias(m)<=21);
}

/* Saldo de la cuenta al final del extracto (el del movimiento más reciente) */
function saldoDelExtracto(){
  const id={'Bankinter':'bankinter','Bankinter Héctor':'bankinter_h','Trade Republic':'tr'}[imp.banco];
  if(id&&imp.pdfFin)return {id,saldo:imp.pdfFin.saldo,fecha:imp.pdfFin.fecha};
  const conS=imp.filas.filter(f=>f.saldo!==null&&f.saldo!==undefined);
  if(!id||!conS.length)return null;
  const porN=[...imp.filas].sort((a,b)=>a.n-b.n);
  // ¿El extracto va del más reciente al más antiguo? Lo deducimos de los propios saldos y, si no se puede, de las fechas
  const val=f=>f.tipo==='gasto'?-f.importe:f.importe,cerca=(a,b)=>Math.abs(a-b)<0.01;
  let vD=0,vA=0;
  for(let i=0;i+1<porN.length;i++){const a=porN[i],b=porN[i+1];if(a.saldo==null||b.saldo==null)continue;if(cerca(a.saldo,b.saldo+val(a)))vD++;if(cerca(b.saldo,a.saldo+val(b)))vA++}
  const desc=vD!==vA?vD>vA:(porN.length>1&&porN[0].fecha>porN[porN.length-1].fecha);
  const max=conS.reduce((a,f)=>f.fecha>a?f.fecha:a,'');
  const delDia=conS.filter(f=>f.fecha===max).sort((a,b)=>a.n-b.n);
  const f=desc?delDia[0]:delDia[delDia.length-1];
  return {id,saldo:f.saldo,fecha:max};
}

  const grupoCats=(g,t)=>'<h3>'+t+'</h3>'+cfg.cats.filter(c=>c.grupo===g).map(c=>'<div class="crow"><input class="ico" value="'+esc(c.icono)+'" onchange="setCat(\''+c.id+'\',\'icono\',this.value)"><input value="'+esc(c.nombre)+'" onchange="setCat(\''+c.id+'\',\'nombre\',this.value)">'+(g==='variable'?'<input inputmode="decimal" placeholder="Sin límite" value="'+(c.presupuesto?String(c.presupuesto).replace('.',','):'')+'" onchange="setCat(\''+c.id+'\',\'presupuesto\',parseNum(this.value))">':'<span></span>')+'<label><input type="checkbox"'+(c.oculta?'':' checked')+' onchange="setCat(\''+c.id+'\',\'oculta\',!this.checked)">Ver</label></div>').join('');
  const mesOpts=sel=>'<option value="0">Cada mes</option>'+MESES.map((m,i)=>'<option value="'+(i+1)+'"'+(sel===i+1?' selected':'')+'>Solo '+m.toLowerCase()+'</option>').join('');
  return '<section class="card"><h2>¿Quién usa este móvil?</h2><div class="seg">'+cfg.personas.map(p=>'<button class="'+(yo===p?'on':'')+'" onclick="setYo(\''+esc(p)+'\')">'+esc(p)+'</button>').join('')+'</div><p class="muted small">Los apuntes se marcan con este nombre.</p></section>'
  +'<section class="card"><h2>💼 Nóminas</h2><p class="muted small" style="margin-top:-4px">Las nóminas que entran a partir de este día cuentan para el mes siguiente (con ellas vivís el mes que empieza). Pon 0 para desactivarlo.</p><label>A partir del día<input type="number" min="0" max="31" inputmode="numeric" value="'+(Number((cfg.nominaSig||{}).dia)||0)+'" onchange="cfg.nominaSig={dia:Math.max(0,Math.min(31,parseInt(this.value)||0))};saveCfg();render()"></label></section>'
  +'<section class="card"><h2>💶 Saldo de las cuentas</h2><p class="muted small" style="margin-top:-4px">Escribe el saldo que ves hoy en el banco. Desde ahí la app suma los ingresos y resta los gastos. Al importar un extracto con columna de saldo se corrige solo.</p>'
   +cfg.cuentas.map(c=>{const s=saldoCuenta(c);return '<h3>'+esc(c.nombre)+({dia:' · día a día',personal:' · personal',ahorro:' · ahorro'}[c.tipo]||'')+'</h3>'+(s!==null?'<p class="small" style="margin:0 0 6px">Ahora: <b>'+eur(s)+'</b> <span class="muted">(puesto el '+fechaCorta(c.fecha)+')</span></p>':'<p class="small muted" style="margin:0 0 6px">Sin saldo todavía.</p>')+'<div class="row2"><input id="sal_'+c.id+'" inputmode="decimal" placeholder="Saldo de hoy"><button class="btn sm" style="margin:4px 0 0" onclick="ponerSaldo(\''+c.id+'\')">Guardar saldo</button></div>'}).join('')+'</section>'

  +'<section class="card"><h2>☁️ Copia en la nube (Google)</h2><p class="small muted" style="margin-top:-4px">Estado: '+(sync.url?(sync.error?'<b style="color:var(--neg)">error: '+esc(sync.error)+'</b>':'conectado · última vez '+ultima):'sin conectar · los datos solo están en este móvil')+'</p>'
   +'<label>Dirección de tu hoja (URL de la aplicación web)<input value="'+esc(sync.url)+'" placeholder="https://script.google.com/macros/s/…/exec" onchange="sync.url=this.value.trim();sync.desde=0;store.set(\'cc_sync\',sync)"></label>'
   +'<label>Clave secreta<input type="password" value="'+esc(sync.clave)+'" onchange="sync.clave=this.value.trim();store.set(\'cc_sync\',sync)"></label>'
   +'<div class="row2"><button class="btn ghost" onclick="probarNube()">Probar conexión</button><button class="btn" onclick="sincronizar(true)">Sincronizar ahora</button></div>'
   +'<details><summary>¿Cómo se conecta? (una sola vez, 10 minutos)</summary><ol class="steps"><li>Crea una hoja nueva en Google Drive llamada <b>Cuentas de Casa</b>.</li><li>Menú <b>Extensiones → Apps Script</b>. Borra lo que haya y pega el código del archivo <code>Codigo.gs</code>.</li><li>En la línea de <code>CLAVE</code> inventa una contraseña larga y guarda (💾).</li><li><b>Implementar → Nueva implementación</b> → tipo <b>Aplicación web</b>. Ejecutar como: <b>Yo</b>. Quién tiene acceso: <b>Cualquier usuario</b>. Autoriza los permisos.</li><li>Copia la URL que acaba en <code>/exec</code> y pégala arriba con tu clave.</li><li>Irene hace lo mismo en su móvil: misma URL y misma clave.</li></ol><p class="small muted">La app nunca borra nada en la hoja: lo que mandas a la papelera solo queda marcado. Y Google guarda el historial de versiones.</p></details></section>'

  +'<section class="card"><h2>Categorías y presupuestos</h2><p class="muted small" style="margin-top:-4px">Pon un límite al mes en los gastos del día a día y verás la barra en verde, naranja o rojo.</p>'
   +grupoCats('variable','Día a día (icono · nombre · límite/mes)')+grupoCats('fijo','Recibos fijos')+grupoCats('ingreso','Ingresos')+grupoCats('neutro','No cuentan')
   +'<h3>Añadir categoría</h3><div class="row2"><input id="nIco" placeholder="Icono 🙂" maxlength="4"><input id="nNom" placeholder="Nombre"></div><select id="nGru"><option value="variable">Día a día</option><option value="fijo">Recibo fijo</option><option value="ingreso">Ingreso</option><option value="neutro">No cuenta</option></select><button class="btn ghost" onclick="nuevaCat()">Añadir</button></section>'

  +'<section class="card"><h2>Recibos fijos de cada mes</h2><p class="muted small" style="margin-top:-4px">Se apuntan solos cada mes el día de cobro. Si un mes cambia, tocad el apunte y corregid el importe; si no toca, mandadlo a la papelera. Sin día, solo sale como recordatorio en Resumen. «Último recibo» = el importe del último cargo del banco.</p>'
   +cfg.fijos.map((f,i)=>'<div class="frow5"><span>'+catById(f.cat).icono+' '+esc(catById(f.cat).nombre)+'</span>'+(f.porcentaje?'<span class="small muted">'+f.porcentaje+' % ingr.</span>':(f.auto==='ultimo'?'<span class="small muted">Último recibo</span>':'<input inputmode="decimal" placeholder="Variable" value="'+(f.importe?String(f.importe).replace('.',','):'')+'" onchange="cfg.fijos['+i+'].importe=parseNum(this.value)||null;saveCfg()">'))+'<input type="number" min="0" max="31" inputmode="numeric" title="Día de cobro" placeholder="Día" value="'+(f.dia||'')+'" onchange="cfg.fijos['+i+'].dia=Math.max(0,Math.min(31,parseInt(this.value)||0));saveCfg()">'+'<select onchange="cfg.fijos['+i+'].mes=+this.value;saveCfg()">'+mesOpts(f.mes)+'</select><button class="x" onclick="cfg.fijos.splice('+i+',1);saveCfg();render()">✕</button></div>').join('')
   +'<h3>Añadir recibo</h3><div class="row2"><select id="fCat">'+cfg.cats.filter(c=>c.grupo==='fijo').map(c=>'<option value="'+c.id+'">'+c.icono+' '+esc(c.nombre)+'</option>').join('')+'</select><input id="fImpN" inputmode="decimal" placeholder="Importe"></div><button class="btn ghost" onclick="nuevoFijo()">Añadir</button></section>'

  +'<section class="card"><h2>Botones rápidos</h2><p class="muted small" style="margin-top:-4px">Con importe se guardan con un solo toque. Sin importe, solo eligen la categoría.</p>'
   +cfg.atajos.map((a,i)=>'<div class="frow"><span>'+catById(a.cat).icono+' '+esc(a.nombre)+'</span><span class="small">'+(a.importe?eur(a.importe):'—')+'</span><span></span><button class="x" onclick="cfg.atajos.splice('+i+',1);saveCfg();render()">✕</button></div>').join('')
   +'<h3>Añadir botón</h3><div class="row2"><input id="aNom" placeholder="Nombre (ej. Café)"><input id="aImp" inputmode="decimal" placeholder="Importe (opcional)"></div><select id="aCat">'+catOptions('super')+'</select><button class="btn ghost" onclick="nuevoAtajo()">Añadir</button></section>'

  +'<section class="card"><details><summary><b>Palabras que reconoce al importar ('+cfg.reglas.length+')</b></summary>'
   +cfg.reglas.map((r,i)=>'<div class="frow"><span>'+esc(r.texto)+'</span><span class="small">→</span><span class="small">'+catById(r.cat).icono+' '+esc(catById(r.cat).nombre)+'</span><button class="x" onclick="cfg.reglas.splice('+i+',1);saveCfg();render()">✕</button></div>').join('')
   +'<h3>Añadir palabra</h3><div class="row2"><input id="rTxt" placeholder="Ej: EROSKI"><select id="rCat">'+catOptions('super')+'</select></div><button class="btn ghost" onclick="nuevaRegla()">Añadir</button></details></section>'

  +'<section class="card"><h2>Copias y Excel</h2><button class="btn ghost" onclick="exportarExcel('+vm.y+')">📊 Descargar Excel de '+vm.y+'</button><button class="btn ghost" onclick="descargarCopia()">💾 Descargar copia completa</button><label class="file" style="padding:14px">♻️ Restaurar una copia<input type="file" accept=".json" onchange="restaurarCopia(this.files[0]);this.value=\'\'"></label></section>'

  +'<section class="card"><details><summary><b>🗑️ Papelera ('+enPapelera.length+')</b></summary>'+(enPapelera.length?enPapelera.sort((a,b)=>b.modificado-a.modificado).slice(0,100).map(m=>'<div class="flex" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span class="small">'+catById(m.categoria).icono+' '+esc(catById(m.categoria).nombre)+' · '+eur(m.importe)+' · '+fechaCorta(m.fecha)+'</span><button class="btn sm ghost" onclick="updMov(\''+m.id+'\',{borrado:false});render()">Recuperar</button></div>').join(''):'<p class="muted small">Vacía.</p>')+'</details></section>';
}
function setYo(p){yo=p;store.set('cc_yo',p);form.quien='';render()}
function setCat(id,k,v){const c=cfg.cats.find(x=>x.id===id);if(!c)return;c[k]=v;saveCfg()}
function nuevaCat(){const nom=$('#nNom').value.trim();if(!nom){toast('Escribe el nombre');return}cfg.cats.push({id:'c_'+uid().slice(0,8),nombre:nom,icono:$('#nIco').value.trim()||'🏷️',grupo:$('#nGru').value,presupuesto:0,oculta:false});saveCfg();render();toast('Categoría añadida')}
function nuevoFijo(){cfg.fijos.push({id:uid(),cat:$('#fCat').value,importe:parseNum($('#fImpN').value)||null,mes:0,dia:1});saveCfg();render()}
function nuevoAtajo(){const nom=$('#aNom').value.trim();if(!nom){toast('Escribe el nombre');return}cfg.atajos.push({id:uid(),nombre:nom,importe:parseNum($('#aImp').value)||null,cat:$('#aCat').value});saveCfg();render()}
function nuevaRegla(){const t=$('#rTxt').value.trim();if(!t)return;cfg.reglas.unshift({texto:norm(t),cat:$('#rCat').value});saveCfg();render()}

/* ===================== Excel y copias ===================== */
function exportarExcel(y){
  if(!window.XLSX){toast('No se pudo cargar el generador de Excel');return}
  const wb=XLSX.utils.book_new();
  const meses=[...Array(12)].map((_,i)=>calc(deMes(y,i)));
  const filas=[['CUENTAS '+y,...MESES.map(m=>m.toUpperCase()),'TOTAL']];
  const suma=a=>r2(a.reduce((x,z)=>x+z,0));
  const tot={};
  [['INGRESOS','ingreso',1],['RECIBOS FIJOS','fijo',-1],['GASTOS DEL DÍA A DÍA','variable',-1],['NO CUENTAN (traspasos, inversión)','neutro',-1]].forEach(([t,g,s])=>{
    filas.push([t]);const acc=Array(12).fill(0);
    cfg.cats.filter(c=>c.grupo===g).forEach(c=>{const v=meses.map(x=>r2(s*(x.cat[c.id]||0)));if(c.oculta&&!suma(v.map(Math.abs)))return;filas.push([c.nombre,...v,suma(v)]);v.forEach((z,i)=>acc[i]+=z)});
    tot[g]=acc.map(r2);filas.push(['TOTAL '+t,...tot[g],suma(tot[g])]);filas.push([]);
  });
  const gastos=tot.fijo.map((x,i)=>r2(x+tot.variable[i]));
  const ahorro=tot.ingreso.map((x,i)=>r2(x+gastos[i]));
  let a=0;const acum=ahorro.map(x=>r2(a+=x));
  filas.push(['TOTAL GASTOS',...gastos,suma(gastos)],['AHORRO DEL MES',...ahorro,suma(ahorro)],['AHORRO ACUMULADO',...acum,acum[11]]);
  const ws=XLSX.utils.aoa_to_sheet(filas);ws['!cols']=[{wch:30},...Array(13).fill({wch:12})];
  XLSX.utils.book_append_sheet(wb,ws,'RESUMEN '+y);
  const vars=cfg.cats.filter(c=>c.grupo==='variable');
  for(let i=0;i<12;i++){
    const l=deMes(y,i);if(!l.length)continue;
    const colum=vars.map(c=>l.filter(m=>m.categoria===c.id).map(m=>r2(m.tipo==='gasto'?-m.importe:m.importe)));
    const alto=Math.max(0,...colum.map(c=>c.length));
    const hoja=[['',...vars.map(c=>c.nombre.toUpperCase())]];
    for(let k=0;k<alto;k++)hoja.push(['',...colum.map(c=>c[k]??'')]);
    hoja.push(['TOTAL',...colum.map(c=>suma(c))]);
    const w=XLSX.utils.aoa_to_sheet(hoja);w['!cols']=[{wch:8},...vars.map(()=>({wch:13}))];
    XLSX.utils.book_append_sheet(wb,w,MESES[i].toUpperCase());
  }
  const lista=deAno(y).sort((p,q)=>p.fecha.localeCompare(q.fecha)).map(m=>{const c=catById(m.categoria);const[s]=signo(m);return {Fecha:m.fecha,Categoría:c.nombre,Grupo:{variable:'Día a día',fijo:'Recibo fijo',ingreso:'Ingreso',neutro:'No cuenta'}[c.grupo]||'',Detalle:m.sub,Nota:m.nota,Importe:r2(s==='−'?-m.importe:m.importe),Quién:m.quien,Origen:m.origen}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(lista.length?lista:[{Fecha:'',Categoría:'',Importe:''}]),'MOVIMIENTOS');
  XLSX.writeFile(wb,'Cuentas_'+y+'.xlsx');
}
function descargar(nombre,texto,tipo){const b=new Blob([texto],{type:tipo});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function descargarCopia(){descargar('copia_cuentas_'+hoy()+'.json',JSON.stringify({version:1,fecha:new Date().toISOString(),movs,cfg},null,1),'application/json');toast('Copia descargada')}
async function restaurarCopia(f){
  if(!f)return;
  try{
    const d=JSON.parse(await f.text());if(!Array.isArray(d.movs))throw 0;
    let n=0;
    d.movs.forEach(r=>{const i=movs.findIndex(m=>m.id===r.id);if(i<0){movs.push({...r,pend:true});n++}else if((r.modificado||0)>(movs[i].modificado||0)){movs[i]={...r,pend:true};n++}});
    if(d.cfg&&(d.cfg.modificado||0)>(cfg.modificado||0)){cfg=asegurarCats(d.cfg);store.set('cc_cfg',cfg)}
    saveMovs();programarSync();render();toast('Copia restaurada: '+n+' movimientos recuperados');
  }catch(e){toast('Ese archivo no es una copia válida')}
}

/* ===================== Sincronización con Google ===================== */
let syncTimer=null,sincronizando=false;
function estadoSync(){
  const dot=$('#syncDot'),txt=$('#syncTxt');if(!dot)return;
  const pend=movs.some(m=>m.pend);
  let col='#9ca3af',t='Sin nube';
  if(sync.url){if(sincronizando){col='#2563eb';t='Guardando…'}else if(sync.error){col='#dc2626';t='Error nube'}else if(pend){col='#d97706';t='Pendiente'}else{col='#16a34a';t='En la nube'}}
  dot.style.background=col;txt.textContent=t;
}
function programarSync(){estadoSync();if(!sync.url||!sync.clave)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sincronizar(false),2000)}
async function llamar(cuerpo){
  const r=await fetch(sync.url,{method:'POST',body:JSON.stringify(Object.assign({clave:sync.clave},cuerpo))});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Respuesta no válida');return j;
}
async function probarNube(){
  if(!sync.url||!sync.clave){toast('Pon la URL y la clave');return}
  try{await llamar({accion:'probar'});toast('✅ Conexión correcta');}catch(e){toast('❌ No conecta: '+(e.message||e))}
}
async function sincronizar(manual){
  if(!sync.url||!sync.clave){if(manual){vista='ajustes';render();toast('Conecta primero tu hoja de Google')}return}
  if(sincronizando)return;
  sincronizando=true;estadoSync();
  try{
    const enviar=movs.filter(m=>m.pend).map(m=>{const c=Object.assign({},m);delete c.pend;return c});
    const j=await llamar({accion:'sync',desde:sync.desde||0,movs:enviar,cfg});
    const enviados=new Map(enviar.map(m=>[m.id,m.modificado]));
    movs.forEach(m=>{if(m.pend&&enviados.get(m.id)===m.modificado)m.pend=false});
    (j.movs||[]).forEach(r=>{
      r.importe=Number(r.importe)||0;r.borrado=r.borrado===true||String(r.borrado).toUpperCase()==='TRUE';
      r.creado=Number(r.creado)||0;r.modificado=Number(r.modificado)||0;r.id=String(r.id);r.fecha=String(r.fecha).slice(0,10);delete r.srv;
      const i=movs.findIndex(m=>m.id===r.id);
      if(i<0)movs.push(Object.assign(r,{pend:false}));
      else if(!(movs[i].pend&&movs[i].modificado>r.modificado))movs[i]=Object.assign(r,{pend:false});
    });
    if(j.cfg&&(Number(j.cfg.modificado)||0)>(Number(cfg.modificado)||0)){cfg=asegurarCats(j.cfg);store.set('cc_cfg',cfg)}
    sync.desde=j.ahora;sync.ultimaOk=Date.now();sync.error='';mercaCache={};
    store.set('cc_sync',sync);saveMovs();
    if(manual)toast('☁️ Todo guardado en la nube');
    const ocupado=document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName);
    if(!ocupado&&$('#modal').classList.contains('hidden')&&vista!=='importar')render();
  }catch(e){
    sync.error=String(e&&e.message||e);store.set('cc_sync',sync);
    if(manual)toast('No se pudo sincronizar: '+sync.error);
  }finally{sincronizando=false;estadoSync()}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sincronizar(false)});
setInterval(()=>sincronizar(false),5*60*1000);

render();
sincronizar(false);
