<script>
/* ===================== utilidades ===================== */
const $=s=>document.querySelector(s);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MCORTO=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const PALETA=['#0f766e','#2563eb','#d97706','#db2777','#7c3aed','#16a34a','#dc2626','#0891b2','#ca8a04','#64748b'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((Number(n)||0)*100)/100;
const eur=n=>(r2(n)||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const eur0=n=>Math.round(Number(n)||0).toLocaleString('es-ES')+' €';
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy=()=>ymd(new Date());
const fechaCorta=f=>{const p=String(f).split('-');return p.length===3?(+p[2])+' '+MCORTO[+p[1]-1]:f};
const norm=x=>String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const palabras=x=>norm(x).replace(/[^A-Z0-9Ñ ]/g,' ').split(/\s+/).filter(Boolean);

const memoria={};
const store={
  get(k,d){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return k in memoria?memoria[k]:d},
  set(k,v){memoria[k]=v;try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){if(!store.av){store.av=1;setTimeout(()=>{store.av=0},60000);setTimeout(()=>toast('⚠️ Este móvil no deja guardar más datos. Descarga una copia en Ajustes.'),0)}return false}}
};

function parseNum(v){
  if(typeof v==='number')return v;
  let s=String(v??'').replace(/[\u2212\u2013]/g,'-').replace(/[€\s\u00a0]/g,'').replace(/EUR/i,'');
  if(!s)return 0;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(s.endsWith('-')){neg=true;s=s.slice(0,-1)}
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
  else if(lc>-1){s=s.replace(/\.(?=\d{3})/g,'').replace(',','.')}
  else if(ld>-1&&/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}
  const n=parseFloat(s);
  return isNaN(n)?0:(neg?-Math.abs(n):n);
}
function parseFecha(v){
  if(v instanceof Date&&!isNaN(v))return ymd(v);
  if(typeof v==='number'&&v>20000&&v<80000){return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10)}
  const s=String(v??'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m){const dd=new Date(+m[1],+m[2]-1,+m[3]);if(dd.getMonth()!==+m[2]-1||dd.getDate()!==+m[3])return null;return m[1]+'-'+pad(m[2])+'-'+pad(m[3])}
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;{const dd=new Date(y,+m[2]-1,+m[1]);if(dd.getMonth()!==+m[2]-1||dd.getDate()!==+m[1])return null}return y+'-'+pad(m[2])+'-'+pad(m[1])}
  return null;
}

/* ===================== configuración de serie (genérica; la vuestra vive en la hoja y en el móvil) ===================== */

/* Añade las categorías nuevas de serie a una configuración ya guardada (sin tocar lo demás) */
function asegurarCats(c){
  const base=defaultCfg().cats;let cambio=false;
  base.forEach((d,i)=>{
    if(c.cats.some(x=>x.id===d.id))return;
    const prev=base.slice(0,i).reverse().find(p=>c.cats.some(x=>x.id===p.id));
    const pos=prev?c.cats.findIndex(x=>x.id===prev.id)+1:c.cats.length;
    c.cats.splice(pos,0,d);cambio=true;
  });
  if(!c.nominaSig){c.nominaSig={dia:20};cambio=true}
  if((Number(c.fijosV)||0)<2){c.fijosV=2;cambio=true}
  if(!Array.isArray(c.cuentas))c.cuentas=[];
  if(!c.cuentas.length){c.cuentas=defaultCfg().cuentas;cambio=true} // las cuentas ya las gestiona cada uno
  if(!Array.isArray(c.reglas))c.reglas=[];
  if((Number(c.reglasV)||0)<2){REGLAS_V2.forEach(([t,k])=>{if(!c.reglas.some(r=>norm(r.texto)===norm(t)))c.reglas.push({texto:t,cat:k})});c.reglasV=2;cambio=true}
  if(!Array.isArray(c.personas)||!c.personas.length){c.personas=defaultCfg().personas;cambio=true}
  if(cambio){c.modificado=(Number(c.modificado)||0)+1;store.set('cc_cfg',c)}
  return c;
}

/* Mes en el que cuenta un apunte: las nóminas cobradas a final de mes cuentan para el mes siguiente */
const esNomina=m=>m.tipo==='ingreso'&&/^nomina/.test(String(m.categoria||''));
function mesCont(m){
  const f=String(m.fecha),dia=Number((cfg.nominaSig||{}).dia)||0;
  if(dia&&esNomina(m)&&Number(f.slice(8,10))>=dia){const y=+f.slice(0,4),mm=+f.slice(5,7);return mm===12?(y+1)+'-01':y+'-'+pad(mm+1)}
  return f.slice(0,7);
}
const deMes=(y,m)=>{const p=y+'-'+pad(m+1);return movs.filter(x=>!x.borrado&&mesCont(x)===p)};
const deAno=y=>movs.filter(x=>!x.borrado&&mesCont(x).startsWith(y+'-'));

/* Cálculo: gastos positivos = dinero que sale; una devolución resta del gasto */
function calc(list){
  const t={ingreso:0,fijo:0,variable:0,neutro:0,cat:{}};
  list.forEach(x=>{
    const c=catById(x.categoria);const g=c.grupo||'variable';
    const v=g==='ingreso'?(x.tipo==='ingreso'?x.importe:-x.importe):(x.tipo==='gasto'?x.importe:-x.importe);
    t[g]=(t[g]||0)+v;t.cat[c.id]=(t.cat[c.id]||0)+v;
  });
  t.gastos=t.fijo+t.variable;t.ahorro=t.ingreso-t.gastos;
  return t;
}

const GRUPO_ICONO={'Carne y pescado':'🥩','Fruta y verdura':'🥦','Lácteos y huevos':'🥛','Pan y bollería':'🍞','Despensa':'🥫','Café':'☕','Bebidas':'🥤','Limpieza y hogar':'🧽','Higiene':'🧴','Suplementos':'💊','Mascotas':'🐾','Otros':'📦'};
let mercaCache={};
async function cargarMercadona(mes){
  let d=mercaCache[mes];
  if(!d){
    try{d=await llamar({accion:'mercadona',mes});mercaCache[mes]=d}
    catch(e){const b=$('#mercaBox');if(b)b.innerHTML='<h2>🛒 Dentro de Mercadona</h2><p class="muted small">No se han podido cargar los productos ahora.</p>';return}
  }
  const b=$('#mercaBox');if(!b||vm.y+'-'+pad(vm.m+1)!==mes)return;
  const grupos=Object.entries(d.grupos||{}).sort((a,z)=>z[1]-a[1]);
  if(!grupos.length){b.innerHTML='<h2>🛒 Dentro de Mercadona</h2><p class="muted small">Aún no hay productos leídos de los tickets de este mes.</p>';return}
  const tot=grupos.reduce((a,g)=>a+g[1],0),max=grupos[0][1];
  b.innerHTML='<h2>🛒 Dentro de Mercadona</h2><p class="muted small" style="margin-top:-6px">'+d.tickets+' tickets · '+eur(tot)+'</p>'
   +grupos.map(([g,v])=>'<div class="bline"><div class="bhead"><span>'+(GRUPO_ICONO[g]||'📦')+' '+esc(g)+'</span><span><b>'+eur(v)+'</b> <small class="muted">'+Math.round(v/tot*100)+' %</small></span></div><div class="bar"><i style="width:'+(v/max*100)+'%"></i></div></div>').join('')
   +(d.top&&d.top.length?'<h3>Lo que más gastas</h3>'+d.top.slice(0,6).map(p=>'<div class="bhead small" style="padding:4px 0"><span>'+(GRUPO_ICONO[p.grupo]||'📦')+' '+esc(p.producto)+' <span class="muted">×'+p.veces+'</span></span><span>'+eur(p.total)+'</span></div>').join(''):'')
   +(d.subidas&&d.subidas.length?'<h3>📈 Ha subido de precio</h3>'+d.subidas.map(s=>'<div class="bhead small" style="padding:4px 0"><span>'+esc(s.producto)+'</span><span style="color:var(--neg)">'+eur(s.antes)+' → '+eur(s.ahora)+(s.kg?'/kg':'')+'</span></div>').join(''):'');
}

function icoCat(c,cls){

  let h=0;for(const ch of String(c.id))h=(h*31+ch.charCodeAt(0))>>>0;
  return '<span class="icoc emo'+(cls?' '+cls:'')+'" style="background:'+(c.color||COLORES_LIBRES[h%COLORES_LIBRES.length])+'" aria-hidden="true">'+esc(c.icono||String(c.nombre||'?').slice(0,1))+'</span>';

function signo(m){const c=catById(m.categoria);if(c.grupo==='neutro')return ['','neu'];const entra=c.grupo==='ingreso'?m.tipo==='ingreso':m.tipo!=='gasto';return entra?['+','pos']:['−','neg']}
function itemMov(m){

/* Reduce la foto (1800 px, JPEG) para que suba rápido y el lector de Google la entienda bien */
async function reducirImagen(f){
  const bm=await createImageBitmap(f,{imageOrientation:'from-image'});
  const k=Math.min(1,1800/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bm,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.85).split(',')[1];
}
function leerComoBase64(f){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>ko(new Error('No se pudo abrir el archivo'));r.readAsDataURL(f)})}
async function leerImagen(f){
  if(!f)return;
  if(!sync.url||!sync.clave){toast('Para leer fotos hay que tener conectada la hoja de Google (Ajustes)');return}
  const pdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
  if(pdf&&f.size>6e6){toast('El PDF pesa demasiado (máximo 6 MB). Prueba con una captura.');return}
  $('#sheet').innerHTML='<h2>Leyendo…</h2><p class="muted">Suele tardar unos segundos.</p>';abrir();
  let j;
  try{j=await llamar({accion:'ocr',imagen:pdf?await leerComoBase64(f):await reducirImagen(f),mime:pdf?'application/pdf':'image/jpeg'})}
  catch(e){cerrar();toast('No he podido leer el archivo: '+(e.message||e));return}
  if(typeof j.texto!=='string'){cerrar();toast('Falta actualizar el script de Google para leer imágenes');return}
  lec={texto:j.texto,srv:j.ticket};cp=null;
  aplicarLectura(tipoDeTexto(j.texto,j.ticket));
}
/* ---- ticket de compra ---- */
function numFechaOcr(y,m,d){
  y=+y;if(y<100)y+=2000;m=+m;d=+d;if(m<1||m>12||d<1||d>31)return null;
  const f=y+'-'+pad(m)+'-'+pad(d);return f<'2020-01-01'||f>ymd(new Date(Date.now()+864e5))?null:f;
}
function fechaDeTicket(t){const m=String(t).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})(?!\d)/);return m?numFechaOcr(m[3],m[2],m[1]):null}
function comercioDeTicket(t){
  if(/MERCADONA/i.test(t))return 'Mercadona';
  const l=String(t).split(/\r?\n/).map(x=>x.trim()).find(x=>(x.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ]/g)||[]).length>=3&&!/^\d/.test(x)&&!/TICKET|FACTURA|NIF|CIF/i.test(x));
  return l?l.replace(/\s+/g,' ').slice(0,28).toLowerCase().replace(/(^|\s)\S/g,s=>s.toUpperCase()):'';
}
/* Ticket de un comercio cualquiera. El lector de Google a veces separa descripción e importe en líneas distintas: se admiten las dos formas */
function parseGenerico(texto){
  const SKIP=/TOTAL|SUBTOTAL|IVA\b|I\.V\.A|BASE|CUOTA|ENTREGADO|CAMBIO|EFECTIVO|TARJETA|VISA|MASTERCARD|A PAGAR|FACTURA|TICKET|NIF|CIF|TEL[EÉ]F|FECHA|HORA|CAJA|OPERADOR|GRACIAS|PUNTOS|DESCUENTO|AHORRO|ENV[IÍ]O|^ART[IÍ]CULOS|GASTOS DE|PEDIDO|^DESCRIPCI|^P\. ?UNIT|^IMPORTE|^CANT|^PRECIO|\bOP:/i;
  const L=String(texto).split(/\r?\n/).map(l=>l.replace(/\u00a0/g,' ').trim()).filter(Boolean);
  const P='-?\\d{1,4}[.,]\\d{2}(?!\\d)',letras=/[A-Za-zÁÉÍÓÚÑáéíóúñ]{2}/;
  const soloPrecios=new RegExp('^(?:'+P+'\\s*(?:€\\/?\\s*kg|kg|€|EUR|[A-Z])?\\s*){1,3}$','i');
  const finPrecios=new RegExp('^(.*?'+'[A-Za-zÁÉÍÓÚÑáéíóúñ]'+'.*?)\\s+((?:'+P+'\\s*(?:€\\/?\\s*kg|kg|€|EUR)?\\s*){1,3})\\s*[A-Z]?$','i');
  const ultimo=t=>{const m=t.match(new RegExp(P,'g'));return m?parseNum(m[m.length-1]):0};
  const items=[];let total=null,pend='',espT=false;
  const add=(d,imp)=>{
    const q=d.match(/^(\d{1,2})\s*[xX]?\s+(.+)$/),desc=(q?q[2]:d).replace(/\s+/g,' ').trim();
    if(imp>0&&desc.length>=2&&letras.test(desc))items.push({producto:desc,cant:q?+q[1]:1,importe:r2(imp),grupo:''});
  };
  L.forEach(l=>{
    if(/^(TOTAL|A PAGAR|IMPORTE TOTAL)/i.test(l)){const v=ultimo(l);if(v)total=v;else espT=true;pend='';return}
    if(espT&&soloPrecios.test(l)){total=ultimo(l);espT=false;return}
    espT=false;
    if(SKIP.test(l)){pend='';return}
    if(soloPrecios.test(l)){if(pend)add(pend,ultimo(l));pend='';return}
    const m=l.match(finPrecios);
    if(m){add(m[1],ultimo(m[2]));pend='';return}
    pend=letras.test(l)?l:'';
  });
  return {items,total,ok:false};
}
const GRUPO_CAT={'Limpieza y hogar':'casa','Higiene':'farmacia','Suplementos':'suplementacion'};
function catDeArticulo(d,grupo,def){
  const ok=id=>cfg.cats.some(c=>c.id===id&&!c.oculta)?id:'';
  const g=GRUPO_CAT[grupo];if(g&&ok(g))return g;
  const s=sugerir(d);if(s&&catById(s).grupo==='variable')return s;
  if(!grupo){
    const n=' '+norm(d)+' ';
    if(/ (DETERG|LEJIA|FREGONA|BAYETA|ESTROPAJO|SUAVIZ|LAVAVAJ|FRIEGA|BOLSA|PILA |AMBIENTADOR)/.test(n)&&ok('casa'))return 'casa';
    if(/ (CHAMPU|GEL |DENTIF|DESODOR|CEPILLO|COMPRESA|TAMPON|CREMA|JABON)/.test(n)&&ok('farmacia'))return 'farmacia';
  }
  return (def&&catById(def).grupo==='variable'&&ok(def))||ok('super')||ok('extras')||cfg.cats.find(c=>c.grupo==='variable'&&!c.oculta).id;
}
function ticketDeTexto(texto,srv){
  const g=srv&&srv.items&&srv.items.length?srv:parseGenerico(texto);
  const comer=comercioDeCompra(texto),porTienda=sugerir(comer);
  const items=g.items.map(i=>({desc:i.producto,importe:r2(i.importe),cat:catDeArticulo(i.producto,i.grupo,i.grupo?'':porTienda),on:true}));
  const suma=r2(items.reduce((a,i)=>a+i.importe,0));
  const t={fecha:fechaDeTicket(texto)||hoy(),comercio:comer,items,total:g.total!=null?r2(g.total):suma,modo:'items',cuenta:(cuentaDia()||{}).id,igual:false};
  return t;
}
const tkSuma=()=>r2(tk.items.filter(i=>i.on).reduce((a,i)=>a+(Number(i.importe)||0),0));
function tkDuplicado(){
  const s=tkSuma(),t=new Date(tk.fecha).getTime();
  const por=movs.find(m=>!m.borrado&&m.tipo==='gasto'&&(Math.abs(m.importe-s)<0.01||Math.abs(m.importe-tk.total)<0.01)&&Math.abs(new Date(m.fecha).getTime()-t)<=3*864e5);
  if(por)return catById(por.categoria).nombre+' '+eur(por.importe)+' ('+fechaCorta(por.fecha)+')';
  const ya=movs.find(m=>!m.borrado&&String(m.importKey).startsWith('tk|'+tk.fecha+'|'+s.toFixed(2)));
  return ya?'este mismo ticket, ya guardado':'';
}

   +(dup?'<p class="small" style="color:var(--warn);margin:0 0 6px">⚠️ Ya tienes: '+esc(dup)+'. Si ya está apuntado, no lo guardes otra vez.</p><label style="display:flex;gap:8px;align-items:center;margin:0 0 8px"><input type="checkbox" style="width:auto"'+(tk.igual?' checked':'')+' onchange="tk.igual=this.checked"> Guardarlo igualmente</label>':'')
   +'<div class="seg" style="margin-top:8px"><button class="'+(tk.modo==='items'?'on':'')+'" onclick="tk.modo=\'items\';pintarTicket()">Uno por artículo</button><button class="'+(tk.modo==='cat'?'on':'')+'" onclick="tk.modo=\'cat\';pintarTicket()">Agrupado por categoría</button></div>'
   +(cuentasVis().length>1?'<label>Pagado desde<select onchange="tk.cuenta=this.value">'+cuentasVis().map(c=>'<option value="'+esc(c.id)+'"'+(tk.cuenta===c.id?' selected':'')+'>'+esc(c.nombre)+'</option>').join('')+'</select></label>':'')
   +'<button class="btn" onclick="guardarTicket()">'+(tk.modo==='cat'?'Guardar por categorías':'Guardar '+n+' apuntes')+'</button><button class="btn ghost" onclick="cerrar()">Cancelar</button>';
  abrir();
}
function guardarTicket(){
  const on=tk.items.filter(i=>i.on&&i.importe>0);
  if(!on.length){toast('No hay artículos marcados');return}
  if(tkDuplicado()&&!tk.igual){toast('Parece que ya está apuntado. Marca «Guardarlo igualmente» si es otro.');return}
  const s=tkSuma(),key='tk|'+tk.fecha+'|'+s.toFixed(2),pre=tk.comercio?tk.comercio+' · ':'';
  let filas;
  if(tk.modo==='cat'){const g={};on.forEach(i=>g[i.cat]=r2((g[i.cat]||0)+i.importe));filas=Object.entries(g).map(([c,v])=>({cat:c,importe:v,nota:pre+catById(c).nombre}))}
  else filas=on.map(i=>({cat:i.cat,importe:i.importe,nota:pre+i.desc}));
  filas.forEach((f,k)=>{const m=nuevoMov({fecha:tk.fecha,tipo:'gasto',importe:f.importe,categoria:f.cat,nota:f.nota,quien:yo,origen:'ticket',importKey:key+'#'+(k+1)});if(tk.cuenta)m.cuenta=tk.cuenta;movs.push(m)});
  saveMovs();programarSync();cerrar();
  const u=tk.fecha.split('-');vm={y:+u[0],m:+u[1]-1};vista='movs';render();

let lec=null;
const NUM_IMP='(\\d{1,3}(?:[.,]\\d{3})*[.,]\\d{2}|\\d+[.,]\\d{2})(?!\\d)';
function importeDeCompra(texto){
  const L=String(texto).split(/\r?\n/).map(l=>l.replace(/\u00a0/g,' ').trim()).filter(Boolean);
  const am=l=>{const m=l.replace(/(\d)\s+(\d{2})(?!\d)/g,'$1,$2').match(new RegExp('(?:EUR|€|\\$)?\\s*'+NUM_IMP+'\\s*(?:EUR|€)?','i'));return m?parseNum(m[1]):0};
  const FUERTE=/TOTAL (?:DEL )?PEDIDO|TOTAL A PAGAR|IMPORTE TOTAL|TOTAL PAGADO|ORDER TOTAL|GRAND TOTAL|IMPORTE PAGADO|A PAGAR|TOTAL \(IVA|TOTAL FACTURA|TOTAL EUR/i,MALO=/SUBTOTAL|SIN IVA|ANTES DE|ENV[IÍ]O|GASTOS DE|BASE|CUOTA|DESCUENTO|AHORRO/i;
  let fuerte=0,flojo=0;
  L.forEach((l,i)=>{
    if(MALO.test(l)||!/TOTAL|A PAGAR|IMPORTE|PAGADO/i.test(l))return;
    const v=am(l)||am(L[i+1]||'');if(!(v>0))return;
    if(FUERTE.test(l)){if(!fuerte)fuerte=v}else if(/TOTAL/i.test(l))flojo=v;
  });
  if(fuerte)return fuerte;if(flojo)return flojo;
  const todos=L.map(am).filter(v=>v>0);return todos.length?Math.max(...todos):0;
}
const MARCAS=/AMAZON|ALIEXPRESS|PAYPAL|ZARA|IKEA|DECATHLON|EL CORTE INGLES|LEROY MERLIN|APPLE|GOOGLE|NETFLIX|SPOTIFY|BOLT|UBER|GLOVO|JUST EAT|RYANAIR|VUELING|BOOKING|PCCOMPONENTES|MEDIAMARKT|WALLAPOP|VINTED|TEMU|SHEIN|BIZUM|REVOLUT/i;
function comercioDeCompra(t){const m=String(t).match(MARCAS);return m?m[0].toLowerCase().replace(/(^|\s)\S/g,s=>s.toUpperCase()):comercioDeTicket(t)}
const MESES_LARGOS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fechaDeCompra(t){
  const f=fechaDeTicket(t);if(f)return f;
  const m=String(t).match(/(\d{1,2})\s+de\s+([A-Za-záéíóúÁÉÍÓÚ]+)\s+de\s+(\d{4})/i);
  if(m){const k=MESES_LARGOS.indexOf(norm(m[2]).toLowerCase());if(k>=0)return numFechaOcr(m[3],k+1,m[1])}
  const m2=String(t).match(/(\d{1,2})\s+([A-Za-z]{3,10})\.?\s+(\d{4})/);
  if(m2){const k=MES_ES[norm(m2[2]).slice(0,3)];if(k)return numFechaOcr(m2[3],k,m2[1])}
  return null;

/* ¿Qué es lo que han subido? ticket con artículos, captura de movimientos del banco o una compra puntual */
function tipoDeTexto(texto,srv){
  const g=srv&&srv.items&&srv.items.length?srv:parseGenerico(texto);
  const suma=r2(g.items.reduce((a,i)=>a+i.importe,0));
  const minI=srv&&srv.items&&srv.items.length?2:3;
  if(g.items.length>=minI&&g.total!=null&&Math.abs(suma-g.total)<0.02)return 'ticket';
  const L=String(texto).split(/\r?\n/).map(l=>l.trim());
  const fechas=L.filter(l=>fechaLibre(l)||(/^(\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\s/.test(l)&&fechaLibre(l.split(/\s/)[0]))).length;
  const filas=parseBancoTexto(texto).length;
  if(filas>=2&&fechas>=1&&!/\bTOTAL\b|DESCRIPCI/i.test(texto))return 'banco';
  if(importeDeCompra(texto)>0&&!(g.items.length>=3&&g.total!=null))return 'compra';
  if(g.items.length>=2)return 'ticket';
  return filas>=1&&fechas>=1?'banco':'compra';
}

function yaApuntado(fecha,importes,dias){

/* ---- captura de movimientos del banco ---- */
const MES_ES={ENE:1,FEB:2,MAR:3,ABR:4,MAY:5,JUN:6,JUL:7,AGO:8,SEP:9,SET:9,OCT:10,NOV:11,DIC:12};
function fechaLibre(s,y0){
  s=norm(s).trim();
  if(s==='HOY')return hoy();if(s==='AYER')return ymd(new Date(Date.now()-864e5));
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/),d,mo,y;
  if(m){d=+m[1];mo=+m[2];y=m[3]?+m[3]:null}
  else{m=s.match(/^(?:[A-Z]{3,9}\.?,?\s+)?(\d{1,2})\s+(?:DE\s+)?([A-Z]{3,10})\.?(?:\s+(?:DE\s+)?(\d{4}))?$/);if(!m||!MES_ES[m[2].slice(0,3)])return null;d=+m[1];mo=MES_ES[m[2].slice(0,3)];y=m[3]?+m[3]:null}
  if(y&&y<100)y+=2000;
  const ahora=new Date();if(!y){y=ahora.getFullYear();if(new Date(y,mo-1,d)>new Date(Date.now()+864e5))y--}
  return numFechaOcr(y,mo,d);
}
function parseBancoTexto(texto){
  const L=String(texto).split(/\r?\n/).map(l=>l.replace(/ /g,' ').trim()).filter(Boolean);
  const AMT=/([+\-−–]?)\s?(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})\s*(?:€|EUR)?\s*$/;
  const out=[];let fecha=null,buf=[];
  L.forEach(l0=>{
    let l=l0;
    if(/SALDO|DISPONIBLE|BALANCE/i.test(l)){buf=[];return}
    const d0=fechaLibre(l);if(d0){fecha=d0;buf=[];return}
    const ini=l.match(/^(\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{2,4})?)\s+(.*)$/);
    if(ini&&fechaLibre(ini[1])){fecha=fechaLibre(ini[1]);l=ini[2]}
    const m=l.match(AMT);
    if(m){
      let con=l.slice(0,m.index).replace(/[\s|·•>-]+$/,'').trim();
      if(!con)con=buf.join(' ').trim();
      if(!con){buf=[];return}
      const abs=parseNum(m[2]);
      const ingreso=m[1]==='+'||(!m[1]&&/N[OÓ]MINA|TRANSFERENCIA RECIBIDA|INGRESO|ABONO|DEVOLUCI[OÓ]N|BIZUM RECIBIDO/i.test(con));
      out.push([fecha||hoy(),con,ingreso?abs:-abs]);buf=[];
    }else{if(/[A-Za-zÁÉÍÓÚÑáéíóúñ]{3}/.test(l)){buf.push(l);if(buf.length>2)buf.shift()}}
  });
  return out;
}
function bancoDeTexto(texto){
  const filas=parseBancoTexto(texto);
  if(!filas.length){toast('No encuentro movimientos en la captura. Prueba con una más nítida.');return}
  imp.banco=claveImp(cuentaDia());imp.raw=[['Fecha','Concepto','Importe']].concat(filas);imp.nombre='captura';imp.pdfFin=null;imp.iban4='';
  imp.map=detectar(imp.raw);construirFilas();ir('importar');

}

function pendientesFijos(y,m,t){
  const list=deMes(y,m);
  return cfg.fijos.filter(f=>(!f.mes||f.mes===m+1)&&!list.some(x=>x.categoria===f.cat)&&!movs.some(x=>x.borrado&&x.id==='fx_'+f.cat+'_'+y+'-'+pad(m+1))).map(f=>{
    const imp=f.porcentaje?r2(t.ingreso*f.porcentaje/100):f.importe;
    return Object.assign({},f,{sugerido:imp});
  });
}
/* ===================== CUENTAS ===================== */
/* Las tres primeras cuentas guardan su clave antigua en los apuntes importados (para no duplicar al reimportar) */
const CLAVE_ANTIGUA={bankinter:'Bankinter',bankinter_h:'Bankinter Héctor',tr:'Trade Republic'};
const BANCOS={bankinter:'Bankinter',tr:'Trade Republic',santander:'Santander',bbva:'BBVA',caixabank:'CaixaBank',sabadell:'Banco Sabadell',ing:'ING',openbank:'Openbank',abanca:'Abanca',unicaja:'Unicaja Banco',kutxabank:'Kutxabank',ibercaja:'Ibercaja',cajamar:'Cajamar',cajarural:'Caja Rural',bancamarch:'Banca March',colonya:'Colonya Caixa Pollença',evo:'EVO Banco',revolut:'Revolut',n26:'N26',wise:'Wise',myinvestor:'MyInvestor',targobank:'Targobank',laboral:'Laboral Kutxa',cajasur:'Cajasur',otro:'Otro banco'};
const TIPOS_CUENTA={dia:'Día a día',personal:'Personal',ahorro:'Ahorro'};
const cuentasVis=()=>cfg.cuentas.filter(c=>!c.oculta);
const claveImp=c=>CLAVE_ANTIGUA[c.id]||c.id;
const bancoDe=c=>c?(c.banco||{bankinter:'bankinter',bankinter_h:'bankinter',tr:'tr'}[c.id]||'otro'):'otro';
const cuentaPorClave=k=>cfg.cuentas.find(c=>claveImp(c)===k)||null;
const cuentaImp=()=>cuentaPorClave(imp.banco);
const cuentaDia=()=>cuentasVis().find(c=>c.tipo==='dia')||cfg.cuentas.find(c=>c.tipo==='dia')||cfg.cuentas[0];
const BANCO_CUENTA=new Proxy({},{get:(o,k)=>{const c=cuentaPorClave(k);return c?c.id:undefined}});
/* ¿De qué cuenta es este extracto? Por el nombre del titular: palabras propias del nombre de cada cuenta y de su dueño */
function cuentaPorTitular(titular,banco){
  const cand=cuentasVis().filter(c=>bancoDe(c)===banco);if(!cand.length)return null;
  const pal=c=>norm(c.nombre+' '+(c.persona||'')).split(/[^A-Z0-9]+/).filter(w=>w.length>=4);
  const t=norm(titular),todas=cand.map(pal);
  const encaja=cand.filter((c,i)=>pal(c).filter(w=>!todas.some((o,j)=>j!==i&&o.includes(w))).some(w=>t.includes(w)));
  return encaja.length===1?encaja[0]:(cand.find(c=>c.tipo==='dia')||cand[0]);
}
function esDeCuentaPersonal(titular){const c=cuentaPorTitular(titular,'bankinter');return !!c&&c.tipo==='personal'}
function nombreBanco(b){const c=cuentaPorClave(b);return c?c.nombre:b}
/* ===================== SALDO Y LO QUE QUEDA ===================== */
/* De qué cuenta sale cada apunte: todo es de la cuenta de casa salvo lo importado de otras cuentas y la pensión (cuenta personal) */
const cuentaCat=cat=>cat==='pension'&&cfg.cuentas.some(c=>c.id==='bankinter_h')?'bankinter_h':(cuentaDia()||{}).id;
const cuentaDe=m=>{if(m.origen==='Otro')return '';if(m.cuenta&&cfg.cuentas.some(c=>c.id===m.cuenta))return m.cuenta;const c=cuentaPorClave(m.origen);return c?c.id:cuentaCat(m.categoria)};
function saldoCuenta(c){
  if(!c||c.saldo===null||c.saldo===undefined||c.saldo==='')return null;
  let s=Number(c.saldo)||0;
  movs.forEach(m=>{
    if(m.borrado||cuentaDe(m)!==c.id)return;
    const f=String(m.fecha);
    const ts=Number(c.ts)||0;
    if(f>hoy())return;
    if(f>c.fecha||(ts&&(Number(m.creado)||0)>ts&&f>=ymd(new Date(ts))))s+=m.tipo==='ingreso'?m.importe:-m.importe;
  });
  return r2(s);
}
function quedaMes(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  const bk=cuentaDia();
  if(saldoCuenta(bk)===null)return null;
  // Dinero para el mes: la cuenta de casa + las cuentas personales (de ahí se pasa a casa); el ahorro va aparte
  const incl=cuentasVis().filter(c=>(c.tipo==='dia'||c.tipo==='personal')&&saldoCuenta(c)!==null);
  const ids=new Set(incl.map(c=>c.id));
  const partes=incl.map(c=>({nombre:c.nombre,saldo:saldoCuenta(c)}));
  const saldo=r2(partes.reduce((a,x)=>a+x.saldo,0));
  const t=calc(deMes(y,m));
  const pend=pendientesFijos(y,m,t).filter(f=>ids.has(cuentaCat(f.cat)));
  // Recibos ya apuntados para más adelante este mes (aún no cobrados) + los que faltan por apuntar
  const pref0=y+'-'+pad(m+1),h0=hoy();
  const refF=id=>(incl.find(c=>c.id===id)||{}).fecha||'';
  const futuros=movs.filter(x=>!x.borrado&&ids.has(cuentaDe(x))&&x.tipo==='gasto'&&!(x.categoria&&catById(x.categoria).grupo==='neutro')&&String(x.fecha).startsWith(pref0)&&x.fecha>h0&&x.fecha>refF(cuentaDe(x))).reduce((a,x)=>a+x.importe,0);
  const fijos=r2(futuros+pend.reduce((a,f)=>a+(Number(f.sugerido)||0),0));
  const sinImporte=pend.filter(f=>!f.sugerido&&!f.porcentaje).map(f=>catById(f.cat).nombre);
  const queda=r2(saldo-fijos);
  const fin=new Date(y,m+1,0).getDate(),dias=fin-d.getDate()+1;
  const gastado=Math.max(0,t.gastos);
  const total=gastado+Math.max(queda,0);
  const pref=y+'-'+pad(m+1);
  const ahorros=new Set(cuentasVis().filter(c=>c.tipo==='ahorro').map(c=>c.id));
  const delAhorro=r2(movs.filter(x=>!x.borrado&&ahorros.has(cuentaDe(x))&&x.tipo==='gasto'&&String(x.fecha).startsWith(pref)).reduce((a,x)=>a+x.importe,0));
  return {cuenta:bk,partes,saldo,fijos,sinImporte,queda,dias,delAhorro,porDia:queda>0?r2(queda/dias):0,gastado,consumo:total>0?gastado/total:1,ritmo:d.getDate()/fin};
}
/* Anillo de lo que queda: lleno a principio de mes, se vacía al gastar. La rayita marca dónde «tocaría» estar hoy */
function anilloQueda(q,col,px,centro){
  const R=42,C=2*Math.PI*R,f=Math.max(0,Math.min(1,1-q.consumo)),ideal=Math.max(0,Math.min(1,1-q.ritmo));
  const a=(-90+ideal*360)*Math.PI/180,x1=50+(R-9)*Math.cos(a),y1=50+(R-9)*Math.sin(a),x2=50+(R+9)*Math.cos(a),y2=50+(R+9)*Math.sin(a);
  const pct=Math.round(f*100);
  return '<svg viewBox="0 0 100 100" width="'+px+'" height="'+px+'" role="img" aria-label="Queda el '+pct+' % del dinero del mes" style="flex:none">'
   +'<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="11"/>'
   +(f>0?'<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+(f*C)+' '+C+'" transform="rotate(-90 50 50)"/>':'')
   +'<line x1="'+x1.toFixed(2)+'" y1="'+y1.toFixed(2)+'" x2="'+x2.toFixed(2)+'" y2="'+y2.toFixed(2)+'" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>'
   +(centro||('<text x="50" y="53" text-anchor="middle" font-size="19" font-weight="800" fill="'+col+'">'+pct+'%</text>'
   +'<text x="50" y="66" text-anchor="middle" font-size="9" fill="var(--muted)">queda</text>'))+'</svg>';
}

function donut(items,total){

  const segs=items.map(it=>{const len=total>0?it.v/total*C:0;const s='<circle r="'+R+'" cx="70" cy="70" fill="none" stroke="'+it.col+'" stroke-width="22" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';off+=len;return s}).join('');
  return '<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="Reparto de gastos"><circle r="'+R+'" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="22"/>'+segs+'<text x="70" y="66" text-anchor="middle" class="dt1">Gastos</text><text x="70" y="84" text-anchor="middle" class="dt2">'+eur0(total)+'</text></svg>';
}
/* ===================== CONSEJOS: análisis de gastos en el propio móvil (sin enviar nada a ningún sitio) ===================== */
const mediana=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),k=s.length>>1;return s.length%2?s[k]:(s[k-1]+s[k])/2};
const percentil=(a,p)=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(p*s.length))]};
const mediaDe=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
/* Hasta n meses anteriores a (y,m) que tengan datos, del más reciente al más antiguo */
function mesesAntes(y,m,n){
  const out=[];let yy=y,mm=m;
  for(let i=0;i<14&&out.length<n;i++){
    mm--;if(mm<0){mm=11;yy--}
    const list=deMes(yy,mm);if(!list.length)continue;
    const t=calc(list);if(t.gastos<=0&&t.ingreso<=0)continue;
    out.push({y:yy,m:mm,t,list});
  }
  return out;
}
function analisisConsejos(y,m,ahora){
  const d=ahora||new Date();
  const actual=d.getFullYear()===y&&d.getMonth()===m;
  const dias=new Date(y,m+1,0).getDate();
  const dia=actual?d.getDate():dias;
  const list=deMes(y,m),t=calc(list);
  const prev=mesesAntes(y,m,6);
  // Un mes cuenta para las medias solo si está completo: gastos apuntados en 10 días o más y repartidos por el mes (no el de cuando empezasteis a usar la app)
  const completo=p=>{const dd=new Set(),sg=new Set();p.list.forEach(x=>{if(x.tipo!=='gasto')return;const g=catById(x.categoria).grupo;if(g==='neutro'||g==='ingreso')return;const n=+String(x.fecha).slice(8,10);dd.add(n);sg.add(Math.min(3,Math.floor((n-1)/7)))});return dd.size>=10&&sg.size>=3};
  const prevC=prev.filter(completo);
  const a={y,m,actual,dia,dias,t,list,prev,prevC,hayHist:prevC.length>=2,pocoMes:actual&&dia<7};
  const ritmo=actual&&dia<dias?dias/Math.max(dia,1):1;

function claveConcepto(con){const k=palabras(con).filter(w=>w.length>=3&&!/\d/.test(w)&&!STOP.has(w)&&!/^(ENERO|FEBRERO|MARZO|ABRIL|MAYO|JUNIO|JULIO|AGOSTO|SEPTIEMBRE|OCTUBRE|NOVIEMBRE|DICIEMBRE|CUENTA)$/.test(w)).slice(0,2).join(' ');return k||palabras(con).filter(w=>w.length>=3&&!/\d/.test(w)).slice(0,2).join(' ')}
function sugerir(con){

  for(const r of cfg.reglas){const rp=palabras(r.texto);if(rp.length&&rp.every(p=>ws.has(p)||[...ws].some(w=>w.startsWith(p)&&p.length>=7)))return r.cat}

async function leerTexto(f){
  const buf=await f.arrayBuffer();
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}
}
function parseCSV(txt){
  const lineas=txt.split(/\r?\n/).slice(0,10).join('\n');
  const cuenta=ch=>(lineas.match(new RegExp(ch==='\t'?'\\t':'\\'+ch,'g'))||[]).length;
  const sep=[';',',','\t'].sort((a,b)=>cuenta(b)-cuenta(a))[0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cell);cell=''}
    else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}
    else cell+=ch;
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}

    }

    imp.iban4=bx.iban4||'';imp.raw=bx.filas;imp.nombre=f.name;imp.pdfFin=bx.fin;imp.map=detectar(imp.raw);construirFilas();render();
    toast((c?c.nombre:'Bankinter')+': '+(bx.filas.length-1)+' movimientos'+(bx.pend?' ('+bx.pend+' pendientes)':''));

/* CSV de Trade Republic: usa el importe que entra de verdad (después de comisiones y retención de Hacienda) */
function trCSV(rows){
  const h=(rows[0]||[]).map(x=>String(x??'').trim().toLowerCase());
  const c=k=>h.indexOf(k);
  if(c('transaction_id')<0||c('amount')<0||c('date')<0)return null;
  const filas=[['FECHA','CONCEPTO','IMPORTE','SALDO','CLAVE ANTERIOR']],veces={};
  rows.slice(1).forEach(r=>{
    const fecha=parseFecha(r[c('date')]);if(!fecha)return;
    const bruto=parseNum(r[c('amount')]);if(!bruto)return;
    const neto=r2(bruto+(c('fee')>=0?parseNum(r[c('fee')]):0)+(c('tax')>=0?parseNum(r[c('tax')]):0));
    const nombre=String(r[c('name')]??'').trim(),tipo=String(r[c('type')]??'').toUpperCase(),desc=String(r[c('description')]??'').trim();
    const con=nombre||(/INTEREST/.test(tipo)?'Intereses (neto)':desc);
    // Clave con la que se importó antes este mismo archivo (nombre e importe bruto), para no duplicar y corregir
    const base='Trade Republic|'+fecha+'|'+norm(nombre)+'|'+r2(bruto);veces[base]=(veces[base]||0)+1;
    filas.push([fecha,con,neto,'',base+'#'+veces[base]]);
  });
  return filas;
}
/* Excel de Bankinter: tabla de pendientes (compras con tarjeta aún sin cargar) + tabla de movimientos con saldo */
function bankinterExcel(rows){
  const txt=r=>r.map(x=>String(x??'').trim());
  const iH=rows.findIndex(r=>{const t=txt(r).map(norm);return t[0]==='FECHA CONTABLE'&&t[1]==='FECHA VALOR'&&/DESCRIP/.test(t[2])&&t[3]==='IMPORTE'&&t[4]==='SALDO'});
  if(iH<0)return null;
  const cab=rows.slice(0,5).map(r=>txt(r).join(' ')).join(' ');
  const ib=cab.replace(/\s/g,'').match(/ES\d{22}/);
  const filas=[['FECHA','CONCEPTO','IMPORTE','SALDO','PENDIENTE']];
  let pend=0,sumPend=0;
  const iP=rows.findIndex((r,i)=>i<iH&&(t=>norm(t[0])==='FECHA'&&/DESCRIP/.test(norm(t[1]))&&norm(t[2])==='IMPORTE')(txt(r)));
  if(iP>=0)for(let i=iP+1;i<iH;i++){
    const t=txt(rows[i]);if(!t[0])break;
    const v=parseNum(rows[i][2]);if(!v)continue;
    const m=t[1].match(/^(.*?)\s*(\d{2})\/(\d{2})\/(\d{2})$/);
    filas.push([m?'20'+m[4]+'-'+m[3]+'-'+m[2]:parseFecha(rows[i][0]),(m?m[1]:t[1]).replace(/\s+/g,' ').trim(),r2(v),'','SI']);
    pend++;sumPend+=v;
  }
  const lib=[];
  for(let i=iH+1;i<rows.length;i++){
    const r=rows[i],t=txt(r);const fc=parseFecha(r[0]);if(!fc)continue;
    const v=parseNum(r[3]);if(!v)continue;
    const sal=t[4]!==''?r2(parseNum(r[4])):null;
    filas.push([parseFecha(r[1])||fc,t[2].replace(/\s+/g,' '),r2(v),sal,'']);
    lib.push({fc,v,sal});
  }
  // Saldo más reciente: el orden del archivo se deduce de los propios saldos
  let fin=null;
  if(lib.length){
    let vD=0,vA=0;for(let i=0;i+1<lib.length;i++){const a=lib[i],b=lib[i+1];if(a.sal==null||b.sal==null)continue;if(Math.abs(a.sal-(b.sal+a.v))<0.01)vD++;if(Math.abs(b.sal-(a.sal+b.v))<0.01)vA++}
    const ult=vD>=vA?lib[0]:lib[lib.length-1];
    const max=lib.reduce((a,x)=>x.fc>a?x.fc:a,'');
    if(ult.sal!=null)fin={fecha:max,saldo:r2(ult.sal+sumPend)};
  }
  return {filas,fin,pend,iban4:ib?ib[0].slice(-4):''};
}

const MES_PDF={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,sept:9,set:9,oct:10,nov:11,dic:12,jan:1,apr:4,aug:8,dec:12};
const esImportePdf=s=>/^-?\d{1,3}(\.\d{3})*,\d{2}\s*€?(\s*-)?$/.test(String(s).trim());
/* items: [{p,x,y,w,s}] (y crece hacia arriba, como en PDF). Devuelve filas tipo hoja: cabecera + [fecha, concepto, importe, saldo] */
function pdfTradeRepublic(items){
  const filas=[['FECHA','CONCEPTO','IMPORTE','SALDO']];
  const paginas=[...new Set(items.map(i=>i.p))].sort((a,b)=>a-b);
  let col=null;
  paginas.forEach(p=>{
    const it=items.filter(i=>i.p===p);
    const h=k=>it.find(i=>i.s.trim().toUpperCase()===k)||it.find(i=>i.s.trim().toUpperCase().startsWith(k));
    const tr=h('TRANSACCIONES DE CUENTA'),en=h('ENTRADA DE'),sa=h('SALIDA DE');
    const ba=it.filter(i=>i.s.trim().toUpperCase()==='BALANCE').sort((a,b)=>b.y-a.y)[0];
    if(en&&sa&&ba)col={en:en.x+en.w/2,sa:sa.x+sa.w/2,ba:ba.x+ba.w/2,top:(tr?tr.y:en.y+20)};
    if(!col)return;
    const fin=h('RESUMEN DEL BALANCE');const bajo=fin?fin.y:0;const alto=(tr||en)?Math.min(col.top,(en||{y:9999}).y-3):9999;
    const zona=it.filter(i=>i.y<alto&&i.y>bajo);
    const imps=zona.filter(i=>esImportePdf(i.s));
    const ys=[...new Set(imps.map(i=>Math.round(i.y)))].sort((a,b)=>b-a);
    ys.forEach(y=>{
      const fila=imps.filter(i=>Math.abs(i.y-y)<2);
      const cerca=c=>fila.map(i=>({i,d:Math.abs(i.x+i.w/2-c)}));
      let ent=0,sal=0,bal=null;

function pdfBankinter(items){

  const paginas=[...new Set(items.map(i=>i.p))].sort((a,b)=>a-b);
  let col=null;
  paginas.forEach(p=>{
    const it=items.filter(i=>i.p===p);
    const h=re=>it.find(i=>re.test(i.s.trim()));
    const ca=h(/^Cargos/i),ab=h(/^Abonos/i),sa=it.find(i=>/^Saldo$/i.test(i.s.trim())),de=h(/^Descripci/i),fv=h(/^Fecha valor/i);
    if(ca&&ab&&sa)col={ca:ca.x+ca.w,ab:ab.x+ab.w,sa:sa.x+sa.w,de:de?de.x:180,fv:fv?fv.x:125,top:ca.y};
    if(!col)return;
    const fechas=it.filter(i=>i.y<col.top&&i.x<col.fv-20&&/^\d{2}-\d{2}-\d{2}$/.test(i.s.trim()));
    fechas.forEach(fi=>{
      const fila=it.filter(i=>Math.abs(i.y-fi.y)<2);
      const fval=fila.find(i=>i!==fi&&Math.abs(i.x-col.fv)<15&&/^\d{2}-\d{2}-\d{2}$/.test(i.s.trim()));
      let car=0,abo=0,sal=null;
      fila.filter(i=>esImportePdf(i.s)&&i.x>col.de+60).forEach(i=>{const r=i.x+i.w;const d={ca:Math.abs(r-col.ca),ab:Math.abs(r-col.ab),sa:Math.abs(r-col.sa)};const k=Object.keys(d).sort((a,b)=>d[a]-d[b])[0];const v=parseNum(i.s);if(k==='ca')car+=v;else if(k==='ab')abo+=v;else sal=v});
      if(!car&&!abo)return;
      // Saldo negativo: Bankinter pone el signo detrás ("1,11 -")
      if(sal!==null&&fila.some(i=>/^-$/.test(i.s.trim())&&i.x>col.ab))sal=-sal;
      const desc=fila.filter(i=>i.x>=col.de-2&&i.x<col.ca-60&&!esImportePdf(i.s)&&!/^-$/.test(i.s.trim())).sort((a,b)=>a.x-b.x).map(i=>i.s.trim()).join(' ');

      const fc=aFecha(fi.s),fecha=fval?aFecha(fval.s):fc;
      filas.push([fecha,desc,r2(abo-car),sal]);
      if(sal!==null&&(!fin||fc>=fin.fecha))fin={fecha:fc,saldo:sal};
    });
  });

}

function detectar(rows){
  let h=-1;

    const r=rows[i].map(norm);
    if(r.some(x=>/FECHA|DATE|^F\. ?[A-Z]/.test(x))&&r.some(x=>/IMPORTE|CANTIDAD|AMOUNT|CARGO|ABONO|DEBE|HABER/.test(x))){h=i;break}
  }
  const head=h>=0?rows[h].map(norm):[];
  const find=(re,ex)=>head.findIndex(x=>re.test(x)&&!(ex&&ex.test(x)));

  let concepto=find(/CONCEPTO|DESCRIPCION|DETALLE|MOVIMIENTO|COMERCIO|DESCRIPTION|NAME|BENEFICIARIO|NOMBRE/);
  const importe=find(/IMPORTE|CANTIDAD|AMOUNT/,/SALDO|BALANCE/);
  const cargo=find(/CARGO|DEBE|ADEUDO/),abono=find(/ABONO|HABER/),saldo=find(/SALDO|BALANCE/),pend=find(/^PENDIENTE$/),ant=find(/^CLAVE ANTERIOR$/);
  if(h<0){fecha=0;concepto=1;return {h:-1,fecha,concepto,importe:2,cargo:-1,abono:-1,saldo:-1}}
  if(concepto<0)concepto=head.findIndex((x,i)=>i!==fecha&&i!==importe&&i!==cargo&&i!==abono);
  return {h,fecha,concepto,importe,cargo,abono,saldo,pend,ant};
}
function buscarDup(fecha,importe,tipo,usados){

  const libre=m=>!m.borrado&&(!m.importKey||/^(gmail|pend)\|/.test(String(m.importKey)))&&!usados.has(m.id)&&m.tipo===tipo&&Math.abs(m.importe-importe)<0.01;
  const dias=m=>Math.abs(new Date(m.fecha).getTime()-t)/864e5;
  // Mismo importe en ±3 días, o un recibo fijo confirmado con ✓ en las 3 semanas de alrededor (el banco puede cobrarlo otro día)
  return movs.find(m=>libre(m)&&dias(m)<=3)||movs.find(m=>libre(m)&&m.origen==='fijo'&&dias(m)<=21);

function saldoDelExtracto(){

  const conS=imp.filas.filter(f=>f.saldo!==null&&f.saldo!==undefined);
  if(!id||!conS.length)return null;
  const porN=[...imp.filas].sort((a,b)=>a.n-b.n);
  // ¿El extracto va del más reciente al más antiguo? Lo deducimos de los propios saldos y, si no se puede, de las fechas

  const desc=vD!==vA?vD>vA:(porN.length>1&&porN[0].fecha>porN[porN.length-1].fecha);
  const max=conS.reduce((a,f)=>f.fecha>a?f.fecha:a,'');
  const delDia=conS.filter(f=>f.fecha===max).sort((a,b)=>a.n-b.n);
  const f=desc?delDia[0]:delDia[delDia.length-1];

}

  +seccionCuentas()

  +'<section class="card"><h2>☁️ Copia en la nube (Google)</h2><p class="small muted" style="margin-top:-4px">Estado: '+(sync.url?(sync.error?'<b style="color:var(--neg)">error: '+esc(sync.error)+'</b>':'conectado · última vez '+ultima):'sin conectar · los datos solo están en este móvil')+'</p>'
   +'<label>Dirección de tu hoja (URL de la aplicación web)<input value="'+esc(sync.url)+'" placeholder="https://script.google.com/macros/s/…/exec" onchange="sync.url=this.value.trim();sync.desde=0;store.set(\'cc_sync\',sync)"></label>'
   +'<label>Clave secreta<input type="password" value="'+esc(sync.clave)+'" onchange="sync.clave=this.value.trim();store.set(\'cc_sync\',sync)"></label>'
   +'<div class="row2"><button class="btn ghost" onclick="probarNube()">Probar conexión</button><button class="btn" onclick="sincronizar(true)">Sincronizar ahora</button></div>'
   +'<details><summary>¿Cómo se conecta? (una sola vez, 10 minutos)</summary><ol class="steps"><li>Crea una hoja nueva en Google Drive llamada <b>Cuentas de Casa</b>.</li><li>Menú <b>Extensiones → Apps Script</b>. Borra lo que haya y pega el código del archivo <code>Codigo.gs</code>.</li><li>En la línea de <code>CLAVE</code> inventa una contraseña larga y guarda (💾).</li><li><b>Implementar → Nueva implementación</b> → tipo <b>Aplicación web</b>. Ejecutar como: <b>Yo</b>. Quién tiene acceso: <b>Cualquier usuario</b>. Autoriza los permisos.</li><li>Copia la URL que acaba en <code>/exec</code> y pégala arriba con tu clave.</li><li>La otra persona hace lo mismo en su móvil: misma URL y misma clave.</li></ol><p class="small muted">La app nunca borra nada en la hoja: lo que mandas a la papelera solo queda marcado. Y Google guarda el historial de versiones.</p></details></section>'

   +cfg.fijos.map((f,i)=>'<div class="frow5"><span>'+catById(f.cat).icono+' '+esc(catById(f.cat).nombre)+'</span>'+(f.porcentaje?'<span class="small muted">'+f.porcentaje+' % ingr.</span>':(f.auto==='ultimo'?'<span class="small muted">Último recibo</span>':'<input inputmode="decimal" placeholder="Variable" value="'+(f.importe?String(f.importe).replace('.',','):'')+'" onchange="cfg.fijos['+i+'].importe=parseNum(this.value)||null;saveCfg()">'))+'<input type="number" min="0" max="31" inputmode="numeric" title="Día de cobro" placeholder="Día" value="'+(f.dia||'')+'" onchange="cfg.fijos['+i+'].dia=Math.max(0,Math.min(31,parseInt(this.value)||0));saveCfg()">'+'<select onchange="cfg.fijos['+i+'].mes=+this.value;saveCfg()">'+mesOpts(f.mes)+'</select><button class="x" onclick="cfg.fijos.splice('+i+',1);saveCfg();render()">✕</button></div>').join('')
   +'<h3>Añadir recibo</h3><div class="row2"><select id="fCat">'+cfg.cats.filter(c=>c.grupo==='fijo').map(c=>'<option value="'+c.id+'">'+c.icono+' '+esc(c.nombre)+'</option>').join('')+'</select><input id="fImpN" inputmode="decimal" placeholder="Importe"></div><button class="btn ghost" onclick="nuevoFijo()">Añadir</button></section>'



  +'<section class="card"><details><summary><b>Palabras que reconoce al importar ('+cfg.reglas.length+')</b></summary>'
   +cfg.reglas.map((r,i)=>'<div class="frow"><span>'+esc(r.texto)+'</span><span class="small">→</span><span class="small">'+catById(r.cat).icono+' '+esc(catById(r.cat).nombre)+'</span><button class="x" onclick="cfg.reglas.splice('+i+',1);saveCfg();render()">✕</button></div>').join('')

  +'<section class="card"><h2>Copias y Excel</h2><button class="btn ghost" onclick="exportarExcel('+vm.y+')">📊 Descargar Excel de '+vm.y+'</button><button class="btn ghost" onclick="descargarCopia()">💾 Descargar copia completa</button><label class="file" style="padding:14px">♻️ Restaurar una copia<input type="file" accept=".json" onchange="restaurarCopia(this.files[0]);this.value=\'\'"></label></section>'

  +'<section class="card"><details><summary><b>🗑️ Papelera ('+enPapelera.length+')</b></summary>'+(enPapelera.length?enPapelera.sort((a,b)=>b.modificado-a.modificado).slice(0,100).map(m=>'<div class="flex" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span class="small">'+catById(m.categoria).icono+' '+esc(catById(m.categoria).nombre)+' · '+eur(m.importe)+' · '+fechaCorta(m.fecha)+'</span><button class="btn sm ghost" onclick="updMov(\''+m.id+'\',{borrado:false});render()">Recuperar</button></div>').join(''):'<p class="muted small">Vacía.</p>')+'</details></section>'
  +'<p class="small muted" style="text-align:center;margin:18px 0 6px">Cuentas de Casa · © 2026 Héctor Mayol. Todos los derechos reservados.</p>';
}
function renombrarPersona(i,v){v=String(v||'').trim();const ant=cfg.personas[i];if(!v||v===ant||cfg.personas.includes(v)){render();return}cfg.personas[i]=v;if(yo===ant){yo=v;store.set('cc_yo',v)}saveCfg();render();toast('Nombre cambiado')}
function preguntarYo(){$('#sheet').innerHTML='<h2>¿Quién eres?</h2><p class="muted small">Así los apuntes de este móvil llevarán tu nombre.</p><div class="seg">'+cfg.personas.map((p,i)=>'<button onclick="setYo('+i+');cerrar()">'+esc(p)+'</button>').join('')+'</div>';abrir()}
function setYo(i){const p=cfg.personas[i];if(p===undefined)return;yo=p;store.set('cc_yo',p);form.quien='';render()}
function setCat(id,k,v){const c=cfg.cats.find(x=>x.id===id);if(!c)return;c[k]=v;saveCfg()}
function nuevaCat(){const nom=$('#nNom').value.trim();if(!nom){toast('Escribe el nombre');return}cfg.cats.push({id:'c_'+uid().slice(0,8),nombre:nom,icono:$('#nIco').value.trim()||'🏷️',grupo:$('#nGru').value,presupuesto:0,oculta:false});saveCfg();render();toast('Categoría añadida')}
function nuevoFijo(){cfg.fijos.push({id:uid(),cat:$('#fCat').value,importe:parseNum($('#fImpN').value)||null,mes:0,dia:1});saveCfg();render()}

/* ===================== Excel y copias ===================== */
function exportarExcel(y){
  if(!window.XLSX){toast('No se pudo cargar el generador de Excel');return}
  const wb=XLSX.utils.book_new();
  const meses=[...Array(12)].map((_,i)=>calc(deMes(y,i)));
  const filas=[['CUENTAS '+y,...MESES.map(m=>m.toUpperCase()),'TOTAL']];
  const suma=a=>r2(a.reduce((x,z)=>x+z,0));
  const tot={};
  [['INGRESOS','ingreso',1],['RECIBOS FIJOS','fijo',-1],['GASTOS DEL DÍA A DÍA','variable',-1],['NO CUENTAN (traspasos, inversión)','neutro',-1]].forEach(([t,g,s])=>{
    filas.push([t]);const acc=Array(12).fill(0);
    cfg.cats.filter(c=>c.grupo===g).forEach(c=>{const v=meses.map(x=>r2(s*(x.cat[c.id]||0)));if(c.oculta&&!suma(v.map(Math.abs)))return;filas.push([c.nombre,...v,suma(v)]);v.forEach((z,i)=>acc[i]+=z)});
    tot[g]=acc.map(r2);filas.push(['TOTAL '+t,...tot[g],suma(tot[g])]);filas.push([]);
  });
  const gastos=tot.fijo.map((x,i)=>r2(x+tot.variable[i]));
  const ahorro=tot.ingreso.map((x,i)=>r2(x+gastos[i]));
  let a=0;const acum=ahorro.map(x=>r2(a+=x));
  filas.push(['TOTAL GASTOS',...gastos,suma(gastos)],['AHORRO DEL MES',...ahorro,suma(ahorro)],['AHORRO ACUMULADO',...acum,acum[11]]);
  const ws=XLSX.utils.aoa_to_sheet(filas);ws['!cols']=[{wch:30},...Array(13).fill({wch:12})];
  XLSX.utils.book_append_sheet(wb,ws,'RESUMEN '+y);
  const vars=cfg.cats.filter(c=>c.grupo==='variable');
  for(let i=0;i<12;i++){
    const l=deMes(y,i);if(!l.length)continue;
    const colum=vars.map(c=>l.filter(m=>m.categoria===c.id).map(m=>r2(m.tipo==='gasto'?-m.importe:m.importe)));
    const alto=Math.max(0,...colum.map(c=>c.length));
    const hoja=[['',...vars.map(c=>c.nombre.toUpperCase())]];
    for(let k=0;k<alto;k++)hoja.push(['',...colum.map(c=>c[k]??'')]);
    hoja.push(['TOTAL',...colum.map(c=>suma(c))]);
    const w=XLSX.utils.aoa_to_sheet(hoja);w['!cols']=[{wch:8},...vars.map(()=>({wch:13}))];
    XLSX.utils.book_append_sheet(wb,w,MESES[i].toUpperCase());
  }
  const lista=deAno(y).sort((p,q)=>p.fecha.localeCompare(q.fecha)).map(m=>{const c=catById(m.categoria);const[s]=signo(m);return {Fecha:m.fecha,Categoría:c.nombre,Grupo:{variable:'Día a día',fijo:'Recibo fijo',ingreso:'Ingreso',neutro:'No cuenta'}[c.grupo]||'',Detalle:m.sub,Nota:m.nota,Importe:r2(s==='−'?-m.importe:m.importe),Quién:m.quien,Origen:m.origen}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(lista.length?lista:[{Fecha:'',Categoría:'',Importe:''}]),'MOVIMIENTOS');
  XLSX.writeFile(wb,'Cuentas_'+y+'.xlsx');
}
function descargar(nombre,texto,tipo){const b=new Blob([texto],{type:tipo});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function descargarCopia(){descargar('copia_cuentas_'+hoy()+'.json',JSON.stringify({version:1,fecha:new Date().toISOString(),movs,cfg},null,1),'application/json');toast('Copia descargada')}
async function restaurarCopia(f){
  if(!f)return;
  try{
    const d=JSON.parse(await f.text());if(!Array.isArray(d.movs))throw 0;
    let n=0;
    d.movs.filter(r=>r&&typeof r.id==='string'&&r.id&&/^\d{4}-\d{2}-\d{2}/.test(String(r.fecha))&&isFinite(Number(r.importe))&&(r.tipo==='gasto'||r.tipo==='ingreso')).forEach(r=>{r.importe=Number(r.importe);const i=movs.findIndex(m=>m.id===r.id);if(i<0){movs.push({...r,pend:true});n++}else if((r.modificado||0)>(movs[i].modificado||0)){movs[i]={...r,pend:true};n++}});
    if(d.cfg&&(d.cfg.modificado||0)>(cfg.modificado||0)){cfg=asegurarCats(d.cfg);store.set('cc_cfg',cfg)}
    saveMovs();programarSync();render();toast('Copia restaurada: '+n+' movimientos recuperados');
  }catch(e){toast('Ese archivo no es una copia válida')}
}

/* ===================== Sincronización con Google ===================== */
let syncTimer=null,sincronizando=false,syncSesion=false;
function estadoSync(){
  const dot=$('#syncDot'),txt=$('#syncTxt');if(!dot)return;
  const pend=movs.some(m=>m.pend);
  let col='#9ca3af',t='Sin nube';
  if(sync.url){if(sincronizando){col='#2563eb';t='Guardando…'}else if(sync.error){col='#dc2626';t='Error nube'}else if(pend){col='#d97706';t='Pendiente'}else{col='#16a34a';t='En la nube'}}
  dot.style.background=col;txt.textContent=t;
}
function programarSync(){estadoSync();if(!sync.url||!sync.clave)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sincronizar(false),2000)}
async function llamar(cuerpo){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),cuerpo.accion==='ocr'?90000:40000);
  try{const r=await fetch(sync.url,{method:'POST',body:JSON.stringify(Object.assign({clave:sync.clave},cuerpo)),signal:ac.signal});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Respuesta no válida');return j}
  catch(e){if(e&&e.name==='AbortError')throw new Error('Google no responde (tiempo agotado)');throw e}
  finally{clearTimeout(t)}
}
async function probarNube(){
  if(!sync.url||!sync.clave){toast('Pon la URL y la clave');return}
  try{await llamar({accion:'probar'});toast('✅ Conexión correcta');}catch(e){toast('❌ No conecta: '+(e.message||e))}
}
async function sincronizar(manual){
  if(!sync.url||!sync.clave){if(manual){vista='ajustes';render();toast('Conecta primero tu hoja de Google')}return}
  if(sincronizando)return;
  sincronizando=true;estadoSync();
  try{
    const enviar=movs.filter(m=>m.pend).map(m=>{const c=Object.assign({},m);delete c.pend;return c});
    const primera=!sync.desde;
    const completa=!sync.v2; // una vez tras actualizar: baja todo de nuevo por si algún apunte automático se quedó sin llegar
    const desde=completa?0:Math.max(0,(sync.desde||0)-15*60*1000); // margen de 15 min: los tickets automáticos tardan en escribirse
    const j=await llamar({accion:'sync',desde:desde,movs:enviar,cfg:primera?null:cfg});
    const enviados=new Map(enviar.map(m=>[m.id,m.modificado]));
    movs.forEach(m=>{if(m.pend&&enviados.get(m.id)===m.modificado)m.pend=false});
    (j.movs||[]).forEach(r=>{
      r.importe=Number(r.importe)||0;r.borrado=r.borrado===true||String(r.borrado).toUpperCase()==='TRUE';
      r.creado=Number(r.creado)||0;r.modificado=Number(r.modificado)||0;r.id=String(r.id);r.fecha=String(r.fecha).slice(0,10);delete r.srv;
      const i=movs.findIndex(m=>m.id===r.id);
      if(i<0)movs.push(Object.assign(r,{pend:false}));
      else if(!(movs[i].pend&&movs[i].modificado>r.modificado)){if(!r.cuenta&&movs[i].cuenta)r.cuenta=movs[i].cuenta;movs[i]=Object.assign(r,{pend:false})}
    });
    {const vistos=new Map(),t=Date.now();movs.forEach(m=>{if(m.borrado||!m.importKey||/^(tk|gmail)\|/.test(String(m.importKey)))return;const o=vistos.get(m.importKey);if(!o){vistos.set(m.importKey,m);return}const [gana,pierde]=((o.creado||0)<(m.creado||0)||((o.creado||0)===(m.creado||0)&&String(o.id)<String(m.id)))?[o,m]:[m,o];vistos.set(m.importKey,gana);Object.assign(pierde,{borrado:true,modificado:t,pend:true})})}
    if(primera&&!j.cfg)programarSync(); // hoja nueva: en la siguiente vuelta se guarda esta configuración
    if(j.cfg&&(primera||(Number(j.cfg.modificado)||0)>(Number(cfg.modificado)||0))){const loc=cfg;cfg=asegurarCats(j.cfg);if(primera){const dc=defaultCfg(),bc=new Set(dc.cats.map(c=>c.id)),br=new Set(dc.reglas.map(r=>norm(r.texto)));let ch=0;loc.cats.forEach(c=>{if(!bc.has(c.id)&&!cfg.cats.some(x=>x.id===c.id)){cfg.cats.push(c);ch=1}});loc.reglas.forEach(r=>{if(!br.has(norm(r.texto))&&!cfg.reglas.some(x=>norm(x.texto)===norm(r.texto))&&cfg.cats.some(c=>c.id===r.cat)){cfg.reglas.push(r);ch=1}});if(ch)cfg.modificado=Date.now()}store.set('cc_cfg',cfg);if(!cfg.personas.includes(yo)&&!store.get('cc_yo',null))yo=cfg.personas[0]}
    if(primera&&!store.get('cc_yo',null)&&cfg.personas.length>1)setTimeout(preguntarYo,400);sync.desde=j.ahora;sync.v2=1;sync.ultimaOk=Date.now();sync.error='';mercaCache={};
    store.set('cc_sync',sync);saveMovs();
    if(!syncSesion){syncSesion=true;try{generarFijos()}catch(e){}}
    if(manual)toast('☁️ Todo guardado en la nube');
    const ocupado=document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName);
    if(!ocupado&&$('#modal').classList.contains('hidden')&&vista!=='importar')render();
  }catch(e){
    sync.error=String(e&&e.message||e);store.set('cc_sync',sync);
    if(manual)toast('No se pudo sincronizar: '+sync.error);
  }finally{sincronizando=false;estadoSync();if(!sync.error&&movs.some(m=>m.pend))programarSync()}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sincronizar(false)});
setInterval(()=>sincronizar(false),5*60*1000);

render();
sincronizar(false);
/* Archivo compartido desde otra app (Android → Compartir → Cuentas): lo lee como si lo hubieras subido desde el botón 📷 */
async function recogerCompartido(){
  if(!/[?&]compartido=1/.test(location.search))return;
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  try{
    const c=await caches.open('cc-compartido'),r=await c.match('archivo');if(!r)return;await c.delete('archivo');
    const b=await r.blob(),f=new File([b],decodeURIComponent(r.headers.get('X-Nombre')||'')||'compartido',{type:b.type});
    if(!bienv)setTimeout(()=>leerImagen(f),600);
  }catch(e){}
}
recogerCompartido();
