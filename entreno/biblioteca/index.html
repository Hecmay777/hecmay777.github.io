<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca de ejercicios</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d1015"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Biblioteca"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1015;--card:#171c24;--card2:#1e2530;--line:#2a3340;--tx:#eef2f7;--mu:#8e9bb0;--ok:#3ddc97;--c:#ff6a3d;--c2:#ffb43d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:18px 16px 80px}
.wrap{max-width:1000px;margin:0 auto}
h1,h2,h3,.big{font-family:'Barlow Condensed','Arial Narrow',Inter,sans-serif;letter-spacing:.01em}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:34px;font-weight:800;flex:1;min-width:220px}
.btn{background:var(--c);color:#0d1015;border-radius:12px;font-weight:700;padding:11px 16px;font-size:15px;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--c)}
.btn.y{background:var(--c2)}
.btn.s{padding:7px 12px;font-size:13px;border-radius:10px}
.sub{color:var(--mu);font-size:13.5px}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;outline:none}
.search:focus{border-color:var(--c)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px;align-items:center}
select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;max-width:100%}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:12px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:84px;transition:.12s;position:relative}
.it:hover{border-color:var(--c);transform:translateY(-2px)}
.it b{font-size:15.5px;line-height:1.25;padding-right:22px}
.it .st{position:absolute;top:10px;right:12px;color:var(--c2);font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--mu);font-weight:600}
.chip.btnc{cursor:pointer}.chip.btnc:hover{border-color:var(--c);color:var(--tx)}
.chip.c{color:var(--c);border-color:var(--c)}
.det{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.det h2{font-size:clamp(32px,6vw,52px);font-weight:800;text-transform:uppercase;line-height:1.05}
.desc{white-space:pre-line;line-height:1.65;color:#cdd6e3;font-size:15.5px;margin:12px 0}
.desc b{color:var(--tx)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin:16px 0 6px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.vid{position:relative;width:min(100%,520px);aspect-ratio:6/5;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:20px;margin:12px 0}
.vid svg{width:100%;height:100%}
.vidtag{position:absolute;left:14px;top:12px;font-size:11px;letter-spacing:.12em;color:#8e9bb0;font-weight:700;text-transform:uppercase}
.more{margin:16px auto;display:block}
.prog{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.prog .btn{flex:1;min-width:200px;text-align:left}
.prog small{display:block;font-size:11px;opacity:.75;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
const LIB=[{"i":5216,"n":"Plancha","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como puntos de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo. \n\n**Ten en cuenta:**\n\n- Mantén la mirada hacia el suelo. \n- Mantén la posición horizontal sin dejar caer o subir demasiado la pelvis.\n- Concéntrate en que tu ombligo esté hacia adentro para tensar los músculos del abdomen.\n- Manten la columna dorsal recta, sacando pecho con las lumbares alineadas.\n- Cuenta una repetición por segundo.","v":"https://youtu.be/JoMOD6qE9Yw","e":5218,"h":null,"t":2.5,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["hombros","tobillos"]},{"i":5217,"n":"Plancha pivot","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como punto de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo. Deja caer la pelvis hasta tocar el suelo y, seguidamente, elévala al máximo flexionando el tronco.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento completo. \n- Mantén la mirada hacia el suelo. \n- Cuenta una repetición cada vez que bajes la pelvis al suelo.","v":"https://youtu.be/fYwsWQo2Qzg","e":5219,"h":5216,"t":2.6,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["cadera","hombros","tobillos"]},{"i":5218,"n":"Plancha equilibrio","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como punto de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo. Mueve el cuerpo hacia adelante y hacia atrás manteniéndolo paralelo al suelo.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento completo. \n- Mantén la mirada hacia el suelo. \n- Cuenta una repetición cada vez que termines el movimiento hacia atrás.","v":"https://youtu.be/O9nxi2nvmSU","e":5219,"h":5216,"t":2.6,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["tobillos","hombros"]},{"i":5219,"n":"Plancha araña","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como punto de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo, realiza una flexión de rodilla para tocar tu rodilla con el codo.\n\n**Ten en cuenta:**\n\n- Mantén la mirada hacia el suelo. \n- Mantén la postura horizontal.\n- Procura no desplazar ni rotar la cadera al flexionar la rodilla. \n- Si no llegas a tocar el codo no te preocupes, ya irás ganando flexibilidad.\n- Cuenta una repetición por flexión de rodilla.","v":"https://youtu.be/y1tu5bxnCEE","e":5220,"h":5217,"t":2.8,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["hombros","tobillos","rodillas","cadera"]},{"i":5220,"n":"Plancha con extensión","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como punto de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo. Extiende el brazo derecho y la pierna izquierda a la vez, y realiza lo mismo después a la inversa.\n\n**Ten en cuenta:**\n\n- Mantén la mirada hacia el suelo. \n- Mantén la postura horizontal.\n- Procura no desplazar ni rotar la cadera al extender brazos y piernas. \n- Cuenta una repetición por cada extensión de brazo con pierna.","v":"https://youtu.be/MQVtlRhTJYk","e":null,"h":5219,"t":2.8,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["cadera","hombros","tobillos","codos"]},{"i":5222,"n":"Mckenzie","d":"Colócate boca abajo con el cuerpo estirado y las manos apoyadas en el suelo a la altura de los Deltoides. Extiende los brazos completamente levantando el tronco superior hasta la cadera, manteniendo el resto del cuerpo en el suelo.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento en su máxima amplitud. \n- Mantén los Deltoides relajados y la cadera en el suelo.\n- Cuenta una repetición por extensión.","v":"https://youtu.be/qjEFCfbCswU","e":5223,"h":null,"t":2.5,"m":["tríceps","dorsales"],"j":["muñecas","codos","cadera"]},{"i":5223,"n":"Supermán","d":"Colócate en el suelo boca abajo, con los brazos estirados por encima de la cabeza como si fueras Superman. Levanta las piernas y los brazos del suelo simultáneamente y bájalos hasta volver a tocar el suelo.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento en su máxima amplitud. \n- Mantén los brazos y piernas bien estirados. \n- Relaja la región de la nuca y Deltoides. \n- La cabeza tiene que seguir el recorrido de los brazos.\n- Cuenta una repetición por cada levantamiento.","v":"https://youtu.be/-MabO15xfoQ","e":null,"h":5222,"t":2.8,"m":["erector de la columna"],"j":["cadera","hombros"]},{"i":5224,"n":"Abdominales en V","d":"Colócate en el suelo boca arriba, con los brazos estirados por encima la cabeza tocando el suelo. Eleva piernas y brazos plegándote hasta tocar los pies con las manos, formando una V con tu cuerpo. Vuelve a la posición inicial sin llegar a tocar el suelo con los pies y manos.\n\n**Ten en cuenta:**\n\n- Mantén pies y brazos bien estirados. \n- Procura que los brazos y la cabeza estén alineados.\n- Controla el movimiento de bajada tensando el abdomen.\n- Si no puedes tocar los pies con las manos no te preocupes, ya irás ganando flexibilidad a medida que entrenes.\n- Cuenta una repetición cada vez que bajes las extremidades.","v":"https://youtu.be/SoCXErO0vM8","e":5229,"h":5225,"t":3.8,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["cadera","hombros"]},{"i":5225,"n":"Abdominales en semi V","d":"Colócate boca arriba con las manos apoyadas en el suelo a cada lado de tu cadera. Desde esta posición eleva ligeramente las piernas y el tronco apoyándote solo con el trasero. Lleva las rodillas al pecho flexionando las piernas y flexiona el tronco hacia delante al mismo tiempo. Vuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta y extiéndela bien en el momento de estirar las piernas. \n- Intenta que el cuerpo y los pies nunca toquen el suelo después de la contracción.\n- Cuenta una repetición cada vez que completes una contracción.","v":"https://youtu.be/ifqmSnSa5-k","e":5224,"h":5228,"t":3.0,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["cadera","rodillas"]},{"i":5226,"n":"Abdominales con extensión","d":"Comienza con la espalda a 45º del suelo, las piernas flexionadas y los pies juntos y apoyados en el suelo. Eleva el tronco hacia arriba como si fueras a sentarte.\n\n**Ten en cuenta:**\n\n- Extiende bien la espalda exagerando la curva lumbar cuando llegues al final del movimiento de sentado.\n- Cuenta una repetición cada vez que completes una extensión.","v":"https://youtu.be/cmuH7ft-x_Y","e":5217,"h":5345,"t":2.8,"m":["recto mayor del abdomen","erector de la columna"],"j":["cadera"]},{"i":5227,"n":"Abdominales con giro","d":"Inicia el ejercicio sentado en el suelo, con el tronco semiflexionado hacia delante y las piernas semiflexionadas, de forma que ni el tronco ni los pies lleguen a tocar el suelo y el punto de equilibro esté en el trasero.\n\nHaz una rotación del tronco hacia un lado hasta tocar con las dos manos el suelo. Alterna girando hacia el otro lado.\n\n**Ten en cuenta:**\n\n- Extiende bien la espalda manteniendo cuello y nuca relajados. \n- Marca bien el giro.\n- Cuenta una repetición cada vez que toques el suelo con las manos.","v":"https://youtu.be/UB6NB1CM2SY","e":5335,"h":null,"t":2.8,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["cadera"]},{"i":5228,"n":"Levantar las piernas","d":"Tumbado boca arriba, eleva las piernas manteniéndolas completamente rectas hasta tenerlas perpendiculares al suelo y seguidamente vuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Controla el descenso de las piernas. \n- Mantén las piernas siempre estiradas.\n- Cuenta una repetición cada vez que bajes las piernas.","v":"https://youtu.be/_-qXAdMECAw","e":5773,"h":5225,"t":3.0,"m":["recto mayor del abdomen"],"j":["cadera"]},{"i":5229,"n":"Rodillas a los codos","d":"Colgado con las manos de una barra, eleva las rodillas hasta que estas toquen tus codos y seguidamente, bájalas hasta encontrarte en la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantente colgado con los brazos estirados. \n- Controla la bajada de piernas.\n- Cuenta una repetición cada vez que bajes las piernas.","v":"https://youtu.be/WWqTofl0nCI","e":5373,"h":5224,"t":3.2,"m":["recto mayor del abdomen","pectorales","trapecios","dorsales"],"j":["codos","hombros","cadera","rodillas"]},{"i":5231,"n":"Salto caja","d":"Colócate delante de una caja, banco u otra elevación estable. Salta para colocarte encima de la caja y extiende bien el cuerpo al llegar arriba. Salta hacia atrás recuperando la posición inicial.\n\n**Ten en cuenta:**\n\n- Marca bien la extensión que va a realizar tu cuerpo hasta colocarte encima de la caja.\n- Amortigua bien la caída.\n- Cuenta una repetición por salto.","v":"https://youtu.be/ZJ3925UnXWA","e":5243,"h":5233,"t":4.0,"m":["glúteos","isquiotibiales","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5232,"n":"Salto","d":"Colócate de pie en el suelo, haz impulso flexionando las rodillas y salta verticalmente lo más alto posible.\n\n**Ten en cuenta:**\n\n- Amortigua la caída.\n- Cuenta una repetición por salto.","v":"https://youtu.be/M7gEsdfd6lQ","e":5233,"h":null,"t":3.8,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},{"i":5233,"n":"Salto horizontal","d":"Colocándote de pie, realiza un squat flexionando todo lo posible las piernas (squat profundo) y haz un salto hacia delante (horizontal). Amortigua la caída de nuevo con una squat profundo.\n\n**Ten en cuenta:**\n\n- Ayúdate con los brazos para realizar el impulso durante el salto. \n- Amortigua bien la caída.\n- Cuenta una repetición por salto.","v":"https://youtu.be/evWs4AwBCY4","e":5231,"h":5232,"t":4.0,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},{"i":5235,"n":"Salto estrella","d":"Colócate de pie con los brazos hacia abajo, seguidamente haz un salto vertical extendiendo los brazos hacia arriba y piernas hacia afuera simulando la forma de una estrella. Al caer vuelve de nuevo a la posición inicial.\n\n**Ten en cuenta:**\n\n- Extiende bien tus extremidades durante el salto. \n- Amortigua bien la caída.\n- Cuenta una repetición por salto.","v":"https://youtu.be/k8StM5bKVeM","e":5233,"h":5232,"t":4.0,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},{"i":5236,"n":"Burpee","d":"Ejercicio que combina: sentadilla, flexión y salto.\n\nColócate de pie como posición inicial. Desde aquí, agáchate y coloca las manos en el suelo, haz impulso con tus piernas hacia atrás colocándote en plancha, de forma que tu cuerpo esté en paralelo al suelo y tus puntos de apoyo sean las manos y las puntas de los pies.\n\nSeguidamente realiza una flexión completa, acercando el pecho al suelo todo lo que puedas. Al finalizar la flexión lleva los pies justo detrás de tus manos con un salto, toma impulso y salta hacia arriba, dando una palmada por encima de la cabeza para terminar el ejercicio.\n\n**Ten en cuenta**\n\n- Intenta hacer el ejercicio lo más fluido posible, sin pausas entre sus partes.\n- Para aumentar la velocidad (más burpees en menos tiempo), haz la plancha impulsando los pies hacia atrás antes de que las manos toquen el suelo, y lo mismo al regresar, levanta las manos antes de que los pies vuelvan a su posición inicial para hacer el salto vertical.\n- Si no puedes realizar la flexión, apóyate en las rodillas en lugar de las puntas de los pies.\n- Toca el suelo con el pecho al hacer cada flexión.\n- Al saltar, asegúrate de que lo haces con el cuerpo recto.\n- La palmada se realiza justo encima de tu cabeza con los brazos estirados.\n- Cuenta una repetición con cada palmada.","v":"https://youtu.be/ldmueYwBkWw","e":5237,"h":5279,"t":5.0,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},{"i":5237,"n":"Burpee doble","d":"Ejercicio que combina: sentadilla, flexión y salto.\n\nColócate de pie como posición inicial. Desde aquí, agáchate y coloca las manos en el suelo, haz impulso con tus piernas hacia atrás colocándote en plancha, de forma que tu cuerpo esté en paralelo al suelo y tus puntos de apoyo sean las manos y las puntas de los pies.\n\nRealiza dos flexiones completas, acercando el pecho al suelo todo lo que puedas. Al finalizar la flexión lleva los pies justo detrás de tus manos con un salto, toma impulso y salta hacia arriba, dando una palmada por encima de la cabeza para terminar el ejercicio.\n\n**Ten en cuenta:**\n\n- Intenta hacer el ejercicio lo más fluido posible, sin pausas entre sus partes.\n- Para aumentar la velocidad (más burpees en menos tiempo), haz la plancha impulsando los pies hacia atrás antes de que las manos toquen el suelo, y lo mismo al regresar, levanta las manos antes de que los pies vuelvan a su posición inicial para hacer el salto vertical.\n- Si no puedes realizar la flexión, apóyate en las rodillas en lugar de las puntas de los pies.\n- Toca el suelo con el pecho al hacer cada flexión.\n- Al saltar, asegúrate de que lo haces con el cuerpo recto.\n- La palmada se realiza justo encima de tu cabeza con los brazos estirados.\n- Cuenta una repetición con cada palmada.","v":"https://youtu.be/Nl_vSl91JZs","e":5352,"h":5236,"t":5.2,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},{"i":5238,"n":"Burrol","d":"Ejercicio complejo de 3 fases:\n\nColócate de pie como posición inicial. Tírate al suelo boca arriba sentándote primero y seguidamente estirándote completamente, de forma que tus brazos queden estirados por encima de la cabeza.\nLevántate con un impulso colocándote en cuclillas y por último, ponte de pie dando un salto vertical y una palmada por encima de tu cabeza.\n\n**Ten en cuenta:**\n\n- Estira tu cuerpo completamente al tirarte al suelo.\n- La palmada se realiza justo encima de tu cabeza con los brazos estirados.\n- Si puedes, levántate sin usar las manos.\n- Cuenta una repetición con cada palmada.","v":"https://youtu.be/1hfLiTP9IIw","e":5309,"h":5342,"t":5.0,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},{"i":5241,"n":"Carrera corta","d":"1. Sal a correr el tiempo o la distancia indicada.","v":"https://youtu.be/TKlvyuOTo50","e":5300,"h":5269,"t":3.5,"m":["glúteos","cuádriceps","isquiotibiales"],"j":["hombros","cadera","rodillas","tobillos"]},{"i":5242,"n":"Sentadilla","d":"Colocándote de pie como posición inicial, con la espalda recta y sacando ligeramente el trasero hacia afuera, flexiona la cadera y las rodillas unos 90 grados aproximadamente o hasta que tus muslos estén paralelos al suelo. Vuelve a la posición inicial para terminar el ejercicio.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Durante la flexión tus rodillas deben mirar hacia afuera.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por flexión.","v":"https://youtu.be/snDiZo0Zcko","e":5243,"h":5340,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},{"i":5243,"n":"Sentadilla con salto","d":"Colocándote de pie como posición inicial, con la espalda recta y sacando ligeramente el trasero hacia afuera, flexiona la cadera y las rodillas unos 90 grados aproximadamente o hasta que tus muslos estén paralelos al suelo. Desde esta posición, realiza un salto vertical extendiendo el cuerpo.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. En el salto, extiende todo tu cuerpo. \n- Amortigua bien la caída. \n- Durante la flexión tus rodillas deben mirar hacia afuera.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por cada salto.","v":"https://youtu.be/eGmFnqFNGfk","e":5277,"h":5242,"t":4.0,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},{"i":5244,"n":"Sentadilla de pistolero","d":"Colocándote de pie como posición inicial y con la espalda recta, flexiona la cadera y baja manteniendo el equilibrio con una pierna apoyada en el suelo y la otra estirada hasta estar paralela al suelo. Mantén la pierna extendida hasta volver a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Mientras que bajas, ayúdate de tus brazos para mantener el equilibrio extendiéndolos hacia delante.\n- Durante la flexión, la rodilla de tu pierna de apoyo debe mirar hacia afuera. \n- Baja hasta que tus Cadera estén por debajo de tus rodillas y tu pierna extendida paralela al suelo.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/rr-HnkXXV6E","e":null,"h":5434,"t":4.0,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},{"i":5245,"n":"Zancada","d":"Colocándote de pie como posición inicial, da un paso largo hacia adelante y desde esta posición, toca suavemente el suelo con la rodilla de la pierna trasera. Vuelve a la posición inicial y cambia de pie para la siguiente repetición.\n\n**Ten en cuenta:**\n\n- Realiza el descenso manteniendo la espalda recta en posición vertical.\n- Realiza la bajada más lentamente que la subida.\n- La rodilla de la pierna que da el paso hacia delante no debe sobrepasar la altura del pie.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/JvStYy4SEhY","e":5248,"h":null,"t":3.5,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas"]},{"i":5246,"n":"Zancada con salto","d":"Colocándote de pie como posición inicial, da un paso largo hacia adelante y desde esta posición haz un salto vertical para cambiar de pierna. Durante el salto estira completamente las piernas para intercambiarlas en el aire.\n\n**Ten en cuenta:**\n\n- Este ejercicio no requiere desplazamiento.\n- Extiende tu cuerpo durante el salto. \n- Amortigua la caída acabando en la posición de zancada. \n- Baja suavemente después del salto para que tu rodilla toque el suelo. \n- La rodilla de la pierna que avanza no debe sobrepasar la altura del pie. \n- Cuenta una repetición por cada salto.","v":"https://youtu.be/LBBbKa--AEs","e":5892,"h":5794,"t":3.8,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5247,"n":"Zancada pivot","d":"Colocándote de pie como posición inicial, da un paso largo hacia adelante y desde esta posición, toca suavemente el suelo con la rodilla de la pierna trasera, pivota siempre sobre el mismo pie.\n\n**Ten en cuenta:**\n\n- Realiza el descenso en un plano completamente vertical, con la espalda recta.\n- Este ejercicio no requiere desplazamiento.\n- La rodilla de la pierna que avanza no debe sobrepasar la altura del pie.\n- Haz la mitad de las repeticiones con cada pierna.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/PxO8aFbJqPU","e":5246,"h":5245,"t":3.5,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5248,"n":"Zancada abierta","d":"Da un paso largo hacia adelante estirando la pierna más allá de la altura de tus Cadera. Vuelva a la posición incial y alterna con la otra pierna.\n\n**Ten en cuenta:**\n\n- Realiza el descenso en un plano completamente vertical, con tu espalda recta. \n- Baja suavemente hasta que tu rodilla toque el suelo. \n- La rodilla de la pierna que avanza no debe sobrepasar la altura del pie.\n- Cuenta una repetición por flexión.","v":"https://youtu.be/0-ettLoY1wk","e":5247,"h":5245,"t":3.5,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5250,"n":"Cohete","d":"Colócate delante de una caja, banco u otra elevación estable. Como posición inicial, apoya una de las piernas en la caja realizando una flexión de 90º con la misma. Desde esta posición, impúlsate como si fueras a poner la otra pierna encima de la caja, pero sin llegar a tocarla, de forma que ambas piernas estén completamente estiradas y una sola apoyada en la caja. Termina el movimiento volviendo a la posición inicial.\n\n**Ten en cuenta:**\n\n- Extiende tu cuerpo al final de la elevación. \n- Desciende de manera controlada.\n- Cuenta una repetición por cada levantamiento.","v":"https://youtu.be/mfAAEQhVO6A","e":5355,"h":null,"t":3.6,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5252,"n":"Flexión","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Desde aquí impúlsate con las manos para elevar el tronco manteniendo el cuerpo alineado y paralelo al suelo. Vuelve a la posición inicial pero sin llegar a apoyar el pecho con el suelo para hacer la siguiente repetición.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/fOOIttCJizc","e":5253,"h":5264,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},{"i":5253,"n":"Flexión diamante","d":"Túmbate boca abajo con las palmas apoyadas en el suelo y ambas manos cerca, donde índices y pulgares de cada mano se toquen para formar un diamante.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar las manos pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/BOqw8btbzWg","e":5254,"h":5319,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},{"i":5254,"n":"Flexión reloj","d":"Túmbate boca abajo con las palmas apoyadas en el suelo, en este ejercicio existen 4 apoyos diferentes de las manos que simulan horas concretas de un reloj. Las cuatro posiciones son: \n\n- Ambas manos en las 12h.\n- Una mano en las 3h y la otra en las 9h.\n- Ambas manos en las 6h. \n- Ambas manos en el centro del reloj.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/b7Q_DvETmw4","e":null,"h":5763,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},{"i":5255,"n":"Flexión montaña","d":"Túmbate boca abajo con las palmas y los pies apoyados en el suelo y el trasero levantado generando una figura de pirámide, seguidamente realiza una flexión normal.\n\n**Ten en cuenta:**\n\n- Mantén tu espalda y tus piernas rectas.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/ke5jv7qFW7g","e":5257,"h":5261,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},{"i":5256,"n":"Flexión araña","d":"Túmbate boca abajo con las palmas y los pies apoyados en el suelo. Realiza el movimiento de flexión a la vez que elevas una de las piernas para que toque el codo de su mismo lado. Alterna las piernas en cada repetición.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Si no llegas con la rodilla al codo no te preocupes, ya irás ganando flexibilidad con el tiempo.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/TKGK7YMreBI","e":5347,"h":5219,"t":4.0,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas","rodillas"]},{"i":5257,"n":"Flexión en L","d":"Túmbate boca abajo con las palmas apoyadas en el suelo y tus pies apoyados en una caja o superficie lo suficientemente elevada como para que el cuerpo quede en forma de L. Desde esta posición realiza el movimiento de flexión.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al ombligo.\n- Los brazos deben estar extendidos por encima de la cabeza.\n- El cuerpo debe formar una L con piernas y manos.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/TKwuiAJgzzU","e":5879,"h":5255,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},{"i":5258,"n":"Flexión lateral","d":"Túmbate boca abajo con las palmas y los pies apoyados en el suelo. Realiza una flexión y desplázate haciendo impulso con tus manos hacia un lado, realiza otra flexión y vuelve a impulsarte hacia tu lugar inicial para hacer otra repetición.\n\n**Ten en cuenta:**\n\n- Para hacer correctamente el cambio de apoyo mantén los brazos estirados, junta las manos y desplaza una de ellas para cambiar de posición, haz lo mismo al volver.\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/KjwK9UBQhOI","e":5259,"h":5265,"t":3.9,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5259,"n":"Flexión de reptil","d":"Realiza una flexión normal pero donde los apoyos de tus manos sean: uno a la atura del pecho y el otro por encima de la cabeza. Tras cada flexión alterna las manos con los puntos de apoyo.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/037X8ErXQ2g","e":5254,"h":5266,"t":3.9,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5260,"n":"Flexión abierta","d":"Realiza una flexión con las manos aproximadamente unos 40 cm más abiertas que en una flexión normal.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/r9EJM4m5zro","e":5259,"h":5267,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5261,"n":"Flexión hindú","d":"Realiza una flexión colocándote en la posición de flexión montaña y haciendo un movimiento hasta tener la posición de extensión de Mckenzie. El movimiento simula la intención de pasar por debajo de una barra situada a la altura de tu cabeza.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento como si pasaras por debajo de una barra que no debes tocar. \n- Marca bien la extensión. \n- No vuelvas a la posición incial para terminar, haz el mismo movimiento pero a la inversa.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/0ybBmFasLtg","e":null,"h":5268,"t":3.9,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","cadera"]},{"i":5262,"n":"Dominada","d":"Colgando de una barra con los dedos de las manos hacia adelante y los brazos estirados, flexiona los codos elevando todo el cuerpo hasta que tu barbilla quede a la altura de la barra. Vuelve a la posición inicial para terminar.\n\n**Ten en cuenta:**\n\n- Extiende bien los brazos al terminar el descenso. \n- El movimiento de flexión debe llevar como mínimo tu barbilla a la altura de la barra. \n- Relaja el cuello. \n- Mantén tu espalda recta. \n- Cuenta una repetición por cada elevación.","v":"https://youtu.be/Ceem40FPgWA","e":5361,"h":5359,"t":3.8,"m":["dorsales","trapecios","pectorales"],"j":["codos","hombros"]},{"i":5263,"n":"Fondos","d":"Sitúate de espaldas a una caja, banco o superficie elevada, apoya las manos en el filo la caja y los pies en el suelo, siendo solo los talones tu punto de apoyo. Desde aquí flexiona los codos dejándote caer controladamente hacia el suelo. Realiza una flexión de codos de 90º y termina con el movimiento inverso, estirándo los brazos completamente.\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta. \n- Realiza el movimiento en la máxima amplitud posible.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/muIQKozJdFA","e":5866,"h":null,"t":3.5,"m":["tríceps","pectorales"],"j":["codos","hombros","cadera"]},{"i":5264,"n":"Flexión con rodillas","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho, las rodillas en el suelo y las puntas de los piens apoyados. Desde aquí impúlsate con las manos para elevar el tronco manteniendo el cuerpo alineado y paralelo al suelo. \n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe formar una línea recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/jF0UJfweKz4","e":5252,"h":null,"t":3.0,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},{"i":5265,"n":"Flexión lateral con rodillas","d":"Túmbate boca abajo con las palmas y las rodillas apoyadas en el suelo. Realiza una flexión y desplázate haciendo impulso con tus manos hacia un lado, realiza otra flexión y vuelve a impulsarte hacia tu lugar inicial para hacer otra repetición.\n\n**Ten en cuenta:**\n\n- Para hacer correctamente el cambio de apoyo mantén los brazos estirados, junta las manos y desplaza una de ellas para cambiar de posición, haz lo mismo al volver.\n- Mantén la mirada al frente y tu cuerpo en línea recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/XPMgLyiaKOA","e":5258,"h":5267,"t":3.0,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},{"i":5266,"n":"Flexión reptil con rodillas","d":"Realiza una flexión normal con las rodillas en el suelo, donde los apoyos de tus manos sean: uno a la atura del pecho y el otro por encima de la cabeza. Tras cada flexión alterna las manos con los puntos de apoyo.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar en línea recta.\n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/8ESDCX2gVok","e":5259,"h":null,"t":3.2,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},{"i":5267,"n":"Flexión abierta con rodillas","d":"Realiza una flexión apoyándote en las rodillas y con las manos aproximadamente unos 40 cm más abiertas que en una flexión normal.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar en línea recta\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/NN22gVu6izA","e":5260,"h":5264,"t":3.0,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},{"i":5268,"n":"Flexión hindú con rodillas","d":"Realiza una flexión apoyándote en las rodillas, colocándote en la posición de flexión montaña y haciendo un movimiento hasta tener la posición de extensión de Mckenzie. El movimiento simula la intención de pasar por debajo de una barra situada a la altura de tu cabeza.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento como si pasaras por debajo de una barra que no debes tocar. \n- Marca bien la extensión. \n- No vuelvas a la posición incial para terminar, haz el mismo movimiento pero a la inversa.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/e6wy2xvEWHs","e":5261,"h":5264,"t":3.2,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","cadera","rodillas"]},{"i":5269,"n":"Andar","d":"Trasládate de un lugar a otro a un ritmo normal por tu propio pie.","v":"https://youtu.be/afu6KiuA9C8","e":5241,"h":null,"t":3.0,"m":["isquiotibiales","cuádriceps"],"j":["cadera","tobillos","rodillas"]},{"i":5273,"n":"Surfer","d":"Tumbado boca abajo en posición de Mckenzie, (piernas apoyadas y brazos estirados generando una extensión de la espalda), realiza un impulso con los brazos para quedar agachado con los pies al lado de las manos, el tronco rotado ligeramente hacia un lado y la mirada al frente.\n\n**Ten en cuenta:**\n\n- Asciende con impulso, de la forma más explosiva que puedas.\n- Mantén la mirada al frente en todo momento.\n- Cuenta una repetición por cada salto.","v":"https://youtu.be/fWsekr2ylD4","e":null,"h":5315,"t":4.2,"m":["recto mayor del abdomen","cuádriceps","deltoides"],"j":["cadera","rodillas","tobillos","muñecas"]},{"i":5274,"n":"Peso muerto 1 pierna","d":"Colócate de pie como posición inicial, flexiona el tronco hacia delante apoyado sobre una sola pierna mientras llevas la otra pierna hacia atrás. \n\n**Ten en cuenta:**\n\n- Mntén la espalda recta.\n- Mantén la mirada al frente.\n- Cuenta una repetición por cada flexión hacia atrás.","v":"https://youtu.be/iYONQKb9D3U","e":6043,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas"]},{"i":5275,"n":"Sentadilla a cada lado","d":"Colócate de pie como posición inicial, con la espalda recta y sacando ligeramente el trasero hacia afuera. Flexiona la cadera y rodillas unos 90º aproximadamente o hasta que tus muslos estén paralelos al suelo. Durante la flexión, lleva el tronco alternativamente sobre una pierna y sobre la otra.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Durante la flexión tus rodillas deben mirar hacia afuera.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por cada sentadilla.","v":"https://youtu.be/7KV2x-jHfcU","e":5434,"h":null,"t":3.5,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5276,"n":"Plancha con salto lateral","d":"Coloca el cuerpo boca abajo apoyando los antebrazos y las puntas de los pies en el suelo. Mantén piernas, tronco y cabeza estirados paralelamente al suelo. Desde esta posición realiza un pequeño salto desplazándote lateralmente al mismo tiempo con las piernas.\n\n**Ten en cuenta:**\n\n- Mantén la mirada la frente y la espalda siempre recta. \n-Cuenta una repetición por cada salto.","v":"https://youtu.be/-tt4V2V3t_0","e":null,"h":5280,"t":2.8,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["cadera","rodillas","tobillos","muñecas","hombros"]},{"i":5277,"n":"Sentadilla con salto lateral","d":"Colócate de pie, con la espalda recta y sacando ligeramente el trasero hacia afuera flexiona las piernas unos 90º aproximadamente o hasta que tus muslos estén paralelos al suelo. Desde esta posición realiza un pequeño salto desplazándote lateralmente.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Extiende tu cuerpo durante el salto. \n- Amortigua bien la caída. \n- Durante la flexión tus rodillas deben mirar hacia afuera.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición con cada salto.","v":"https://youtu.be/YzxAE-uPcRw","e":5891,"h":5243,"t":4.0,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5278,"n":"Flexión rodando","d":"Túmbate boca arriba con las palmas y los talones apoyados en el suelo. Mediante un impulso lleva las piernas hacia atrás y al volver, flexiona las piernas para quedar en posición de cuclillas. Desde esta posición apoya las manos en el suelo y mediante un impulso lleva las piernas hacia atrás. Realiza una flexión normal y con un impulso lleva las piernas hacia adelante para quedar en posición de cuclillas nuevamente, luego túmbate hacia atrás para volver a comenzar.\n\n**Ten en cuenta:**\n\n- Durante la flexión mantén la mirada al frente y toca el pecho con el suelo sin llegar a apoyarlo.\n- Cuando te tumbes, estira completamente tu cuerpo y tus brazos por encima de la cabeza.\n- Cuenta una repetición cada vez que pases por la posición inicial.","v":"https://youtu.be/mfS0Iasouvc","e":5309,"h":5252,"t":3.8,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},{"i":5279,"n":"Semi burpee","d":"Colócate de pie como posición inicial. Agacha el cuerpo llevando las manos al suelo, a la vez que impulsas las piernas hacia atrás, colocándote en la posición inicial de plancha, con el cuerpo recto y apoyado en la punta de los pies.\n\nDesde esta posición, impúlsate con los pies para colocarlos justo detrás de las manos y realiza un salto hacia arriba. Da una palmada por encima de la cabeza para terminar el ejercicio.\n\n**Ten en cuenta:**\n\n- Cuenta una repetición con cada palmada.","v":"https://youtu.be/tnX3DxQ9xHU","e":5419,"h":null,"t":3.8,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},{"i":5280,"n":"Plancha con salto","d":"Coloca el cuerpo boca abajo apoyando los antebrazos y las puntas de los pies en el suelo. Mantén piernas, tronco y cabeza estirados en paralelo al suelo. Desde esta posición haz un salto elevando las piernas.\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta y la mirada al frente.\n- Amortigua el salto.\n- Cuenta una repetición cada salto.","v":"https://youtu.be/J-Ns3EpUrq0","e":5276,"h":5283,"t":2.8,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["hombros","tobillos","cadera"]},{"i":5282,"n":"¡Levántate!","d":"Colócate boca arriba en el suelo con las piernas flexionadas, toma impulso con las piernas echándote un poco hacia atrás para seguidamente, levantar todo el tronco del suelo. Quédate apoyado con el pie de una pierna y la rodilla de la contraria para terminar el levantamiento y vuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Extiende bien tu cuerpo al final de la elevación. \n- Baja de manera controlada.\n- Intercambia la posición de las piernas al finalizar.\n- Cuenta una repetición por cada levantamiento.","v":"https://youtu.be/a2WEv8H3MqA","e":5343,"h":5342,"t":2.5,"m":["abdominales","glúteos"],"j":["cadera","rodillas","tobillos","hombros"]},{"i":5283,"n":"Plancha con desplazamiento lateral","d":"Coloca el cuerpo boca abajo apoyando los antebrazos y las puntas de los pies en el suelo. Mantén piernas, tronco y cabeza estirados en paralelo al suelo. Desde esta posición realizar desplazamientos laterales moviendo hacia un mismo lado piernas y brazos a la vez, primero brazo derecha y pie derecho, después brazo izquierdo y pie izquierdo (y viceversa).\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta.\n- Cuenta una repetición con cada movimiento lateral.","v":"https://youtu.be/IRcNGJzTG2Q","e":5280,"h":5218,"t":2.5,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["hombros","tobillos"]},{"i":5286,"n":"Thruster libre","d":"Colócate de pie, con la espalda recta y sacando ligeramente el trasero hacia afuera, flexiona las piernas hasta tocar las rodillas con los codos. Al volver a la posición de pie, estira los brazos completamente por encima de tu cabeza.\n\n**Ten en cuenta:**\n\n- Extiende bien brazos y espalda en la elevación. \n- Mantén tu espalda recta todo el tiempo.\n- Cuenta una repetición por cada sentadilla.","v":"https://youtu.be/PYgQA3MNcsc","e":5379,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["tobillos","rodillas","cadera"]},{"i":5289,"n":"Flexión inclinada","d":"Movimiento de flexión con las manos apoyadas en una caja o superficie elevada, de forma que nuestro cuerpo esté inclinado.\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta y la mirada al frente. \n- El pecho debe descender hasta la altura de las manos.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/SWE_b1z7jKU","e":5295,"h":5252,"t":3.0,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5290,"n":"El puente 1 pierna","d":"Colócate tumbado boca arriba con una pierna flexionada y el pie apoyado en el suelo. El tobillo de la otra pierna irá apoyado en la rodilla de la primera para que funcione como punto de apoyo. Desde aquí, realiza una elevación del tronco despegando el trasero del suelo hasta tener el tronco y la pierna completamente alineados. Alterna las piernas entre series.\n\n**Ten en cuenta:**\n\n- Mantén el cuerpo bien alineado. \n- Desciende suavemente. \n- Cuenta una repetición cada extensión.","v":"https://youtu.be/HVdXJNW8PPw","e":5334,"h":5291,"t":3.5,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},{"i":5291,"n":"El puente","d":"Colócate tumbado boca arriba con las piernas flexionadas y los pies apoyados en el suelo. Eleva el tronco despegando el trasero del suelo hasta tener el cuerpo alineado. Desciende volviendo a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén el cuerpo bien alineado. \n- Desciende suavemente.\n- Cuenta una repetición con cada extensión.","v":"https://youtube.com/shorts/KuEVq3OA2ss","e":5290,"h":null,"t":3.0,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},{"i":5292,"n":"Burpee con salto rodillas-codos","d":"Ejercicio que combina: sentadilla, flexión y salto.\n\nColócate de pie como posición inicial. Agacha el cuerpo llevando las manos al suelo, a la vez que saltas con las piernas hacia atrás colocándote en la posición inicial de plancha, con el cuerpo recto y apoyado en la punta de los pies.\n\nRealiza una flexión completa, acercando el pecho al suelo todo lo que puedas. Al finalizar la flexión impúlsate con los pies para colocarlos justo detrás de las manos y realiza un salto hacia arriba. En el salto pliega las piernas para tocar los codos con las rodillas. Da una palmada por encima de la cabeza para terminar el ejercicio.\n\n**Ten en cuenta:**\n\n- Haz un salto potente para que te de tiempo a realizar el movimiento en el aire.\n- Cuenta una repetición por cada salto.","v":"https://youtu.be/76U6URjaha0","e":5352,"h":5299,"t":5.0,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},{"i":5293,"n":"Sentadilla búlgara","d":"Realiza un squat dejando el peso sobre una sola pierna, manteniendo la otra pierna apoyada y flexionada en un soporte elevado situado detrás de ti.\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta.\n- La rodilla que flexionas delante no debe sobrepasar la altura del pie.\n- Durante la flexión tus rodillas deben mirar hacia afuera.\n- Cuenta una repetición por cada sentadilla.","v":"https://youtu.be/gfLc56pF4Cs","e":6009,"h":null,"t":5.2,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},{"i":5295,"n":"Flexión declinada","d":"Movimiento de flexión con los pies apoyados sobre una caja, banco o superficie elevada.\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta y la mirada al frente.\n- Cuanto más elevadas estén las piernas, más difícil es el ejercicio.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/j7JYaVoR-0k","e":5320,"h":5289,"t":3.2,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5296,"n":"Escalador","d":"Colócate en posición plancha (con las manos y pies como puntos de apoyo y el cuerpo en paralelo al suelo) y realiza un impulso para llevar los pies a la altura de tus manos. Salta de nuevo para recuperar la posición inicial.\n\n**Ten en cuenta:**\n\n- El movimiento de salto debe ser explosivo.\n- Intenta que tus piernas queden estiradas tras el salto.\n- Cuenta una repetición por cada salto.","v":"https://youtu.be/FCbw2Fg7GEY","e":5316,"h":null,"t":4.2,"m":["recto mayor del abdomen","abdominales oblicuos","deltoides","cuádriceps"],"j":["hombros","cadera","rodillas","tobillos"]},{"i":5297,"n":"Escalador alterno","d":"Colócate en posición plancha, con una de las piernas flexionada y la rodilla lo más cerca posible del codo. Desde ahí, realiza un impulso para llevar la pierna flexionada atrás a la vez  que realizas el movimiento de flexión con la otra pierna. Alterna ambas piernas de manera seguida para simular una escalada.\n\n**Ten en cuenta:**\n\n- El movimiento de escalar debe ser explosivo, alternando las dos piernas rápidamente y sin pausas.\n- Intenta que las piernas pasen de estar flexionadas a completamente estiradas.\n- Cuenta una repetición por cada flexión de pierna.","v":"https://youtube.com/shorts/_gNZC-2Zs-M","e":null,"h":5317,"t":4.2,"m":["recto mayor del abdomen","abdominales oblicuos","deltoides","cuádriceps"],"j":["hombros","cadera","rodillas","tobillos"]},{"i":5299,"n":"Burpees con salto estrella","d":"Ejercicio que combina: sentadilla, flexión y salto.\n\nLa posición inicial es de pie. Desde aquí, agacha el cuerpo llevando las manos al suelo a la vez que impulsas las piernas hacia atrás, colocándote en la posición inicial de plancha, con el cuerpo recto y apoyado en la punta de los pies.\n\nRealiza una flexión completa acercando el pecho al suelo todo lo que puedas. Al finalizar la flexión impulsa los pies para colocarlos justo detrás de las manos y realiza un salto vertical, extendiendo brazos y piernas hacia afuera simulando la forma de una estrella.\n\n**Ten en cuenta:**\n\n- Haz un salto potente para que te de tiempo a realizar el movimiento en el aire.\n- Cuenta una repetición por cada salto.","v":"https://youtu.be/2y_6r2hmijE","e":5292,"h":5236,"t":5.0,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},{"i":5300,"n":"Sprint","d":"Corre lo más rápido que puedas durante el tiempo indicado en cada sesión.","v":"https://youtu.be/JTXLY2voVw4","e":null,"h":5241,"t":23.0,"m":["cuádriceps","isquiotibiales","gemelos"],"j":["tobillos","rodillas","cadera"]},{"i":5309,"n":"Bubu","d":"Este ejercicio combina la realización de un Burpee y un Burrol en cada repetición.\n \nBurpee: Movimiento complejo en 3 fases. Inicia el movimiento de pie. \n \n1. Tírate al suelo boca abajo amortiguando la caída con las manos hasta que todo tu cuerpo toque el suelo.\n2. Manteniendo las manos en el suelo, impulsa los pies para llevarlos lo más cerca posible de las manos.\n3. Ponte de pie realizando un salto vertical y dando una palmada por encima de tu cabeza.\n \nBurrol: Movimiento complejo en 3 fases. Inicia el movimiento de pie.\n \n1. Tírate al suelo boca arriba sentándote primero y seguidamente estirándote completamente con los brazos estirados por encima de la cabeza.\n2. Levántate con un impulso para ponerte de cuclillas.\n3. Ponte de pie dando un salto vertical y una palmada por encima de tu cabeza.\n \n \n**Ten en cuenta:**\n \n- Estírate completamente en el suelo al tumbarte.\n- En los Burpees: intenta mantener las piernas estiradas cuando saltes para levantarte.\n- En los Burrols: utiliza las manos para levantarte si lo necesitas.\n- Cuenta una repetición una vez realizado un burpee y un burrol.","v":"https://youtu.be/j7IIbUwjW0Q","e":5311,"h":5238,"t":5.2,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},{"i":5310,"n":"Burpee lateral","d":"Movimiento complejo en 3 fases. Inicia el movimiento de pie. \n\n1) Tírate al suelo boca abajo amortiguando la caída con las manos hasta que todo tu cuerpo toque el suelo.\n2) Impúlsate con los brazos y piernas para ponerte de pie nuevamente.\n3) Realiza un salto horizontal mientras das una palmada con las manos por encima de tu cabeza.\n \n**Ten en cuenta:**\n \n- Cuando te levantes mantén las piernas lo más estiradas posible (sin doblar las rodillas)\n- Amortigua bien la caída pero no realices una flexión.\n \n**Ejercicio alternativo:**\n \n- Burpee","v":"https://youtu.be/SsdlTZkkV0k","e":5237,"h":5236,"t":5.0,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},{"i":5311,"n":"Burrol salto a caja","d":"Movimiento complejo de 4 fases. Inicia el movimiento de pie.\n \n1) Tírate al suelo boca arriba sentándote primero para luego tumbarte completamente con los brazos estirados por encima de la cabeza.\n2) Levántate con un impulso para ponerte de cuclillas y ponte de pie.\n3) Salta hacia delante para colocarte encima de una caja, banco o superficie elevada.\n4) Salta hacia atrás para terminar en la posición inicial.\n \n**Ten en cuenta:**\n \n- Quédate completamente erguido tras el salto a caja.\n- Túmbate completamente en el suelo en el descenso.\n- Si lo necesitas, usa las manos para levantarte del suelo.\n \n**Ejercicio alternativo:**\n \n- Burrol","v":"https://youtu.be/ZlLoY6NtSsw","e":null,"h":5238,"t":5.3,"m":["abdominales","cuádriceps","isquiotibiales","glúteos","gemelos"],"j":["hombros","cadera","rodillas","tobillos"]},{"i":5312,"n":"Saltos cruzados","d":"Párese con los pies separados a la altura de los Deltoides y extienda los brazos hacia los lados con las palmas hacia abajo. Esta es la posición inicial.\nSalta y cruza el brazo derecho sobre el izquierdo y el pie derecho sobre el izquierdo. Vuelve a la posición inicial y luego cruza con el brazo y el pie opuestos. Continúe alternando lados.\n\n**Ten en cuenta:**\n\n- Asegúrate de mantener el ritmo.\n- No descanses demasiado tiempo para recuperarte entre saltos.\n- Cuenta una repetición cada ves que realizas un cruce de brazos.","v":"https://youtu.be/nUllaWKdZX0","e":null,"h":5331,"t":2.8,"m":["trapecios","deltoides","pectorales","gemelos","glúteos"],"j":["codos","hombros","cadera"]},{"i":5313,"n":"Desplazamiento lateral","d":"Colócate de pie como posición inicial, flexiona ligeramente las rodillas realizando un desplazamiento lateral hacia la derecha. \nToca el pie derecho con la mano izquierda. Desplázate de la misma forma hacia la izquierda y toca el pie izquierdo con la mano derecha. \nCuenta una repetición cada vez que toques un pié con la mano.\n \n**Ten en cuenta:**\n\n- Mantén la espalda recta cuando vayas a tocar el pie. \n \n**Ejercicio alternativo:**\n\n- Sentadilla lado a lado","v":"https://youtu.be/oe14pWODN7Q","e":null,"h":5275,"t":2.5,"m":["cuádriceps","gemelos"],"j":["cadera","rodillas","tobillos"]},{"i":5315,"n":"Escalador lateral","d":"1.- Colócate en posición de plancha con ambas manos apoyadas en el suelo, separadas a la anchura de los hombros y las piernas extendidas apoyando la punta de los pies en el suelo. \n2.- Desde esta posición, realiza un impulso para llevar las piernas hacia delante a un lado de tu cuerpo.\n3.- Mediante un impulso realiza el movimiento inverso para volver a la posición inicial, y repite hacia el otro lado.\n\nTen en cuenta: \n\n- Mantén la espalda recta.\n- Evita que los codos se flexionen.\n- Nota el estiramiento de toda la cadena lateral. \n- Cada salto hacia un lado es una repetición.","v":"https://youtu.be/vrUM2JVnseg","e":5273,"h":5316,"t":4.2,"m":["recto mayor del abdomen","abdominales oblicuos","deltoides","cuádriceps"],"j":["hombros","cadera","rodillas","tobillos"]},{"i":5316,"n":"Escalador rana","d":"Túmbate boca abajo como posición inicial, con las palmas de las manos apoyadas en el suelo y los brazos estirados para despegar el pecho del suelo. \nImpúlsate para colocarte de cuclillas con las manos apoyadas en el suelo, de forma que estés en posición de sentadilla profunda.\n \n**Ten en cuenta:**\n \n- Mantén la espalda recta y el trasero bien abajo en la recepción.\n- Cuenta una repetición por cada salto.","v":"https://youtu.be/4gaKG7v4b5g","e":5315,"h":5296,"t":4.2,"m":["recto mayor del abdomen","abdominales oblicuos","deltoides","cuádriceps"],"j":["hombros","cadera","rodillas","tobillos"]},{"i":5317,"n":"Escalador runner","d":"Túmbate boca abajo y estira los brazos como si te prepararas para hacer una flexión levantando el tronco del suelo y manteniendo la espalda recta. \nDesde esta posición, lleva una rodilla hacia el codo del mismo lado. Vuelve a la posición inicial y haz lo mismo con la otra extremidad.\n\n**Ten en cuenta:**\n \n- Mantén la espalda recta\n- No abras la pierna durante el desplazamiento, la rodilla se dirige en línea recta al codo. \n- Cuenta una repetición por cada flexión de rodilla.","v":"https://youtu.be/ffeDkk1ryZE","e":5297,"h":5316,"t":4.2,"m":["recto mayor del abdomen","abdominales oblicuos","deltoides","cuádriceps"],"j":["hombros","cadera","rodillas","tobillos"]},{"i":5318,"n":"Escaleras","d":"Colócate de pie como posición inicial. Dobla la espalda hacia el suelo llevando las manos lo más cerca posible a los pies y manteniendo las piernas estiradas.  \nDesde esta posición, gatea con las manos hacia delante 4 pasos.\nVuelve atrás con las manos hasta llegar a la posición inicial.\n \n**Ten en cuenta:**\n\n- Mantén el abdomen apretado durante todo el ejercicio.\n- Cuenta una repetición cada vez que te vuelvas a poner de pie.","v":"https://youtube.com/shorts/arld7dxqaZI","e":5763,"h":null,"t":2.5,"m":["abdominales","isquiotibiales","glúteos"],"j":["muñecas","cadera","tobillos"]},{"i":5319,"n":"Flexión cerrada","d":"Movimiento de flexión donde los brazos se mantienen más juntos que en una flexión normal, por dentro de la altura de los Deltoides.\n \n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Mantén los brazos pegados al cuerpo durante todo el rango de movimiento.\n- Cuenta una repetición por cada flexión.","v":"https://youtube.com/shorts/hvNBltOp6cc","e":5253,"h":5264,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5320,"n":"Flexión con déficit","d":"Túmbate boca abajo con las palmas apoyadas sobre una superficie que las mantenga ligeramente elevadas y te permita que el recorrido del ejercicio sea un poco mayor, como un par de libros o dos piedras de tamaño similar. \nDesde aquí impúlsate con las manos para elevar el tronco manteniendo el cuerpo paralelo al suelo. Vuelve lentamente a la posición inicial hasta tocar el suelo con el pecho.\n \n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtube.com/shorts/dB64bAawu44","e":5257,"h":5231,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5321,"n":"Flexión con rodillas con déficit","d":"Túmbate boca abajo con las palmas apoyadas sobre una superficie que las mantenga ligeramente elevadas y te permita que el recorrido del ejercicio sea un poco mayor, como un par de libros o dos piedras de tamaño similar. Las rodillas están apoyadas y los pies levantados.\nDesde aquí impúlsate con las manos para elevar el tronco manteniendo el cuerpo paralelo al suelo. Vuelve lentamente a la posición inicial hasta tocar el suelo con el pecho.\n \n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtube.com/shorts/xpRGFvXfb48","e":5320,"h":5264,"t":3.0,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},{"i":5324,"n":"Flexión manos arriba","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Impúlsate con las manos para elevar el tronco manteniendo el cuerpo alineado y paralelo al suelo. \nCuando el pecho toque el suelo, levanta las manos dejando el peso sobre el pecho. Apoya las manos y elévate de nuevo.\n \n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtube.com/shorts/uZV9WHuS5Gc","e":null,"h":5325,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5325,"n":"Flexión manos arriba con rodillas","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Impúlsate con las manos para elevar el tronco manteniendo el cuerpo alineado y paralelo al suelo. Las rodillas en el suelo y los pies levantados. \nCuando el pecho toque el suelo, levanta las manos dejando el peso sobre el pecho. Apoya las manos y elévate de nuevo.\n \n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtube.com/shorts/7um0yDAWjOE","e":5324,"h":null,"t":3.0,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},{"i":5326,"n":"Flexión noria","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Al levantarte, eleva el tronco y lleva el peso hacia atrás. Seguidamente, lleva el peso hacia delante y flexiona de nuevo hacia abajo, realizando un movimiento circular de arriba a abajo.\n \n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- Realiza el movimiento de forma fluida y sin pausas.\n- Cuenta una repetición por cada flexión.","v":"https://youtube.com/shorts/qNAyfQ43ON8","e":5261,"h":5268,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","cadera"]},{"i":5328,"n":"Flexión palmada","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Realiza una flexión con un gran impulso para realizar una palmada en el aire y volver a la posición inicial con las manos en el suelo.\n\n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- Amortigua bien la caida para no hacerte daño en las muñecas\n- Cuenta una repetición por cada palmada.","v":"https://youtube.com/shorts/7bav26twQmQ","e":null,"h":5329,"t":3.9,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5329,"n":"Flexión rodillas con palmada","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho, las rodillas en el suelo y los pies levantados.\nRealiza una flexión con un gran impulso para realizar una palmada en el aire y volver a la posición inicial con las manos en el suelo.\n\n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- Amortigua bien la caida para no hacerte daño en las muñecas\n- Cuenta una repetición por cada palmada.","v":"https://youtube.com/shorts/LS_943Qy2-M","e":5328,"h":null,"t":3.2,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},{"i":5331,"n":"Saltos de tijera","d":"Colócate de pie con los pies juntos, las rodillas ligeramente flexionadas y los brazos a los lados. Salta mientras levantas los brazos y separas las piernas de los lados. Recepciona con las piernas separadas y los brazos tocándose encima la cabeza. \n \n**Ten en cuenta:**\n \n- Se puede aumentar la intensidad saltando más rápido\n- Cuenta una repetición cada vez que vuelvas a la posición inicial.","v":"https://youtube.com/shorts/OR7s2YXnrkk","e":5312,"h":null,"t":2.8,"m":["gemelos","glúteos"],"j":["tobillos","rodillas","hombros"]},{"i":5332,"n":"Skipping","d":"Corre sin moverte de sitio, levantando las rodillas y con el abdomen en tensión.\n \n**Ten en cuenta:**\n \n- Manten la cabeza erguida y mirando hacia adelante.\n- Usa tus brazos para dar impulso al movimiento.\n- Cuenta una repetición por cada rodilla levantada.","v":"https://youtube.com/shorts/hGhE40KBaC8","e":5333,"h":null,"t":2.8,"m":["gemelos","glúteos","isquiotibiales"],"j":["tobillos","rodillas","cadera"]},{"i":5333,"n":"Skipping rodillas codos","d":"Colócate de pie con los pies juntos y las manos detrás de la cabeza. Mantén el core activo y levanta una rodilla hacia arriba mientras que acercas el codo del lado contrario para tocarla, girando ligeramente el tronco. En la siguiente repetición alterna al otro lado.\n\n**Ten en cuenta:**\n \n- Mantén la cabeza erguida y mirando hacia adelante.\n- Usa tus brazos para dar impulso al movimiento.\n- Cuenta una repetición por cada lado.","v":"https://youtube.com/shorts/xgYuOJMjmyI","e":null,"h":5332,"t":2.9,"m":["gemelos","glúteos","isquiotibiales","abdominales"],"j":["tobillos","rodillas","cadera"]},{"i":5334,"n":"Molino","d":"Colócate de pie, abre las piernas algo más que el ancho de las Cadera, con los pies girados ligeramente hacia afuera. Eleva el brazo derecho por encima de tu cabeza. Gira y baja hacia el lado izquierdo sin mover las piernas hasta que tu mano izquierda toque tu pie izquierdo.\n\nEn esta posición final tus brazos deben estar alineados, formando una línea casi perpendicular al suelo. Mantén el pecho abierto y la mirada en la mano que está elevada. Detente un breve momento en esta posición y realiza el movimiento inverso hasta poner el cuerpo recto.\n\n**Ten en cuenta**\n\n- Inspira al bajar, espira al subir.\n- Si te resulta muy fácil el ejercicio, sujeta un peso con la mano elevada: una mochila con peso, una mancuerna o una kettlebell.\n- Mantén en todo momento la espalda recta.\n- Cuenta una repetición cada vez que subas.","v":"https://youtube.com/shorts/yGJmDlHSkrA","e":null,"h":5956,"t":2.5,"m":["isquiotibiales","gemelos","glúteos"],"j":["cadera","hombros","rodillas"]},{"i":5335,"n":"Plancha rotacion","d":"Coloca el cuerpo boca abajo apoyando los antebrazos perpendiculares al cuerpo y las puntas de los pies en el suelo. \nMantén piernas, tronco y cabeza estirados en paralelo al suelo. Rota tu cuerpo todo lo posible hacia un lado, llevando un brazo por debajo del pecho en dirección a la espalda. Para cambiar, rota hacia el otro lado hasta situarte en la misma posición pero con el brazo contrario.\n\n**Ten en cuenta:**\n \n- Mantén la posición horizontal sin dejar caer o subir demasiado la pelvis.\n- Haz la máxima amplitud de movimiento posible en la rotación.\n- Cuenta una repetición por cada vez que bajes el brazo.","v":"https://youtube.com/shorts/guXQ0krotlA","e":5337,"h":null,"t":2.6,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["hombros","tobillos"]},{"i":5337,"n":"Plancha asimétrica","d":"Coloca el cuerpo boca abajo apoyando los antebrazos y las puntas de los pies en el suelo. Mantén piernas, tronco y cabeza estirados en paralelo al suelo. Lleva uno de tus brazos al cuerpo, manteniéndolo pegado, de forma que el otro brazo sea el único punto de apoyo junto con los pies. Aguanta la posición el tiempo requerido. Vuelve a la posición inicial y cambia de brazo. \n \n**Ten en cuenta:**\n \n- Mantén la posición horizontal sin dejar caer o subir demasiado la pelvis.\n- Cuenta una repetición por cada lado.","v":"https://youtube.com/shorts/PFRJzEZN8XM","e":null,"h":5335,"t":2.6,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["hombros","tobillos"]},{"i":5339,"n":"Plancha martillo","d":"Coloca el cuerpo en plancha apoyando los antebrazos y las puntas de los pies en el suelo. Mantén piernas, tronco y cabeza estirados en paralelo al suelo. Sube apoyándote en las manos, primero una y luego la otra, y baja apoyándote en los antebrazos, primero en uno y luego en otro, en el mismo orden que subiste, para acabar en la posición inicial.\n \nRepite el ejercicio empezando con el brazo contrario al que usaste al principio.\n \n**Ten en cuenta:**\n \n- Mira siempre hacia adelante.\n- Mantén la posición horizontal sin dejar caer o subir demasiado la pelvis.\n- Cuenta una repetición por cada cambio de apoyo.","v":"https://youtube.com/shorts/5L1Y-8X4xJA","e":5878,"h":null,"t":3.2,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos","tríceps","deltoides"],"j":["hombros","tobillos","codos"]},{"i":5340,"n":"Rodillas cuclillas","d":"Colócate de rodillas con la espalda recta y apoyándote solo con las puntas de los pies. Desplaza el peso hacia tus talones para poder ponerte de cuclillas. Vuelve a la posición inicial. \n \n**Ten en cuenta:**\n \n- Mantén la mirada al frente. \n- Mantén los pies a la altura de los Deltoides.\n- Si lo necesitas, estira los brazos para mantener el equilibrio.\n- Cuenta una repetición cada vez que estés en cuclillas.","v":"https://youtube.com/shorts/2bdI7RazQGw","e":5341,"h":null,"t":3.2,"m":["cuádriceps","glúteos"],"j":["tobillos","rodillas","cadera"]},{"i":5341,"n":"Rodillas a de pie","d":"Colócate de rodillas con la espalda recta y los pies apoyados solo con la punta, desplaza el peso hacia tus talones para poder levantarte y ponerte de pie. Vuelve a la posición inicial realizando una sentadilla profunda y apoyando las rodillas en el suelo.\n \n**Ten en cuenta:**\n\n- Mantén la mirada hacia el frente. \n- Mantén los pies a la altura de los Deltoides.\n- Si lo necesitas, estira los brazos para mantener el equilibrio.\n- Cuenta una repeticion cada vez que te pongas de pie.","v":"https://youtube.com/shorts/rtqCsinr7m0","e":null,"h":5340,"t":3.5,"m":["cuádriceps","glúteos"],"j":["tobillos","rodillas","cadera"]},{"i":5342,"n":"Roll a dos","d":"Túmbate boca arriba y flexiona las Cadera para llevar las piernas por encima de tu cabeza. Mientras devuelves las piernas a la posición inicial, coge impulso para elevar el tronco y tocar los pies con las manos. \n \n**Ten en cuenta:**\n \n- Mantén la espalda lo más recta posible durante todo el movimiento\n- Cuenta una repetición cada vez que tocas los pies.","v":"https://youtube.com/shorts/efc9FN8EV0s","e":5238,"h":null,"t":2.5,"m":["cuádriceps","glúteos"],"j":["tobillos","rodillas","cadera"]},{"i":5343,"n":"Roll a pies","d":"Colócate de pie, siéntate y rueda un poco hacia atrás apoyando toda la espalda en el suelo y llevando las piernas lo más cerca de la cabeza que te sea posible. Coge impulso y levántate de nuevo.\n\n**Ten en cuenta:**\n\n- Lleva las piernas hacia atrás mientras coges impulso.\n- Marca bien la extensión de cadera cuando te pongas de pie.\n- Cuenta una repeticion cada vez que te pongas de pie.","v":"https://youtube.com/shorts/FeO1zKJXBOg","e":5238,"h":5342,"t":2.3,"m":["abdominales","glúteos"],"j":["cadera"]},{"i":5345,"n":"Sentada paleo","d":"Tumbado con piernas estiradas y brazos por encima de tu cabeza, siéntate, flexionas tus piernas y las abrazas con tus manos. \n \n **Ten en cuenta:**\n \n- Asegúrate de extender la espalda cuando abraces las piernas. \n- Cuenta una repetición cada vez que abrazas tus piernas.","v":"https://youtube.com/shorts/tQDKDwDCxl4","e":5365,"h":5227,"t":2.5,"m":["abdominales","glúteos"],"j":["cadera","rodillas","hombros"]},{"i":5346,"n":"Sentadilla profunda","d":"Desde la posición de pie, espalda recta y sacando ligeramente el trasero hacia afuera, flexiona la cadera y rodillas bajando el trasero lo más cercano posible a los tobillos. Vuelve a la posición inicial\n\n**Ten en cuenta:**\n \n- Mantén la espalda siempre recta.\n- Durante la flexión tus rodillas deben mirar hacia afuera.\n- Cuenta una repetición por sentadilla.","v":"https://youtube.com/shorts/13CyEyBH7Mc","e":null,"h":5242,"t":3.5,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5347,"n":"Flexión spider inversa","d":"Colócate en plancha y haz una flexión normal, cuando termines, lleva una pierna hacia el codo del mismo lado. Repite con la otra pierna.\n \n**Ten en cuenta:**\n\n- Tu cuerpo debe estar en completa línea recta.\n- El pecho debe conectar con el suelo.\n- Flexiona la rodilla hasta tocar el codo, si no llegas no te preocupes ya irás ganando flexibilidad con el tiempo. \n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/zEBgaQxjrkY","e":null,"h":5348,"t":4.0,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5348,"n":"Flexión spider inversa con rodillas","d":"Realiza el movimiento de flexión con las rodillas apoyadas en el suelo. Cuando tengas los brazos estirados, lleva una pierna a contactar con el codo del mismo lado y repite con el otro lado.\n\n **Ten en cuenta:**\n\n- Tu cuerpo debe estar en completa línea recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Flexiona la rodilla hasta tocar el codo, si no llegas no te preocupes, ya irás ganando flexibilidad con el tiempo.\n- Cuenta una repetición por cada flexión.","v":"https://youtube.com/shorts/7tzUHOU7Co4","e":5347,"h":null,"t":3.2,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5349,"n":"Abrazos al sol","d":"Colócate de pie con un peso ligero en cada mano y los brazos estirados delante de la pelvis. Desde esta posición, realiza un movimiento de abducción para llevar los brazos completamente estirados encima de tu cabeza. \n\n**Ten en cuenta**:\n\n- Mantén los brazos estirados durante todo el recorrido. \n- Flexiona ligeramente las rodillas para proteger la espalda.\n- Mantén la espalda recta.\n- Cuenta una repetición cada vez que vuelvas a la posición inicial.","v":"https://youtube.com/shorts/TSyB1ItSWnc","e":5364,"h":5357,"t":2.5,"m":["trapecios","deltoides"],"j":["hombros"]},{"i":5350,"n":"Arrancada en dos","d":"Ejercicio que se divide en 3 partes:\n\n1. Colócate de pie como posición inicial con una barra como objeto de peso. Realiza una sentadilla con el peso delante de tu cuerpo y los brazos estirados hacia abajo.\n2. Con un impulso, lleva la barra al pecho flexionando los brazos y amortigua la recogida con una ligera flexión de piernas.\n3. Estira las piernas para ponerte de pie y aprovecha el impulso para levantar la barra por encima de tu cabeza.\n\n**Ten en cuenta**:\n\n- Mantén el trasero hacia afuera durante todo el movimiento. \n- Marca bien la extensión al elevar los brazos.\n- Cuenta una repetición cada vez que levantes el peso por encima de tu cabeza.","v":"https://youtube.com/shorts/dCOkkhwULeI","e":5286,"h":5375,"t":5.0,"m":["trapecios","deltoides","pectorales","abdominales","cuádriceps","isquiotibiales"],"j":["hombros","rodillas","cadera","muñecas","tobillos"]},{"i":5352,"n":"Burpee dominada","d":"Este ejercicio combina: sentadilla, flexión y salto.\n\nColócate de pie como posición inicial. Desde aquí, tírate al suelo y colócate en posición plancha: con el cuerpo recto y apoyándote con las manos y las puntas de los pies.\n\nRealiza una flexión completa, acercando el pecho al suelo todo lo que puedas sin llegar a apoyarte. Al finalizar la flexión impulsa los pies para colocarlos justo detrás de las manos, toma impulso para realizar un salto hacia arriba y cuélgate de la barra con los brazos estirados.\nRealiza fuerza con tus brazos flexionándolos para llevar la cabeza a la altura de la barra. Vuelve a la posición inicial.\n\n**Ten en cuenta**:\n\n- Amortigua bien la caída.\n- Mantén la espalda recta en todo momento.\n- Cuenta una repetición por cada dominada.","v":"https://youtube.com/shorts/c9A3xsdPhhw","e":null,"h":5299,"t":8.0,"m":["pectorales","tríceps","cuádriceps","dorsales","trapecios","bíceps"],"j":["hombros","cadera","codos","rodillas"]},{"i":5353,"n":"Cargada a hombro","d":"Colócate de pie, con las espalda recta, las piernas ligeramente flexionadas, y un peso apoyado en el suelo entre tus piernas. Coge el peso con una mano, estira las piernas y lleva el peso a uno de tus Deltoides. Vuelve a la posición inicial y alterna con el otro hombro.\n\n**Ten en cuenta**:\n\n- Mantén la espalda recta y los Glúteos hacia afuera durante todo el movimiento.\n- Elige un peso que te permita realizar el movimiento con precisión.\n- Cuenta una repetición por cada levantamiento.","v":"https://youtube.com/shorts/F_vxVGMOBFM","e":null,"h":5366,"t":3.2,"m":["abdominales","cuádriceps","isquiotibiales"],"j":["hombros","rodillas","codos"]},{"i":5355,"n":"Cohete con carga","d":"Colocado delante de una caja, banco o otra elevación estable apoya una de las piernas en la caja generando una flexión de 90º de cadera y rodilla. Con un peso cargado a la altura del pecho, nos impulsamos con la pierna de apoyo para situarnos de pie encima de la caja, descendemos y cambiamos la pierna de apoyo. \n\n**Ten en cuenta**:\n\n- Extiende el cuerpo al final de la elevación\n- Desciende de manera controlada\n- Cuenta una repetición por elevación.","v":"https://youtube.com/shorts/9MUU3Yo00Ec","e":null,"h":5250,"t":4.0,"m":["cuádriceps","isquiotibiales"],"j":["cadera","rodillas","tobillos"]},{"i":5356,"n":"Dominada supina","d":"Cuélgate en la barra con el agarre de manos que sitúe los dedos mirando hacia ti. Haz fuerza con los brazos para llevar la barbilla a la altura de la barra y vuelve a la posición inicial. \n\n**Ten en cuenta**:\n\n- Lleva la barbilla a la altura de la barra\n- Extiende bien los brazos al volver a la posición inicial. \n- Cuenta una repetición cada vez que pase la barbilla por encima de la barra.","v":"https://youtube.com/shorts/ubKpcwzIYU8","e":null,"h":5420,"t":3.8,"m":["dorsales","trapecios","tríceps","bíceps"],"j":["codos","hombros"]},{"i":5357,"n":"Crol","d":"Realizamos el movimiento de nadar en crol con un peso ligero en cada una de las manos. \n\n**Ten en cuenta**:\n\n- Marca bien el movimiento con cada brazo\n- Mantén la espalda recta durante todo el ejercicio\n- Cuenta una repetición por brazada.","v":"https://youtube.com/shorts/x_P6Sj6yuCs","e":5349,"h":null,"t":2.5,"m":["trapecios","deltoides","pectorales"],"j":["codos","hombros","muñecas"]},{"i":5358,"n":"Peso muerto","d":"Desde la vertical. Espalda recta y acentuando ligeramente la curvatura lumbar y con un peso entre las manos con los brazos estirados enganchados al cuerpo, realizamos una flexión de toda la columna hacia adelante llevando el peso hacia el suelo. Volvemos a la posición inicial. \n\n**Ten en cuenta**:\n\n- Espalda recta y trasero hacia afuera durante todo el movimiento\n- Elige un peso que te permita realizar el movimiento con precisión\n- Cuenta una repetición por levantamiento.","v":"https://youtube.com/shorts/TeyLECgC5eg","e":null,"h":5274,"t":5.0,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},{"i":5359,"n":"Dominada asistida","d":"Colgado en la barra con un agarre de manos donde veas el dorso de tus manos y los pies introducidos en la goma de asistencia, realizamos fuerza con los brazos para llevar la barbilla a la altura de la barra y volver a la posición inicial. \n\n**Ten en cuenta**:\n\n- Lleva la barbilla a la altura de la barra\n- Extiende bien los brazos al volver a la posición inicial. \n- Cuenta una repetición cada vez que pasas la barbilla por encima de la barra.","v":"https://youtube.com/shorts/9BY7tofnhSk","e":5262,"h":5418,"t":3.2,"m":["dorsales","trapecios","tríceps","bíceps"],"j":["codos","hombros"]},{"i":5360,"n":"Dominada con salto","d":"Colgado en la barra con un agarre de manos donde veas el dorso de tus manos y los pies apoyados en el suelo o en una caja,  realizamos fuerza con los brazos mientras a la vez que saltamos para llevar la barbilla a la altura de la barra y volver a la posición inicial. \n\n**Ten en cuenta**:\n\n- Lleva la barbilla a la altura de la barra\n- Extiende bien los brazos al volver a la posición inicial. \n- Cuenta una repetición cada vez que pasas la barbilla por encima de la barra.","v":"https://youtube.com/shorts/kqdeYoRq-ew","e":5262,"h":5359,"t":3.5,"m":["dorsales","trapecios","tríceps","bíceps"],"j":["codos","hombros"]},{"i":5361,"n":"Dominada spider","d":"Colgado en la barra con un agarre de manos donde veas el dorso de ellas, realizamos fuerza con los brazos para llevar la barbilla a la al
