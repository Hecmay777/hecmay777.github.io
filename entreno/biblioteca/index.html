 la espalda pegada en la pared y los pies separados al ancho de tu pelvis, flexiona el cuerpo vértebra a vértebra hasta flexionarte completamente.\n\nRebobina el movimiento con la misma intención, apoyarte en la pared vértebra a vértebra.","v":"https://youtube.com/shorts/LE_T3hAnruw","e":null,"h":null,"t":2.3,"m":["erector de la columna","abdominales"],"j":["columna vertebral","cadera"]},{"i":5968,"n":"Descanso","d":"1. Colócate de pie en posición vertical con los brazos relajados delante de ti. \n2. Eleva los brazos por encima de la cabeza inspirando y extendiendo tu cuerpo al máximo. \n3. Exhala y déjalos caer  por inercia, en la bajada flexiona ligeramente las rodillas.","v":"https://youtube.com/shorts/1DEFAAyxo6Q","e":null,"h":null,"t":1.0,"m":["0"],"j":["0"]},{"i":5975,"n":"Plancha rotacion (derecha)","d":"1. Colócate boca abajo con los antebrazos cruzados delante del pecho  y la punta de los pies en el suelo como únicos puntos de apoyo. El cuerpo formará una línea recta paralela al suelo.\n2. Levanta el brazo derecho en un movimiento circular hasta extenderlo perpendicularmente al suelo.\n3. Vuelve a la posición inicial y alterna el brazo.\n\nTen en cuenta: \n\n- Mantén piernas, tronco y cabeza estirados. \n- Activa abdomen y glúteos y no arquees la zona lumbar.\n- Cuando eleves el brazo, abre el pecho lo máximo que puedas. \n- Cada vez que levantes la mano es una repetición.","v":"https://youtube.com/shorts/XQZuzKOs4P8","e":5414,"h":null,"t":2.6,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["hombros","tobillos"]},{"i":5976,"n":"Plancha rotacion (izquierda)","d":"1. Colócate boca abajo con los antebrazos cruzados delante del pecho  y la punta de los pies en el suelo como únicos puntos de apoyo. El cuerpo formará una línea recta paralela al suelo.\n2. Levanta el brazo izquierdo en un movimiento circular hasta extenderlo perpendicularmente al suelo.\n3. Vuelve a la posición inicial y alterna el brazo.\n\nTen en cuenta: \n\n- Mantén piernas, tronco y cabeza estirados. \n- Activa abdomen y glúteos y no arquees la zona lumbar.\n- Cuando eleves el brazo, abre el pecho lo máximo que puedas. \n- Cada vez que levantes la mano es una repetición.","v":"https://youtube.com/shorts/hTjmBlqfCNY","e":5415,"h":null,"t":2.6,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["hombros","tobillos"]},{"i":5977,"n":"Flexión y extensión de tobillos (D)","d":"1. Comienza sentado en el suelo, con las manos apoyadas en la superficie, una pierna extendida y la otra flexionada.\n2. Eleva ligeramente la pierna estirada despegándola del suelo.\n3. Flexiona y extiende el tobillo elevado.\n4. Vuelve a apoyar la pierna en el suelo.\n\nTen en cuenta:\n- Mantén la espalda recta.\n- Realiza el movimiento lentamente y en su máxima amplitud.\n- Cada flexo-extensión es una repetición.","v":"https://youtube.com/shorts/brI-at6nTB4","e":null,"h":null,"t":2.3,"m":["flexores del pie","gemelos","sóleo"],"j":["tobillos"]},{"i":5978,"n":"Cruce pie derecho a mano","d":"1. Colócate tumbado boca arriba con los brazos abiertos formando una T. \n2. Levanta la pierna derecha y con una ligera rotación de cadera, sin doblar la rodilla, lleva el pie lo más cerca que puedas de la mano opuesta. \n3. Regresa a la posición inicial.\n\nTen en cuenta:\n\n- Al levantar la pierna, mantén los hombros y la cadera en contacto con el suelo. \n- Asegúrate de que la espalda está sobre el suelo. \n- Cada intento de tocar la mano es una repetición.","v":"https://youtube.com/shorts/_P_O3FVlids?feature=share","e":5979,"h":null,"t":2.5,"m":["abdominales"],"j":["cadera"]},{"i":5979,"n":"Pie a mano invertido (derecha)","d":"1. Colócate tumbado boca abajo con los brazos abiertos formando una T. \n2. Levanta una pierna y con una ligera rotación de cadera y doblando la rodilla, lleva el pie lo más cerca que puedas de la mano opuesta. \n3. Regresa a la posición inicial.\n\nTen en cuenta:\n\n- Al levantar la pierna, mantén los hombros y la cadera en contacto con el suelo. \n- Asegúrate de que el pecho está sobre el suelo. \n- Cada intento de tocar la mano es una repetición.","v":"https://youtube.com/shorts/CH8Qv1_wOiw","e":null,"h":5978,"t":2.8,"m":["abdominales"],"j":["cadera","rodillas"]},{"i":5980,"n":"Escalador con rotación (derecha)","d":"1. Colócate en posición de plancha con ambas manos apoyadas en el suelo, separadas a la anchura de los hombros y las piernas extendidas apoyando la punta de los pies en el suelo. \n2. Flexiona una de las piernas apoyando la planta del pie en el suelo junto a la mano de ese mismo lado por fuera de ella.\n3. Rota hacia fuera la mano de la pierna extendida y, desde esta posición, flexiona el brazo de la pierna flexionada por debajo del pecho\n4. A continuación, rota todo el cuerpo hacia arriba hasta que los dos brazos formen un ángulo superior a 180º.\n5. Deshaz el movimiento para volver a la posición inicial.\n\nTen en cuenta: \n- Extiende tu cuerpo cuando lo rotas.","v":"https://youtube.com/shorts/2G1RhcXqGMU","e":null,"h":null,"t":2.3,"m":["abdominales","pectorales","trapecios","deltoides"],"j":["hombros","codos"]},{"i":5981,"n":"Estiramiento pectoral menor (D)","d":"1. Colócate en el suelo en posición de cuadrupedia con una barra paralela o un cajón delante tu cabeza.\n2. Apoya la palma de la mano en la barra o cajón haciendo fuerza y empuja con el pecho hacia el suelo, marcando bien la lumbar. \n3. Suelta la mano y relaja el cuerpo. \n\nTen en cuenta: \n- Mantén el brazo siempre estirado para que el pectoral se estire bien. \n- Cada extensión es una repetición .","v":"https://youtube.com/shorts/Emzj-dqYYU4","e":null,"h":null,"t":2.3,"m":["pectorales"],"j":["hombros","codos"]},{"i":5982,"n":"Rotadores externos derecho","d":"1. Ata una goma o cinta con resistencia a una superficie vertical.\n2. Colócate de pie aproximadamente a medio metro de la superficie donde tengas atada la goma y sujétala con la mano más alejada y el brazo flexionado a 90º, con el biceps pegado a tu cuerpo.\n3. Desde esta posición rota el brazo hacia fuera varias veces.\n4. Eleva el brazo manteniendo el ángulo de 90º, pero con el antebrazo paralelo a tu cuerpo y la mano a la altura de la cabeza.\n5. Rota tu cuerpo para ponerte de frente a la superficie donde está atada la goma,  extiende el codo del brazo que sujeta la goma, y aguanta en esa posición unos segundos.\n6. Vuelve a la posición inicial, gírate 180º y repite todo el movimiento con el otro brazo.\n\nTen en cuenta:\n\n- Mantén la espalda recta y el core activo.\n- Cada movimiento completo por brazo es una repetición.","v":"https://youtube.com/shorts/YfFl64NVU-c","e":null,"h":null,"t":2.5,"m":["manguito rotador"],"j":["hombros","codos"]},{"i":5983,"n":"Excéntricas subescapular (derecha)","d":"1. Ata una cinta a una superficie y colócate de pie de espaldas a ella, sujetando la cinta con una mano y el brazo flexionado pegado a tu cuerpo. Sujeta la cinta de forma que genere resistencia.\n2. Desde esa posición, extiende hacia adelante el brazo que sujeta la cinta y llévalo hacia arriba y hacia atrás de forma controlada, manteniendo la tensión para evitar que la resistencia de la goma te venza.\n3. Vuelve a la posición inicial.\n\nTen en cuenta: \n- Realiza el movimiento de manera controlada. \n- Cuando la banda te tire hacia atrás no dejes que el hombro gire del todo. \n- Activa el core y mantén la espalda recta.","v":"https://youtube.com/shorts/Se86T0nbo5M","e":null,"h":null,"t":2.3,"m":["pectorales","bíceps","dorsales"],"j":["codos","hombros"]},{"i":5985,"n":"contracírculos de deltoides (I)","d":"1. Colócate de pie con los brazos relajados y las escápulas activas. \n2. Con uno de los hombros dibuja círculos mientras con el otro lo haces al sentido contrario. \n\nTen en cuenta: \n- Mantén el cuerpo relajado y concéntrate en las escápulas y los hombros.","v":"https://youtube.com/shorts/Foe_1kymXOw","e":null,"h":null,"t":2.3,"m":["trapecios","dorsales"],"j":["hombros"]},{"i":5986,"n":"Círculos dinámicos de rodillas (derecha)","d":"1. Colócate de pie, manteniendo el equilibrio sobre una pierna.\n2. Flexiona ligeramente la cadera y la rodilla de la pierna que tienes en el aire.\n3. Dibuja círculos con el pie de la pierna en el aire, utilizando el movimiento rotacional de caderas y, sobre todo, rodillas.\n4. Realiza las repeticiones hacia un lado y hacia otro","v":"https://youtube.com/shorts/zZekoLT3-rw","e":null,"h":null,"t":2.3,"m":["cuádriceps","isquiotibiales"],"j":["rodillas","cadera","tobillos"]},{"i":5987,"n":"Perímetro máximo de pie (izquierda)","d":"1. Colócate de pie con las manos apoyadas en tu cintura.\n2. Lleva casi todo el peso corporal hacia una pierna.\n3. Con la pierna que queda libre dibuja el perímetro de tu pie pasando por el talón, canto externo, interno y ante pie. \n\nTen en cuenta:\n\n- Permite que tus rodillas y caderas se muevan en libertad para facilitar el movimiento.","v":"https://youtube.com/shorts/Z9o_yHgH8vc","e":null,"h":null,"t":2.3,"m":["cuádriceps","isquiotibiales","gemelos"],"j":["tobillos"]},{"i":5988,"n":"Dinamico lateral cadera (izquierda)","d":"1. Colócate de pie frente a una pared o soporte, apoya una mano sobre ella, y la otra mano en tu cadera.\n2. Manteniendo el equilibrio sobre la pierna del lado cuya mano tienes apoyada en la pared, eleva la otra pierna realizando un movimiento de balanceo hacia dentro y hacia fuera.\n\nTen en cuenta:\n- El movimiento nace desde la pelvis y la cadera.\n- No es necesario que mantengas la pierna extendida.","v":"https://youtube.com/shorts/JvMOGDctwjE","e":null,"h":null,"t":2.3,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera"]},{"i":5989,"n":"Dinamico lateral cadera (derecha)","d":"1. Colócate de pie frente a una pared o soporte, apoya una mano sobre ella, y la otra mano en tu cadera.\n2. Manteniendo el equilibrio sobre la pierna del lado cuya mano tienes apoyada en la pared, eleva la otra pierna realizando un movimiento de balanceo hacia dentro y hacia fuera.\n\nTen en cuenta:\n- El movimiento nace desde la pelvis y la cadera.\n- No es necesario que mantengas la pierna extendida.","v":"https://youtube.com/shorts/Elz8uW9jOdk","e":null,"h":null,"t":2.3,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera"]},{"i":5990,"n":"Dinamico frontal de cadera (izquierda)","d":"1. Colócate de pie y apoya una mano sobre una pared o soporte.\n2. Apoya la mano libre sobre tu cadera y, manteniendo el equilibrio sobre la pierna que queda hacia fuera, eleva la otra pierna realizando un movimiento de balanceo hacia delante y hacia atrás.\n\nTen en cuenta:\n- El movimiento nace desde la pelvis y la cadera.\n- No es necesario que mantengas la pierna extendida.","v":"https://youtube.com/shorts/Z8jnwfKmnnQ","e":null,"h":null,"t":2.3,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera"]},{"i":5991,"n":"Dinamico frontal de cadera (derecha)","d":"1. Colócate de pie y apoya una mano sobre una pared o soporte.\n2. Apoya la mano libre sobre tu cadera y, manteniendo el equilibrio sobre la pierna que queda hacia fuera, eleva la otra pierna realizando un movimiento de balanceo hacia delante y hacia atrás.\n\nTen en cuenta:\n- El movimiento nace desde la pelvis y la cadera.\n- No es necesario que mantengas la pierna extendida.","v":"https://youtube.com/shorts/JE-ysSdtJW4","e":null,"h":null,"t":2.3,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera"]},{"i":5992,"n":"El puente con carga","d":"","v":"https://youtube.com/shorts/dhYEzeKWhvA","e":5994,"h":5291,"t":3.5,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},{"i":5993,"n":"El puente isometrico","d":"","v":"https://youtube.com/shorts/AB9zMdPYmOQ","e":5994,"h":null,"t":3.2,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},{"i":5994,"n":"El puente isometrico con carga","d":"1.- Colócate tumbado boca arriba, con las piernas flexionadas y los pies apoyados en el suelo, separados a la anchura de tu cadera. \n2.- Coloca una Kettlebell sobre tu cadera.\n3.- Eleva la cadera hacia el techo despegando glúteos del suelo manteniendo el cuerpo alineado. \n4.- Mantén la posición el tiempo indicado.\n\nTen en cuenta:\n\n- Mantén el cuerpo bien alineado, procura que tus rodillas y muslos estén paralelos. \n- Contrae los glúteos mientras los elevas.","v":"https://youtube.com/shorts/Bmb8XWQ7Kt4","e":null,"h":5993,"t":3.5,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},{"i":5995,"n":"Hip thrust libre","d":"1. Colócate sentado con la espalda apoyada sobre un cajón, justo debajo de las escápulas, con las piernas flexionadas y los pies apoyados en el suelo, separados a la anchura de tu cadera. \n2. Eleva la cadera hacia el techo despegando glúteos del suelo manteniendo el cuerpo alineado. \n3. Desciende lentamente y vuelve a la posición inicial.\n\nTen en cuenta:\n\n- Mantén el cuerpo bien alineado, procura que tus rodillas y muslos estén paralelos. \n- Contrae los glúteos mientras los elevas.","v":"https://youtube.com/shorts/WH6uLK3xEXQ","e":5996,"h":null,"t":3.0,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},{"i":5996,"n":"Hip thrust con carga","d":"1. Colócate sentado con la espalda apoyada sobre un cajón, justo debajo de las escápulas, con las piernas flexionadas y los pies apoyados en el suelo, separados a la anchura de tu cadera. \n2. Coloca una Kettlebell sobre tu cadera.\n3. Eleva la cadera hacia el techo despegando glúteos del suelo manteniendo el cuerpo alineado. \n4. Desciende lentamente y vuelve a la posición inicial.\n\nTen en cuenta:\n\n- Mantén el cuerpo bien alineado, procura que tus rodillas y muslos estén paralelos. \n- Contrae los glúteos mientras los elevas.","v":"https://youtube.com/shorts/ZWhOXxqsWeo","e":null,"h":5995,"t":3.5,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},{"i":6009,"n":"Sentadilla búlgara con peso","d":"1. Colócate de pie y de espaldas a una caja, banco o silla, con una pierna apoyada sobre ella y agarra una kettlebell con la mano del mismo lado.\n2. Desciende tu cuerpo lentamente flexionando la pierna apoyada en el suelo y llevando la rodilla de la pierna contraria hacia el suelo.\n3. Cuando la rodilla de atrás toque el suelo, empuja con el talón de la pierna delantera contra el suelo para extender la pierna y elevar de nuevo el cuerpo volviendo a la posición inicial. \n\nTen en cuenta:\n\n- La rodilla no debe sobrepasar la punta del pie. \n- Mantén el pecho erguido, la espalda recta y la vista al frente.\n- Cada sentadilla es una repetición.","v":"https://youtu.be/pjiQmEpdjXA","e":null,"h":5293,"t":5.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":6010,"n":"Sentadilla búlgara con peso (derecha)","d":"1. Colócate de pie y de espaldas a una caja, banco o silla, con la pierna izquierda apoyada sobre ella y agarra una kettlebell con la mano del mismo lado.\n2. Desciende tu cuerpo lentamente flexionando la pierna apoyada en el suelo y llevando la rodilla de la pierna contraria hacia el suelo.\n3. Cuando la rodilla de atrás toque el suelo, empuja con el talón de la pierna delantera contra el suelo para extender la pierna y elevar de nuevo el cuerpo volviendo a la posición inicial. \n\nTen en cuenta:\n\n- La rodilla no debe sobrepasar la punta del pie. \n- Mantén el pecho erguido, la espalda recta y la vista al frente.\n- Cada sentadilla es una repetición.","v":"https://youtube.com/shorts/kLamKninjQc","e":null,"h":5412,"t":5.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":6011,"n":"Sentadilla búlgara con peso (izquierda)","d":"1. Colócate de pie y de espaldas a una caja, banco o silla, con la pierna derecha apoyada sobre ella y agarra una kettlebell con la mano del mismo lado.\n2. Desciende tu cuerpo lentamente flexionando la pierna apoyada en el suelo y llevando la rodilla de la pierna contraria hacia el suelo.\n3. Cuando la rodilla de atrás toque el suelo, empuja con el talón de la pierna delantera contra el suelo para extender la pierna y elevar de nuevo el cuerpo volviendo a la posición inicial. \n\nTen en cuenta:\n\n- La rodilla no debe sobrepasar la punta del pie. \n- Mantén el pecho erguido, la espalda recta y la vista al frente.\n- Cada sentadilla es una repetición.","v":"https://youtube.com/shorts/JOhnxeSzpxY","e":null,"h":5413,"t":5.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":6018,"n":"Levantamiento turco con peso (derecha)","d":"1. Colócate tumbado boca arriba, con el brazo que sostienes la kettlebell completamente estirado a 90º por encima de la cabeza. \n2. Flexiona la rodilla y apoya el pie (del mismo brazo que tienes estirado) en el suelo.\n3. Al mismo tiempo, utiliza el antebrazo del lado contrario para apoyarte en el suelo y elevar el tronco.\n4. Apoya la mano de ese brazo, despega la pierna que estaba estirada en el suelo para apoyar la rodilla y desde ahí, ponte de pie. \n5. Deshaz el movimiento hasta situarte en la posición inicial.\n\nTen en cuenta:\n- Durante el movimiento mantén las mirada fija en la kettlebell. \n- Mantén el brazo extendido perpendicularmente al suelo durante todo el ejercicio. \n- Imagina que es tu cuerpo el que se va metiendo debajo del peso.","v":"https://youtube.com/shorts/9ICibceYcdk","e":null,"h":5394,"t":4.0,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["cadera","rodillas","hombros"]},{"i":6019,"n":"Levantamiento turco con peso (izquierda)","d":"1. Colócate tumbado boca arriba, con el brazo que sostienes la kettlebell completamente estirado a 90º por encima de la cabeza. \n2. Flexiona la rodilla y apoya el pie (del mismo brazo que tienes estirado) en el suelo.\n3. Al mismo tiempo, utiliza el antebrazo del lado contrario para apoyarte en el suelo y elevar el tronco.\n4. Apoya la mano de ese brazo, despega la pierna que estaba estirada en el suelo para apoyar la rodilla y desde ahí, ponte de pie. \n5. Deshaz el movimiento hasta situarte en la posición inicial.\n\nTen en cuenta:\n- Durante el movimiento mantén las mirada fija en la kettlebell. \n- Mantén el brazo extendido perpendicularmente al suelo durante todo el ejercicio. \n- Imagina que es tu cuerpo el que se va metiendo debajo del peso.","v":"https://youtube.com/shorts/DIkECi_u-Ts","e":null,"h":5395,"t":4.0,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["cadera","rodillas","hombros"]},{"i":6020,"n":"Sentadilla búlgara (derecha)","d":"Colócate de espaldas a una silla, sofá o banco, a una zancada de distancia. Eleva el pie izquierdo hasta apoyarlo en la esquina de la silla. Desciende hasta que tu rodilla izquierda quede muy cerca del suelo. Si la rodilla derecha se adelanta mucho respecto a la punta de tus pies sepárate un poco más del banco (zancada más amplia). El torso debería mantenerse recto o ligeramente inclinado hacia adelante. Al subir, cadera y hombros se elevan a la vez.","v":"https://youtube.com/shorts/drJZTTCpOrQ","e":null,"h":null,"t":5.2,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":6021,"n":"Hollow hold","d":"","v":"https://youtube.com/shorts/YhIV7IjzV6I","e":null,"h":null,"t":2.5,"m":["recto mayor del abdomen","abdominales oblicuos","cuádriceps","psoas - iliaco"],"j":["cadera"]},{"i":6022,"n":"Dominada","d":"Cuélgate de la barra con agarre pronado (palmas mirando al frente), con una apertura un poco mayor de la altura de tus hombros, con los brazos totalmente estirados. \n\nDesde esta postura, intenta juntar las escápulas, tensando la parte superior de la espalda y elevando el pecho. Eleva ahora todo el cuerpo flexionando los codos, hasta que tu barbilla supere la barra. Desciende de manera controlada, hasta que tus brazos estén casi rectos y vuelve a subir. \n\n- No debes perder la tensión escapular durante el movimiento.\n- Toma aire en la bajada (o antes de empezar a subir) y expúlsalo en la subida.\n- Si no puedes realizar todavía una dominada, utiliza la versión con salto o utiliza una silla de apoyo, ayudándote con las piernas. Intenta utilizar cada vez menos las piernas y cada vez más el cuerpo superior.\n- No hagas kipping. No debería haber movimiento en el cuerpo inferior. Como mucho un poco de impulso para completar la última repetición si vas al límite.","v":"https://youtube.com/shorts/RUusb6fO82E","e":5617,"h":6027,"t":3.8,"m":["dorsales","trapecios","pectorales"],"j":["codos","hombros"]},{"i":6023,"n":"Squat con carga","d":"Sujeta la kettlebell o algún peso contra el pecho y colócate en la posición inicial de sentadilla: de pie, con los pies a la altura de los hombros y las puntas de los pies mirando ligeramente hacia fuera.\n\nDesde esta posición, lleva la cadera hacia atrás y flexiona las rodillas para descender, manteniendo el torso lo más recto que puedas, con una curvatura natural de la espalda. Desciende hasta que tus caderas bajen por debajo de tus rodillas, y regresa a la posición inicial.\n\nNotas:\n\n- Si no tienes kettlebell utiliza cualquier peso, por ejemplo un bidón de agua.\n\n- Al descender, las rodillas deberían ir por encima de los pies, no dejes que colapsen hacia dentro.\n\n- Juega con la posición de los pies. Algunas personas necesitan separarlos un poco más para poder bajar suficiente.\n\n- Los talones nunca se despegan del suelo, debes pensar en aplicar fuerza en ellos en la subida.\n\n- Mantén la mirada al frente y el pecho elevado.\n\n- Cada vez que subas debes extender completamente la cadera y rodillas antes de volver a bajar.","v":"https://youtube.com/shorts/TrlCuU5hamE","e":null,"h":null,"t":4.0,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":6024,"n":"Peso muerto 1 pierna (derecha)","d":"","v":"https://youtube.com/shorts/CjJDrSXH5vs","e":null,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},{"i":6025,"n":"Thruster con kettlebell izquierdo","d":"Coloca la kettlebell en posición de rack: codo pegado al cuerpo, muñeca recta y kettlebell descansando en el triángulo que forma tu brazo con el pecho.\n\nDesciende en una sentadilla normal (recuerda que tus Cadera deben bajar por debajo de tus rodillas) y explota como si fueras a saltar. Cuando tu cadera se abra completamente, la kettlebell empieza a subir, y simplemente completas el movimiento empujando la kettlebell hasta estirar completamente el brazo. Baja la kettlebell de manera controlada, y cuando está a punto de tocar el pecho de nuevo, empieza a descender para realizar la siguiente repetición. Esto amortigua el golpe y hace el movimiento más fluido.\n\nMantén el torso recto y los abdominales tensos. Inhala en la bajada y exhala en la subida.","v":"https://youtube.com/shorts/Q191Ch9R2UE","e":5615,"h":null,"t":5.0,"m":["cuádriceps","glúteos","deltoides","trapecios","dorsales"],"j":["cadera","rodillas","codos","tobillos"]},{"i":6026,"n":"Levantamiento turco (derecha)","d":"La posición inicial es tumbado, con el brazo derecho extendido, perpendicular al cuerpo.\n\nDesde esta posición, dobla la rodilla derecha y apoya completamente la planta del pie, no demasiado cerca de la cadera. Inicia el movimiento con los abdominales, levantando el torso lo suficiente para empezar a llevar tu peso al codo izquierdo y, como si estuvieras girando sobre él, levanta el tronco del suelo, liderando el movimiento con el pecho, no con la cabeza. Te apoyas primero en el codo, después en el antebrazo y finalmente en la palma de la mano, extendiendo completamente el brazo izquierdo hasta bloquear el codo. El codo derecho se mantiene completamente extendido durante todo el movimiento.\n\nAhora levanta la cadera, lo suficiente para cruzar por debajo la pierna izquierda, apoyándote en la rodilla, que quedaría debajo de ti. En este momento ambos brazos deberían estar alineados, cercanos a la perpendicular con el suelo. Despega la mano izquierda del suelo, endereza el torso, acerca el pie derecho y levántate. \n\nDesde esta postura, debes revertir el movimiento, apoyando la rodilla izquierda en el suelo, apoyando la mano izquierda, elevando la cadera para estirar la pierna izquierda, bajando la cadera al suelo y controlando la caída hacia atrás, hasta llegar a la posición inicial. Realiza las repeticiones indicadas por un lado y después por el otro.","v":"https://youtube.com/shorts/eF4dxieAut4","e":null,"h":null,"t":2.5,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":6027,"n":"Dominada con salto","d":"Versión más sencilla de la dominada. Se trata de aprovechar el impulso del salto inicial para elevar la barbilla por encima de la barra. En función de la altura de la barra puede que no tengas que soltarla en cada salto o que sí.\n\n- El agarre es pronado, con las palmas mirando al frente.\n- Intenta utilizar cada vez menos el impulso del salto y más la fuerza de los brazos.","v":"https://youtube.com/shorts/h-v6ScSUeyE","e":6022,"h":null,"t":3.5,"m":["dorsales","trapecios","tríceps","bíceps"],"j":["codos","hombros"]},{"i":6028,"n":"Peso muerto 1 pierna (izquierda)","d":"Estando de pie, con el cuerpo recto, eleva ligeramente el pie derecho y, manteniendo el torso recto y la pierna izquierda estirada, acerca el torso hacia el suelo, idealmente hasta que esté paralelo al suelo, y regresa a la posición inicial. Lleva la pierna derecha hacia atrás para actuar como contrapeso, manteniéndola alineada con el torso durante el movimiento.\n\n- Si no tienes suficiente flexibilidad, puedes flexionar ligeramente la rodilla de la pierna de apoyo.\n- Si te resulta muy fácil, carga algún peso con las manos para hacerlo más desafiante.","v":"https://youtube.com/shorts/hhIn9-JrQl4","e":null,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},{"i":6029,"n":"Molino con peso (derecha)","d":"","v":"https://youtube.com/shorts/1DVNc2Ise1M","e":5647,"h":null,"t":2.5,"m":["isquiotibiales","gemelos","glúteos"],"j":["cadera","hombros","rodillas"]},{"i":6031,"n":"Push press (derecha)","d":"Coloca la kettlebell en posición de rack: codo pegado al cuerpo, muñeca recta y kettlebell descansando en el triángulo que forma tu brazo con el pecho. \n\nEn vez de empezar empujando con los hombros, debes impulsarte primero con las piernas, doblando ligeramente las rodillas (¼ de sentadilla), y abriendo la cadera de manera explosiva. Es este empuje del cuerpo inferior el que lanza la kettlebell hacia arriba inicialmente. El hombro empieza a empujar cuando la cadera se ha extendido completamente y la kettlebell está ‘flotando’ en el aire, no antes. Cuando la kettlebell pasa el nivel de los ojos, adelanta ligeramente el torso. Al igual que en el press, en la posición final el codo debe bloquearse y las rodillas estar completamente extendidas.","v":"https://youtube.com/shorts/ijQbsM-wWW8","e":5605,"h":null,"t":3.8,"m":["deltoides","trapecios","dorsales"],"j":["codos","hombros","rodillas"]},{"i":6032,"n":"Flow b","d":"Antes de empezar, revisa bien el video y practica la secuencia. Te costará un poco al principio, pero pronto la interiorizarás.","v":"https://youtube.com/shorts/zllyQs_UxBU","e":null,"h":null,"t":3.2,"m":["cuádriceps","glúteos","abductores","abdominales","tríceps"],"j":["hombros","cadera","tobillos","rodillas","muñecas","codos"]},{"i":6033,"n":"Flow c","d":"Antes de empezar, revisa bien el video y practica la secuencia. Te costará un poco al principio, pero pronto la interiorizarás.","v":"https://youtube.com/shorts/bYhOwkjSSiA","e":null,"h":null,"t":3.2,"m":["cuádriceps","glúteos","abductores","abdominales","tríceps"],"j":["hombros","cadera","tobillos","rodillas","muñecas","codos"]},{"i":6034,"n":"Flow d","d":"Antes de empezar, revisa bien el video y practica la secuencia. Te costará un poco al principio, pero pronto la interiorizarás.","v":"https://youtube.com/shorts/oI9heH4zeSk","e":null,"h":null,"t":3.2,"m":["cuádriceps","glúteos","abductores","abdominales","tríceps"],"j":["hombros","cadera","tobillos","rodillas","muñecas","codos"]},{"i":6035,"n":"Flow e","d":"Antes de empezar, revisa bien el video y practica la secuencia. Te costará un poco al principio, pero pronto la interiorizarás.","v":"https://youtube.com/shorts/eFWNKGw6Bmk","e":null,"h":null,"t":3.2,"m":["cuádriceps","glúteos","abductores","abdominales","tríceps"],"j":["hombros","cadera","tobillos","rodillas","muñecas","codos"]},{"i":6036,"n":"Molino con peso (izquierda)","d":"","v":"https://youtube.com/shorts/79JNfTA_GVg","e":5661,"h":null,"t":2.5,"m":["isquiotibiales","gemelos","glúteos"],"j":["cadera","hombros","rodillas"]},{"i":6037,"n":"Sentadilla con anillas","d":"Ajusta las anillas a la altura de tus caderas o un poco por encima. Agárralas y da uno o dos pasos hacia atrás. \nDesde aquí lleva el peso del cuerpo hacia atrás y flexiona las rodillas a la vez que estiras los brazos, hasta acercar todo lo posible la cadera al suelo. Empuja ahora con las piernas para regresar a la posición inicial, utilizando el mínimo apoyo posible de tus brazos.\n\nNotas sobre la técnica:\n\n- Las caderas deberían bajar por debajo de la altura de tus rodillas.","v":"https://youtube.com/shorts/KXrSfhcwPv4","e":null,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":6038,"n":"Sentadilla pistolero con anillas","d":"Ajusta las anillas a la altura de tus caderas o un poco por encima. Agárralas y da uno o dos pasos hacia atrás. \nDesde aquí, eleva primero la pierna derecha hacia delante (sin doblar la rodilla), lleva el peso del cuerpo hacia atrás y flexiona la rodilla izquierda a la vez que estiras los brazos, hasta acercar todo lo posible la cadera al suelo. La pierna derecha debe quedar estirada, por delante del cuerpo, paralela al suelo. Empuja ahora con la pierna izquierda para regresar a la posición inicial, utilizando el mínimo apoyo posible de tus brazos.\nCambia de pierna y repite el ejercicio por el otro lado, alternando piernas en cada repetición.\n\nNotas sobre la técnica:\n\n- Para hacer el ejercicio más demandante da un pequeño salto para cambiar de una pierna a otra al final de cada repetición.","v":"https://youtube.com/shorts/ibwTwiJKBrM","e":null,"h":null,"t":3.6,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},{"i":6039,"n":"Isométrico en L 1","d":"Ajusta las anillas para que estén ligeramente por encima de la altura de tus caderas. Agárralas con ambas manos y estira completamente tus brazos, manteniendo el pecho elevado, los hombros hacia atrás y hacia abajo, con ligera rotación externa. El cuerpo debería estar completamente recto, con las puntas de los pies apuntando al suelo. \nDesde aquí flexiona las rodillas y acércalas lo más posible al pecho. Aguanta esta posición el tiempo indicado.\n\nNotas sobre la técnica:\n\n- Mantén los hombros hacia atrás y hacia abajo.\n- Mantén el pecho elevado y la espalda recta.\n- Intenta que la cadera no se vaya hacia atrás. Debería estar entre las anillas.","v":"https://youtube.com/shorts/P7dVlx9tSj8","e":5694,"h":null,"t":4.0,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas"]},{"i":6040,"n":"Fly invertido 1","d":"Ajusta las anillas para que queden a la altura de tu pecho aproximadamente. Agarra las anillas y da un paso atrás. Deja caer tu cuerpo hacia atrás, manteniéndolo recto, hasta estirar completamente los brazos. Esta es la posición inicial.\n\nDesde aquí abre los brazos hacia los lados, sin flexionar los codos, hasta que estén alineados entre sí y con tu espalda superior, formando un T. Regresa de manera controlada a la posición inicial y realiza las repeticiones indicadas.\n\nNotas sobre la técnica:\n\n- Los brazos deben permanecer rectos durante todo el movimiento.\n- Evita impulsarte con el cuerpo, utiliza la fuerza de tus brazos y espalda.\n- Mantén el pecho elevado, no dejes que colapse.\n\nModificaciones:\n\n- Además de ajustar la altura de las anillas, puedes acercarte o alejarte un poco más de las anillas para graduar la dificultad.","v":"https://youtube.com/shorts/iBwfs0OL1m4","e":5709,"h":null,"t":3.0,"m":["deltoides","dorsales","recto mayor del abdomen"],"j":["codos","hombros","muñecas"]},{"i":6041,"n":"Elevación de cadera en anillas","d":"Ajusta las anillas a la altura de tus rodillas. Túmbate en el suelo boca arriba, colocando la planta de los pies dentro de las anillas, de tal manera que tus muslos queden perpendiculares al suelo (o casi). \nDesde aquí eleva la cadera todo lo que puedes, empujando con los talones, y regresa a la posición inicial. Repita el número de veces indicado.\n\nModificaciones:\n\n- Para hacerlo más difícil utiliza una pierna de cada vez.","v":"https://youtube.com/shorts/LyIea0b49vk","e":null,"h":null,"t":3.2,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},{"i":6042,"n":"Sentadilla búlgara con anillas (izquierda)","d":"Ajusta una anilla a la altura de tu rodilla o ligeramente por encima. Colócate de espaldas a la anilla, como a un paso de distancia, y coloca el empeine del pie derecho por dentro de la anilla.\nDesde esta posición, flexiona la rodilla izquierda, descendiendo el torso hacia el suelo. Cuando la rodilla derecha se acerque al suelo, empuja con la pierna izquierda para regresar a la posición de partida.\n\nNotas sobre la técnica:\n\n- Si la rodilla adelantada sobrepasa mucho la punta del pie, adelanta el pie.\n- Intenta no hacer fuerza con la pierna colocada en la anilla.","v":"https://youtube.com/shorts/mi9BI3_FCvk","e":null,"h":null,"t":5.2,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":6043,"n":"Peso muerto 1 pierna con KB","d":"1. Colócate de pie con una kettlebell cogida con las dos manos y los brazos extendidos, los pies separados a una distancia equivalente a la de nuestros hombros y mirando al frente. \n2. Flexiona una de tus piernas y llevándola hacia atrás, quedando en equilibrio sobre la otra pierna.\n3. Desde esa posición, lleva la pierna elevada hacia atrás mientras la extiendes completamente, a la vez que bajas el tronco y apoyas las manos en el suelo, sin flexionar los brazos.\n4. Realiza el movimiento inverso, y apoya de nuevo la pierna en el suelo regresando a la posición inicial.\n5. Repite el movimiento cambiando la pierna de apoyo.\n\nTen en cuenta: \n\n- Mantén la espalda recta en todo momento.\n- Si no tienes flexibilidad, puedes doblar ligeramente la pierna de apoyo. \n- Cada flexión hacia atrás es una repetición.","v":"https://youtube.com/shorts/5hCNNHZKpp4","e":null,"h":5274,"t":4.0,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},{"i":6044,"n":"Peso muerto 1 pierna con KB (derecha)","d":"1. Colócate de pie con una kettlebell cogida con las dos manos y los brazos extendidos, los pies separados a una distancia equivalente a la de nuestros hombros y mirando al frente. \n2. Flexiona una de tus piernas y llevándola hacia atrás, quedando en equilibrio sobre la otra pierna.\n3. Desde esa posición, lleva la pierna elevada hacia atrás mientras la extiendes completamente, a la vez que bajas el tronco y apoyas las manos en el suelo, sin flexionar los brazos.\n4. Realiza el movimiento inverso, y apoya de nuevo la pierna en el suelo regresando a la posición inicial.\n\n\nTen en cuenta: \n\n- Mantén la espalda recta en todo momento.\n- Si no tienes flexibilidad, puedes doblar ligeramente la pierna de apoyo. \n- Cada flexión hacia atrás es una repetición.","v":"https://youtube.com/shorts/iI1FYaUIYHA","e":null,"h":5408,"t":4.0,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},{"i":6045,"n":"Peso muerto 1 pierna con KB (izquierda)","d":"1. Colócate de pie con una kettlebell cogida con las dos manos y los brazos extendidos, los pies separados a una distancia equivalente a la de nuestros hombros y mirando al frente. \n2. Flexiona una de tus piernas y llevándola hacia atrás, quedando en equilibrio sobre la otra pierna.\n3. Desde esa posición, lleva la pierna elevada hacia atrás mientras la extiendes completamente, a la vez que bajas el tronco y apoyas las manos en el suelo, sin flexionar los brazos.\n4. Realiza el movimiento inverso, y apoya de nuevo la pierna en el suelo regresando a la posición inicial.\n\n\nTen en cuenta: \n\n- Mantén la espalda recta en todo momento.\n- Si no tienes flexibilidad, puedes doblar ligeramente la pierna de apoyo. \n- Cada flexión hacia atrás es una repetición.","v":"https://youtu.be/gG82S0iHYZI","e":null,"h":5409,"t":4.0,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]}];

function animFor(name){const n=nz(name||'');for(const id of ['taps','box','saltosent','aust','flex','tric','cuerda','pallof','transp','plank','sit','dips','lunge','push','dom']){if(ANIM[id].k.some(k=>n.includes(k)))return id}return null}
const CS='#ff6a3d',CP='#1d2535',CK='#f0c29a',CH='#2a1d18';

 return `<svg viewBox="0 0 180 150" id="fig" data-a="${idStr}" data-l="${esc((labels||[]).join('|'))}"><line x1="4" y1="141" x2="176" y2="141" stroke="#3a4556" stroke-width="2"/><ellipse id="shd" cx="90" cy="141" rx="34" ry="3.5" fill="#000" opacity=".35"/>${props}

const ez=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function poseAt(A,ms){const fr=A.fr;let tot=0;fr.forEach(f=>tot+=f[1]);let t=ms%tot,i=0;while(t>fr[i][1]){t-=fr[i][1];i++}
 const a=fr[i][0],b=fr[(i+1)%fr.length][0],u=ez(t/fr[i][1]),o={};
 for(const k of ['h','s','e','a','p','k','f'])o[k]=[a[k][0]+(b[k][0]-a[k][0])*u,a[k][1]+(b[k][1]-a[k][1])*u];
 if(a.k2){for(const k of ['k2','f2'])o[k]=[a[k][0]+(b[k][0]-a[k][0])*u,a[k][1]+(b[k][1]-a[k][1])*u]}
 if(a.r!=null)o.r=a.r+(b.r-a.r)*u;return o}
const L=(a,b,c)=>`M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`+(c?`L${c[0].toFixed(1)} ${c[1].toFixed(1)}`:'');
const pt=(a,t,b)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function applyPose(svg,A,p){const q=id=>svg.querySelector('#'+id),D=(id,d)=>q(id).setAttribute('d',d);
 const lg=(pre,off)=>{const kn=pre==='f'&&p.k2?p.k2:p.k,ft=pre==='f'&&p.k2?p.f2:p.f,m=pt(p.p,.55,kn);
  const sh=(x)=>[x[0]+off,x[1]];D(pre+'_th',L(sh(p.p),sh(m)));D(pre+'_sh',L(sh(kn),sh(ft)));
  if(pre==='f'){D('f_th',L(sh(p.p),sh(kn)))}else{D('n_th',L(p.p,m));D('n_sh',L(p.k,p.f))}
  D(pre+'_sw',L(sh(ft),[ft[0]+off+7,ft[1]+(p.f[1]>135?0:2)]))};
 // far leg (full thigh in shorts colour to knee), near leg
 const fk=p.k2||p.k,ff=p.k2?p.f2:p.f;
 D('f_th',L([p.p[0]-5,p.p[1]],[fk[0]-5,fk[1]]));D('f_sh',L([fk[0]-5,fk[1]],[ff[0]-5,ff[1]]));D('f_sw',L([ff[0]-5,ff[1]],[ff[0]+2,ff[1]]));
 const m=pt(p.p,.6,p.k);D('n_th',L(p.p,m));D('n_sh',L(m,p.k,p.f));D('n_sw',L(p.f,[p.f[0]+8,p.f[1]]));
 D('f_ua',L([p.s[0]-5,p.s[1]],[p.e[0]-5,p.e[1]]));D('f_fa',L([p.e[0]-5,p.e[1]],[p.a[0]-5,p.a[1]]));
 D('tr',L(p.s,p.p));D('n_ua',L(p.s,p.e));D('n_fa',L(p.e,p.a));D('nk',L(p.s,p.h));
 const hn=q('hn');hn.setAttribute('cx',p.a[0]);hn.setAttribute('cy',p.a[1]);
 q('hd').setAttribute('cx',p.h[0]);q('hd').setAttribute('cy',p.h[1]);
 const cx=p.h[0],cy=p.h[1],r=9.4,pp=th=>[cx+r*Math.cos(th*Math.PI/180),cy-r*Math.sin(th*Math.PI/180)];
 const a1=pp(75),a2=pp(235);q('hr').setAttribute('d',`M${a1[0].toFixed(1)} ${a1[1].toFixed(1)}A${r} ${r} 0 0 0 ${a2[0].toFixed(1)} ${a2[1].toFixed(1)}Z`);
 const sx=(p.p[0]+p.s[0])/2;q('shd').setAttribute('cx',sx);
 q('bd').setAttribute('d',A.band?L(p.a,A.band):'');const wt=q('wt');if(A.w){wt.setAttribute('visibility','visible');wt.setAttribute('x',p.a[0]-6);wt.setAttribute('y',p.a[1]-2)}
 q('rp').setAttribute('d',p.r!=null?`M${p.a[0]} ${p.a[1]}C${p.a[0]+52} ${p.r},${p.a[0]-52} ${p.r},${p.a[0]} ${p.a[1]}`:'')}
function animLoop(ts){requestAnimationFrame(animLoop);const svg=document.getElementById('fig');if(!svg)return;
 if(typeof G!=='undefined'&&G&&G.paused)return;
 const ids=svg.dataset.a.split('|'),n=ids.length;let ix=0;if(n>1){ix=Math.floor(ts/4200)%n;if(svg.dataset.cur!==String(ix)){svg.dataset.cur=ix;svg.querySelectorAll('.pr').forEach(g=>g.style.display=(+g.dataset.i===ix)?'':'none');const lb=document.getElementById('vl');if(lb)lb.textContent=(ix+1)+'/'+n+' · '+(svg.dataset.l.split('|')[ix]||'')}}
 const A=ANIM[ids[ix]];applyPose(svg,A,poseAt(A,ts))}
