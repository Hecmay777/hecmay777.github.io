icultad.","v":"https://youtube.com/shorts/EoQfO0V1ag8","e":null,"h":null,"t":3.2,"m":["recto mayor del abdomen","abdominales oblicuos","cuádriceps","deltoides"],"j":["hombros","cadera","rodillas"]},{"i":5715,"n":"Skin the cat 1","d":"Ajusta las anillas para que queden por encima de la altura de tu cadera. Agarra las anillas a ambos lados de tu cuerpo, con las palmas de las manos mirando hacia atrás, y lleva el torso hacia el suelo, hasta que tus brazos estén totalmente estirados detrás de ti, y tu torso formando un ángulo de unos 90° con tus piernas.\nDesde esta posición inicial, empuja con las piernas para ir estirando el cuerpo, llevando el peso hacia delante, a la vez que rotas las manos para que terminen mirando hacia los lados. Revierte el movimiento para regresar a la posición inicial.\n\nNotas sobre la técnica:\n\n- Haz el movimiento de manera controlada. \n- En la posición final debes notar cómo se estiran los Deltoides y bíceps.","v":"https://youtube.com/shorts/RYFzFii2fiw","e":5716,"h":null,"t":2.3,"m":["pectorales","dorsales","bíceps","tríceps"],"j":["hombros"]},{"i":5716,"n":"Skin the cat 2","d":"Ajusta las anillas para que al colgarte de ellas, con tus brazos y piernas totalmente estiradas, tus pies no toquen el suelo. Si no puedes elevar tanto las anillas, dobla las piernas para que no se apoyen en el suelo.\nDesde esta posición, flexiona las rodillas y eleva las piernas, girando el torso hacia atrás para pasar las piernas entre las anillas. Continúa girando hasta que tu torso esté paralelo al suelo, y estira las piernas para que las puntas de los pies apunten al suelo. Revierte el movimiento para regresar a la posición inicial.\n\nNotas sobre la técnica:\n\n- Haz el movimiento de manera controlada. \n- En la posición final debes notar cómo se estiran los Deltoides y bíceps. Intenta que las palmas de las manos roten durante el movimiento para terminar mirando hacia atrás.\n\nModificaciones:\n\n- Para simplificar el ejercicio coloca las anillas a una altura que te permita colocar la pierna en el suelo al dar la vuelta, apoyándote en ella para girar de regreso.\n- Para hacer el ejercicio más difícil estira las piernas.","v":"https://youtube.com/shorts/ttJ0zBj1LLM","e":null,"h":null,"t":3.2,"m":["pectorales","dorsales","bíceps","tríceps"],"j":["hombros"]},{"i":5717,"n":"Fondos en L en anillas","d":"Este ejercicio combina en realidad dos ejercicios anteriores, haciéndolo muy completo.\nAjusta las anillas para que queden por encima de tus Cadera. Agarra las anillas a ambos lados del cuerpo. \nManteniendo el torso perpendicular al suelo y las piernas rectas alineadas con el cuerpo (o ligeramente dobladas para que no toquen el suelo), empuja con los brazos hasta estirarlos completamente. Esta es la posición de partida.\nDesde aquí, flexiona los codos para que el torso descienda (sin inclinar mucho el torso hacia delante), hasta que tus tríceps estén paralelos al suelo, y empuja para regresar a la posición de partida, momento en el cual elevas las piernas para estirarlas delante de ti, quedando paralelas al suelo. Aguanta esta posición un segundo, baja las piernas y repite el movimiento completo el número de veces indicado.\n\nNotas sobre la técnica:\n\n- Mantén los codos cerca del cuerpo durante todo el movimiento.\n- No dejes que tu cuello se hunda entre los Deltoides, tensa la espalda superior.\n- No dobles las muñecas, deben estar alineadas con los antebrazos.\n- Las piernas no deben tocar el suelo al descender. Para ello, eleva un poco más las anillas o dobla ligeramente las piernas.\n\nModificaciones:\n\n- Si no puedes estirar las piernas al final del movimiento dobla las rodillas y acércalas al pecho.","v":"https://youtube.com/shorts/7rhV1QH_POs","e":null,"h":null,"t":4.2,"m":["dorsales","tríceps","trapecios"],"j":["codos","hombros","muñecas"]},{"i":5718,"n":"Inversión encogida a dominada","d":"Ajusta las anillas para que al colgarte de ellas, con tus brazos estirados y piernas flexionadas delante de ti (rodillas hacia el pecho), tus pies no toquen el suelo. Las palmas de las manos están enfrentadas (agarre neutro).\n\nGira el torso hacia atrás hasta que tu cabeza esté apuntando al suelo. Desde esta posición empieza a bajar las piernas (girando el torso en sentido contrario) a la vez que flexionas las codos y rotas las anillas, para que tus palmas miren hacia ti, quedando tu cabeza a la altura de las anillas. Aguanta esta posición 1-2 segundos y estira los brazos para regresar a la posición inicial y realizar la siguiente repetición.\n\nNotas sobre la técnica:\n\n- Mantén la tensión abdominal durante todo el movimiento.","v":"https://youtube.com/shorts/AV8lB6Jxi1Q","e":null,"h":null,"t":4.2,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas"]},{"i":5719,"n":"Pino encogido 1","d":"Coloca las anillas a un palmo del suelo o un poco más arriba. Agarra las anillas y pon tu cuerpo en forma de V invertida, con tu cadera formando un ángulo de 90°, manteniendo las anillas cerca del pecho. \nDesde aquí, flexiona la rodilla derecha para acercar el pie a tu cadera. Aguanta la posición 2-3 segundos y regresa el pie al suelo, elevando ahora el pie contrario. Aguanta 2-3 segundos con el otro pie y repite, alternando lados hasta cumplir el tiempo indicado.\n\nNotas sobre la técnica:\n\n- Mantén los Deltoides cerca de las anillas y los codos cerca del cuerpo para facilitar el soporte.\n- Mantén la tensión abdominal y la espalda recta.\n\nModificaciones:\n\n- Intenta poco a poco elevar ambos pies a la vez, hasta que estés listo para el siguiente nivel del ejercicio.","v":"https://youtube.com/shorts/e_luzRHM37s","e":5720,"h":null,"t":3.2,"m":["cuádriceps","recto mayor del abdomen","deltoides"],"j":["rodillas","cadera"]},{"i":5720,"n":"Pino encogido 2","d":"Coloca las anillas a un palmo del suelo o un poco más arriba. Agarra las anillas y pon tu cuerpo en forma de V invertida, con tu cadera formando un ángulo de 90°, manteniendo las anillas cerca del pecho.\nDesde aquí, lleva el peso de tu cuerpo hacia tus Deltoides y eleva los pies de manera controlada, flexionando las rodillas hasta que tus pies se acerquen a tu cadera. Aguanta la posición el tiempo indicado.\n\nNotas sobre la técnica:\n\n- Mantén los Deltoides cerca de las anillas y los codos cerca entre sí para facilitar el soporte.\n- Mantén la tensión abdominal y la espalda recta.\n- Si no puedes mantener la postura el tiempo indicado, apoya los pies e inténtalo de nuevo.","v":"https://youtube.com/shorts/iydkNRXT-qw","e":null,"h":5719,"t":4.2,"m":["cuádriceps","recto mayor del abdomen","deltoides"],"j":["rodillas","cadera"]},{"i":5721,"n":"Isométrico encogido a pino","d":"Coloca las anillas a un palmo del suelo o un poco más arriba. Apóyate en las anillas y lleva tus rodillas hacia tu pecho, aguantando la posición un par de segundos. De manera controlada gira el torso para pasar las piernas entre las anillas, y una vez que tus piernas crucen las anillas flexiona los codos y baja los Deltoides hacia las manos, mientras sigues girando el torso y elevando los pies. Aguanta también esta posición un par de segundos e invierte el movimiento para regresar a la posición inicial.\n\nNotas sobre la técnica:\n\n- Al pasar los pies por detrás de las anillas piensa en elevar las Cadera y llevar las rodillas a los codos.\n- En esta fase del movimiento mantén las anillas lo más cerca que puedas, debajo del pecho.","v":"https://youtube.com/shorts/0k8BGVDIdqg","e":null,"h":null,"t":4.5,"m":["recto mayor del abdomen","deltoides","bíceps"],"j":["hombros","cadera","rodillas","tobillos"]},{"i":5722,"n":"Isométrico L a dominada","d":"Ajusta las anillas para que al colgarte de ellas, con tus codos flexionados y piernas rectas delante de ti (L-sit), tu cadera tenga al menos 50-60 cm por debajo. Las palmas de las manos están mirando hacia ti (agarre supino).\n\nManteniendo el ángulo de 90° entre tus piernas y tu torso gira el cuerpo hacia atrás, de manera controlada, a la vez que estiras los brazos, hasta terminar con el torso paralelo al suelo y la cabeza hacia abajo (estiramiento germano). A medida que elevas las piernas vas girando las anillas, para que en esta posición final estén enfrentadas (agarre neutro) o ligeramente mirando hacia atrás. Ahora giras el torso en sentido contrario, manteniendo las piernas rectas, a la vez que vas girando las anillas y flexionando los codos para terminar en la posición inicial (L-sit y codos flexionados con palmas hacia ti). Desde esta posición realizas la siguiente repetición.\n\nModificaciones:\n\n- Si no puedes mantener las piernas estiradas dobla las rodillas y acércalas a tu cuerpo.","v":"https://youtube.com/shorts/CDumfJ68LPg","e":null,"h":null,"t":4.8,"m":["recto mayor del abdomen","deltoides","bíceps"],"j":["hombros","cadera","rodillas","muñecas"]},{"i":5723,"n":"Cuelgue agarre falso extendido","d":"El agarre falso es muy importante para ejercicios avanzados como el muscle-up. En este tipo de agarre la anilla cruza tu mano, apoyándose en la zona pegada a tu dedo pulgar y en la parte interna de la muñeca.\n\nAl principio es muy incómodo, ya que las muñecas no están acostumbradas a soportar peso en esa posición, y es normal notar dolor hasta que se acostumbran los tejidos. Por este motivo debes progresar poco a poco.\n\nInicialmente intenta simplemente aguantar colgado con este agarre el tiempo indicado.\n\nModificaciones:\n\n- Si no puedes soportar todo tu peso con este agarre baja las anillas y apoya los pies en el suelo (por ejemplo con las piernas estiradas delante de ti y apoyando los talones), llevando cada vez más peso hacia el agarre.\n\n- Si se te resbala el agarre prueba a rodear la zona baja de la anilla con esparadrapo.","v":"https://youtube.com/shorts/7nHDKnAo2cw","e":null,"h":null,"t":2.5,"m":["pronadores","supinadores"],"j":["muñecas"]},{"i":5724,"n":"Cuelgue agarre falso Flexiónado","d":"El agarre falso es muy importante para ejercicios avanzados como el muscle-up. En este tipo de agarre la anilla cruza tu mano, apoyándose en la zona pegada a tu dedo pulgar y en la parte interna de la muñeca.\n\nAl principio es muy incómodo, ya que las muñecas no están acostumbradas a soportar peso en esa posición, y es normal notar dolor hasta que se acostumbran los tejidos. Por este motivo debes progresar poco a poco. \n\nInicialmente intenta simplemente aguantar colgado con este agarre el tiempo indicado, manteniendo los codos flexionados.\n\nModificaciones:\n\n- Si no puedes soportar todo tu peso con este agarre baja las anillas y apoya los pies en el suelo (por ejemplo con las piernas estiradas delante de ti y apoyando los talones), llevando cada vez más peso hacia el agarre.\n\n- Si se te resbala el agarre prueba a rodear la zona baja de la anilla con esparadrapo.","v":"https://youtube.com/shorts/gtDVTOKjLdI","e":null,"h":null,"t":2.8,"m":["pronadores","supinadores"],"j":["muñecas"]},{"i":5725,"n":"Sentadilla búlgara con anillas (derecha)","d":"Ajusta una anilla a la altura de tu rodilla o ligeramente por encima. Colócate de espaldas a la anilla, como a un paso de distancia, y coloca el empeine del pie derecho por dentro de la anilla.\nDesde esta posición, flexiona la rodilla izquierda, descendiendo el torso hacia el suelo. Cuando la rodilla derecha se acerque al suelo, empuja con la pierna izquierda para regresar a la posición de partida.\nRealiza todas las repeticiones por un lado y después por el otro.\n\nNotas sobre la técnica:\n\n- Si la rodilla adelantada sobrepasa mucho la punta del pie, adelanta el pie.\n- Intenta no hacer fuerza con la pierna colocada en la anilla.","v":"https://youtube.com/shorts/bENgwHp9h6Y","e":null,"h":null,"t":5.2,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5726,"n":"Dominada agarre falso","d":"El agarre falso es muy importante para ejercicios avanzados como el muscle-up. En este tipo de agarre la anilla cruza tu mano, apoyándose en la zona pegada a tu dedo pulgar y en la parte interna de la muñeca.\n\nAl principio es muy incómodo, ya que las muñecas no están acostumbradas a soportar peso en esa posición, y es normal notar dolor hasta que se acostumbran los tejidos. Por este motivo debes progresar poco a poco.\n\nCon el agarre falso, flexiona los codos intentando llevar las anillas al pecho. Cuanto más puedas elevar los Deltoides por encima de las manos mejor, ya que te será así más fácil la transición posterior hacia el muscle-up.\n\nNotas sobre la técnica:\n\n- Mantén el cuerpo recto durante el movimiento (con tensión abdominal).\n- No subas totalmente vertical. Tus piernas deberían estar ligeramente adelantadas y el torso un poco hacia atrás. De esta manera te será más fácil pivotar hacia el muscle-up posterior.\n\nModificaciones:\n\n- Si no puedes soportar todo tu peso con este agarre baja las anillas y apoya los pies en el suelo, o haz remo con agarre falso.","v":"https://youtube.com/shorts/1crmzgv17NI","e":null,"h":null,"t":3.8,"m":["deltoides","bíceps","pectorales","recto mayor del abdomen"],"j":["codos","hombros"]},{"i":5727,"n":"Muscle-up asistida","d":"Ajusta las anillas a la altura del pecho. Agárralas con ambas manos, usando agarre falso, y estira completamente los brazos para llevar el cuerpo hacia atrás, manteniendo las plantas de los pies en el suelo y las rodillas flexionados. \nDesde aquí dobla los brazos para llevar tu pecho entre las anillas, momento en el que las giras hacia fuera para apoyarte en ellas, enderezar el torso y hacer el dip o fondo en anillas, elevando los pies del suelo. De manera controlada desciende del dip, gira las anillas en sentido contrario y déjate caer despacio hacia la posición inicial, para realizar la siguiente repetición.\n\nNotas sobre la técnica:\n\n- Recuerda utilizar el agarre falso.\n- Intenta apoyarte cada vez menos en las piernas para hacer el dip. El objetivo es fortalecer el empuje desde un punto cada vez más bajo.","v":"https://youtube.com/shorts/C9QLPkZQubQ","e":null,"h":null,"t":3.8,"m":["abdominales","bíceps","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},{"i":5728,"n":"Muscle-up 1","d":"Ajusta las anillas a la altura del pecho. Agárralas con ambas manos, usando agarre falso, y estira completamente los brazos para llevar el cuerpo hacia atrás, manteniendo las plantas de los pies en el suelo y las rodillas flexionados. \nDesde aquí dobla los brazos para llevar tu pecho entre las anillas, momento en el que las giras hacia fuera para apoyarte en ellas, manteniendo esta postura una fracción de segundo. Ahora déjate caer despacio hacia la posición inicial, para realizar la siguiente repetición.\n\nNotas sobre la técnica:\n\n- Recuerda utilizar el agarre falso.\n- En la posición final del ejercicio empuja hacia abajo las anillas. Esto te ayudará a ir fortaleciendo este rango de movimiento, importante para el siguiente nivel.","v":"https://youtube.com/shorts/saactRjApgQ","e":5729,"h":null,"t":4.0,"m":["abdominales","bíceps","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},{"i":5729,"n":"Muscle-up 2","d":"Ajusta las anillas para que al colgarte de ellas, con tus brazos y piernas totalmente estiradas, tus pies no toquen el suelo. Si no puedes subir tanto las anillas, eleva las piernas por delante de ti para que no se apoyen en el suelo.\nFlexiona los codos hasta que tus Deltoides superen la altura de tus manos y, sin pausa, adelanta el pecho y lleva la cadera hacia atrás, a la vez que rotas las anillas y empujas con las manos para elevar el torso por encima de las anillas, hasta bloquear los codos.\n\nNotas sobre la técnica:\n\n- Mantén las piernas rectas si es posible. Si las anillas no tienen suficiente altura estira las piernas delante de ti para no usarlas de apoyo.\n- Regresa de manera lenta y controlada a la posición inicial. \n- Si en vez de subir de manera totalmente vertical lo haces con cierto ángulo, te será más fácil la transición. Cuando tu cabeza supere las anillas, y a la vez que las giras, lleva el torso hacia delante y la cadera hacia atrás. Este impulso te ayudará en la transición, la parte más difícil del muscle-up.","v":"https://youtube.com/shorts/-zqtJTNh6uE","e":null,"h":5728,"t":4.8,"m":["abdominales","bíceps","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},{"i":5733,"n":"Paso lateral y mini squat, brazos arriba","d":"Dibujas una marca vertical en el suelo y te colocas de pie a un lado de la marca\nInspiras haciendo un paso lateral, pasando por encima de la marca, bajando a la mini-sentadilla mientras estiras los codos y brazos hacia arriba.\nAl exhalar, juntas los pies al otro lado de la marca estirando bien las rodillas volviendo a la posición inicial y bajando los brazos.\nRepite varias veces pasando a un lado y otro de la marca.\n\n**Tenn en cuenta:**\n\n- Ejercicio metabólico.\n- Puedes mantener los brazos hacia arriba durante todo el ejercicio o bien subirlos y bajarlos.","v":"https://youtube.com/shorts/AvnrkGpeh2U","e":5277,"h":5275,"t":2.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera","hombros"]},{"i":5734,"n":"De pie, el gato","d":"De pie, con las rodillas ligeramente flexionadas y las manos apoyados sobre las rodillas\nAl inspirar estiras toda la columna y miras hacia delante\nAl exhalar, arqueas la columna llevando el pubis hacia el ombligo, y la cabeza hacia la barriga","v":"https://youtube.com/shorts/a97lX0TTaw8","e":null,"h":null,"t":2.3,"m":["dorsales"],"j":["cadera"]},{"i":5758,"n":"Buceador","d":"Estírate en el suelo boca abajo con los brazos estirados por encima la cabeza. \nLevanta las piernas y los brazos del suelo simultáneamente.\nRealiza un movimiento de brazos como si estuvieras nadando en braza o pecho.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento en su máxima amplitud. \n- Mantén las piernas bien estiradas. \n- Relaja la región de la nuca y Deltoides.\n- Cuenta una repetición por brazada","v":"https://youtube.com/shorts/fJWXIRs7t_M","e":null,"h":null,"t":2.5,"m":["trapecios","deltoides"],"j":["hombros","codos"]},{"i":5759,"n":"Burpee roll","d":"La posición inicial es de pie. Desde aquí, agacha el cuerpo llevando las manos al suelo, a la vez que saltas con las piernas hacia atrás, colocándote en la posición inicial de plancha, con el cuerpo recto y apoyado en la punta de los pies.\nPasa uno de los brazos por debajo de tu pecho para rodar por el suelo.\nRealiza una flexión de brazos en su parte concéntrica, alejando el pecho al suelo todo lo que puedas. Al finalizar la flexión salta con los pies para colocarlos justo detrás de las manos, y toma impulso para realizar un salto hacia arriba. Da una palmada por encima de la cabeza.\n \n**Ten en cuenta:**\n \n- Mirada al frente.\n- Amortigua bien la caída pero no realices una flexión.\n- El pecho debe conectar con el suelo.\n- Cuando gires haz un apoyo suave sobre el hombro para no hacerte daño. \n- Cuando te levantes mantén las piernas lo más estiradas posible (sin doblar las rodillas).\n- Palmada detrás de la cabeza.\n-  Cuenta una repetición por burpee más giro.","v":"https://youtube.com/shorts/3sYAQgxIfok","e":null,"h":5236,"t":5.3,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},{"i":5761,"n":"Cuclillas iso","d":"Desde la posición de pie, espalda recta y sacando ligeramente el trasero hacia afuera flexiona cadera y rodillas unos #90º aproximadamente o hasta que tus muslos estén paralelos al suelo.\nMantén la posición.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Durante la flexión tus rodillas no deben rotar hacia adentro. \n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por segundo.","v":"https://youtube.com/shorts/I67jnFmphRk","e":null,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},{"i":5763,"n":"Escaleras y flexión","d":"Empieza en posición erguida. \nDobla la espalda hasta llevar las manos al el suelo lo más cerca posible de los pies manteniendo las piernas estiradas. \nDesde esta posición, da cuatro pasos con las manos separando las manos de los pies. \nRealiza una flexión\nVuelve atrás con las manos hasta la posición inicial y levanta el cuerpo hasta posición erguida.\n \n**Ten en cuenta:**\n\n- Mantén el abdomen apretado durante todo el ejercicio.\n- En la flexión toca con el pecho al suelo.\n- Mantén las piernas tan estiradas como puedas sin comprometer tus lumbares.\n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/_diicPh5cyA","e":null,"h":null,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},{"i":5764,"n":"Flexión y extensión de tobillos","d":"Siéntate en el suelo con una pierna estirada y ligeramente elevada. Realiza flexiones y extensiones del tobillo elevado. Realiza la mitad de las repeticiones y cambia de lado. \n\n**Ten en cuenta:**\n\n- Mantén  la espalda estirada.\n- Realiza el movimiento lentamente y en su máxima amplitud.\n- Cuenta una repetición por cada flexo-extensión.","v":"https://youtube.com/shorts/KdCXVeHekVs","e":null,"h":null,"t":2.3,"m":["flexores del pie","gemelos","sóleo"],"j":["tobillos"]},{"i":5765,"n":"Flexión tigre","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Desde aquí:\n\nImpúlsate con las manos para elevar el tronco manteniendo el cuerpo alineado y paralelo al suelo. \nDobla las rodillas, manteniendo los brazos extendidos, como si quisieras tocar los pies con tu trasero.\nExtiende las piernas otra vez, manteniendo los brazos estirados, hasta volver a la posición paralela al suelo.\nDobla los codos lentamente hasta tocar el suelo con tu pecho.\n\n**Ten en cuenta:**\n\n- Mirada al frente. \n- Tu cuerpo debe estar en completa línea recta. \n- Dobla las rodillas al máximo sin comprometer tus Deltoides.\n- El pecho debe conectar con el suelo.\n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/yYf1l4Uie1c","e":null,"h":null,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas","rodillas","cadera"]},{"i":5766,"n":"Flexión y extensión de muñecas","d":"Siéntate en el suelo. Extiende un brazo y realiza flexiones y extensiones de la muñeca elevada. Realiza la mitad de las repeticiones  y cambia de lado.\n\n**Ten en cuenta:**\n\n- Mantén  la espalda estirada.\n- Realiza el movimiento lentamente y en su máxima amplitud.\n- Cuenta una repetición por cada flexión y extensión.","v":"https://youtube.com/shorts/7LPKe3jGMc4","e":null,"h":null,"t":2.0,"m":["pronadores","supinadores"],"j":["muñecas"]},{"i":5767,"n":"Flexión molinos","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Desde aquí:\n\nImpúlsate con las manos para elevar el tronco manteniendo el cuerpo alineado y paralelo al suelo. \nLevanta el brazo izquierdo hasta llevarlo completamente perpendicular al suelo en un movimiento circular.\nVuelve a la posición paralela al suelo.\nDobla los codos lentamente hasta tocar el suelo con tu pecho.\n\nRepite el movimiento con el brazo derecho\n\n**Ten en cuenta:**\n\n- Mirada al frente. \n- Tu cuerpo debe estar en completa línea recta. \n- Cuando eleves el brazo abre el pecho lo máximo que puedas.\n- El pecho debe conectar con el suelo.\n- Cuenta una repetición por extensión de brazo.","v":"https://youtube.com/shorts/xTVpcI0AHjc","e":null,"h":null,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas","rodillas","cadera"]},{"i":5769,"n":"Gato a perro","d":"Colócate en posición cuadrúpeda, con las rodillas bajo las Cadera y las manos bajo los Deltoides, con los dedos abiertos. \n\nInspira a la vez que “alargas” el cuerpo, como intentando separar la cabeza por un lado (estira el cuello, alejando las orejas de los Deltoides) y el coxis por el otro, a la vez que mantienes el peso distribuido de manera homogénea entre manos y rodillas, presionando contra el suelo.\n\nAguanta esta posición unos segundos y, desde ahí, espira mientras encorvas la espalda y acercas la barbilla al pecho. \n\nA medida que curvas la espalda y escondes la cabeza debes contraer el abdomen, como intentando que los abdominales toquen la columna vertebral. Esto maximiza la contracción del transverso abdominal, tu faja natural. Si tu transverso es fuerte, estarás más protegido de lesiones.\n\n**Ten en cuenta:**\n\n- Sincroniza el movimiento a la respiración. \n- Cuenta una repetición cada vez que pasas por las 2 posiciones.","v":"https://youtube.com/shorts/udACzISXaig","e":null,"h":null,"t":2.3,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["muñecas","hombros","cadera","rodillas"]},{"i":5770,"n":"Lanzada adelante","d":"Sitúate con la Kettlebell entre las piernas coge impulso. Lánzala hacia delante como si hicieras un pase de rugby. \n\nA la vez que lanzas la kettlebell avanza un pie y retrasa otro mientras giras de manera que acabes el movimiento mirando al lado contrario de donde empezaste.\n\n**Ten en cuenta:**\n \n- Mira hacia adelante.\n- Realiza el movimiento los más amplio posible con la kettlebell.\n- Cuenta una repetición por lanzada.","v":"https://youtube.com/shorts/IcH9SHJj6dc","e":null,"h":null,"t":5.0,"m":["abdominales","lumbares","glúteos"],"j":["cadera","hombros"]},{"i":5771,"n":"Molinos paleo","d":"Sitúate boca arriba apoyado exclusivamente por las manos y los pies. Toma impulso y apóyate solo con un brazo mientras llevas el otro a la vertical. Cambia de brazo.\n\n**Ten en cuenta:**\n\n- Haz el ejercicio pausadamente.\n- mantén el trasero elevado todo el tiempo.\n- Cuenta una repetición por brazo.","v":"https://youtube.com/shorts/GHIn4wgKnmI","e":null,"h":null,"t":2.8,"m":["abdominales","lumbares","glúteos"],"j":["hombros","rodillas"]},{"i":5773,"n":"Pie a mano cruzada","d":"Túmbate boca arriba brazos en cruz. Flexiona un brazo junto a la pierna del lado contrario para conseguir tocar el pie con tu mano.\n\n**Ten en cuenta:**\n\n- Mantén brazo y pierna estirados en todo momento.\n- Vigila no tensar el cuello durante el movimiento. \n- Cuenta una repetición con cada toque de mano y pie.","v":"https://youtube.com/shorts/SfhvBGkNuxA","e":null,"h":null,"t":2.8,"m":["abdominales"],"j":["cadera"]},{"i":5774,"n":"Pistol en trx","d":"Estira los brazos a la altura del pecho sujetando el agarre de los TRX para mantener la tensión. Realiza el movimiento de sentadilla sobre una sola pierna equilibrándote con la otra pierna en extensión.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Durante la flexión tus rodillas no deben rotar hacia adentro.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por sentadilla.","v":"https://youtube.com/shorts/1AfqcJpdO64","e":null,"h":null,"t":3.6,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},{"i":5775,"n":"Plancha cadera","d":"Coloca el cuerpo boca abajo apoyando los antebrazos perpendiculares al cuerpo y las puntas de los pies en el suelo. \nMantén piernas, tronco y cabeza estirados en una línea paralela al suelo. \nGira el tronco hasta que tus Cadera toquen el suelo. Alterna los lados.\n\n**Ten en cuenta:**\n\n- Mira hacia adelante. \n- Mantén el core y los Glúteos activados.\n- Cuenta una repetición cada vez tus Cadera toquen el suelo.","v":"https://youtube.com/shorts/g_8UjLluvyM","e":null,"h":null,"t":2.6,"m":["abdominales","lumbares"],"j":["codos","hombros","tobillos"]},{"i":5777,"n":"Plancha molinos","d":"Coloca el cuerpo boca abajo apoyando los antebrazos y las puntas de los pies en el suelo. Mantén los antebrazos cruzados delante el pecho\nLevanta el brazo izquierdo hasta llevarlo completamente perpendicular al suelo en un movimiento circular.\nVuelve a la posición paralela al suelo.\n\n**Ten en cuenta:**\n\n- Mira hacia adelante. \n- Mantén el core y los Glúteos activados.\n- Cuando eleves el brazo abre el pecho lo máximo que puedas.\n- Alterna los lados.\n- Cuenta una repetición cada vez que levantes una mano.","v":"https://youtube.com/shorts/sklcQLCu81A","e":null,"h":null,"t":2.8,"m":["abdominales","lumbares"],"j":["hombros","codos","tobillos"]},{"i":5778,"n":"Press trx","d":"Sujeta los agarres del TRX mirando en dirección opuesta al punto de agarre y los brazos abiertos y flexionados un poco más arriba que el pecho dejando que los TRX queden justo encima los Deltoides\nDesde esta posición estira los brazos hasta que queden completamente extendidos delante tu pecho.\nFlexiona de nuevo los codos de forma controlada hasta llegar a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén el cuerpo lo más recto posible, tensando abdominales y Glúteos.\n- Realiza el ejercicio de forma controlada.\n- Alza los brazos para evitar que los TRX rasquen tus Deltoides o brazos.\n- Cambia la inclinación de tu cuerpo para graduar la intensidad del ejercicio.\n- Cuenta una repetición por extensión de brazos.","v":"https://youtube.com/shorts/cL7weDy2s98","e":null,"h":null,"t":3.2,"m":["deltoides","trapecios","dorsales"],"j":["codos","hombros"]},{"i":5780,"n":"Remo abierto en trx","d":"Sujeta los agarres del TRX e inclina tu cuerpo hacia atrás extendiendo los brazos hasta una posición que te sea cómoda. Desde esta posición:\n\nGira las muñecas para que tus manos miren hacia abajo. Flexiona los codos, manteniendo los brazos abiertos a la altura de tus Deltoides y llevando las manos cerca de tu pecho. \nRegresa lentamente a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén el cuerpo lo más recto posible, tensando abdominales y Glúteos.\n- Puedes graduar la dificultad del ejercicio cambiando la inclinación del cuerpo.\n- Cuenta una repetición por remada.","v":"https://youtube.com/shorts/Ma4LSMVASiM","e":null,"h":null,"t":3.2,"m":["deltoides","trapecios","dorsales"],"j":["codos","hombros"]},{"i":5781,"n":"Remo doble trx","d":"Sujeta los agarres del TRX e inclina tu cuerpo hacia atrás extendiendo los brazos hasta una posición que te sea cómoda. Desde esta posición:\n\nDobla los codos manteniendo los brazos enganchados al cuerpo hasta que tus manos toquen tu pecho.\nExtiende los brazos de forma controlada.\nGira las muñecas para que tus manos miren hacia abajo. Flexiona los codos, manteniendo los brazos abiertos a la altura de tus Deltoides y llevando las manos cerca de tu pecho. \nRegresa lentamente a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén el cuerpo lo más recto posible, tensando abdominales y Glúteos.\n- Puedes graduar la dificultad del ejercicio cambiando la inclinación del cuerpo.\n- Cuenta una repetición por cada dos remadas.","v":"https://youtube.com/shorts/6lNXygw5Rj0","e":null,"h":null,"t":3.5,"m":["deltoides","trapecios","dorsales"],"j":["codos","hombros"]},{"i":5782,"n":"Remo giro trx","d":"Sujeta los agarres del TRX e inclina tu cuerpo hacia atrás extendiendo los brazos hasta una posición que te sea cómoda. Desde esta posición:\n\nDobla los codos llevando las manos a un hombro. Esto hará que tu cuerpo gire sobre tu core.\nExtiende los brazos de forma controlada.\nAlterna costados.\n\n**Ten en cuenta:**\n\n- Mantén el cuerpo lo más recto posible, tensando abdominales y Glúteos.\n- Gira la cintura, no muevas los pies del suelo.\n- Puedes graduar la dificultad del ejercicio cambiando la inclinación del cuerpo.\n- Cuenta una repetición por remada.","v":"https://youtube.com/shorts/lsd3UtV_BEY","e":null,"h":null,"t":4.0,"m":["deltoides","trapecios","dorsales"],"j":["codos","hombros"]},{"i":5786,"n":"Tigre","d":"Empieza con las manos y los pies en el suelo. Mantén piernas, tronco y cabeza estirados en una línea paralela al suelo. Dobla las rodillas, manteniendo los brazos extendidos, como si quisieras tocar los pies con tu trasero. Extiende las piernas otra vez, manteniendo los brazos estirados, hasta volver a la posición paralela al suelo.\n\n**Ten en cuenta:**\n\n- Mirada al frente. \n- Tu cuerpo debe estar en completa línea recta. \n- Dobla las rodillas al máximo sin comprometer tus Deltoides.\n- El pecho debe conectar con el suelo.\n- Cuenta una repetición cada vez que vuelvas a la posición inicial.","v":"https://youtube.com/shorts/qWjiXI5cr5I","e":null,"h":null,"t":2.0,"m":["lumbares"],"j":["rodillas","cadera"]},{"i":5787,"n":"Tigre mckenzie","d":"Empieza con las manos y los pies en el suelo. Estira los brazos levantando tronco y cabeza pero dejando las piernas y Cadera en el suelo. Dobla las rodillas, manteniendo los brazos extendidos, como si quisieras tocar los pies con tu trasero. Extiende las piernas otra vez hasta volver a la posición paralela al suelo.\n\n**Ten en cuenta:**\n\n- Mirada al frente. \n- Dobla las piernas al máximo sin comprometer tu espalda.\n- Cuenta una repetición cada vez que vuelvas a la posición inicial.","v":"https://youtube.com/shorts/AygDPfZcY5E","e":null,"h":null,"t":2.5,"m":["lumbares"],"j":["rodillas","cadera"]},{"i":5789,"n":"Patada inferior","d":"Empieza apoyado en tus manos y las puntas de tus pies, con las piernas flexionadas para que tus rodillas estén justo debajo tu trasero.\n\nEleva ligeramente el pie izquierdo y la mano derecha y pivota tu cuerpo hacia la derecha pasando tu pierna por debajo tu cuerpo y extendiendola como si dieras una patada.\n\nVuelve a la posición original y repite el ejercicio hacia el otro lado.\n\n**Ten en cuenta:**\n\n- Mantén la tensión abdominal.\n- Realiza el movimiento con fluidez.\n- Cuenta una repetición por patada","v":"https://youtube.com/shorts/k5vXT0Sjs2o","e":null,"h":null,"t":2.5,"m":["glúteos"],"j":["rodillas","cadera","hombros"]},{"i":5790,"n":"Giro capoeira","d":"Empieza apoyado en tus manos y tus pies mirando hacia arriba, con las piernas flexionadas para que tus rodillas estén justo por encimade tu trasero y los brazos extendidos detrás tu espalda.\n\nEleva ligeramente el pie izquierdo y la mano derecha y pivota tu cuerpo sobre el eje de contacto con el suelo hasta quedar boca abajo. Coloca la mano derecha en el suelo.\n\nVuelve a la posición original y repite el ejercicio hacia el otro lado.\n\n**Ten en cuenta:**\n\n- Mantén la tensión abdominal.\n- Realiza el movimiento con fluidez.\n- Cuenta una repetición por giro.","v":"https://youtube.com/shorts/2l8_Knv0Wgs","e":null,"h":null,"t":2.0,"m":["abdominales"],"j":["hombros","rodillas","cadera"]},{"i":5792,"n":"Zancada atrás con extension","d":"Empieza de pie, con las manos en la cadera o con los brazos estirados a lo largo del cuerpo. Da una zancada hacia atrás con la rodilla derecha bajando el torso, hasta que la rodilla se acerque al suelo. Al mismo tiempo levanta los brazos hasta que queden estirados encima tu cabeza. En la posición final tus piernas han de estar en un ángulo aproximado de 90°, pero puede haber pequeñas variaciones en cada zancada. Desde esta posición, empuja con la punta del pie para regresar a la posición inicial, y repite por el lado izquierdo.\n\n**Ten en cuenta:**\n\n- Descenso en un plano completamente vertical. \n- Baja suavemente hasta que tu rodilla conecte con el suelo. \n- Que la rodilla de la extremidad avanzada no sobrepase la altura del pie. \n- Cuenta una repetición por zancada.","v":"https://youtube.com/shorts/NAhbDr9tvPM","e":null,"h":null,"t":3.5,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5794,"n":"Zancadas adelante equilibrio","d":"Empieza de pie con los pies juntos y da un paso largo hacia adelante. Cuando tu pie toque el suelo levanta la pierna trasera y mantente en equilibrio. Desde esta posición, toca suavemente con la mano opuesta al pie que está en contacto con el suelo. Impúlsate hacia atrás para volver a la posición inicial. Repite el movimiento con la otra pierna.\n\n**Ten en cuenta:**\n\n- Descenso en un plano completamente vertical. \n- Que la rodilla de la extremidad avanzada no sobrepase la altura del pie. \n- Cuenta una repetición por paso.","v":"https://youtube.com/shorts/iBrDXEpNb1g","e":null,"h":null,"t":3.5,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5795,"n":"Zancadas OH con peso","d":"Agarra la kettlebell con las dos manos y elevarla sobre tu cabeza.\n\nDa un paso largo hacia adelante y desde esta posición, toca suavemente con la rodilla de la pierna trasera el suelo. Vuelve a la posición inicial e intercambia el pie que avanzas. \n\n**Ten en cuenta:**\n\n- Descenso en un plano completamente vertical. \n- Baja suavemente hasta que tu rodilla conecte con el suelo. \n- Que la rodilla de la extremidad avanzada no sobrepase la altura del pie. \n- Mantén la espalda recta.\n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/WQSfExawZ-s","e":null,"h":null,"t":3.8,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5803,"n":"Sentadilla cuclilla trx","d":"Sujeta un asa del TRX en cada mano. Mantén los brazos estirados y el cuerpo en posición de estar sentado en una silla. Mantén los pies planos en el suelo y, al mismo tiempo que rotas las muñecas ligeramente, flexiona los brazos para empujar tu cuerpo hacia delante.\nVuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén los pies planos en el suelo durante todo el ejercicio.\n- Mantén el cuerpo en la postura correcta mientras flexionas y estiendes los brazos.\n- Mira hacia adelante.\n- Cuenta una repetición con cada flexión de brazos.","v":"https://youtube.com/shorts/qn1Cuc_w8cU","e":null,"h":null,"t":3.5,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5804,"n":"Zancada giros","d":"Con los pies separados, empieza con un pie delante del otro. Reclina el peso sobre el talón del pie de delante mientras el pie de detrás lo apoyas solo en la punta. Dobla las rodillas para realizar una zancada. Regresa a la posición inicial y rota hacia el otro lado para cambiar de pierna.\n\n**Ten en cuenta:**\n\n- Mantén tu cuerpo recto al descender.\n- Baja suavemente hasta que tu rodilla trasera toque el suelo.\n- Al doblar las rodillas, la rodilla delantera debe aliniarse con tu pie.\n- Regresa a la posición inicial antes de rotar.\n- Cuenta una repetición con cada zancada.","v":"https://youtube.com/shorts/sxvPWr2z-A4","e":null,"h":null,"t":3.2,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5807,"n":"Dominadas trx","d":"En posición de sentadilla profunda, sujeta un agarre del TRX en cada mano con los brazos extendidos por encima de la cabeza. Flexiona los brazos para levantar tu cuerpo, como en una dominada. Extiende los brazos nuevamente y regresa a la posición inicial.\n \n**Ten en cuenta:**\n \n- Mantén el abdomen en tensión y la espalda recta.\n- Asegúrate de que los codos estén apuntando hacia el suelo y no abiertos hacia los lados.\n- Al hacer la dominada, tus rodillas no deben rebasar la altura de tus pies.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por dominada.","v":"https://youtube.com/shorts/sHXtXHbAesA","e":null,"h":null,"t":3.2,"m":["dorsales","trapecios","pectorales"],"j":["codos","hombros"]},{"i":5808,"n":"Perro en trx","d":"Sujeta un agarre del TRX en cada mano, con los brazos extendidos por encima de la cabeza. Con la espalda recta, inclínate sobre tus Cadera con las rodillas ligeramente flexionadas. Inclínate un poco más para profundizar el estiramiento y sentir la tensión en los Deltoides. Levántate regresando lentamente a la posición inicial. Luego, repite el movimiento.\n\n**Ten en cuenta:**\n\n- Mantén el abdomen en tensión y la espalda recta.\n- Debes mantener las rodillas flexionadas.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por cada estiramiento profundo.","v":"https://youtube.com/shorts/0MuIHdprDL8","e":null,"h":null,"t":2.3,"m":["tríceps","pectorales","deltoides"],"j":["muñecas","hombros","cadera"]},{"i":5809,"n":"90-90","d":"Siéntate en el suelo con la pierna de delante doblada en un ángulo de 90º, manteniendo el lateral de esta en contacto con el suelo, y la otra pierna también doblada en un ángulo de 90º hacia detrás. Levanta los brazos extendidos por encima de tu cabeza e inclínate hacia adelante sobre tus Cadera, estirándote hasta donde te sea cómodo. Vuelve a incorporarte manteniendo los brazos en la misma posición. Cambia de lado y repite el movimiento.\n\n**Ten en cuenta:**\n\n- Mantén el abdomen en tensión y la espalda recta.\n- No levantes las Cadera del suelo al inclinarte hacia adelante.\n- Cuenta una repetición con cada estiramiento. \n- Cuenta una repetición con cada estiramiento.","v":"https://youtube.com/shorts/T3S_5Ihacp0","e":null,"h":null,"t":2.0,"m":["glúteos"],"j":["rodillas","cadera"]},{"i":5810,"n":"Estiramiento cadena posterior","d":"1. Comienza de pie con la espalda pegada a la pared, los pies separados a la anchura de tu cadera, y las extremidades relajadas.\n2. Inclina la cabeza y ve enrollando la columna vertebral, vértebra por vértebra, hasta flexionarte completamente.\n3. Cuando llegues al punto más bajo, lleva las manos a la nuca y haz un poco de presión hacia abajo.\n4. Rebobina el movimiento desenrollando tu cuerpo de nuevo hasta volver a la posición inicial.\n\nTen en cuenta:\n\n- Mantén las piernas extendidas en todo momento.\n- Sube lentamente.\n- Cada extensión es una repetición.","v":"https://youtube.com/shorts/wzVGOYqRPf4","e":null,"h":null,"t":2.3,"m":["isquiotibiales","lumbares"],"j":["cadera"]},{"i":5813,"n":"Caballero adelante (derecha)","d":"1. Colócate con una rodilla apoyada en el suelo y el empeine de ese pie apoyado también, formando un ángulo de 90º con tu pierna.\n2. Apoya completamente la planta del pie contrario, con la rodilla y cadera flexionadas en genuflexión.\n3. Desde aquí, apoya tus manos sobre la pierna delantera y desplaza tu peso hacia adelante, inclinándote, y nota el estiramiento de la pierna cuya rodilla tienes apoyada en el suelo.\n\nTen en cuenta:\n- Mantén tu espalda recta.","v":"https://youtube.com/shorts/d2wis5SrZGk","e":null,"h":null,"t":2.3,"m":["psoas - iliaco","cuádriceps"],"j":["rodillas","cadera"]},{"i":5814,"n":"Caballero adelante (izquierda)","d":"1. Colócate con una rodilla apoyada en el suelo y el empeine de ese pie apoyado también, formando un ángulo de 90º con tu pierna.\n2. Apoya compl ón.","v":"https://youtube.com/shorts/eqn5p1LGffM","e":null,"h":null,"t":2.5,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},{"i":5831,"n":"Dominadas escapulares","d":"Cuélgate de la barra con agarre pronado (palmas mirando al frente), con una apertura un poco mayor de la altura de tus Deltoides, con los brazos totalmente estirados. \n\nDesde esta postura, intenta juntar las escápulas y elévalas todo lo que puedas tensando la parte superior de la espalda.\n\n**Ten en cuenta:**\n\n- En todo momento debes realizar un movimiento controlado.\n- Solamente deben moverse las escápulas.\n- Cuenta una repetición por elevación.","v":"https://youtube.com/shorts/4PxA6EDeWxQ","e":null,"h":null,"t":2.5,"m":["trapecios","deltoides","dorsales"],"j":["hombros"]},{"i":5832,"n":"Agarre supino en barra","d":"Cuélgate de la barra con agarre supino (dedos mirando tu cara), con una apertura un poco mayor de la altura de tus Deltoides, con los brazos totalmente estirados. \n\nDesde esta postura, intenta juntar las escápulas, tensando la parte superior de la espalda y eleva el cuerpo unos centímetros manteniendo la altura de los Deltoides inferior a la barbilla.\n\nMantén esta postura durante unos segundos y luego deja caer el cuerpo.\n\n**Ten en cuenta:**\n\n- En todo momento debes realizar un movimiento controlado.\n- Solamente deben moverse las escápulas.\n- Cuenta una repetición por elevación.","v":"https://youtube.com/shorts/fGONtkmhPL0","e":null,"h":null,"t":2.3,"m":["dorsales","trapecios","tríceps","bíceps"],"j":["codos","hombros"]},{"i":5833,"n":"Agarre alternado","d":"Cuélgate de la barra con agarre pronado (palmas mirando al frente), con una apertura un poco mayor de la altura de tus Deltoides, con los brazos totalmente estirados. \n\nDesde esta postura, suelta uno de los brazos balancea el cuerpo un poco hacia el lado del brazo del que cuelgas, y al volver cambia de brazo.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento controlado, tensa todo el cuerpo en la ejecución.\n- Cada cambio de brazo cuenta como una repetición.","v":"https://youtube.com/shorts/CfX_0zY8bu0","e":null,"h":null,"t":2.5,"m":["redondo mayor","dorsales"],"j":["hombros","muñecas"]},{"i":5834,"n":"Extensiones torácicas","d":"Coloca un rodillo en el suelo y échate mirando boca arriba cuidando que el rodillo quede exactamente a la altura dorsal. Flexiona los dos brazos y colócalos detrás de la nuca.\n\nDesde esta posición, realiza una flexión abdominal y al llegar al suelo estira tu caja torácica al máximo.\n\n**Ten en cuenta:**\n\n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/qVeYK420dvk","e":null,"h":null,"t":2.5,"m":["pectorales","recto mayor del abdomen"],"j":["hombros"]},{"i":5835,"n":"Rotaciones torácicas c/ rodilla (D)","d":"Colócate a cuatro patas en el suelo.\n\nFlexiona un brazo y coloca la mano detrás de la nuca. Desde esta posición rota el lado del brazo flexionado hacia abajo llevando el codo al pecho y de ahí invierte la rotación llevando el codo lo más alto que puedas por fuera del cuerpo.\n\n**Ten en cuenta:**\n\n- Cuenta una repetición al volver a la posición inicial.","v":"https://youtube.com/shorts/zFnQTe4xNLQ","e":null,"h":null,"t":2.3,"m":["pectorales","recto mayor del abdomen","deltoides","dorsales"],"j":["rodillas","hombros","muñecas"]},{"i":5836,"n":"Rotaciones torácicas estirado (D)","d":"Túmbate boca abajo en el suelo sujetando un palo largo con los dos brazos. Uno de los brazos debe sujetar el final del palo.\nDesde esta posición, rotamos el cuerpo hacia arriba manteniendo las piernas completamente pegadas al suelo.\n\nAl volver al suelo, cambia la posición del palo para que el final de este se encuentre en la otra mano, y rota nuevamente con el lado contrario.\n\n**Ten en cuenta:**\n\n- Cuenta una repetición por cada rotación.","v":"https://youtube.com/shorts/yncJudDo9WU","e":null,"h":null,"t":2.3,"m":["glúteos","erector de la columna","dorsales"],"j":["hombros","cadera"]},{"i":5839,"n":"Excéntricas subescapular a cinta con mayor resistencia.\n\n**Ten en cuenta:**\n\n- Mantén el core activo.\n- Aguanta la tensión el tiempo indicado.","v":"https://youtube.com/shorts/aNIHnylA_uc","e":null,"h":null,"t":2.5,"m":["abdominales"],"j":["codos","hombros"]},{"i":5866,"n":"Fondos en paralelas","d":"Sitúate en el centro de las barras en paralelas, toma una barra con cada mano y suspéndete en el aire solo con la fuerza de tus brazos.\n\nLuego desciende suavemente hasta que tus brazos flexionados alcancen los 90 grados como mínimo. Luego vuelve a estirar los brazos completamente.\n\n**Ten en cuenta:**\n\n- Mantén las escápulas activas durante todo el movimiento.\n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/yOL_WmC3XdI","e":null,"h":null,"t":3.8,"m":["tríceps","pectorales"],"j":["codos","hombros"]},{"i":5867,"n":"Sentadillas a una pierna en caja","d":"Desde la posición de pie, parado sobre una sola pierna, espalda recta y sacando ligeramente el trasero hacia afuera, flexiona la cadera y rodilla hasta sentarte en la caja. Equilibrate con la otra pierna en extensión.\nLuego, levántate con la misma pierna que tienes flexionada hasta quedar de pie.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Durante la flexión tus rodillas no deben rotar hacia adentro.  \n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/slsDvxhYNQI","e":null,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},{"i":5869,"n":"Toques de hombro","d":"Colócate de espaldas cerca a una pared y apoyando las manos en el suelo escala la pared con las piernas hasta casi estar estirado.\n\nDesde esta posición, utiliza una de las manos para tocar el hombro contrario de manera rápida y luego realiza lo mismo con la otra mano. \n\n**Ten en cuenta:**\n\n- Intenta acercar el cuerpo a la pared lo máximo que puedas.\n- Cuenta una repetición por cada toque.","v":"https://youtube.com/shorts/FgriA1W-J8s","e":null,"h":null,"t":3.8,"m" 76,"n":"Escalada de pared","d":"Colócate de espaldas a una pared. Apoya las manos en el suelo y eleva la pierna derecha para apoyarla contra la pared, y después la izquierda.\n\nAcércate a la pared con las manos a la vez que sigues escalando con las piernas. Sigue subiendo hasta que llegues a la posición más vertical posible. Retrocede ahora con las manos hasta que los pies lleguen de nuevo al suelo y repite.\n\n**Ten en cuenta:**\n\n- Mantén el core activo.\n- Intenta acercarte a la pared.\n- Cuenta una repetición por escalada.","v":"https://youtube.com/shorts/2kHk2xabk1k","e":null,"h":null,"t":3.8,"m":["deltoides","trapecios","dorsales"],"j":["hombros","codos"]},{"i":5877,"n":"Elevación de rodillas con giro","d":"Sujétate colgando de una barra. Desde esta posición eleva las piernas flexionadas hasta que las rodillas queden a la altura del pecho y manteniendo la posición de los Deltoides y brazos estables y las piernas flexionadas, gira la piernas rotando el abdomen hacia izquierda y derecha. \n\n**Ten en cuenta:**\n\n- Mantén el core y las escápulas activas.\n- Cuenta una repetición por lado.","v":"https://youtube.com/shorts/QE0K0Fq5sTg","e":null,"h":null,"t":3.8,"m":["abdominales"],"j":["rodillas","cadera","hombros"]},{"i":5878,"n":"Plancha press","d":"Coloca el cuerpo boca abajo apoyando los antebrazos y las puntas de los pies en el suelo. Mantén piernas, tronco y cabeza estirados en paralelo al suelo. Apoya todo el peso del cuerpo en los antebrazos y desde esta posición, elévate usando la fuerza de tus brazos, especialmente los tríceps, hasta tener los brazos estirados. Luego, vuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta y la mirada al frente. \n- Cuenta una repetición por cada levantamiento.","v":"https://youtube.com/shorts/Yt3aTQLjqTk","e":null,"h":5339,"t":3.2,"m":["recto mayor del abdomen","tríceps"],"j":["codos","hombros","muñecas"]},{"i":5879,"n":"Flexión en L con deficit","d":"Apoya las manos en el suelo y los pies en cia que te permita apoyar las manos a 15-20 cm de la pared y patear con las piernas hacia arriba, hasta que quedes cabeza abajo, apoyando únicamente los talones en la pared.\n\nDesde esta posición, flexiona los codos para acercar la cabeza al suelo, y empuja con fuerza para regresar a la posición original.\n\n**Ten en cuenta:**\n\n- Puedes utilizar un cojín para apoyar la cabeza cuando desciendas.\n- La descender no debes realizar una hiper extensión lumbar.\n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/jtpcUjugWls","e":5886,"h":null,"t":5.0,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5891,"n":"Sentadilla con salto con carga","d":"Desde la posición de pie, espalda recta y sacando ligeramente el trasero hacia afuera flexiona la cadera y rodillas unos #90º aproximadamente o hasta que tus muslos estén paralelos al suelo. Desde esta posición, realizamos un salto vertical con extensión global del cuerpo sujetando la kettlebell con las dos manos a la altura del pecho.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. En el salto, extiende todo tu cuerpo. \n- Amortigua la caída. \n- Durante la flexión tus rodillas no deben rotar hacia adentro. \n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por salto.","v":"https://youtube.com/shorts/uGpzmv6F2Us","e":null,"h":null,"t":4.5,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5892,"n":"Zancada con salto con peso","d":"Sujetando la kettlebell con las dos manos a la altura del pecho da un paso largo hacia adelante y desde esta posición, haz un salto vertical para cambiar de pierna . El ejercicio se hace sin desplazamiento. Durante el salto las piernas quedan completamente estiradas y se intercambian en el aire. Amortigua realizando el movimiento de zancada.\n\n**Ten en cuenta:**\n\n- Extiende tu cuerpo durante el salto. \n- Amortigua la caída. \n- Descenso en un plano completamente vertical. \n- Baja suavemente hasta que tu rodilla conecte con el suelo. \n- Que la rodilla de la extremidad avanzada no sobrepase la altura del pie.\n- Cuenta una repetición por salto.","v":"https://youtube.com/shorts/y5KQpmeC3iM","e":null,"h":null,"t":4.2,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5893,"n":"Pecho a barra","d":"Agarrado de una barra, con los dedos mirando hacia adelante y, con los brazos estirados deja caer tu peso quedando colgado de la barra. Desde aquí flexiona los codos elevando todo el cuerpo hasta que el pecho quede a la altura de la barra. Vuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Extiende bien los brazos durante el descenso. \n- El movimiento de flexión debe llevar tu pecho a la altura de la barra. \n- Relaja el cuello. \n- Mantén tu espalda recta. \n- Cuenta una repetición por elevación.","v":"https://youtube.com/shorts/6Ebl4ZOVSMo","e":null,"h":null,"t":4.2,"m":["dorsales","trapecios","pectorales"],"j":["codos","hombros"]},{"i":5894,"n":"Elevación de rodillas en barra iso","d":"Sujétate colgando de una barra. Desde esta posición eleva las piernas flexionadas hasta que las rodillas queden a la altura de las Cadera. Mantenlas a esa altura durante el tiempo requerido en la sesión.\n\n**Ten en cuenta:**\n\n- Mantén el core y escápulas activas.","v":"https://youtube.com/shorts/2vZAh5UsHfs","e":null,"h":null,"t":3.5,"m":["abdominales"],"j":["rodillas","cadera","hombros"]},{"i":5895,"n":"Caminata del granjero","d":"Coge un peso que te genere un poco de esfuerzo cargar con una sola mano y manteniendo la espalda recta camina muy lentamente (exageradamente) durante el tiempo estipulado en la sesión. \n\n**Ten en cuenta:**\n\n- Mantén la espalda recta en todo momento.\n- Cambia de lado en cada intervalo de tiempo.","v":"https://youtube.com/shorts/W-_hjvjg8t8","e":null,"h":null,"t":2.5,"m":["bíceps","tríceps","abdominales"],"j":["cadera","rodillas","tobillos"]},{"i":5896,"n":"Plancha equilibrio en TRX","d":"Amarra a una barra lateral superior unas cintas TRX para que queden a unos 20 cm sobre el suelo y colócate en posición de plank con los pies en las TRX y aplicando la retroversión de Cadera para activar los músculos abdominales.\n\nDesde esta posición, mueve el cuerpo hacia adelante y atrás paralelo al suelo.\n\n**Ten en cuenta:**\n\n- Marca el movimiento completo. \n- Mantén la mirada hacia el suelo. \n- Cuenta una repetición cada vez que llegas al punto máximo de retroceso.","v":"https://youtube.com/shorts/Xr40_HfuzCs","e":null,"h":null,"t":3.2,"m":["abdominales"],"j":["hombros","tobillos"]},{"i":5898,"n":"Plancha lateral con rodilla (derecha)","d":"1. Colócate lateralmente apoyado en el suelo con un antebrazo, dobla la rodilla del mismo lado del brazo que aguanta el peso y mantén la otra pierna estirada. Tu otro brazo irá flexionado con la mano apoyada en la cadera. \n2. Eleva con la fuerza del abdomen todo tu cuerpo hasta que solo estén en contacto con el suelo tu antebrazo y tu rodilla.\n3. Aguanta en esta posición el tiempo estipulado. \n\nTen en cuenta:\n- Mantén esta postura procurando que la cadera no se desplace hacia abajo. \n- Activa abdomen y glúteos y no arquees la zona lumbar.","v":"https://youtube.com/shorts/PubtDBzleBE","e":5392,"h":null,"t":2.5,"m":["recto mayor del abdomen","abdominales oblicuos","glúteos","cuádriceps"],"j":["codos","hombros","rodillas"]},{"i":5899,"n":"Plancha lateral con rodilla (izquierda)","d":"1. Colócate lateralmente apoyado en el suelo con un antebrazo, dobla la rodilla del mismo lado del brazo que aguanta el peso y mantén la otra pierna estirada. Tu otro brazo irá flexionado con la mano apoyada en la cadera. \n2. Eleva con la fuerza del abdomen todo tu cuerpo hasta que solo estén en contacto con el suelo tu antebrazo y tu rodilla.\n3. Aguanta en esta posición el tiempo estipulado. \n\nTen en cuenta:\n- Mantén esta postura procurando que la cadera no se desplace hacia abajo. \n- Activa abdomen y glúteos y no arquees la zona lumbar.","v":"https://youtube.com/shorts/x-7rczZN8N0","e":5393,"h":null,"t":2.5,"m":["recto mayor del abdomen","abdominales oblicuos","glúteos","cuádriceps"],"j":["codos","hombros","rodillas"]},{"i":5900,"n":"Supinación y pronación c/ bastón D","d":"1. Colócate de pie con un brazo extendido hacia delante, sujetando un palo largo por uno de sus extremos y el otro extremo apuntando hacia arriba, perpendicular a tu brazo.\n2. Comienza a girar el brazo extendido hacia un lado, hasta el punto máximo.\n3. Con ayuda de la otra mano lleva el palo y brazo extendido de nuevo a la posición anterior, y repite el giro hacia el otro lado.","v":"https://youtube.com/shorts/w-3RuCo6RdU","e":null,"h":null,"t":2.3,"m":["supinadores","pronadores"],"j":["hombros","muñecas"]},{"i":5901,"n":"Supinación y pronación c/ bastón I","d":"1. Colócate de pie con un brazo extendido hacia delante, sujetando un palo largo por uno de sus extremos y el otro extremo apuntando hacia arriba, perpendicular a tu brazo.\n2. Comienza a girar el brazo extendido hacia un lado, hasta el punto máximo.\n3. Con ayuda de la otra mano lleva el palo y brazo extendido de nuevo a la posición anterior, y repite el giro hacia el otro lado.","v":"https://youtube.com/shorts/H8oI6WZsVWM","e":null,"h":null,"t":2.3,"m":["supinadores","pronadores"],"j":["hombros","muñecas"]},{"i":5902,"n":"Estiramiento de glúteos (izquierda)","d":"1. Colócate tumbado de espaldas con las piernas extendidas y apoyadas en la pared formando con tu cuerpo un ángulo de 90º. \n2. Flexiona una de las piernas y coloca la parte externa del tobillo a la altura de la rodilla contraria.\n3. Desde esta posición, flexiona la pierna que está apoyada en la pared, de tal forma que empuje la pierna contraria hasta sentir cómo se estira el glúteo.\n4. Vuelve a la posición inicial y repite intercambiando las piernas.\n\nTen en cuenta:\n\n- Cada estiramiento es una repetición.","v":"https://youtube.com/shorts/px9-AReEq98","e":null,"h":null,"t":2.3,"m":["glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5903,"n":"Pallof press (derecha)","d":"1. Sujeta una banda a una barra vertical a la altura de los hombros y colócate  a un metro de ella.\n2. Con los brazos flexionados, sujeta la banda a la mitad del pecho. Las piernas deben estar semiflexionadas. \n3. Extiende ambos brazos completamente sujetando al frente la banda, sintiendo la tensión, flexiona los brazos y vuelve otra vez a estirarlos. \n\nTen en cuenta: \n\n- Mantén el core tenso y contraído. \n- Cada flexión es una repetición.","v":"https://youtube.com/shorts/2hGiUKkI2P4","e":null,"h":null,"t":2.5,"m":["abdominales"],"j":["codos","hombros"]},{"i":5904,"n":"Pallof press (izquierda)","d":"1. Sujeta una banda a una barra vertical a la altura de los hombros y colócate  a un metro de ella.\n2. Con los brazos flexionados, sujeta la banda a la mitad del pecho. Las piernas deben estar semiflexionadas. \n3. Extiende ambos brazos completamente sujetando al frente la banda, sintiendo la tensión, flexiona los brazos y vuelve otra vez a estirarlos. \n\nTen en cuenta: \n\n- Mantén el core tenso y contraído. \n- Cada flexión es una repetición.","v":"https://youtube.com/shorts/px9-AReEq98","e":null,"h":null,"t":2.5,"m":["abdominales"],"j":["codos","hombros"]},{"i":5905,"n":"Zancada con salto con peso (izquierda)","d":"1. Colócate de pie como posición inicial, con una kettlebell apoyada en el suelo entre tus piernas.\n2. Flexiona las piernas, agarra la kettlebell con las manos y realiza una cargada para llevarla a la altura del pecho.\n3. Desde esta posición, da un pequeño salto vertical y lleva una de tus piernas un paso hacia adelante y la otra hacia atrás.\n4. Lleva la rodilla de la pierna trasera hacia el suelo, flexionando ambas piernas, de manera que queden aproximadamente en 90º y, desde esta posición, realiza un salto vertical para cambiar de pierna en el aire y quedar en la misma posición.\n\nTen en cuenta:\n- Este ejercicio no requiere desplazamiento.\n- Realiza los pasos de forma fluida, sin pausa.\n- Extiende tu cuerpo durante el salto.\n- Amortigua suavemente la caída acabando en la posición de zancada.\n- La rodilla de la pierna adelantada no debe sobrepasar la punta del pie.\n- Cada salto es una repetición.","v":"https://youtube.com/shorts/sd5LXeFkwBw","e":null,"h":5820,"t":4.2,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5906,"n":"Zancada con salto con peso (derecha)","d":"1. Colócate de pie como posición inicial, con una kettlebell apoyada en el suelo entre tus piernas.\n2. Flexiona las piernas, agarra la kettlebell con las manos y realiza una cargada para llevarla a la altura del pecho.\n3. Desde esta posición, da un pequeño salto vertical y lleva una de tus piernas un paso hacia adelante y la otra hacia atrás.\n4. Lleva la rodilla de la pierna trasera hacia el suelo, flexionando ambas piernas, de manera que queden aproximadamente en 90º y, desde esta posición, realiza un salto vertical para cambiar de pierna en el aire y quedar en la misma posición.\n\nTen en cuenta:\n- Este ejercicio no requiere desplazamiento.\n- Realiza los pasos de forma fluida, sin pausa.\n- Extiende tu cuerpo durante el salto.\n- Amortigua suavemente la caída acabando en la posición de zancada.\n- La rodilla de la pierna adelantada no debe sobrepasar la punta del pie.\n- Cada salto es una repetición.","v":"https://youtube.com/shorts/xNizrI41-v4","e":null,"h":5819,"t":4.2,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5909,"n":"Circunducciones de cuello","d":"En posición de pie, sin mover ninguna parte del cuerpo de los Deltoides hacia abajo, describe una circunferencia con la cabeza, lo más amplia posible.\nEl movimiento nace desde el cuello.\nRealiza las repeticiones hacia un lado y luego hacia el otro.","v":"https://youtube.com/shorts/dahSJwyUf4M","e":null,"h":null,"t":2.3,"m":["esternocleidomastoideo","escalenos"],"j":["cuello"]},{"i":5910,"n":"Circunducciones de tórax","d":"En posición de pie, sin mover ninguna parte del cuerpo de la cintura hacia abajo, describe una circunferencia con el tronco, lo más amplia posible.\nEl movimiento nace de tu columna torácica. Mantén la pelvis en retroversión y la cabeza en posición neutra.\nRealiza las repeticiones hacia un lado y luego hacia el otro.","v":"https://youtube.com/shorts/0yyARA-UZR8","e":null,"h":null,"t":2.3,"m":["pectorales","dorsales"],"j":["cuello"]},{"i":5911,"n":"Círculos de deltoides","d":"En posición de pie, describe una circunferencia con los Deltoides, lo más amplia posible. \nEl movimiento nace de las escápulas.\nRealiza las repeticiones hacia un lado y luego hacia el otro.","v":"https://youtube.com/shorts/he-3xwoCVWg","e":null,"h":null,"t":2.3,"m":["trapecios","dorsales"],"j":["hombros"]},{"i":5912,"n":"Círculos de codos y muñecas","d":"En posición de pie, describe una circunferencia con los codos y las muñecas, lo más amplia posible. \nEl movimiento nace de los codos y las muñecas, pero los Deltoides acompañan la rotación..\nRealiza las repeticiones hacia un lado y luego hacia el otro.","v":"https://youtube.com/shorts/d93Y0yq67wA","e":null,"h":null,"t":2.3,"m":["dorsales","deltoides","trapecios"],"j":["hombros","codos","muñecas"]},{"i":5913,"n":"Círculos de pelvis","d":"En posición de pie y con la manos en la cintura, mantén los pies separados algo más del ancho de tus Cadera, describe circunferencias bien amplias con la pelvis.\nPuedes flexionar un poco las rodillas para ampliar el recorrido.\nMantén la columna neutra.\nRealiza las repeticiones hacia un lado y luego hacia el otro.","v":"https://youtube.com/shorts/WsVeykvZkqs","e":null,"h":null,"t":2.3,"m":["lumbares"],"j":["cadera"]},{"i":5914,"n":"Círculos de rodillas juntas","d":"De pie y con la manos en la cintura. Los pies y las rodillas deben estar juntas, desde esta posición describe circunferencias con ambas rodillas a la vez sin levantar los talones del suelo.\nRealiza las repeticiones hacia un lado y luego hacia el otro.","v":"https://youtube.com/shorts/Pa7sLOv69eY","e":null,"h":null,"t":2.3,"m":["cuádriceps","isquiotibiales"],"j":["rodillas","cadera","tobillos"]},{"i":5915,"n":"Circunducciones de tobillo","d":"De pie, llevamos el peso del cuerpo hacia una pierna, vamos a apoyar la punta del pie de la otra pierna. Desde esta posición y manteniendo el equilibrio describe circunferencias lo más amplias posible con la punta del pie que tienes alzado, utilizando el movimiento del tobillo.\nRealiza las repeticiones hacia un lado y hacia el otro y luego cambia de pie.","v":"https://youtube.com/shorts/uKPjdfCIE5s","e":null,"h":null,"t":2.3,"m":["gemelos"],"j":["tobillos"]},{"i":5916,"n":"Shaking global","d":"De pie y con las rodillas ligeramente flexionadas, comienza el movimiento desde los pies, realiza pequeños rebotes al mismo tiempo que acompañas la vibración generada con el resto del cuerpo, especialmente con Deltoides y brazos.","v":"https://youtube.com/shorts/5Sm_Lopfwxg","e":null,"h":null,"t":2.3,"m":["gemelos","cuádriceps"],"j":["tobillos"]},{"i":5917,"n":"Ondas de cuello anteroposteriores","d":"En posición de pie, sin mover ninguna parte del cuerpo de los Deltoides hacia abajo, describe una circunferencia con tu mentón, lo más amplia posible.\nEl movimiento nace desde el cuello.\nRealiza las repeticiones hacia adelante y hacia atrás.","v":"https://youtube.com/shorts/BURycyBFUQU","e":null,"h":null,"t":2.3,"m":["esternocleidomastoideo","escalenos"],"j":["cuello"]},{"i":5918,"n":"Deslizamientos de tórax anteroposteriores","d":"En posición de pie, sin mover ninguna parte del cuerpo de la cintura hacia abajo manteniendo la cabeza neutra, desliza el tórax hacia delante, inspira, saca pecho y eleva las costillas y hacia atrás,espirando y encorvando la espalda.\nAcompaña con el movimiento natural de los Deltoides.","v":"https://youtube.com/shorts/kTNGzqsllPs","e":null,"h":null,"t":2.3,"m":["pectorales","dorsales"],"j":["cuello"]},{"i":5919,"n":"Dislocaciones de deltoides c/ banda","d":"De pie, con los brazos extendi
