 al suelo por detrás de tu cabeza, o lo más cerca que permita tu flexibilidad. Rueda ahora hacia delante, con suficiente impulso para volver a la posición de sentadilla profunda, y ponte de pie.","v":"https://youtube.com/shorts/pX2pFNaw__g","e":null,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5603,"n":"Patadas de burro","d":"Apóyate en el suelo sobre las manos y las puntas de los pies, mirando hacia abajo. Desde esta posición salta con los pies y estiras las piernas, como pateando el aire. Amortigua la caída y repite el número de veces indicado.\n\n- Versión más sencilla: eleva las piernas con salto pero sin estirarlas, manteniendo las rodillas flexionadas durante todo el ejercicio.","v":"https://youtube.com/shorts/SWHmK3J_pUs","e":null,"h":null,"t":2.8,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["tobillos","rodillas","cadera","hombros"]},{"i":5604,"n":"Sentadilla búlgara con peso (derecha)","d":"Colócate de espaldas a una silla, sofá o banco, a una zancada de distancia, con algún peso en tus manos o una mochila cargada. Eleva el pie izquierdo hasta apoyarlo en la esquina de la silla. Desciende hasta que tu rodilla izquierda quede muy cerca del suelo. Si la rodilla derecha se adelanta mucho respecto a la punta de tus pies sepárate un poco más del banco (zancada más amplia). El torso debería mantenerse recto o ligeramente inclinado hacia adelante. Al subir, cadera y Deltoides se elevan a la vez. Realiza todas las repeticiones indicadas por un lado y después por el otro.\n\n- Puedes coger un peso delante de ti (pegado al pecho), coger peso con ambas manos (manteniendo los brazos a los lados del cuerpo) o cargar una mochila con peso a la espalda.","v":"https://youtube.com/shorts/puJcuKI4KYA","e":null,"h":null,"t":5.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5605,"n":"Escalada de pared","d":"Colócate de espaldas a una pared. Apoya las manos en el suelo y eleva la pierna derecha para apoyarla contra la pared, y después la izquierda. Avanza con las manos a la vez que sigues escalando con las piernas. Sigue subiendo hasta que llegues a la posición más vertical posible. Retrocede ahora con las manos hasta que los pies lleguen de nuevo al suelo y repite.\n\n- Si lo haces en una pared de casa, utiliza calcetines para no mancharla.\n- Si no puedes todavía escalar la pared, simplemente eleva las piernas (una de cada vez) para apoyarlas en la pared y regrésales al suelo, sin mover las manos.","v":"https://youtube.com/shorts/eAOpyTrCU5s","e":null,"h":null,"t":4.2,"m":["pectorales","bíceps","deltoides","recto mayor del abdomen"],"j":["hombros","muñecas","cadera"]},{"i":5606,"n":"Abdominales","d":"Siéntate en el suelo, con las piernas flexionadas, juntando las plantas de los pies. Desde esta posición lleva el torso hacia atrás, hasta apoyarlo completamente en el suelo, y regresa a la posición inicial. Puedes utilizar las manos para acompañar el movimiento, haciendo que toquen el suelo detrás de tu cabeza al bajar y tocando los pies al terminar cada repetición.\n\n-Si notas molestias puedes colocar una toalla justo detrás de tus Glúteos, para que sirva de apoyo a tu espalda lumbar.","v":"https://youtube.com/shorts/hsVa8UDRN9w","e":null,"h":null,"t":2.5,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["cadera","rodillas"]},{"i":5607,"n":"Abdominales en semi V","d":"Siéntate en el suelo, apoyando las manos detrás de ti y con las piernas flexionadas delante, juntando las rodillas. Desde esta posición lleva el torso hacia atrás y estira las piernas. Sin pausa, adelante ahora el torso y flexiona las rodillas, hasta que lleguen cerca del pecho.","v":"https://youtube.com/shorts/he2mGB_icCg","e":5224,"h":null,"t":3.0,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["cadera","rodillas"]},{"i":5608,"n":"Flexión hindú","d":"Colócate boca abajo, apoyado en manos y punta de los pies, haciendo que tu cuerpo forme una “V” invertida. Flexiona los codos para que tu torso se mueva hacia abajo y hacia delante. Cuando tus codos llegan a unos 90° y tu cuerpo está paralelo al suelo, extiende los brazos para elevar el torso, pero dejando la cadera cerca del suelo. Ahora revierte el movimiento para volver a la posición inicial: flexiona codos, acerca el torso al suelo, eleva cadera y empuja de nuevo con los brazos.\n\n-Si no puedes hacer el ejercicio de esta manera, apoya los brazos en una superficie elevada para hacerlo más fácil.","v":"https://youtube.com/shorts/P8QnhvYlkKE","e":null,"h":null,"t":3.9,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","cadera"]},{"i":5609,"n":"Plancha pivote","d":"Colócate en el suelo, apoyado sobre los antebrazos y las puntas de los pies, manteniendo el cuerpo recto. Desde esta posición, eleva la cadera todo lo que puedas, formando con el cuerpo una “V” invertida, y regresa a la posición inicial. Repite durante el tiempo (o repeticiones) indicado.","v":"https://youtube.com/shorts/Xd8H59mwXig","e":null,"h":null,"t":2.6,"m":["recto mayor del abdomen","erector de la columna","abdominales transversos","pectorales"],"j":["tobillos","rodillas","cadera","hombros"]},{"i":5610,"n":"Plancha dinámica","d":"Colócate en el suelo, apoyado sobre los antebrazos y las puntas de los pies, manteniendo el cuerpo recto. Desde esta posición, pivota sobre los tobillos, utilizando todo su rango de movimiento para llevar el cuerpo hacia adelante y después hacia atrás. Repite durante el tiempo indicado.","v":"https://youtube.com/shorts/_PFu31TDEn8","e":null,"h":null,"t":2.6,"m":["recto mayor del abdomen","erector de la columna","abdominales transversos","pectorales"],"j":["tobillos","rodillas","cadera","hombros"]},{"i":5611,"n":"Plancha con toques","d":"Colócate en el suelo, apoyado sobre las manos y las puntas de los pies, manteniendo el cuerpo recto y con los brazos estirados. Desde esta posición, realizarás sin pausa los siguientes movimientos: mano derecha a hombro izquierdo, mano izquierda a hombro derecho, mano derecha a cadera izquierda, mano izquierda a cadera derecha, mano derecha a rodilla izquierda, mano izquierda a rodilla derecha, mano derecha a tobillo izquierdo, mano izquierda a tobillo derecho. Después de cada “toque” debes volver a la posición inicial. Repite durante el tiempo indicado.\n\n- Si no tienes flexibilidad para llegar a los tobillos llega únicamente a las rodillas.","v":"https://youtube.com/shorts/6Valp18iFuE","e":null,"h":null,"t":2.6,"m":["recto mayor del abdomen","erector de la columna","abdominales transversos","pectorales"],"j":["tobillos","rodillas","cadera","hombros"]},{"i":5612,"n":"Desplante adelante con peso","d":"Empieza de pie, sujetando un peso delante de ti o con una mochila cargada en los Deltoides. Da una zancada hacia delante con la rodilla derecha y agacha el torso, hasta que la rodilla llegue prácticamente al suelo. En este punto ambas rodillas deberían formar un ángulo aproximado de 90°, pero puede haber pequeñas variaciones en cada zancada.\n\nDesde esta posición, empuja con el talón derecho para regresar a la posición inicial, y repite por el lado izquierdo.","v":"https://youtube.com/shorts/RMWG_V60Ges","e":null,"h":null,"t":3.8,"m":["glúteos","cuádriceps","isquiotibiales"],"j":["cadera","rodillas","tobillos"]},{"i":5613,"n":"Desplante atrás con peso","d":"Empieza de pie, sujetando un peso delante de ti o con una mochila cargada en los Deltoides. Da una zancada hacia atrás con la rodilla derecha y agacha el torso, hasta que la rodilla se acerque al suelo, formando un ángulo aproximado de 90°, pero puede haber pequeñas variaciones en cada zancada.\n\nDesde esta posición, empuja con la punta del pie para regresar a la posición inicial, y repite por el lado izquierdo.","v":"https://youtube.com/shorts/TJw_i4aacXE","e":null,"h":null,"t":3.8,"m":["glúteos","cuádriceps","isquiotibiales"],"j":["cadera","rodillas","tobillos"]},{"i":5614,"n":"Desplante lateral con peso","d":"Empieza de pie, sujetando un peso delante de ti o con una mochila cargada en los Deltoides. Da una zancada amplia hacia la derecha, flexionando la rodilla para llevar el torso hacia ese lado, todo lo que puedas sin perder el equilibrio. Sin pausa, regresa a la posición inicial y repite por el lado opuesto. Utiliza las manos para facilitar el equilibrio.","v":"https://youtube.com/shorts/Hoi4iVZ44BA","e":null,"h":null,"t":3.8,"m":["glúteos","cuádriceps","isquiotibiales"],"j":["cadera","rodillas","tobillos"]},{"i":5615,"n":"Thruster libre","d":"Empieza de pie, con el cuerpo recto y los codos flexionados, apuntando al frente, y las palmas mirando hacia arriba, como si sujetaras una barra sobre ellas, por debajo del cuello.\n\nDesde esta posición, desciende en una sentadilla normal (recuerda que tus Cadera deben bajar por debajo de tus rodillas) y explota como si fueras a saltar. Cuando tu cadera se abra completamente eleva los brazos como levantando una barra imaginaria. Sin pausa, baja los brazos a su posición original y empieza a descender para realizar la siguiente repetición.\n\nMantén el torso recto y los abdominales tensos. Inhala en la bajada y exhala en la subida.","v":"https://youtube.com/shorts/FcsCLR5VuQc","e":null,"h":null,"t":3.5,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos","hombros","codos"]},{"i":5616,"n":"Flexión diamante","d":"En este tipo de flexión, debes colocar las manos muy cerca, de tal manera que se toquen los dedos pulgares e índices, formando una especie de diamante (forma romboide).\n\nComo en la flexión normal, apóyate en las manos (colocadas como acabamos de indicar) y puntas de los pies, con los brazos extendidos y el cuerpo recto. Flexiona los codos para controlar la bajada, hasta que tu pecho llegue a tocar las manos o muy cerca de ellas, y empuja contra el suelo para volver a la posición inicial, estirando los brazos.\n\n- Mantén los codos cerca del cuerpo, en un ángulo de 45° o menos.\n- No permitas que la cadera colapse hacia abajo. Tensa abdominales y Glúteos para mantener el cuerpo recto.\n- Mantén el cuello neutral, alineado con el resto del cuerpo.","v":"https://youtube.com/shorts/a1Om0xc9nOU","e":null,"h":5659,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5617,"n":"Dominada con manos juntas","d":"Cuélgate de la barra con agarre pronado (palmas mirando al frente), de tal manera que tus manos queden muy cerca (unos 5 cm).\n\nEleva ahora todo el cuerpo flexionando los codos, hasta que tu barbilla supere la barra. Desciende de manera controlada, hasta que tus brazos estén casi rectos y vuelve a subir.\n\n- Toma aire en la bajada (o antes de empezar a subir) y expúlsalo en la subida.\n- Si no puedes realizar todavía una dominada, utiliza la versión con salto o utiliza una silla de apoyo, ayudándote con las piernas. Intenta utilizar cada vez menos las piernas y cada vez más el cuerpo superior.\n- No hagas kipping. No debería haber movimiento en el cuerpo inferior. Como mucho un poco de impulso para completar la última repetición si vas al límite.","v":"https://youtube.com/shorts/VcoXOhh5UCo","e":null,"h":6022,"t":3.8,"m":["deltoides","bíceps","pectorales"],"j":["codos","hombros"]},{"i":5618,"n":"Flexión reptíl","d":"Apóyate en las manos y puntas de los pies, con los brazos extendidos y el cuerpo recto. Atrasa la mano derecha, apoyándola más cerca de la altura de la cadera. Flexiona los codos para controlar la bajada, hasta que tu pecho llegue a pocos centímetros del suelo, y empuja contra el suelo para volver a la posición inicial, estirando los brazos. Regresa la mano derecha a su lugar, retrasa ahora la izquierda y repite.\n\n- Mantén los codos cerca del cuerpo, en un ángulo de 45° o menos.\n- No permitas que la cadera colapse hacia abajo. Tensa abdominales y Glúteos para mantener el cuerpo recto.\n- Mantén el cuello neutral, alineado con el resto del cuerpo.","v":"https://youtube.com/shorts/P_99QtzPwI0","e":null,"h":null,"t":3.9,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5619,"n":"Peso muerto 1 pierna con KB (derecha)","d":"Estando de pie, con el cuerpo recto y la kettlebell en las manos, eleva ligeramente el pie derecho y, manteniendo el torso recto y la pierna izquierda estirada, acerca el torso hacia el suelo, idealmente hasta que la kettlebell toque ligeramente el suelo, y regresa a la posición inicial. Lleva la pierna derecha hacia atrás para actuar como contrapeso, manteniéndola alineada con el torso durante el movimiento.\n\n- Si no tienes suficiente flexibilidad, puedes flexionar ligeramente la rodilla de la pierna de apoyo.\n- Si te resulta muy difícil, empieza haciendo el movimiento sin peso, o con algo que pese menos que la kettlebell.","v":"https://youtube.com/shorts/5OZQZ8bso-Q","e":6024,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},{"i":5621,"n":"Flexión araña","d":"Apóyate en las manos y puntas de los pies, con los brazos extendidos y el cuerpo recto. Flexiona los codos para descender, a la vez que flexionas la rodilla derecha para acercarla al codo derecho, manteniendo el pie en el aire. Cuando tu pecho llegue a pocos centímetros del suelo, empuja con los brazos para volver a la posición inicial, regresando también la pierna a su situación de partida. Vuelve a bajar el torso pero adelantando esta vez la pierna izquierda. Continúa hasta completar las repeticiones indicadas, alternando lados.\n\n- Mantén los codos cerca del cuerpo, en un ángulo de 45° o menos.\n- No permitas que la cadera colapse hacia abajo. Tensa abdominales y Glúteos para mantener el cuerpo recto.\n- Mantén el cuello neutral, alineado con el resto del cuerpo.","v":"https://youtube.com/shorts/SefHgZJWLsw","e":null,"h":null,"t":4.0,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},{"i":5622,"n":"Flexión superman","d":"Apóyate en las manos y puntas de los pies, con los brazos extendidos y el cuerpo recto. La diferencia con la flexión normal es que ahora las manos estarán adelantadas respecto a la cabeza. Flexiona los codos para descender, hasta llegar a apoyarte en tus antebrazos. Desde esta posición tensa el torso y empuja con los brazos para regresar a la posición inicial, manteniendo el torso como un bloque.\n\n- Si te parece muy difícil, coloca las manos más cerca de tu pecho. Si tampoco puedes así, apóyate en las rodillas en vez de las puntas de los pies.","v":"https://youtube.com/shorts/3JcTt6PCCxU","e":null,"h":null,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5623,"n":"El puente 1 pierna (izquierda)","d":"Túmbate en el suelo, con las piernas estiradas y los brazos rectos a lo largo del cuerpo. Flexiona la rodilla derecha y apoya la planta del pie cerca de los Glúteos. Manteniendo la pierna izquierda recta, empuja con la derecha hasta elevar completamente la cadera. Aguanta un segundo la posición, contrayendo al máximo los Glúteos y desciende a la posición inicial.","v":"https://youtube.com/shorts/Qfhnh9bPf3s","e":null,"h":null,"t":3.5,"m":["glúteos","isquiotibiales","adductores"],"j":["cadera","rodillas"]},{"i":5624,"n":"Plancha con salto","d":"Apóyate en las manos y puntas de los pies, con los brazos extendidos y el cuerpo recto. Desde esta posición, da un salto con los pies para llevarlos hacia la derecha. Amortigua el impacto con un pequeño rebote y salta de nuevo con los pies hacia el lado izquierdo. Alterna lados hasta completar las repeticiones indicadas.","v":"https://youtube.com/shorts/NPhnC--Qo5o","e":null,"h":null,"t":2.8,"m":["recto mayor del abdomen","erector de la columna","abdominales oblicuos"],"j":["tobillos","rodillas","cadera","hombros"]},{"i":5625,"n":"Press (derecha)","d":"Coloca la kettlebell en posición de rack: codo pegado al cuerpo, muñeca recta y kettlebell descansando en el triángulo que forma tu brazo con el pecho.\n\nDesde la posición de rack, tensa el abdomen y los Glúteos. Manteniendo las rodillas rectas, empuja con el hombro hasta estirar completamente el brazo. Mantén el hombro hacia atrás y hacia abajo (retracción escapular) para proteger la articulación.\n\nEn la posición final, con el brazo completamente estirado y el codo ‘bloqueado’, la kettlebell debe formar una línea recta con tu hombro, cadera y pie. En este punto la muñeca debe estar totalmente recta y el pulgar ligeramente rotado hacia atrás.\n\nPara bajar la kettlebell echa ligeramente hacia atrás el torso (manteniendo la tensión abdominal), permitiendo a la kettlebell descender de nuevo verticalmente hasta la posición de rack.\n\nInspira en la bajada, espira en la subida.","v":"https://youtube.com/shorts/DxJUjjApPww","e":5584,"h":null,"t":3.2,"m":["recto mayor del abdomen","glúteos","deltoides","tríceps"],"j":["muñecas","codos","hombros"]},{"i":5626,"n":"Remo (derecha)","d":"Con la kettlebell entre los pies, da un paso atrás con el pie derecho, y agacha el torso hasta que esté casi paralelo con el suelo, permitiéndote tomar la kettlebell con la mano derecha. Apoya el antebrazo izquierdo sobre la rodilla y, sin mover el torso y manteniendo la retracción escapular (Deltoides hacia abajo y hacia atrás), eleva la kettlebell lo más alto que puedas, idealmente hasta que se acerque a tus costillas.\n\nRecuerda mantener la espalda recta y los abdominales tensos durante todo el movimiento. Realiza todas las repeticiones indicadas por un lado y después por el lado contrario.\n\nInspira antes de empezar el movimiento, espira mientras subes e inspira de nuevo mientras bajas.","v":"https://youtube.com/shorts/Hg3zOGinyV4","e":5640,"h":null,"t":3.2,"m":["bíceps","recto mayor del abdomen","pectorales"],"j":["cadera","hombros","codos"]},{"i":5627,"n":"Pendulo","d":"Coloca la kettlebell entre tus pies, ligeramente adelantada respecto a ellos. Flexiona la cadera, manteniendo la espalda recta.\n\nAl agarrar la kettlebell con ambas manos, asegúrate que tienes los Deltoides en posición estable, hacia atrás y hacia abajo, y el pecho elevado, con la espalda recta y una ligera curva lumbar.\n\nLevanta la kettlebell hacia ti, con el peso en los talones y sin adelantar las rodillas. Utiliza los brazos para guiar la kettlebell por debajo de las piernas y cuando tus antebrazos toquen el interior de tus muslos, empuja de manera explosiva con la cadera para lanzar la kettlebell hacia adelante y hacia arriba.\n\nLa fuerza se origina en las Cadera, pero piensa que estás realmente impulsando la kettlebell con todo el cuerpo. Para que esta transmisión sea eficiente, mantén los brazos pegados al cuerpo durante la fase inicial del movimiento.\n\nDurante el ascenso debes mantener los brazos relajados. Una ligera flexión de los codos es admisible, y facilita mantener la retracción escapular. \n\nEl objetivo es llevar la kettlebell más o menos a la altura del pecho, o idealmente a la altura de la frente, pero no más arriba. No te preocupes si te lleva varias repeticiones llegar a ese punto.\n\nDesde esta posición, deja que la gravedad atraiga la kettlebell hacia el suelo, guiando con tus brazos para que pase de nuevo por debajo de las piernas, manteniendo la espalda recta y flexionando la cadera (y rodillas) cuando tus brazos se acercan al cuerpo. Aprovecha la energía elástica acumulada en el descenso para explotar de nuevo con la cadera, que empuja los brazos para la siguiente repetición.","v":"https://youtube.com/shorts/fMRSPGyQeb8","e":5655,"h":null,"t":5.0,"m":["glúteos","cuádriceps"],"j":["hombros","muñecas","cadera"]},{"i":5628,"n":"Clean (derecha)","d":"Coloca la kettlebell entre tus pies, ligeramente adelantada respecto a ellos. Flexiona la cadera, manteniendo la espalda recta.\n\nAgarra la kettlebell con la mano derecha, asegurando que tienes los Deltoides en posición estable, hacia atrás y hacia abajo, y el pecho elevado, con la espalda recta y una ligera curva lumbar.\n\nLevanta la kettlebell hacia ti, con el peso en los talones y sin adelantar las rodillas. Utiliza el brazo para guiar la kettlebell por debajo de las piernas y cuando tu antebrazo toque el interior de tus muslos, empuja de manera explosiva con la cadera para lanzar la kettlebell hacia adelante y hacia arriba, sin permitir que se adelante mucho, sino más cercana a una subida en vertical.\n\nPara lograr esta subida cercana a la vertical debes mantener el codo más flexionado y dar un golpe hacia atrás con la espalda (por el lado donde sujetas la kettlebell), aproximadamente cuando la kettlebell va subiendo a la altura de la cadera.\n\nLa idea es 'recibir' la kettlebell de manera controlada, no permitiendo que te golpee el antebrazo. Cuando estás a punto de entrar en contacto con la kettlebell relaja el agarre y deja que la kettlebell 'ruede' alrededor de tu antebrazo, en vez de girar por encima. Para lograr esto piensa en meter la mano rápidamente a través del asa, haciendo que se apoye en el talón de la mano.\n\nDesde la posición de rack, lleva la cadera ligeramente hacia atrás, dejando caer la kettlebell casi verticalmente, no la lances hacia adelante. En la caída, guía la kettlebell con el brazo, y cuando este se estire completamente flexiona un poco más las rodillas para amortiguar la caída, realizando el swing hacia atrás, por debajo de las piernas. A medida que desciende la kettlebell rota internamente tu mano para que el pulgar apunte hacia atrás (45-90°) al final del swing descendente. En este momento abre de nuevo las Cadera a la vez que extiendes las rodillas para iniciar la siguiente repetición.","v":"https://youtube.com/shorts/t5OG-NLd8No","e":5233,"h":null,"t":3.2,"m":["glúteos","cuádriceps","deltoides"],"j":["rodillas","cadera","hombros"]},{"i":5629,"n":"Thruster con KB (derecha)","d":"Coloca la kettlebell en posición de rack: codo pegado al cuerpo, muñeca recta y kettlebell descansando en el triángulo que forma tu brazo con el pecho.\n\nDesciende en una sentadilla normal (recuerda que tus Cadera deben bajar por debajo de tus rodillas) y explota como si fueras a saltar. Cuando tu cadera se abra completamente, la kettlebell empieza a subir, y simplemente completas el movimiento empujando la kettlebell hasta estirar completamente el brazo. Baja la kettlebell de manera controlada, y cuando está a punto de tocar el pecho de nuevo, empieza a descender para realizar la siguiente repetición. Esto amortigua el golpe y hace el movimiento más fluido.\n\nMantén el torso recto y los abdominales tensos. Inhala en la bajada y exhala en la subida.","v":"https://youtube.com/shorts/umlCvRMc7hU","e":5615,"h":null,"t":5.0,"m":["cuádriceps","glúteos","deltoides","trapecios","dorsales"],"j":["cadera","rodillas","codos","tobillos"]},{"i":5630,"n":"Levantamiento turco con peso (derecha)","d":"La posición inicial es tumbado, con el brazo derecho extendido, perpendicular al cuerpo, sujetando la kettlebell con la mano.\n\nDesde esta posición, dobla la rodilla derecha y apoya completamente la planta del pie, no demasiado cerca de la cadera. Inicia el movimiento con los abdominales, levantando el torso lo suficiente para empezar a llevar tu peso al codo izquierdo y, como si estuvieras girando sobre él, levanta el tronco del suelo, liderando el movimiento con el pecho, no con la cabeza. Te apoyas primero en el codo, después en el antebrazo y finalmente en la palma de la mano, extendiendo completamente el brazo izquierdo hasta bloquear el codo. El codo derecho se mantiene completamente extendido durante todo el movimiento.\n\nAhora levanta la cadera, lo suficiente para cruzar por debajo la pierna izquierda, apoyándote en la rodilla, que quedaría debajo de ti. En este momento ambos brazos deberían estar alineados, cercanos a la perpendicular con el suelo. Despega la mano izquierda del suelo, endereza el torso, acerca el pie derecho y levántate.\n\nDesde esta postura, debes revertir el movimiento, apoyando la rodilla izquierda en el suelo, apoyando la mano izquierda, elevando la cadera para estirar la pierna izquierda, bajando la cadera al suelo y controlando la caída hacia atrás, hasta llegar a la posición inicial. Realiza las repeticiones indicadas por un lado y después por el otro.\n\n- La kettlebell debe estar siempre sobre tu centro de gravedad, de lo contrario será difícil controlarla.\n- Si sientes que pierdes el control de la kettlebell, gira rápido tu torso hacia el lado que se inclina la kettlebell y haz un aterrizaje controlado, sin dejar que te doble el codo.\n- Respira de manera normal durante todo el ejercicio.","v":"https://youtube.com/shorts/KeNUdFSlcc8","e":6026,"h":null,"t":3.5,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["cadera","rodillas","hombros"]},{"i":5631,"n":"Step up con peso","d":"Sujetando algún peso, colócate delante de una superficie elevada (silla, banco etc.) que esté a la altura de tu rodilla o algo más baja. Coloca el pie derecho sobre la superficie elevada, apoyando completamente la planta. Impúlsate para subir con ambos pies a la plataforma, extendiendo completamente rodillas y cadera. Regresa ahora el pie izquierdo al suelo y después el derecho, volviendo a la posición inicial. Repite el movimiento pero subiendo ahora con el pie izquierdo y descendiendo con el derecho. Alterna cada pierna hasta completar las repeticiones indicadas.\n\n- Si utilizas una silla asegúrate que no resbala. Puedes colocar una alfombra debajo por ejemplo.\n- Si utilizas sólo un peso (kettlebell, bidón de agua…), sujétalo con ambas manos delante del pecho. Si utilizas dos (como mancuernas) sujétalos con las manos a ambos lados del cuerpo.","v":"https://youtube.com/shorts/cU7J2A_dFJ4","e":null,"h":null,"t":4.0,"m":["cuádriceps","glúteos","isquiotibiales"],"j":["tobillos","rodillas","cadera"]},{"i":5632,"n":"Flexión con rodillas","d":"Apóyate en las manos y rodillas, con los brazos extendidos y el cuerpo recto (Deltoides, cadera y rodillas en línea recta). Flexiona los codos para controlar la bajada, hasta que tu pecho llegue a pocos centímetros del suelo, y empuja contra el suelo para volver a la posición inicial, estirando los brazos.\n\n- Mantén los codos cerca del cuerpo, en un ángulo de 45° o menos.\n- No permitas que la cadera colapse hacia abajo. Tensa abdominales para mantener el cuerpo recto.\n- Mantén el cuello neutral, alineado con el resto del cuerpo.","v":"https://youtube.com/shorts/CB7f7QNkdoE","e":5583,"h":5633,"t":3.0,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},{"i":5633,"n":"Flexión en pared","d":"Colócate de pie, en frente de una pared, a una distancia que te permita apoyar las manos sobre ella, con los brazos extendidos y el cuerpo recto. Flexiona los codos para controlar la bajada, hasta que tu frente llegue a pocos centímetros de la pared, y empuja contra la pared para volver a la posición inicial, estirando los brazos.\n\n- Mantén el cuello neutral, alineado con el resto del cuerpo.\n- Si te resulta muy fácil, puedes realizar las flexiones apoyándote sobre una superficie elevada, como una mesa.","v":"https://youtube.com/shorts/RNwlVvJcDxc","e":5632,"h":null,"t":2.8,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5634,"n":"Flexión en L","d":"Apoya las manos en el suelo y los pies en una superficie elevada, de tal manera que tu cadera forme un ángulo de unos 90° aproximadamente. Desde esta posición, flexiona los codos hasta que la cabeza llegue a unos pocos centímetros del suelo, y empuja para regresar a la posición original.\n\n- Si te parece muy difícil, apoya los pies en el suelo y las manos en una superficie elevada, manteniendo los 90° en tu cadera.","v":"https://youtube.com/shorts/syss7G8iDWg","e":5584,"h":5635,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5635,"n":"Flexión montaña","d":"Apoya las manos en el suelo y flexiona la cadera, en un ángulo de algo más de 90°, apoyándote en las puntas de los pies, con las piernas rectas. Desde aquí, flexiona los codos para que la cabeza llegue lo más cerca posible del suelo, entre las manos o un poco más adelante, y empuja con los brazos para regresar a la posición inicial.","v":"https://youtube.com/shorts/Jv4NMQaCac8","e":5634,"h":null,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5636,"n":"Dominada supina con salto","d":"Versión más sencilla de la dominada. Se trata de aprovechar el impulso del salto inicial para elevar la barbilla por encima de la barra. En función de la altura de la barra puede que no tengas que soltarla en cada salto o que sí.\n\n- El agarre es supino, con las palmas mirando hacia ti.\n- Intenta utilizar cada vez menos el impulso del salto y más la fuerza de los brazos.","v":"https://youtube.com/shorts/Kj_IeUrJD-0","e":5588,"h":null,"t":3.2,"m":["deltoides","bíceps","pectorales"],"j":["codos","hombros"]},{"i":5637,"n":"Semi burpee","d":"La posición inicial es de pie. Desde aquí, agacha el cuerpo llevando las manos al suelo, a la vez que saltas con las piernas hacia atrás, colocándote en la posición inicial de plancha, con el cuerpo recto y apoyado en la punta de los pies.\n\nSalta ahora con los pies hacia delante, para colocarlos justo detrás de las manos, y toma impulso para realizar un salto. Da una palmada por encima de la cabeza. Cada palmada representa una repetición completa.\n\n- Intenta hacer el ejercicio lo más fluido posible, sin pausas entre sus partes.\n- Para aumentar la velocidad (más burpees en menos tiempo), empieza a saltar con los pies hacia atrás antes de que las manos toquen el suelo, y lo mismo al regresar, levanta las manos antes de que los pies vuelvan a su posición inicial.\n- Si no puedes hacer una flexión, apóyate en las rodillas en vez de las puntas de los pies.\n- Al saltar, asegúrate que extiendes completamente la cadera (cuerpo recto).","v":"https://youtube.com/shorts/7XRa9sjHqrE","e":5236,"h":null,"t":4.0,"m":["recto mayor del abdomen","cuádriceps","deltoides"],"j":["rodillas","cadera","hombros","muñecas"]},{"i":5638,"n":"Levantamiento de piernas Flexiónadas","d":"Cuélgate de la barra con agarre pronado (palmas mirando al frente), con una apertura un poco mayor de la altura de tus Deltoides, con los brazos totalmente estirados, pero manteniendo tensión en la zona superior de la espalda.\n\nFlexiona las rodillas a la vez que elevas las piernas, hasta que las rodillas lleguen a la altura del pecho. Desciende de manera controlada hasta la posición de inicio y repite el número de veces indicado.\n\n- Tensa la musculatura abdominal para evitar que se balancee el cuerpo.\n- No te impulses con las piernas.","v":"https://youtube.com/shorts/_aIivdnjpvA","e":5590,"h":5639,"t":3.2,"m":["recto mayor del abdomen","trapecios","cuádriceps"],"j":["cadera","rodillas","hombros"]},{"i":5639,"n":"Levantamiento de piernas en suelo","d":"Túmbate en el suelo con las piernas estiradas y los brazos a lo largo del cuerpo. Si te encuentras más cómodo puedes colocar las manos debajo de los Glúteos como apoyo.\n\nDesde esta posición, manteniendo las piernas rectas (o con una leve flexión de rodillas), elévalas hasta que estén perpendiculares al cuerpo o un poco más. Manteniendo la tensión abdominal regresa las piernas a la posición inicial, pero detén el movimiento antes de que lleguen al suelo y vuelve a subir para la siguiente repetición.\n\n- Si sientes molestias en la espalda baja o no puedes realizar el ejercicio con las piernas estiradas flexiona las rodillas a medida que las piernas se elevan.","v":"https://youtube.com/shorts/gAPFBQ6PnT4","e":5638,"h":null,"t":3.5,"m":["recto mayor del abdomen","cuádriceps","psoas - iliaco"],"j":["cadera"]},{"i":5640,"n":"Dominada en mesa","d":"Colócate debajo de la mesa sólida, de tal manera que el borde de la mesa te quede a la altura del pecho, con la planta de los pies apoyada en el suelo y las rodillas dobladas. Agarra el borde de la mesa con ambas manos y elévate, acercando el pecho todo lo que puedas a la mesa.\n\n- Si te parece muy fácil el ejercicio, puedes hacerlo más difícil estirando las piernas, o más todavía elevándolas, apoyando por ejemplos los pies sobre una silla.\n- Si no tienes una mesa sólida, puedes utilizar dos sillas y un palo de escoba.","v":"https://youtube.com/shorts/7OSvAUXU9mo","e":null,"h":null,"t":3.5,"m":["deltoides","bíceps","pectorales","recto mayor del abdomen"],"j":["codos","hombros"]},{"i":5641,"n":"Sentadilla con peso","d":"Sujeta una kettlebell contra el pecho y colócate en la posición inicial de sentadilla: de pie, con los pies a la altura de los Deltoides y las puntas de los pies mirando ligeramente hacia fuera. \n\nDesde esta posición, lleva la cadera hacia atrás y flexiona las rodillas para descender, manteniendo el torso lo más recto que puedas, con una curvatura natural de la espalda. Desciende hasta que tus Cadera bajen por debajo de tus rodillas, y regresa a la posición inicial.\n\n- Si no tienes kettlebell utiliza cualquier peso, por ejemplo un bidón de agua.\n- Al descender, las rodillas deberían ir por encima de los pies, no dejes que colapsen hacia dentro.\n- Juega con la posición de los pies. Algunas personas necesitan separarlos un poco más para poder bajar suficiente.\n- Los talones nunca se despegan del suelo, debes pensar en aplicar fuerza en ellos en la subida.\n- Mantén la mirada al frente y el pecho elevado.\n- Cada vez que subas debes extender completamente la cadera y rodillas antes de volver a bajar.","v":"https://youtube.com/shorts/2F3PLMNkLC0","e":null,"h":null,"t":4.0,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5642,"n":"Levantamiento turco (izquierda)","d":"La posición inicial es tumbado, con el brazo derecho extendido, perpendicular al cuerpo, sujetando la kettlebell con la mano.\n\nDesde esta posición, dobla la rodilla derecha y apoya completamente la planta del pie, no demasiado cerca de la cadera. Inicia el movimiento con los abdominales, levantando el torso lo suficiente para empezar a llevar tu peso al codo izquierdo y, como si estuvieras girando sobre él, levanta el tronco del suelo, liderando el movimiento con el pecho, no con la cabeza. Te apoyas primero en el codo, después en el antebrazo y finalmente en la palma de la mano, extendiendo completamente el brazo izquierdo hasta bloquear el codo. El codo derecho se mantiene completamente extendido durante todo el movimiento.\n\nAhora levanta la cadera, lo suficiente para cruzar por debajo la pierna izquierda, apoyándote en la rodilla, que quedaría debajo de ti. En este momento ambos brazos deberían estar alineados, cercanos a la perpendicular con el suelo. Despega la mano izquierda del suelo, endereza el torso, acerca el pie derecho y levántate.\n\nDesde esta postura, debes revertir el movimiento, apoyando la rodilla izquierda en el suelo, apoyando la mano izquierda, elevando la cadera para estirar la pierna izquierda, bajando la cadera al suelo y controlando la caída hacia atrás, hasta llegar a la posición inicial. Realiza las repeticiones indicadas por un lado y después por el otro.\n\n- La kettlebell debe estar siempre sobre tu centro de gravedad, de lo contrario será difícil controlarla.\n- Si sientes que pierdes el control de la kettlebell, gira rápido tu torso hacia el lado que se inclina la kettlebell y haz un aterrizaje controlado, sin dejar que te doble el codo.\n- Respira de manera normal durante todo el ejercicio.","v":"https://youtube.com/shorts/U6u-nWfCMn8","e":null,"h":null,"t":3.5,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["cadera","rodillas","hombros"]},{"i":5643,"n":"Sentadilla búlgara con peso (izquierda)","d":"Colócate de espaldas a una silla, sofá o banco, a una zancada de distancia, con algún peso en tus manos o una mochila cargada. Eleva el pie izquierdo hasta apoyarlo en la esquina de la silla. Desciende hasta que tu rodilla izquierda quede muy cerca del suelo. Si la rodilla derecha se adelanta mucho respecto a la punta de tus pies sepárate un poco más del banco (zancada más amplia). El torso debería mantenerse recto o ligeramente inclinado hacia adelante. Al subir, cadera y Deltoides se elevan a la vez. Realiza todas las repeticiones indicadas por un lado y después por el otro.\n\n- Puedes coger un peso delante de ti (pegado al pecho), coger peso con ambas manos (manteniendo los brazos a los lados del cuerpo) o cargar una mochila con peso a la espalda.","v":"https://youtube.com/shorts/pjF7iXQwR-c","e":null,"h":null,"t":5.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5644,"n":"Peso muerto 1 pierna con KB (izquierda)","d":"Estando de pie, con el cuerpo recto y la kettlebell en las manos, eleva ligeramente el pie derecho y, manteniendo el torso recto y la pierna izquierda estirada, acerca el torso hacia el suelo, idealmente hasta que la kettlebell toque ligeramente el suelo, y regresa a la posición inicial. Lleva la pierna derecha hacia atrás para actuar como contrapeso, manteniéndola alineada con el torso durante el movimiento.\n\n- Si no tienes suficiente flexibilidad, puedes flexionar ligeramente la rodilla de la pierna de apoyo.\n- Si te resulta muy difícil, empieza haciendo el movimiento sin peso, o con algo que pese menos que la kettlebell.","v":"https://youtube.com/shorts/Kr-oL3-kb5Y","e":6028,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},{"i":5646,"n":"El puente 1 pierna (derecha)","d":"Túmbate en el suelo, con las piernas estiradas y los brazos rectos a lo largo del cuerpo. Flexiona la rodilla derecha y apoya la planta del pie cerca de los Glúteos. Manteniendo la pierna izquierda recta, empuja con la derecha hasta elevar completamente la cadera. Aguanta un segundo la posición, contrayendo al máximo los Glúteos y desciende a la posición inicial.","v":"https://youtube.com/shorts/KE0-uMaFB_A","e":null,"h":null,"t":3.5,"m":["glúteos","isquiotibiales","adductores"],"j":["cadera","rodillas"]},{"i":5647,"n":"Molino (derecha)","d":"Estando de pie, abre las piernas algo más que la altura de las Cadera y eleva el brazo derecho por encima de tu cabeza. Gira tu pie izquierdo hacia fuera, unos 45° o un poco más. Lleva la cadera hacia la derecha, cargando el peso hacia ese lado. A la vez que desciendes el tronco, rótalo ligeramente hacia arriba, manteniendo la mirada en la mano derecha. Baja hasta llegar a tocar el suelo con la mano izquierda (o lo más abajo que puedas).\n\nEn esta posición final tus brazos deben estar alineados, formando a su vez una línea casi perpendicular con el suelo. Mantén el pecho abierto, los omoplatos juntos, y la mirada en la mano, que debe bajar totalmente vertical. Detente un breve momento en la posición final y realiza el movimiento inverso hasta volver a la posición de cuerpo recto. \n\nInspira al bajar, espira al subir.\n\n- Si te resulta muy fácil el ejercicio, sujeta un peso con la mano elevada: una mochila con peso, una mancuerna, una kettlebell….","v":"https://youtube.com/shorts/gsSCQfybHRQ","e":null,"h":null,"t":2.5,"m":["isquiotibiales","gemelos","glúteos"],"j":["cadera","hombros","rodillas"]},{"i":5648,"n":"Plancha lateral (izquierda)","d":"Túmbate en el suelo sobre el costado derecho, apoyado en el antebrazo, con el codo debajo del hombro. Desde esta posición, eleva la cadera para que el cuerpo quede totalmente recto, apoyado únicamente en el antebrazo y la parte externa del pie derecho. Aguanta esta posición el tiempo indicado y repite por el lado contrario.\n\n- Puedes apoyar la mano izquierda en la cadera o elevar el brazo por encima de la cabeza.\n- Si no puedes mantener esta postura por más de 30 segundos, apóyate sobre la rodilla derecha en vez de sobre el pie.","v":"https://youtube.com/shorts/lZgjfHArojE","e":null,"h":null,"t":2.5,"m":["recto mayor del abdomen","abdominales oblicuos","glúteos","cuádriceps"],"j":["codos","hombros"]},{"i":5649,"n":"Clean (izquierda)","d":"Coloca la kettlebell entre tus pies, ligeramente adelantada respecto a ellos. Flexiona la cadera, manteniendo la espalda recta.\n\nAgarra la kettlebell con la mano derecha, asegurando que tienes los Deltoides en posición estable, hacia atrás y hacia abajo, y el pecho elevado, con la espalda recta y una ligera curva lumbar.\n\nLevanta la kettlebell hacia ti, con el peso en los talones y sin adelantar las rodillas. Utiliza el brazo para guiar la kettlebell por debajo de las piernas y cuando tu antebrazo toque el interior de tus muslos, empuja de manera explosiva con la cadera para lanzar la kettlebell hacia adelante y hacia arriba, sin permitir que se adelante mucho, sino más cercana a una subida en vertical.\n\nPara lograr esta subida cercana a la vertical debes mantener el codo más flexionado y dar un golpe hacia atrás con la espalda (por el lado donde sujetas la kettlebell), aproximadamente cuando la kettlebell va subiendo a la altura de la cadera.\n\nLa idea es 'recibir' la kettlebell de manera controlada, no permitiendo que te golpee el antebrazo. Cuando estás a punto de entrar en contacto con la kettlebell relaja el agarre y deja que la kettlebell 'ruede' alrededor de tu antebrazo, en vez de girar por encima. Para lograr esto piensa en meter la mano rápidamente a través del asa, haciendo que se apoye en el talón de la mano.\n\nDesde la posición de rack, lleva la cadera ligeramente hacia atrás, dejando caer la kettlebell casi verticalmente, no la lances hacia adelante. En la caída, guía la kettlebell con el brazo, y cuando este se estire completamente flexiona un poco más las rodillas para amortiguar la caída, realizando el swing hacia atrás, por debajo de las piernas. A medida que desciende la kettlebell rota internamente tu mano para que el pulgar apunte hacia atrás (45-90°) al final del swing descendente. En este momento abre de nuevo las Cadera a la vez que extiendes las rodillas para iniciar la siguiente repetición.","v":"https://youtube.com/shorts/XiUp_ztN_64","e":5233,"h":null,"t":3.2,"m":["glúteos","cuádriceps","deltoides"],"j":["rodillas","cadera","hombros"]},{"i":5650,"n":"Push press (izquierda)","d":"Coloca la kettlebell en posición de rack: codo pegado al cuerpo, muñeca recta y kettlebell descansando en el triángulo que forma tu brazo con el pecho. \n\nEn vez de empezar empujando con los Deltoides, debes impulsarte primero con las piernas, doblando ligeramente las rodillas (¼ de sentadilla), y abriendo la cadera de manera explosiva. Es este empuje del cuerpo inferior el que lanza la kettlebell hacia arriba inicialmente. El hombro empieza a empujar cuando la cadera se ha extendido completamente y la kettlebell está ‘flotando’ en el aire, no antes. Cuando la kettlebell pasa el nivel de los ojos, adelanta ligeramente el torso. Al igual que en el press, en la posición final el codo debe bloquearse y las rodillas estar completamente extendidas.","v":"https://youtube.com/shorts/DVbqZGPtVbo","e":5605,"h":null,"t":3.8,"m":["deltoides","trapecios","dorsales"],"j":["codos","hombros","rodillas"]},{"i":5651,"n":"Thruster con KB (izquierda)","d":"Coloca la kettlebell en posición de rack: codo pegado al cuerpo, muñeca recta y kettlebell descansando en el triángulo que forma tu brazo con el pecho.\n\nDesciende en una sentadilla normal (recuerda que tus Cadera deben bajar por debajo de tus rodillas) y explota como si fueras a saltar. Cuando tu cadera se abra completamente, la kettlebell empieza a subir, y simplemente completas el movimiento empujando la kettlebell hasta estirar completamente el brazo. Baja la kettlebell de manera controlada, y cuando está a punto de tocar el pecho de nuevo, empieza a descender para realizar la siguiente repetición. Esto amortigua el golpe y hace el movimiento más fluido.\n\nMantén el torso recto y los abdominales tensos. Inhala en la bajada y exhala en la subida.","v":"https://youtube.com/shorts/DVbqZGPtVbo","e":5615,"h":null,"t":5.0,"m":["cuádriceps","glúteos","deltoides","trapecios","dorsales","abdominales oblicuos"],"j":["cadera","rodillas","codos","tobillos"]},{"i":5652,"n":"Plancha araña","d":"Colócate en el suelo, apoyado sobre los antebrazos y las puntas de los pies, manteniendo el cuerpo recto. Desde esta posición, flexiona la rodilla derecha y adelántala hasta que llegue casi al codo, manteniendo el pie en el aire. Repite ahora por el lado izquierdo, y alterna lados hasta llegar a las repeticiones indicadas.","v":"https://youtube.com/shorts/AQ33bYR078o","e":null,"h":null,"t":2.8,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["codos","hombros","rodillas"]},{"i":5653,"n":"Levantamiento turco con peso (izquierda)","d":"La posición inicial es tumbado, con el brazo derecho extendido, perpendicular al cuerpo, sujetando la kettlebell con la mano.\n\nDesde esta posición, dobla la rodilla derecha y apoya completamente la planta del pie, no demasiado cerca de la cadera. Inicia el movimiento con los abdominales, levantando el torso lo suficiente para empezar a llevar tu peso al codo izquierdo y, como si estuvieras girando sobre él, levanta el tronco del suelo, liderando el movimiento con el pecho, no con la cabeza. Te apoyas primero en el codo, después en el antebrazo y finalmente en la palma de la mano, extendiendo completamente el brazo izquierdo hasta bloquear el codo. El codo derecho se mantiene completamente extendido durante todo el movimiento.\n\nAhora levanta la cadera, lo suficiente para cruzar por debajo la pierna izquierda, apoyándote en la rodilla, que quedaría debajo de ti. En este momento ambos brazos deberían estar alineados, cercanos a la perpendicular con el suelo. Despega la mano izquierda del suelo, endereza el torso, acerca el pie derecho y levántate.\n\nDesde esta postura, debes revertir el movimiento, apoyando la rodilla izquierda en el suelo, apoyando la mano izquierda, elevando la cadera para estirar la pierna izquierda, bajando la cadera al suelo y controlando la caída hacia atrás, hasta llegar a la posición inicial. Realiza las repeticiones indicadas por un lado y después por el otro.\n\n- La kettlebell debe estar siempre sobre tu centro de gravedad, de lo contrario será difícil controlarla.\n- Si sientes que pierdes el control de la kettlebell, gira rápido tu torso hacia el lado que se inclina la kettlebell y haz un aterrizaje controlado, sin dejar que te doble el codo.\n- Respira de manera normal durante todo el ejercicio.","v":"https://youtube.com/shorts/WImTJUJa_8U","e":5642,"h":null,"t":3.5,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["hombros","cadera","rodillas"]},{"i":5654,"n":"Flow a","d":"Antes de empezar, revisa bien el video y practica la secuencia. Te costará un poco al principio, pero pronto la interiorizarás.","v":"https://youtube.com/shorts/qyOCtuwI-Q8","e":null,"h":null,"t":3.2,"m":["cuádriceps","glúteos","abductores","abdominales"],"j":["hombros","cadera","tobillos","rodillas","muñecas","codos"]},{"i":5655,"n":"Extensión explosiva de cadera","d":"Túmbate en el suelo y eleva las piernas, flexionando las rodillas. \nDesde esta posición, baja de manera explosiva los pies a la vez que elevas la cadera. Debes lograr que la cadera se eleve antes de que los pies lleguen al suelo.\n\nRepite el número de veces indicado, intentando aplicar la mayor velocidad posible en la elevación de cadera.","v":"https://youtube.com/shorts/-5hgJBEZGZI","e":null,"h":null,"t":3.2,"m":["isquiotibiales","glúteos","abdominales","cuádriceps"],"j":["tobillos","rodillas","cadera"]},{"i":5656,"n":"Press (izquierda)","d":"Place kettlebell in rack position (elbow close to body, wrist straight, kettlebell resting on forearm and against chest).\n\nFrom here, engage abs and glutes. Keeping knees straight, push outwards from the shoulder, stretching the arm. Keep shoulders back and down (scapular retraction) to protect your shoulders.\n\nIn the final position (arm extended and elbow locked), the kettlebell should form a straight line with shoulder, hip, and foot. Wrist straight and thumb slightly rotated backwards.\n\nTo lower the kettlebell, shift torso slightly backwards while keeping abs engaged, allowing kettlebell to lower vertically to the rack position.\n\nInhale downwards and exhale while rising.","v":"https://youtube.com/shorts/AhITaMJdJ9M","e":5584,"h":null,"t":3.2,"m":["recto mayor del abdomen","glúteos","deltoides","tríceps"],"j":["muñecas","codos","hombros"]},{"i":5657,"n":"Remo (izquierda)","d":"Con la kettlebell entre los pies, da un paso atrás con el pie derecho, y agacha el torso hasta que esté casi paralelo con el suelo, permitiéndote tomar la kettlebell con la mano derecha. Apoya el antebrazo izquierdo sobre la rodilla y, sin mover el torso y manteniendo la retracción escapular (Deltoides hacia abajo y hacia atrás), eleva la kettlebell lo más alto que puedas, idealmente hasta que se acerque a tus costillas.\n\nRecuerda mantener la espalda recta y los abdominales tensos durante todo el movimiento. Realiza todas las repeticiones indicadas por un lado y después por el lado contrario.\n\nInspira antes de empezar el movimiento, espira mientras subes e inspira de nuevo mientras bajas.","v":"https://youtube.com/shorts/NidSpNjjOpA","e":5640,"h":null,"t":3.2,"m":["bíceps","recto mayor del abdomen","pectorales"],"j":["cadera","hombros","codos"]},{"i":5658,"n":"Sentadilla búlgara (izquierda)","d":"Colócate de espaldas a una silla, sofá o banco, a una zancada de distancia. Eleva el pie izquierdo hasta apoyarlo en la esquina de la silla. Desciende hasta que tu rodilla izquierda quede muy cerca del suelo. Si la rodilla derecha se adelanta mucho respecto a la punta de tus pies sepárate un poco más del banco (zancada más amplia). El torso debería mantenerse recto o ligeramente inclinado hacia adelante. Al subir, cadera y Deltoides se elevan a la vez. Realiza todas las repeticiones indicadas por un lado y después por el otro.","v":"https://youtube.com/shorts/o4NCvmGJ6wg","e":null,"h":null,"t":5.2,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5659,"n":"Flexión diamante de rodillas","d":"En este tipo de flexión, debes colocar las manos muy cerca, de tal manera que se toquen los dedos pulgares e índices, formando una especie de diamante (forma romboide).\n\nApóyate en las manos (colocadas como acabamos de indicar) y rodillas, con los brazos extendidos y el cuerpo recto (línea recta de la cabeza a las rodillas). Flexiona los codos para controlar la bajada, hasta que tu pecho llegue a tocar las manos o muy cerca de ellas, y empuja contra el suelo para volver a la posición inicial, estirando los brazos.\n\n- Mantén los codos cerca del cuerpo, en un ángulo de 45° o menos.\n- No permitas que la cadera colapse hacia abajo. Tensa abdominales y Glúteos para mantener el cuerpo recto.\n- Mantén el cuello neutral, alineado con el resto del cuerpo.","v":"https://youtube.com/shorts/-hYiUMCEO6s","e":5616,"h":null,"t":3.0,"m":["pectorales","tríceps","deltoides"],"j":["rodillas","codos","hombros","muñecas"]},{"i":5660,"n":"Flexión con palmada de rodillas","d":"Apóyate en las manos y rodillas, con los brazos extendidos y el cuerpo recto. Flexiona los codos para controlar la bajada, hasta que tu pecho llegue a pocos centímetros del suelo, y empuja con velocidad el suelo para que en la subida tus manos se despeguen del mismo, lo suficiente para dar una palmada y volver a apoyar las manos en el suelo para amortiguar el descenso. \n\n- Si no te da tiempo a dar la palmada, simplemente intenta empujarte con suficiente potencia para que las manos se despeguen momentáneamente del suelo, sin forzar la palmada.\n- Si te resulta imposible, puedes hacer el ejercicio apoyándote en la pared.\n- Si te resulta fácil, configura la versión más difícil, apoyándote sobre los pies en vez de las rodillas","v":"https://youtube.com/shorts/UQ0VPM-Ccmw","e":5585,"h":null,"t":3.2,"m":["pectorales","tríceps","deltoides"],"j":["rodillas","codos","hombros","muñecas"]},{"i":5661,"n":"Molino (izquierda)","d":"Estando de pie, con la kettlebell en posición de rack en el lado derecho, realiza un press para elevarla por encima de la cabeza. Gira tu pie izquierdo hacia fuera, unos 45° o un poco más. Lleva la cadera hacia la derecha, cargando el peso hacia ese lado. A la vez que desciendes, rota ligeramente el tronco hacia arriba, manteniendo la mirada en la kettlebell. Baja hasta llegar a tocar el suelo con la mano izquierda (o lo más abajo que puedas).\n\nEn esta posición final tus brazos deben estar alineados, formando a su vez una línea casi perpendicular con el suelo. Mantén el pecho abierto, los omoplatos juntos, y la mirada en la kettlebell, que debe bajar totalmente vertical. Si se desplaza lateralmente se te hará muy difícil controlarla. Detente un breve momento en la posición final y realiza el movimiento inverso hasta volver a la posición de cuerpo recto. Inspira al bajar, espira al subir.\n\n- Si te resulta muy difícil, utiliza un peso menor, o hazlo directamente sin peso.","v":"https://youtube.com/shorts/oASJSZotUnY","e":null,"h":null,"t":2.5,"m":["isquiotibiales","gemelos","glúteos"],"j":["cadera","hombros","rodillas"]},{"i":5662,"n":"Plancha lateral (derecha)","d":"bla","v":"https://youtube.com/shorts/2SQZzSmUQ-I","e":null,"h":null,"t":2.5,"m":["recto mayor del abdomen","abdominales oblicuos","glúteos","cuádriceps"],"j":["codos","hombros"]},{"i":5663,"n":"Preparación general deltoides","d":"Ajusta las anillas a la altura de tus Cadera aproximadamente. Agarra las anillas con las palmas de tus manos mirando hacia abajo y arrodíllate en el suelo. Con los brazos estirados lleva tu pecho hacia delante y hacia el suelo, hasta que notes tensión en los Deltoides. Haz algunos rebotes ligeros (sin forzar ni mantener la tensión) y vete llevando los brazos hacia atrás poco a poco, para ir trabajando todo el rango de movimiento de tus Deltoides antes de entrenar.\nAl final del movimiento tus brazos deben quedar detrás de ti, estirados. En este punto rota también el agarre para trabajar todos los pequeños músculos del Manguito Rotador del hombro. Realiza el movimiento completo, de delante a atrás, 4 o 5 veces.\n\nNotas sobre la técnica:\n- Los rebotes son muy ligeros, es un calentamiento, no un estiramiento. \n- Adapta la posición del torso para notar una ligera tensión en los Deltoides.\n\nModificaciones:\n- Coloca las rodillas en una posición que te permita realizar todo el movimiento, de delante a atrás. Si tienes poca flexibilidad en los Deltoides tendrás que ajustar las rodillas durante el movimiento.","v":"https://youtube.com/shorts/8X7zJOvlHwg","e":null,"h":null,"t":2.3,"m":["recto mayor del abdomen","deltoides","tríceps"],"j":["rodillas","hombros"]},{"i":5664,"n":"Perro boca abajo anillas","d":"Ajusta las anillas para que queden ligeramente por encima de la altura de tus Cadera. Agarra las anillas con las palmas de tus manos mirando hacia abajo y camina hacia atrás, lo suficiente como para que al colocar tu torso paralelo al suelo forme un ángulo de unos 90° con tus piernas, manteniendo los brazos estirados. \nDesde aquí, empuja con el torso hacia el suelo, notando cómo se estiran tus Deltoides. Mantén la posición el tiempo indicado.\n\nNotas sobre la técnica:\n\n- Mantén los brazos estirados y la mirada hacia el suelo. \n- Flexiona ligeramente las rodillas si te ayuda a empujar un poco más con el torso.","v":"https://youtube.com/shorts/cvlv2NxzDlI","e":null,"h":null,"t":2.3,"m":["tríceps","pectorales","deltoides"],"j":["muñecas","hombros","cadera","tobillos"]},{"i":5665,"n":"Perro boca abajo en T en anillas","d":"Ajusta las anillas para que queden ligeramente por encima de la altura de tus Cadera. Agarra las anillas con las palmas de tus manos mirando hacia abajo y da un paso hacia atrás. Estira los brazos hacia los lados, a la vez que desciendes con tu torso, manteniendo las piernas rectas o con una ligera flexión de rodillas. Mantén la posición el tiempo indicado.\n\nNotas sobre la técnica:\n\n- Puedes modificar el ángulo de los brazos para variar el énfasis del estiramiento en diferentes músculos. También puedes doblar las rodillas para generar más tensión en los Deltoides.","v":"https://youtube.com/shorts/HSqzytt3doQ","e":null,"h":null,"t":2.3,"m":["pectorales","deltoides","bíceps"],"j":["muñecas","hombros"]},{"i":5666,"n":"Estiramiento tríceps-deltoides","d":"Ajusta las anillas a la altura del pecho. Agarra las anillas por abajo, con las palmas de las manos mirando hacia ti. Lleva el peso de tu cuerpo hacia delante, hasta que tus codos apunten hacia delante y ligeramente hacia arriba. Con el cuerpo recto, mantén esta postura el tiempo indicado. Realiza ligeras rotaciones hacia los lados para aumentar la efectividad del estiramiento sobre dorsales, tríceps y Deltoides.\n\nNotas sobre la técnica:\n\n- Ajusta la altura de las anillas y/o la posición de los pies según tu flexibilidad.","v":"https://youtube.com/shorts/qrUUW-wd3uw","e":null,"h":null,"t":2.3,"m":["tríceps","deltoides"],"j":["hombros","codos","muñecas"]},{"i":5667,"n":"Estiramiento superman","d":"Ajusta las anillas para que queden por encima de la altura de tus Cadera. Agarra las anillas con tus palmas mirando hacia abajo. Lleva primero las rodillas al suelo y deja después caer la cadera hasta que tu torso “cuelgue” de tus brazos, los cuales deben estar totalmente estirados. Las piernas deben quedar también estiradas detrás de ti, con la cadera a pocos centímetros del suelo. \nAguanta 5-10 segundos en esta posición, gira el torso hacia el lado derecho, aguantando en esa posición otros 5-10 segundos, y repite hacia el lado izquierdo.\n\nNotas sobre la técnica:\n\n- Ajusta la altura de las anillas para permitirte adoptar la postura indicada.","v":"https://youtube.com/shorts/CZAuKgyTg4I","e":null,"h":null,"t":2.3,"m":["pectorales","bíceps"],"j":["hombros","muñecas","rodillas"]},{"i":5668,"n":"Estiramiento germano 1","d":"Ajusta las anillas para que queden a la altura de tu pecho. Agarra las anillas a ambos lados de tu cuerpo y lleva el torso hacia el suelo, hasta que tus brazos estén totalmente estirados detrás de ti, y tu torso formando un ángulo de unos 90° con tus piernas.\nDesde esta posición lleva el peso hacia delante para estirar los Deltoides. Aguanta la posición el tiempo indicado.\n\nNotas sobre la técnica:\n\n- En la posición final puedes rotar ligeramente las anillas para variar el ángulo de estiramiento.","v":"https://youtube.com/shorts/7Q2vDeI9MwI","e":5669,"h":null,"t":2.3,"m":["deltoides"],"j":["cadera","hombros"]},{"i":5669,"n":"Estiramiento germano 2","d":"Ajusta las anillas para que al colgarte de ellas, con tus brazos y piernas totalmente estiradas, tus pies no toquen el suelo. Si no puedes elevar tanto las anillas, dobla las piernas para que no se apoyen en el suelo.\n\nDesde esta posición, flexiona las rodillas y eleva las piernas, girando el torso hacia atrás para pasar las piernas entre las anillas. Continúa girando hasta que tu torso esté paralelo al suelo, y estira las piernas para que las puntas de los pies apunten al suelo o hacia delante. Aguanta la posición el tiempo indicado.\n\nModificaciones:\n\n- Para simplificar el ejercicio coloca las anillas a una altura que te permita colocar la pierna en el suelo al dar la vuelta, apoyándote en ella para modular la intensidad del estiramiento.","v":"https://youtube.com/shorts/lFY4MVVPb1E","e":null,"h":5668,"t":2.3,"m":["trapecios","deltoides"],"j":["hombros"]},{"i":5670,"n":"Flexión anillas 1","d":"Ajusta las anillas para que queden a la altura de tus Cadera aproximadamente. Agarra las anillas y aleja tus pies hasta que tu cuerpo quede en línea recta, en el peso hacia la punta de tus pies.\nFlexiona los codos hasta que tu pecho quede a la altura de las anillas, y empuja para regresar a la posición inicial.\n\nNotas sobre la técnica:\n\n- Mantén el cuerpo recto, tensa abdominales y Glúteos.\n- Alinea el cuello con el resto del cuerpo (posición neutra).\n- Mantén los codos cerca del cuerpo, no abras mucho los brazos (<45°).\n- No dobles las muñecas, deben estar alineadas con los antebrazos.\n\nModificaciones:\n\n-Además de ajustar la altura de las anillas, puedes abrir un poco más las piernas para facilitar el equilibrio (más estabilidad). Para hacerlo más difícil, junta los pies.","v":"https://youtube.com/shorts/G1EZ8c4xeSc","e":5671,"h":null,"t":3.2,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5671,"n":"Flexión anillas 2","d":"Ajusta las anillas para que queden a la altura de la mitad de tu muslo aproximadamente. Agarra las anillas y aleja tus pies hasta que tu cuerpo quede en línea recta, con los antebrazos perpendiculares al suelo.\nFlexiona los codos hasta que tu pecho quede a la altura de las anillas, y empuja para regresar a la posición inicial.\n\nNotas sobre la técnica:\n\n- Mantén el cuerpo recto, tensa abdominales y Glúteos.\n- Alinea el cuello con el resto del cuerpo (posición neutra).\n- Mantén los codos cerca del cuerpo, no abras mucho los brazos (<45°).\n- No dobles las muñecas, deben estar alineadas con los antebrazos.\n\nModificaciones:\n\n- Además de ajustar la altura de las anillas, puedes abrir un poco más las piernas para facilitar el equilibrio (más estabilidad). Para hacerlo más difícil, junta los pies.","v":"https://youtube.com/shorts/d5xPHGJnHws","e":5672,"h":5670,"t":3.8,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5672,"n":"Flexión anillas 3","d":"Ajusta las anillas para que queden a 10-20 cm del suelo. Agarra las anillas y aleja tus pies hasta que tu cuerpo quede en línea recta, con los antebrazos perpendiculares al suelo.\nFlexiona los codos hasta que tu pecho quede a la altura de las anillas, y empuja para regresar a la posición inicial.\n\nNotas sobre la técnica:\n\n- Mantén el cuerpo recto, tensa abdominales y Glúteos.\n- Alinea el cuello con el resto del cuerpo (posición neutra).\n- Mantén los codos cerca del cuerpo, no abras mucho los brazos (<45°).\n- No dobles las muñecas, deben estar alineadas con los antebrazos.\n\nModificaciones:\n\n- Además de ajustar la altura de las anillas, puedes abrir un poco más las piernas para facilitar el equilibrio (más estabilidad). Para hacerlo más difícil, junta los pies.\n- Si quieres hacer el ejercicio más difícil puedes elevar los pies, apoyándolos por ejemplo en una silla.","v":"https://youtube.com/shorts/-iDqpzPG1Kc","e":null,"h":5671,"t":4.2,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},{"i":5673,"n":"Dominada anillas 1","d":"Ajusta las anillas para que queden un poco por encima de tu cabeza. Agarra las anillas, con las palmas enfrentadas (agarre neutro) y da un paso hacia adelante. Ahora, manteniendo el cuerpo recto, estira los brazos completamente, llevando el cuerpo hacia atrás, sin mover los pies. Desde aquí, flexiona los codos hasta regresar a la posición inicial.\n\nNotas sobre la técnica:\n\n- Mantén el cuerpo recto, tensa abdominales y Glúteos.\n- Mantén el peso del cuerpo en los talones, no apoyes toda la planta.\n\nModificaciones:\n\n- Puedes modificar el agarre para hacer más énfasis en distintos músculos. \n- Ajusta la altura de las anillas para encontrar el nivel de complejidad adecuado.","v":"https://youtube.com/shorts/0Hs4sRwkbtw","e":5674,"h":null,"t":3.0,"m":["deltoides","bíceps","tríceps"],"j":["codos","hombros"]},{"i":5674,"n":"Dominada anillas 2","d":"Ajusta las anillas para que al colgarte de ellas, con tus brazos totalmente estirados y el torso perpendicular al suelo, tu cadera quede a unos 30-50 cm del suelo. Las piernas deben estar estiradas y apoyadas sobre los talones.\nFlexiona los codos acercando la cabeza a las anillas, y regresa a la posición de partida.\n\nNotas sobre la técnica:\n\n- Mantén la tensión abdominal.\n- Mantén las piernas rectas, apoyadas sobre los talones.\n\nModificaciones:\n\n- Puedes modificar el agarre para hacer más énfasis en distintos músculos. \n- Ajusta la altura de las anillas para encontrar el nivel de complejidad adecuado.","v":"https://youtube.com/shorts/2f91G1yvyDs","e":5675,"h":5673,"t":3.2,"m":
