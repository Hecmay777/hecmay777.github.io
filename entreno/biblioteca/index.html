tura de la barra mientras acercamos nuestra rodilla al codo del mismo lado. Volvemos a la posición inicial. Alternamos piernas. \n\n**Ten en cuenta**:\n\n- Lleva la barbilla a la altura de la barra\n- Extiende bien los brazos al volver a la posición inicial. \n- Cuenta una repetición cada vez que pasas la barbilla por encima de la barra.","v":"https://youtube.com/shorts/3v6NibC2VQQ","e":5352,"h":5262,"t":4.0,"m":["dorsales","trapecios","tríceps","bíceps","abdominales"],"j":["codos","hombros","cadera","rodillas"]},{"i":5362,"n":"Espalda","d":"Realizamos el movimiento de nadar de espalda con un peso ligero en cada una de las manos. \n\n**Ten en cuenta**:\n\n- Marca bien el movimiento con cada brazo\n- Mantén la espalda recta durante todo el ejercicio\n- Cuenta una repetición por brazada.","v":"https://youtube.com/shorts/QxbmJeNkCMI","e":5349,"h":5357,"t":2.5,"m":["trapecios","deltoides","pectorales"],"j":["codos","hombros","muñecas"]},{"i":5364,"n":"Hombro a hombro","d":"Con el peso cargado sobre un hombro agarrado con ambas manos realizamos un impulso para elevar el peso por encima de nuestras cabezas y luego llevar el peso al otro hombro. Al recepcionar el peso flexiona ligeramente las piernas y estíralas para acompañar el impulso de los brazos. \n\n**Ten en cuenta**:\n\n- Mantén la espalda recta y el trasero hacia afuera durante todo el movimiento\n- Elige un peso que te permita realizar el movimiento con precisión\n- Cuenta una repetición por lado.","v":"https://youtube.com/shorts/kwVv4Do0vTU","e":5369,"h":5349,"t":3.0,"m":["trapecios","deltoides","pectorales"],"j":["hombros","codos","rodillas"]},{"i":5365,"n":"Sentada con peso","d":"Tumbado con las piernas estiradas, brazos por encima de tu cabeza y agarrando un ligero peso con las manos, siéntate mientras flexionas tus piernas simultáneamente. \n\n**Ten en cuenta**:\n \n- Asegúrate de extender la espalda cuando abraces las piernas. \n- Elige un peso que te permita realizar el movimiento con precisión\n- Cuenta una repetición por sentada.","v":"https://youtube.com/shorts/jSpns9URjzM","e":null,"h":5345,"t":2.8,"m":["abdominales","deltoides","trapecios"],"j":["hombros","cadera","rodillas","tobillos"]},{"i":5366,"n":"Media cargada","d":"Realizamos una ligera flexión de piernas cargando el peso con los brazos estirados entre las piernas y mientras volvemos a la posición inicial, con un impulso de brazos llevamos el peso a la altura del pecho. Al llegar al pecho amortiguamos con una ligera flexión de piernas. \n\n**Ten en cuenta**:\n\n- Mantén la espalda recta y el trasero hacia afuera durante todo el movimiento\n- Elige un peso que te permita realizar el movimiento con precisión\n- Cuenta una repetición por levantamiento.","v":"https://youtube.com/shorts/1WP8RYViVqA","e":5380,"h":null,"t":3.2,"m":["isquiotibiales","cuádriceps","deltoides","trapecios"],"j":["cadera","rodillas","hombros","codos","tobillos"]},{"i":5369,"n":"Paladas","d":"Lleva el peso entre las piernas y con un gesto de cadera y estirando los brazos , eleva el peso a la vertical a un lado de tu cabeza, lleva de nuevo el peso entre las piernas y al otro lado de la cabeza. \n\n**Ten en cuenta**:\n\n- Mantén la espalda recta y el trasero hacia afuera durante todo el movimiento\n- Marca bien la extensión cuando lleves el peso encima de la cabeza. \n- Elige un peso que te permita realizar el movimiento con precisión\n- Cuenta una repetición por levantamiento.","v":"https://youtube.com/shorts/-DAgFkyOPzE","e":5770,"h":5371,"t":3.5,"m":["abdominales","lumbares","glúteos"],"j":["cadera","hombros"]},{"i":5371,"n":"Péndulo americano","d":"Lleva el peso entre las piernas y realiza una ligera flexión de piernas. Con un gesto de cadera impulsa el peso y con los brazos estirados lleva el peso a la vertical por encima de tu cabeza. \n\n**Ten en cuenta**:\n\n- Mantén la espalda recta y el trasero hacia afuera durante todo el movimiento\n- Marca bien la extensión cuando lleves el peso encima de la cabeza. \n- Elige un peso que te permita realizar el movimiento con precisión\n- Este es un ejercicio dominante de cadera, desde ahí debe salir el impulso.\n- Cuenta una repetición por impulso.","v":"https://youtube.com/shorts/3dcGQOLwPtY","e":5371,"h":5353,"t":5.0,"m":["abdominales","lumbares","glúteos"],"j":["cadera","hombros"]},{"i":5373,"n":"Pies a barra","d":"Colgado de la barra lleva los pies completamente estirados a tocar la barra y vuelve a la posición inicial. \n\n**Ten en cuenta**:\n\n- Mientras elevas los pies aprieta con las manos hacia abajo\n- Mantén el core apretado durante todo el movimiento. \n- Cuenta una repetición cada vez que toques la barra con los pies.","v":"https://youtube.com/shorts/GZbjhR18yRc","e":5374,"h":5229,"t":3.5,"m":["abdominales","lumbares"],"j":["cadera","hombros"]},{"i":5374,"n":"Pies a barra lateral","d":"Colgado de la barra lleva los pies completamente estirados a tocar la barra lateralmente por afuera de una de tus manos, vuelve a la posición inicial y realiza el mismo movimiento hacia el otro lado. \n\n**Ten en cuenta**:\n\n- Mientras elevas los pies aprieta con las manos hacia abajo\n- Mantén el core apretado durante todo el movimiento. \n- Cuenta una repetición cada vez que toques la barra con los pies.","v":"https://youtube.com/shorts/uXcXm1SESnI","e":5872,"h":5373,"t":3.5,"m":["abdominales","lumbares"],"j":["cadera","hombros"]},{"i":5375,"n":"Push press","d":"Con el peso a la altura de los Deltoides, haz una ligera flexión de piernas y mientras las estiras de nuevo,  empuja con tus brazos el peso para situarlo encima de la cabeza. Vuelve a la posición inicial. \n\n**Ten en cuenta**:\n\n- Espalda recta y trasero hacia afuera durante todo el movimiento\n- Marca la extensión cuando tengas el peso encima de la cabeza\n- Elige un peso que te permita realizar el movimiento con precisión\n- Cuenta una repetición por levantamiento.","v":"https://youtube.com/shorts/aiU2jADsrR4","e":5350,"h":5364,"t":3.8,"m":["deltoides","trapecios","dorsales"],"j":["codos","hombros","rodillas"]},{"i":5377,"n":"Sentadilla con peso frontal","d":"De pie sitúa el peso a la altura del pecho, espalda recta y trasero hacia afuera. Pies abiertos a la altura de los Deltoides abiertos unos 45 grados.  Desde aquí flexiona la cadera y las rodillas hasta que los muslos estén paralelos al suelo. Vuelve a la posición inicial\n\n**Ten en cuenta**:\n\n- Mantén la espalda siempre recta.\n- Durante la flexión tus rodillas no deben rotar hacia adentro. \n- Baja hasta que tus Cadera estén por debajo de tus rodillas","v":"https://youtube.com/shorts/Xmh5hbat2KA","e":5891,"h":5242,"t":4.0,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5379,"n":"Thruster con KB","d":"Desde la posición de pie con la Kettlebell a la altura de nuestro pecho, realizamos una sentadilla a la vez que tocamos las rodillas con nuestros codos. Al volver a la posición de pie estiramos los brazos completamente por encima de nuestra cabeza.\n\n**Ten en cuenta**:\n \n- Toca con los codos a las rodillas.\n- Extiende bien tus brazos y tu espalda en la elevación.\n- Mantén tu espalda recta todo el tiempo\n- Cuenta una repetición por levantamiento.","v":"https://youtube.com/shorts/_HKR37XTZ6s","e":null,"h":5286,"t":5.0,"m":["cuádriceps","glúteos","deltoides","trapecios","dorsales"],"j":["cadera","rodillas","codos","tobillos"]},{"i":5380,"n":"Cargada completa con KB","d":"Realizamos una sentadilla completa cargando la kettlebell con los brazos estirados entre las piernas y mientras volvemos a la posición inicial, con un impulso de brazos llevamos el peso a la altura del pecho. Al llegar al pecho amortiguamos con una ligera flexión de piernas. \n\n**Ten en cuenta**:\n\n- Mantén la espalda recta y el trasero hacia afuera durante todo el movimiento\n- Elige un peso que te permita realizar el movimiento con precisión\n- Cuenta una repetición por levantamiento.","v":"https://youtube.com/shorts/wrM6Ljb4cAQ","e":null,"h":5366,"t":3.8,"m":["isquiotibiales","cuádriceps","deltoides","trapecios"],"j":["cadera","hombros","codos"]},{"i":5392,"n":"Plancha lateral (derecha)","d":"1.- Colócate lateralmente apoyado en el suelo, con un antebrazo y tus pies como puntos de apoyo. Tu otro brazo irá flexionado con la mano apoyada en la cadera. \n2.- Eleva con la fuerza del abdomen todo tu cuerpo hasta que solo estén en contacto con el suelo tu antebrazo y tus pies.\n3.- Aguanta en esta posición el tiempo estipulado. \n\nTen en cuenta:\n\n- Mantén esta postura procurando que la cadera no se desplace hacia abajo. \n- Activa abdomen y glúteos y no arquees la zona lumbar.\n- Cada lado es una repetición.","v":"https://youtube.com/shorts/UWdC0lBXJO8","e":5216,"h":null,"t":2.5,"m":["abdominales transversos","glúteos","adductores"],"j":["hombros","cadera","tobillos"]},{"i":5393,"n":"Plancha lateral (izquierda)","d":"1.- Colócate lateralmente apoyado en el suelo, con un antebrazo y tus pies como puntos de apoyo. Tu otro brazo irá flexionado con la mano apoyada en la cadera. \n2.- Eleva con la fuerza del abdomen todo tu cuerpo hasta que solo estén en contacto con el suelo tu antebrazo y tus pies.\n3.- Aguanta en esta posición el tiempo estipulado. \n\nTen en cuenta:\n\n- Mantén esta postura procurando que la cadera no se desplace hacia abajo. \n- Activa abdomen y glúteos y no arquees la zona lumbar.\n- Cada lado es una repetición.","v":"https://youtube.com/shorts/RbaywqhQKaE","e":5216,"h":5899,"t":2.5,"m":["abdominales transversos","glúteos","adductores"],"j":["hombros","cadera","tobillos"]},{"i":5394,"n":"Levantamiento turco (derecha)","d":"1. Colócate tumbado boca arriba, con un brazo completamente estirado a 90º por encima de la cabeza. \n2. Flexiona la rodilla y apoya el pie (del mismo brazo que tienes estirado) en el suelo.\n3. Al mismo tiempo, utiliza el antebrazo del lado contrario para apoyarte en el suelo y elevar el tronco.\n4. Apoya la mano de ese brazo, despega la pierna que estaba estirada en el suelo para apoyar la rodilla y desde ahí, ponte de pie. \n5. Deshaz el movimiento hasta situarte en la posición inicial.\n\nTen en cuenta:\n\n- Durante el movimiento mantén las mirada fija en la mano que elevas. \n- Mantén el brazo extendido perpendicularmente al suelo durante todo el ejercicio.","v":"https://youtube.com/shorts/si8dhFltoG4","e":6018,"h":null,"t":2.5,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5395,"n":"Levantamiento turco (izquierda)","d":"1. Colócate tumbado boca arriba, con un brazo completamente estirado a 90º por encima de la cabeza. \n2. Flexiona la rodilla y apoya el pie (del mismo brazo que tienes estirado) en el suelo.\n3. Al mismo tiempo, utiliza el antebrazo del lado contrario para apoyarte en el suelo y elevar el tronco.\n4. Apoya la mano de ese brazo, despega la pierna que estaba estirada en el suelo para apoyar la rodilla y desde ahí, ponte de pie. \n5. Deshaz el movimiento hasta situarte en la posición inicial.\n\nTen en cuenta:\n\n- Durante el movimiento mantén las mirada fija en la mano que elevas. \n- Mantén el brazo extendido perpendicularmente al suelo durante todo el ejercicio.","v":"https://youtube.com/shorts/Y3roTmxuPZA","e":6019,"h":null,"t":2.5,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5396,"n":"Sentadilla de pistolero (derecha)","d":"1. Colócate de pie en posición vertical con una pierna y ambos brazos extendidos hacía el frente. \n2. Con una sola pierna como punto de apoyo en el suelo comienza el movimiento descendente, llevando la cadera hacia atrás y flexionando la rodilla de la pierna cuyo pie está en el suelo.\n3. La cadera debe quedar a la altura de la rodilla o incluso inferior, desde aquí comienza a levantarte hacia la posición inicial.\n\nTen en cuenta: \n- Mantén la espalda recta siempre. \n- Mantén los brazos hacia adelante ayudan a mantener el equilibrio.\n- Evita levantar el talón de pie de apoyo.\n- Cada flexión es una repetición.","v":"https://youtube.com/sho te el movimiento con la pierna contraria.\n\nTen en cuenta:\n- Extiende bien los brazos a la posición inicial.\n- Regula la resistencia de la goma para graduar la dificultad.\n- Cuenta una repetición cada vez que tu barbilla sobrepase la barra.","v":"https://youtube.com/shorts/BK3U_upp12g","e":5361,"h":5359,"t":3.2,"m":["dorsales","trapecios","tríceps","bíceps","abdominales"],"j":["codos","hombros","cadera","rodillas"]},{"i":5422,"n":"Flexión y extensión de tobillos (I)","d":"1. Comienza sentado en el suelo, con las manos apoyadas en la superficie, una pierna extendida y la otra flexionada.\n2. Eleva ligeramente la pierna estirada despegándola del suelo.\n3. Flexiona y extiende el tobillo elevado.\n4. Vuelve a apoyar la pierna en el suelo, cambia de pierna y repite con la otra.\n\nTen en cuenta:\n- Mantén la espalda recta.\n- Realiza el movimiento lentamente y en su máxima amplitud.\n- Cada flexo-extensión es una repetición.","v":"https://youtube.com/shorts/2be-RA3JjFs","e":null,"h":null,"t":2.3,"m":["flexores del pie","gemelos","sóleo"],"j":["tobillos"]},{"i":5423,"n":"Cruce pie izquierdo a mano","d":"1. Colócate tumbado boca arriba con los brazos abiertos formando una T. \n2. Levanta la pierna izquierda y con una ligera rotación de cadera, sin doblar la rodilla, lleva el pie lo más cerca que puedas de la mano opuesta. \n3. Regresa a la posición inicial.\n\nTen en cuenta:\n\n- Al levantar la pierna, mantén los hombros y la cadera en contacto con el suelo. \n- Asegúrate de que la espalda está sobre el suelo. \n- Cada intento de tocar la mano es una repetición.","v":"https://youtube.com/shorts/uu7PL0Tsvqk","e":5424,"h":null,"t":2.5,"m":["abdominales"],"j":["cadera"]},{"i":5424,"n":"Pie a mano invertido (izquierda)","d":"1. Colócate tumbado boca abajo con los brazos abiertos formando una T. \n2. Levanta una pierna y con una ligera rotación de cadera y doblando la rodilla, lleva el pie lo más cerca que puedas de la mano opuesta. \n3. Regresa a la posición inicial.\n\nTen en cuenta:\n\n- Al levantar la pierna, mantén los hombros y la cadera en contacto con el suelo. \n- Asegúrate de que el pecho está sobre el suelo. \n- Cada intento de tocar la mano es una repetición.","v":"https://youtube.com/shorts/wMyrxCS-W0I","e":null,"h":5423,"t":2.8,"m":["abdominales"],"j":["cadera","rodillas"]},{"i":5425,"n":"Escalador con rotación (izquierda)","d":"1. Colócate en posición de plancha con ambas manos apoyadas en el suelo, separadas a la anchura de los hombros y las piernas extendidas apoyando la punta de los pies en el suelo. \n2. Flexiona una de las piernas apoyando la planta del pie en el suelo junto a la mano de ese mismo lado por fuera de ella.\n3. Rota hacia fuera la mano de la pierna extendida y, desde esta posición, flexiona el brazo de la pierna flexionada por debajo del pecho\n4. A continuación, rota todo el cuerpo hacia arriba hasta que los dos brazos formen un ángulo superior a 180º.\n5. Deshaz el movimiento para volver a la posición inicial.\n\nTen en cuenta: \n- Extiende tu cuerpo cuando lo rotas.","v":"https://youtube.com/shorts/aapJco2jeFw","e":null,"h":null,"t":2.3,"m":["abdominales","pectorales","trapecios","deltoides"],"j":["hombros","codos"]},{"i":5426,"n":"Rotaciones torácicas estirado (I)","d":"1. Túmbate boca abajo con las piernas separadas y estiradas y los brazos estirados por encima de la cabeza sujetando un palo largo. Una de las manos debe sujetar el palo por su extremo.\n2. Desde esta posición rota el cuerpo hacia el lado de la mano que sujeta el extremo hasta apoyar la espalda en el suelo, manteniendo las piernas pegadas al suelo en todo momento.\n3. Vuelve a la posición inicial y sujeta el extremo del palo con la otra mano para girar ahora hacia ese lado y repetir el movimiento.\n\nTen en cuenta:\n\n- Cada rotación es una repetición.","v":"https://youtube.com/shorts/M933KOoPug0","e":null,"h":null,"t":2.3,"m":["glúteos","erector de la columna","dorsales"],"j":["hombros","cadera"]},{"i":5427,"n":"Estiramiento pectoral menor (I)","d":"1. Colócate en el suelo en posición de cuadrupedia con una barra paralela o un cajón delante tu cabeza.\n2. Apoya la palma de la mano en la barra o cajón haciendo fuerza y empuja con el pecho hacia el suelo, marcando bien la lumbar. \n3. Suelta la mano y relaja el cuerpo. \n\nTen en cuenta: \n- Mantén el brazo siempre estirado para que el pectoral se estire bien. \n- Cada extensión es una repetición .","v":"https://youtube.com/shorts/abzfXWkpSFU","e":null,"h":null,"t":2.3,"m":["pectorales"],"j":["hombros","codos"]},{"i":5428,"n":"Rotadores externos izquierdo","d":"1. Ata una goma o cinta con resistencia a una superficie vertical.\n2. Colócate de pie aproximadamente a medio metro de la superficie donde tengas atada la goma y sujétala con la mano más alejada y el brazo flexionado a 90º, con el biceps pegado a tu cuerpo.\n3. Desde esta posición rota el brazo hacia fuera varias veces.\n4. Eleva el brazo manteniendo el ángulo de 90º, pero con el antebrazo paralelo a tu cuerpo y la mano a la altura de la cabeza.\n5. Rota tu cuerpo para ponerte de frente a la superficie donde está atada la goma,  extiende el codo del brazo que sujeta la goma, y aguanta en esa posición unos segundos.\n6. Vuelve a la posición inicial, gírate 180º y repite todo el movimiento con el otro brazo.\n\nTen en cuenta:\n\n- Mantén la espalda recta y el core activo.\n- Cada movimiento completo por brazo es una repetición.","v":"https://youtube.com/shorts/ICyjVbM8FCw","e":null,"h":null,"t":2.5,"m":["manguito rotador"],"j":["hombros","codos"]},{"i":5430,"n":"Dominada australiana con caja y trx","d":"1. Fija un TRX y colócate frente a una caja. Agarra las asas del TRX, apoya  tus pies sobre la caja y extiende los brazos para que tu cuerpo quede totalmente paralelo al suelo.\n2. Junta las manos con las palmas mirando hacia adelante y, desde esta posición, flexiona los brazos mientras separas las manos para llevar el pecho a la altura del TRX.\n3. Vuelve a extender los brazos para volver a la posición inicial y realizar la siguiente repetición. \n\nTen en cuenta: \n- Es importante la retracción escapular a lo largo del movimiento.\n- Mantén la espalda recta durante la ejecución.\n- Cada flexión es una repetición.","v":"https://youtube.com/shorts/DCKRYK4Z2fw","e":null,"h":null,"t":3.8,"m":["deltoides","dorsales","bíceps"],"j":["codos","hombros"]},{"i":5431,"n":"Caminata del grangero (derecha)","d":"1. Coge con la mano derecha un objeto de peso que te genere un poco de esfuerzo manteniéndolo al lado de tu cuerpo con el brazo extendido.\n2. Manteniendo la espalda recta, camina lentamente el tiempo o distancia estipulado.\n\nTen en cuenta:\n\n- Mantén tu espalda recta a la hora de coger y soltar el peso, tal como si hicieras una sentadilla.\n- Activa tu zona media para mantener el tronco erguido durante la ejecución del ejercicio.","v":"https://youtube.com/shorts/AngxLdwhg3A","e":null,"h":null,"t":2.5,"m":["bíceps","tríceps","abdominales"],"j":["cadera","rodillas","tobillos"]},{"i":5432,"n":"Caminata del grangero (izquierda)","d":"1. Coge con la mano izquierda un objeto de peso que te genere un poco de esfuerzo manteniéndolo al lado de tu cuerpo con el brazo extendido.\n2. Manteniendo la espalda recta, camina lentamente el tiempo o distancia estipulado.\n\nTen en cuenta:\n\n- Mantén tu espalda recta a la hora de coger y soltar el peso, tal como si hicieras una sentadilla.\n- Activa tu zona media para mantener el tronco erguido durante la ejecución del ejercicio.","v":"https://youtube.com/shorts/_HK2iLC_LVk","e":null,"h":null,"t":2.5,"m":["bíceps","tríceps","abdominales"],"j":["cadera","rodillas","tobillos"]},{"i":5433,"n":"Fondos en paralelas con cinta","d":"1. Ata una cinta por cada uno de sus extremos a las barras paralelas de forma que la cinta quede perpendicular y colócate en el centro de ellas, agarrando una barra con cada mano.\n2. Apoya las rodillas sobre la cinta flexionando las piernas y suspéndete en el aire solo con la fuerza de tus brazos. La resistencia de la cinta te ayudará.\n3. Desciende de forma controlada flexionando los codos hasta alcanzar los 90º, con el torso levemente inclinado hacia delante. \n4. Vuelve a la posición inicial impulsándote con una extensión de tríceps hacia arriba de manera controlada.\n\nTen en cuenta: \n- No sobrepases los 90º entre el hombro y el tronco. \n- Bloque abdomen, cabeza neutra y columna alineada. \n- Cada flexión es una repetición","v":"https://youtube.com/shorts/q8oN2SbHmgs","e":5866,"h":5263,"t":3.0,"m":["tríceps","pectorales"],"j":["codos","hombros"]},{"i":5434,"n":"Sentadilla pistolero con caja","d":"1. Colócate de pie delante de una caja o banco a unos de los lados y con una pierna y ambos brazos extendidos hacías el frente.\n2. Con una sola pierna como punto de apoyo en el suelo comienza el movimiento descendente, llevando la cadera hacia atrás y flexionando la rodilla de la pierna cuyo pie está totalmente en el suelo.\n3. Siéntate ligeramente en el banco con la rodilla de apoyo 90º y la otra extendida.\n4. Impúlsate hacia arriba con la pierna de apoyo para volver a la posición inicial.\n5. Cada vez que subas alterna de pierna.\n\nTen en cuenta: \n- Mantén la espalda recta siempre. \n- Mantén los brazos hacia adelante para que te ayuden a mantener el equilibrio.\n- Evita levantar el talón de pie de apoyo.\n- Cada flexión es una repetición.","v":"https://youtube.com/shorts/im1iTjTI6X8","e":5437,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5435,"n":"Sentadilla pistolero con caja (derecha)","d":"1. Colócate de pie delante de una caja o banco a unos de los lados y con una pierna y ambos brazos extendidos hacías el frente.\n2. Con una sola pierna como punto de apoyo en el suelo comienza el movimiento descendente, llevando la cadera hacia atrás y flexionando la rodilla de la pierna cuyo pie está totalmente en el suelo.\n3. Siéntate ligeramente en el banco con la rodilla de apoyo 90º y la otra extendida.\n4. Impúlsate hacia arriba con la pierna de apoyo para volver a la posición inicial.\n\nTen en cuenta: \n- Mantén la espalda recta siempre. \n- Mantén los brazos hacia adelante para que te ayuden a mantener el equilibrio.\n- Evita levantar el talón de pie de apoyo.\n- Cada flexión es una repetición.","v":"https://youtube.com/shorts/yn8WGXCN9VE","e":5438,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5436,"n":"Sentadilla pistolero con caja (izquierda)","d":"1. Colócate de pie delante de una caja o banco a unos de los lados y con una pierna y ambos brazos extendidos hacías el frente.\n2. Con una sola pierna como punto de apoyo en el suelo comienza el movimiento descendente, llevando la cadera hacia atrás y flexionando la rodilla de la pierna cuyo pie está totalmente en el suelo.\n3. Siéntate ligeramente en el banco con la rodilla de apoyo 90º y la otra extendida.\n4. Impúlsate hacia arriba con la pierna de apoyo para volver a la posición inicial.\n5. Cada vez que subas alterna de pierna.\n\nTen en cuenta: \n- Mantén la espalda recta siempre. \n- Mantén los brazos hacia adelante para que te ayuden a mantener el equilibrio.\n- Evita levantar el talón de pie de apoyo.\n- Cada flexión es una repetición.","v":"https://youtube.com/shorts/I5Npw5QUpVU","e":5439,"h":null,"t":3.5,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5437,"n":"Sentadilla pistolero asistida","d":"1. Colócate de pie en posición vertical con una caja o banco a unos de los lados y con una pierna y ambos brazos extendidos hacías el frente. \n2. Con una sola pierna como punto de apoyo en el suelo, comienza el movimiento descendente, llevando la cadera hacia atrás y flexionando la rodilla de la pierna cuyo pie está en el suelo.\n3. La cadera debe quedar a la altura de la rodilla o incluso inferior, desde aquí comienza a levantarte, apoyando en la caja  la mano contraria al pie extendido para ayudarte, hasta la posición inicial.\n4. Cada vez que subas alterna de pierna. \n\nTen en cuenta: \n- Mantén la espalda recta siempre. \n- Mantén los brazos hacia adelante para que te ayuden a mantener el equilibrio.\n- Evita levantar el talón de pie de apoyo.\n- Cada flexión es una repetición.","v":"https://youtube.com/shorts/pv4QoIeia8o","e":null,"h":5434,"t":3.6,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5438,"n":"Sentadilla pistolero asistida (derecha)","d":"1. Colócate de pie en posición vertical con una caja o banco a unos de los lados y con una pierna y ambos brazos extendidos hacías el frente. \n2. Con una sola pierna como punto de apoyo en el suelo, comienza el movimiento descendente, llevando la cadera hacia atrás y flexionando la rodilla de la pierna cuyo pie está en el suelo.\n3. La cadera debe quedar a la altura de la rodilla o incluso inferior, desde aquí comienza a levantarte, apoyando en la caja  la mano contraria al pie extendido para ayudarte, hasta la posición inicial.\n\nTen en cuenta: \n- Mantén la espalda recta siempre. \n- Mantén los brazos hacia adelante para que te ayuden a mantener el equilibrio.\n- Evita levantar el talón de pie de apoyo.\n- Cada flexión es una repetición.","v":"https://youtube.com/shorts/335Obv0iUIg","e":null,"h":5435,"t":3.6,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5439,"n":"Sentadilla pistolero asistida (izquierda)","d":"1. Colócate de pie en posición vertical con una caja o banco a unos de los lados y con una pierna y ambos brazos extendidos hacías el frente. \n2. Con una sola pierna como punto de apoyo en el suelo, comienza el movimiento descendente, llevando la cadera hacia atrás y flexionando la rodilla de la pierna cuyo pie está en el suelo.\n3. La cadera debe quedar a la altura de la rodilla o incluso inferior, desde aquí comienza a levantarte, apoyando en la caja  la mano contraria al pie extendido para ayudarte, hasta la posición inicial.\n\nTen en cuenta: \n- Mantén la espalda recta siempre. \n- Mantén los brazos hacia adelante para que te ayuden a mantener el equilibrio.\n- Evita levantar el talón de pie de apoyo.\n- Cada flexión es una repetición.","v":"https://youtube.com/shorts/xq4NEyavjfo","e":null,"h":5436,"t":3.6,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5487,"n":"Saltar a la cuerda","d":"Utiliza una cuerda de longitud apropiada, que te permita colocar las manos ligeramente por encima de las Cadera, con los codos cerca del cuerpo, formando un ángulo de unos 45°. \n\n- Salta sobre las puntas de tus pies, sin que tus talones lleguen a tocar el suelo.\n- Mantén el cuerpo lo más recto posible durante el ejercicio, mirando al frente, flexionando ligeramente las rodillas en cada salto. \n- No saltes muy alto. El objetivo es aumentar la velocidad de giro de la cuerda, saltando lo necesario para que la cuerda pase por debajo de tus pies, logrando un ritmo rápido y uniforme. \n- Minimiza el movimiento en Deltoides y brazos. El giro de la cuerda debe venir de las muñecas. Mantén los brazos relajados para facilitar el giro.","v":"https://youtube.com/shorts/T5R4qFFipjA","e":null,"h":null,"t":8.0,"m":["glúteos","gemelos"],"j":["hombros","codos","muñecas","cadera","rodillas","tobillos"]},{"i":5488,"n":"Giros articulares","d":"Realizaremos 5 giros en cada sentido de las principales articulaciones del cuerpo. \n\nLa secuencia es la siguiente: cuello, Deltoides, codos, muñecas, cadera, rodillas y tobillos.\n\nEl movimiento debe ser lento y controlado, utilizando el mayor rango de movimiento que permita cada articulación.","v":"https://youtu.be/EE-OwlWgR0Y","e":null,"h":null,"t":2.3,"m":["esternocleidomastoideo","escalenos"],"j":["cuello","hombros","codos","muñecas","cadera","rodillas","tobillos"]},{"i":5489,"n":"Balanceo de piernas (derecha)","d":"Apoya una mano sobre una pared u objeto cercano. Balancea la pierna interior (más cercana a la pared) hacia delante y hacia atrás. Empieza con ángulo pequeño y auméntalo hasta llegar a la máxima altura que te resulte cómoda.\n\n- Mantén la pierna relajada para lograr un movimiento fluido.\n- La rodilla puede doblarse ligeramente, pero no en exceso.\n- El cuerpo superior debe mantenerse estable, con poco movimiento y sin encorvar la espalda.","v":"https://youtube.com/shorts/S-vKqx6lakM","e":null,"h":null,"t":2.3,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera"]},{"i":5490,"n":"Balanceo de piernas lateral (derecha)","d":"Sitúate de cara a una pared y apoya ambas manos sobre ella, con los brazos estirados a la altura de los Deltoides. Desde esta posición cruza una pierna hacia un lado y después hacia el otro, pasando por delante del cuerpo.\n\nEmpieza realizando balanceos suaves y auméntalos hasta llegar a una altura que te resulte cómoda.\n\n- Mantén la pierna relajada para lograr un movimiento fluido.\n- La rodilla puede doblarse ligeramente, pero no en exceso.\n- El cuerpo superior debe mantenerse estable, con poco movimiento y sin encorvar la espalda. Mantén la mirada al frente.","v":"https://youtube.com/shorts/skEZTQEuHtw","e":null,"h":null,"t":2.3,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera"]},{"i":5491,"n":"Estiramiento de muñecas","d":"La posición de inicio es con las rodillas y las palmas de las manos en el suelo. Las manos estarán bajo los Deltoides, con los dedos extendidos hacia adelante.\n\nDesde esta posición, balancea el tronco hacia delante y hacia atrás.\n\nDespués de 5 repeticiones gira las manos, haciendo que los dedos miren hacia atrás. Balancea de nuevo el torso hacia delante y hacia atrás.\n\n- Realiza el movimiento de manera controlada, sin levantar nunca del suelo el talón de las manos.\n- Desplaza el torso lo suficiente para sentir tensión en las muñecas pero sin llegar a producir dolor.","v":"https://youtube.com/shorts/WzgOOguZVEE","e":null,"h":null,"t":2.3,"m":["pronadores","supinadores"],"j":["muñecas","rodillas"]},{"i":5492,"n":"Flexión escapular","d":"La posición inicial es idéntica a una flexión normal, con el cuerpo recto, apoyado sobre las manos y las puntas de los pies. Desde esta posición, baja el torso intentando juntar los omoplatos, manteniendo los brazos rectos. Al subir, separa los omoplatos todo lo que puedas, como intentando que sobresalga la columna vertebral.\n\n- Mantén la tensión abdominal. No permitas que baje la cadera o se doble la espalda.\n- No dobles el cuello. Debería estar en posición neutra, alineado con la espalda.\n- Si te cuesta mantener esta postura, puedes apoyarte sobre los antebrazos, manteniendo los codos doblados.\n- Realiza el ejercicio despacio, con una pequeña pausa al principio y al final.","v":"https://youtube.com/shorts/_B3bdufWMgI","e":null,"h":null,"t":2.3,"m":["pectorales","dorsales"],"j":["hombros"]},{"i":5493,"n":"Dominada escapular","d":"Cuélgate de una barra con los brazos estirados y agarre pronado (palmas de las manos mirando hacia delante). \n\nDesde esta posición, elévate unos centímetros sin usar los brazos. Para ello debes usar un encogimiento inverso, utilizando los músculos alrededor de las escápulas (omoplatos) para elevar el cuello y pecho, manteniendo los brazos rectos.\n\n- Tensa los abdominales para minimizar el balanceo.\n- Piensa también en activar los dorsales, para mejorar la estabilidad. Puedes lograr esto haciendo el gesto de empujar hacia abajo con la parte externa de las manos, como si quisieras doblar la barra.","v":"https://youtube.com/shorts/9ON0JOAW0FA","e":null,"h":null,"t":2.5,"m":["deltoides","dorsales"],"j":["hombros"]},{"i":5494,"n":"Saltos con separación de piernas","d":"La posición de inicio es de pie, con las piernas juntas y los brazos estirados, pegados al cuerpo. Desde esta posición salta y abre las piernas, a la vez que juntas los brazos por encima de la cabeza. Sin descanso, salta de nuevo para regresar a la posición inicial. Repite durante el tiempo indicado, manteniendo un ritmo constante.","v":"https://youtube.com/shorts/wDfVbpCRuq0","e":null,"h":null,"t":2.8,"m":["cuádriceps","isquiotibiales","glúteos","deltoides"],"j":["cadera","rodillas","tobillos","hombros"]},{"i":5495,"n":"Saltos cruzados","d":"La posición de inicio es de pie, con las piernas abiertas y los brazos levantados hacia los lados.\nDesde esta posición salta a la vez que cruzas una pierna por delante de la otra y un brazo por delante del otro. Regresa ahora con otro salto a la posición inicial. Salta de nuevo cruzando piernas y brazos por delante del cuerpo, pero esta vez alternando la pierna y brazo que cruza por arriba.\n\n- No olvidas alternar los lados, cruzando en una repetición el brazo y pierna derecha por encima y el brazo y pierna izquierda en la siguiente repetición.","v":"https://youtube.com/shorts/8-U7uV20ZpQ","e":null,"h":null,"t":2.8,"m":["cuádriceps","isquiotibiales","glúteos","deltoides"],"j":["cadera","rodillas","tobillos","hombros"]},{"i":5496,"n":"Correr en el sitio","d":"Consiste básicamente en simular un movimiento de carrera sin desplazamiento. Utiliza piernas y brazos, sin un excesivo movimiento vertical y sin elevar mucho las rodillas. Te apoyarás principalmente en las puntas de los pies. Los talones deben tocar el suelo levemente en cada paso.\n\n- Si entrenas en un parque o tienes suficiente espacio puedes reemplazarlo por carrera normal.","v":"https://youtube.com/shorts/9jqQKaHHOn0","e":null,"h":null,"t":2.8,"m":["cuádriceps","abdominales"],"j":["rodillas","cadera","tobillos"]},{"i":5497,"n":"Vaca-gato","d":"Colócate en posición cuadrúpeda, con las rodillas bajo las Cadera y las manos bajo los Deltoides, con los dedos abiertos. Inspira a la vez que “alargas” el cuerpo, como intentando separar la cabeza por un lado (estira el cuello, alejando las orejas de los Deltoides) y el coxis por el otro, a la vez que mantienes el peso distribuido de manera homogénea entre manos y rodillas, presionando contra el suelo.\n\nAguanta esta posición unos segundos y, desde ahí, espira mientras encorvas la espalda y acercas la barbilla al pecho. A medida que curvas la espalda y escondes la cabeza debes contraer el abdomen, como intentando que los abdominales toquen la columna vertebral. Esto maximiza la contracción del transverso abdominal, tu faja natural. Si tu transverso es fuerte, estarás más protegido de lesiones.","v":"https://youtube.com/shorts/srmCEUowYEs","e":null,"h":null,"t":2.3,"m":["erector de la columna","recto mayor del abdomen","trapecios"],"j":["rodillas","cadera","hombros"]},{"i":5498,"n":"Hollow body rock","d":"Adopta la postura de hollow hold, con brazos y pies elevados, orejas entre brazos y espalda lumbar tocando el suelo.\n\nDesde esta posición empieza a mecerte hacia delante y hacia atrás, sin alterar la forma del cuerpo.","v":"https://youtube.com/shorts/SCzhtvjw3pA","e":null,"h":null,"t":2.5,"m":["recto mayor del abdomen","abdominales oblicuos","cuádriceps","psoas - iliaco"],"j":["cadera"]},{"i":5499,"n":"Iron cross","d":"Túmbate en el suelo boca arriba, con los brazos estirados hacia los lados, formando una cruz. Eleva las piernas y dobla las rodillas. Los muslos deberían formar un ángulo de 90 grados con el tronco. \n\nDesde esta posición, lleva las piernas hacia un lado, de manera controlada, hasta que toquen el suelo o lleguen lo más cerca posible. Repite hacia el otro lado.","v":"https://youtube.com/shorts/eIQyL26msA4","e":null,"h":null,"t":2.3,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["cadera","rodillas"]},{"i":5500,"n":"Iron cross alta","d":"Túmbate en el suelo boca arriba, con los brazos estirados hacia los lados, formando una cruz. \n\nDesde esta posición, lleva el pie derecho hacia la mano izquierda, doblando la pierna lo necesario. Repite hacia el otro lado.","v":"https://youtu.be/zydMuACA08Q","e":null,"h":null,"t":2.3,"m":["recto mayor del abdomen","abdominales oblicuos","cuádriceps","psoas - iliaco"],"j":["cadera","rodillas"]},{"i":5501,"n":"Iron cross inversa","d":"Túmbate en el suelo boca abajo, con los brazos estirados hacia los lados, formando una cruz.\n\nDesde esta posición, lleva el pie derecho lo más cerca que puedas de la mano izquierda, doblando la pierna lo necesario. Repite hacia el otro lado. Intenta que el movimiento sea rítmico y seguido.","v":"https://youtube.com/shorts/VENLqndN3fo","e":null,"h":null,"t":2.3,"m":["erector de la columna","glúteos","isquiotibiales"],"j":["cadera","rodillas"]},{"i":5502,"n":"Sentadilla con calentamiento de muñecas","d":"Colócate en sentadilla, con los talones pegados al suelo. Adelante el torso, apoyándote con la punta de los pies (separando los talones del suelo), a la vez que apoyas las manos en el suelo, estirando las muñecas.\n\nRegresa a la posición de sentadilla, y adelanta de nuevo el cuerpo, apoyándote esta vez sobre el reverso de las manos. Repite alternando lados. Explora también diferentes ángulos para calentar bien las articulaciones.","v":"https://youtube.com/shorts/FI70-oBkdLk","e":null,"h":null,"t":2.3,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5503,"n":"Rotación de cadera","d":"Colócate en sentadilla, con los talones pegados al suelo.  Lleva la rodilla derecha hacia atrás, todo lo que te permite tu movilidad. Desde aquí adelanta la rodilla para que toque el suelo delante del cuerpo, y regresa a la posición inicial. \n\nRepite ahora con la pierna izquierda.","v":"https://youtube.com/shorts/ez0d25lZ7Oc","e":5504,"h":null,"t":2.3,"m":["glúteos","isquiotibiales","cuádriceps","abductores"],"j":["cadera","rodillas"]},{"i":5504,"n":"Rotación de cadera y estiramiento","d":"Colócate en sentadilla, con los talones pegados al suelo. Lleva la rodilla derecha hacia atrás, todo lo que te permite tu movilidad. Desde aquí adelanta la rodilla para que toque el suelo delante del cuerpo, y abre completamente la cadera, apoyándote sobre la rodilla. Repite ahora con la pierna izquierda.","v":"https://youtube.com/shorts/v9CQjFSUiJ0","e":5505,"h":5503,"t":2.3,"m":["glúteos","isquiotibiales","cuádriceps","abductores"],"j":["cadera","rodillas"]},{"i":5505,"n":"Sentadilla 90/90","d":"Siéntate en el suelo, con las piernas dobladas delante de ti, en ángulos de 90° y con ambas rodillas mirando hacia el mismo lado.\n\nAdelanta los brazos para actuar de contrapeso, y gira las piernas para que ambas rodillas queden apuntando ahora hacia el lado opuesto, manteniendo los 90° en las piernas. Alterna lados durante el tiempo establecido.\n\n-Si no puedes realizar el ejercicio, simplifícalo echando el torso hacia atrás y apoyando las manos en el suelo mientras giras las piernas.","v":"https://youtube.com/shorts/2RrcpFBOp0s","e":5506,"h":5504,"t":2.3,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},{"i":5506,"n":"Paseo silencioso","d":"Desde la posición de sentadilla, pasa a cuclillas, y estira la pierna derecha todo lo que puedas, apoyando después el pie del mismo lado. Apoyándote en el pie izquierdo sitúa el cuerpo sobre el pie derecho, y repites el proceso por el otro lado: adelantas la pierna izquierda todo lo posible, apoyas el pie y sigues avanzando, alternando lados.\n\n- Intenta mantener la cadera lo más cerca del suelo posible.","v":"https://youtube.com/shorts/4WIg-_wAOpA","e":null,"h":5505,"t":2.3,"m":["cuádriceps","glúteos","gemelos"],"j":["cadera","rodillas","tobillos"]},{"i":5507,"n":"Talones a glúteos","d":"Estando de pie, con el cuerpo recto, eleva los talones de manera alternada para llevarlos hacia los Glúteos.\n\n- Puedes colocar las manos detrás del cuerpo para validar la altura a la que llegas con los talones.","v":"https://youtube.com/shorts/3HUQHubwl98","e":null,"h":null,"t":2.8,"m":["isquiotibiales","gemelos"],"j":["tobillos","rodillas"]},{"i":5508,"n":"Rodillas a pecho","d":"Estando de pie, con el cuerpo recto, simula que corres en el sitio, pero con un movimiento marcado de elevación de rodillas, que deberían llevarse hacia el pecho (lo que puedas) en cada zancada.","v":"https://youtube.com/shorts/dAL5hFfJiX4","e":null,"h":null,"t":2.8,"m":["gemelos","glúteos","isquiotibiales"],"j":["tobillos","rodillas","cadera"]},{"i":5510,"n":"Escaleras","d":"Estando de pie, con el cuerpo recto, flexiona la cadera para llevar las manos al suelo, lo más cerca de los pies que puedas, sin doblar las rodillas.\n\nCamina hacia delante con las manos, hasta que el cuerpo esté en línea recta, con las manos debajo de los Deltoides. Sin levantar las manos del suelo, camina ahora con los pies, acercándolos lo más posible a las manos, manteniendo rectas las rodillas.\n\n- Si no tienes suficiente flexibilidad dobla ligeramente las rodillas.\n- Si el ejercicio te parece fácil, camina un poco más con las manos, adelantándolas respecto al torso (quedarán por delante de los Deltoides) antes de empezar a caminar con los pies.","v":"https://youtube.com/shorts/jh-XOJQKc_M","e":null,"h":null,"t":2.5,"m":["recto mayor del abdomen","deltoides","cuádriceps","glúteos"],"j":["muñecas","hombros","cadera","tobillos"]},{"i":5511,"n":"Paseo de cangrejo","d":"Siéntate en el suelo con las piernas dobladas delante de ti, y las manos apoyadas en el suelo. Levanta la cadera, manteniendo el apoyo en los pies y manos.\n\nDesde esta posición, avanza la mano derecha y el pie izquierdo, y posteriormente la mano izquierda y el pie derecho, así sucesivamente.\n\n- Mantén el pecho elevado y las orejas alejadas de los Deltoides. No encojas los Deltoides al avanzar.\n- Los pasos de las manos y los pies deben ser de la misma longitud, para mantener la misma posición del cuerpo durante todo el tiempo.\n- Si llegas al final de la habitación puedes regresar haciendo el movimiento inverso (caminando hacia atrás) o darte la vuelta para avanzar de frente hacia el otro lado.","v":"https://youtube.com/shorts/vxidhTPQTvw","e":null,"h":null,"t":2.3,"m":["deltoides","dorsales","recto mayor del abdomen","glúteos","isquiotibiales"],"j":["cadera","rodillas","tobillos","hombros","muñecas"]},{"i":5512,"n":"Paseo de oso","d":"La posición de inicio es apoyado con las puntas de los pies y las manos en el suelo. Las manos deben estar lo más cerca de los pies que te permita mantener las piernas rectas o con una ligera flexión de rodillas.\n\nCamina hacia delante moviendo a la vez la mano y el pie de lados opuestos, intercambiando en la siguiente zancada.","v":"https://youtube.com/shorts/79MjdSR6nGk","e":null,"h":null,"t":2.3,"m":["deltoides","recto mayor del abdomen","cuádriceps"],"j":["cadera","rodillas","tobillos","hombros","muñecas"]},{"i":5513,"n":"Paseo de hombre araña","d":"Apóyate en el suelo con las manos y las puntas de los pies, con el cuerpo estirado salvo una ligera flexión de rodilla. Los codos deben estar también flexionados, con el pecho a un palmo del suelo.\n\nDesde esta posición levanta el pie derecho y la mano izquierda. Avanza con el pie derecho hasta que la rodilla quede al nivel del codo derecho o un poco adelantada, a la vez que la mano izquierda se apoya en el suelo por delante del cuerpo. Repite por el lado contrario y sigue avanzando en un movimiento fluido, sin pausas.","v":"https://youtube.com/shorts/jKcM-845it4","e":null,"h":null,"t":2.3,"m":["deltoides","recto mayor del abdomen","cuádriceps"],"j":["cadera","rodillas","tobillos","hombros","muñecas"]},{"i":5514,"n":"Deslizamiento escapular","d":"Ponte de pie de espaldas a una pared manteniendo contacto con ella en la parte posterior de la cabeza y el sacro, con una curva lumbar natural. Extiende los brazos a los lados, con los codos en ángulos de 90°, con el dorso de las manos lo más cerca posible de la pared, idealmente en contacto con ella.\n\nEl ejercicio consiste en deslizar el dorso de las manos por la pared hacia arriba y hacia abajo, intentando mantener las escápulas juntas durante el movimiento.\n\n- Para hacer el ejercicio más fácil puedes separar más los pies de la pared y flexionar ligeramente las rodillas.\n- No debes “mostrar las costillas”. La caja torácica debe estar alineada con la cadera, para lo cual quizá tengas que tensar ligeramente los abdominales.\n- Para juntar las escápulas piensa también en elevar ligeramente el pecho y llevar los Deltoides hacia atrás y hacia abajo.","v":"https://youtube.com/shorts/Fk1HucHwD8M","e":null,"h":null,"t":2.3,"m":["dorsales","trapecios","deltoides"],"j":["hombros","codos"]},{"i":5515,"n":"Wall angels","d":"Ponte de espaldas a la pared y apóyate en la pared.\nSepara un poco los pies de la pared.\nMantén tus hombros, tu cabeza y tu trasero pegados a la pared.\n\nDeja la curva natural de tu espalda.\n\nSube tus brazos pegados a la pared por encima de 90 grados\nTus dedos y codos deben tocar siempre la pared en todo el recorrido. Si cuando intentas subir los brazos se te despegan los codos, no sigas subiendo, es preferible mantener los codos sobre la pared, poco a poco lograrás subir más.\n\nNota:\n\n- Para hacer el ejercicio más dificil apoya completamente tu espalda, sin dejar curvatura alguna (no podrás pasar los dedos entre tu espalda y la pared). Para esto debes activar los músculos de tu abdomen (como si tu ombligo quisiera acercarse a la pared).","v":"https://youtube.com/shorts/7x77w5Oq0eo","e":null,"h":null,"t":2.3,"m":["deltoides","dorsales","recto mayor del abdomen"],"j":["hombros","codos"]},{"i":5516,"n":"Superman","d":"Es el opuesto del Hollow hold. Túmbate boca abajo, con las piernas juntas y los brazos estirados por encima de la cabeza. Tensa los Glúteos y la zona lumbar para elevar simultáneamente el torso y las piernas, manteniendo sólo en contacto con el suelo la zona media del cuerpo.\n\n- Intenta mantener los pies juntos y los brazos completamente estirados, con la cabeza entre ellos.","v":"https://youtube.com/shorts/fXphNGB9aGM","e":null,"h":null,"t":3.0,"m":["erector de la columna","glúteos","trapecios"],"j":["hombros","cadera"]},{"i":5517,"n":"Estiramiento cuádriceps","d":"Aprieta el pie contra el glúteo durante unos segundos hasta que sientas cómo se estira el cuádriceps. Libera el pie para que regrese al suelo, dando un paso y repitiendo el proceso por el otro lado. En cada estiramiento irás por tanto avanzando un paso.","v":"https://youtube.com/shorts/UwumA9Q4efo","e":null,"h":null,"t":2.3,"m":["cuádriceps"],"j":["cadera","rodillas"]},{"i":5518,"n":"Calentamiento perro (derecha)","d":"Colócate en posición cuadrúpeda, con manos y rodillas apoyadas en el suelo. Desde esta posición, eleva la rodilla lateralmente todo lo que puedas sin rotar el torso, manteniendo la pierna doblada. Realiza una pequeña pausa en esa posición y regresa la rodilla al punto de partida. Ahora, sin pausa, eleva la pierna hacia atrás, lo más alto que puedas sin doblar la espalda. Regresa a la posición de origen. Realiza todas las repeticiones seguidas por un lado y después por el otro.\n\n- Minimiza el movimiento del torso durante el ejercicio.\n- Mantén el ángulo de 90° en la rodilla durante todo el ejercicio.","v":"https://youtube.com/shorts/Cj4Ggvt9TlE","e":null,"h":null,"t":2.3,"m":["glúteos","isquiotibiales","cuádriceps"],"j":["rodillas","cadera","muñecas"]},{"i":5519,"n":"Tabla de deltoides","d":"Siéntate en el suelo, apóyate en pies y manos. Eleva la cadera hasta la altura de los Deltoides, de tal forma que rodillas, cadera y Deltoides estén alineados. Mantén la posición el tiempo indicado.\n\n- Los pies deben quedar debajo de las rodillas y las manos debajo de los Deltoides.\n- Intenta juntar los omoplatos (retracción escapular), elevando el pecho y rotando externamente los Deltoides.","v":"https://youtube.com/shorts/dMVxAVuOS_Q","e":5520,"h":null,"t":2.3,"m":["glúteos","trapecios","deltoides"],"j":["rodillas","hombros","muñecas"]},{"i":5520,"n":"Tabla de deltoides dinámica","d":"Siéntate en el suelo, apóyate en pies y manos. Eleva la cadera hasta la altura de los Deltoides, de tal forma que rodillas, cadera y Deltoides estén alineados.\n\nDesde esta posición eleva la mano y pie derechos a la vez que rotas el cuerpo hacia la izquierda, apoyándote después en manos y puntas de los pies (rodilla flexionadas), mirando hacia abajo y, sin pausa, sigues girando en el mismo sentido para terminar en la misma posición que al inicio (pero en un lugar diferente). Ahora realiza el movimiento inverso, girando hacia el otro lado hasta llegar a la misma posición y lugar del principio. Una repetición equivale a un giro completo hacia un lado y un giro completo hacia el otro lado, regresando al punto de partida.\n\n- Durante el giro, intenta mantener la cadera elevada, no permitiendo que descienda.","v":"https://youtube.com/shorts/6S5Z-wmCe8U","e":null,"h":5519,"t":2.3,"m":["glúteos","trapecios","deltoides"],"j":["rodillas","hombros","muñecas"]},{"i":5521,"n":"Giro y apertura en v","d":"Sentado en el suelo, rueda hacia atrás, llevando los pies lo más lejos que puedas, idealmente hasta que toquen el suelo. Sin pausa en el movimiento, rueda de nuevo hacia adelante, estirando y abriendo las piernas hasta que lleguen al suelo, adelantando el torso para intentar tocar las puntas de los pies con las manos.\n\n- Controla el impulso hacia atrás para no lastimarte el cuello. Coloca los brazos a los lados de la cabeza de tal manera que puedas frenar el movimiento si es necesario.\n- Si no llegas con los pies al suelo no te preocupes. Intenta ir mejorando poco a poco, llegando cada vez más cerca.","v":"https://youtube.com/shorts/ITZ8UJ_uF8U","e":null,"h":null,"t":2.3,"m":["recto mayor del abdomen","abdominales oblicuos","cuádriceps","psoas - iliaco"],"j":["cadera"]},{"i":5522,"n":"Patada en cruce lateral","d":"Colócate en posición cuadrúpeda, mirando hacia abajo, apoyado únicamente en manos y puntas de los pies (con las rodillas ligeramente elevadas sobre el suelo). Desde esta posición eleva la mano izquierda y el pie derecho, a la vez que giras el cuerpo hacia la izquierda, pasando la pierna derecha por debajo del cuerpo y estirándola completamente hacia un lado para completar el movimiento. En esta posición final, el pie izquierdo queda completamente apoyado en e ,"h":null,"t":2.5,"m":["glúteos","isquiotibiales","cuádriceps"],"j":["cadera","rodillas","tobillos"]},{"i":5590,"n":"Levantamiento de piernas","d":"Cuélgate de la barra con agarre pronado (palmas mirando al frente), con una apertura un poco mayor de la altura de tus Deltoides, con los brazos totalmente estirados, pero manteniendo tensión en la zona superior de la espalda. \n\nManteniendo las piernas rectas (o con una leve flexión de rodillas), eleva las piernas de manera controlada (sin impulso), hasta que los pies lleguen a la altura del pecho. Desciende de manera controlada hasta la posición de inicio y repite el número de veces indicado.\n\n- Tensa la musculatura abdominal para evitar que se balancee el cuerpo.\n- Si no puedes llegar con las piernas a la altura del pecho puedes subir solo hasta que estén paralelas al suelo.\n- No te impulses con las piernas. El movimiento debe ser controlado.","v":"https://youtube.com/shorts/aXpjtO79Bao","e":null,"h":5638,"t":3.5,"m":["abdominales","bíceps","pectorales","cuádriceps"],"j":["muñecas","hombros","cadera"]},{"i":5592,"n":"Desplante hacia delante","d":"Empieza de pie, con las manos en la cadera o con los brazos estirados a lo largo del cuerpo. Da una zancada hacia delante con la rodilla derecha y agacha el torso, hasta que la rodilla llegue prácticamente al suelo. En este punto ambas rodillas deberían formar un ángulo aproximado de 90°, pero puede haber pequeñas variaciones en cada zancada.\n\nDesde esta posición, empuja con el talón derecho para regresar a la posición inicial, y repite por el lado izquierdo.","v":"https://youtube.com/shorts/KXWwsIZdHOw","e":null,"h":null,"t":3.5,"m":["glúteos","cuádriceps","isquiotibiales"],"j":["cadera","rodillas","tobillos"]},{"i":5593,"n":"Desplante hacia atrás","d":"Empieza de pie, con las manos en la cadera o con los brazos estirados a lo largo del cuerpo. Da una zancada hacia atrás con la rodilla derecha y agacha el torso, hasta que la rodilla se acerque al suelo, formando un án
