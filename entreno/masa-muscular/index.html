<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masa muscular · 12 semanas</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d1015"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Masa muscular"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1015;--card:#171c24;--card2:#1e2530;--line:#2a3340;--tx:#eef2f7;--mu:#8e9bb0;--ok:#3ddc97;--c:#ff6a3d;--c2:#ffb43d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:20px 20px 80px}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3,.big{font-family:'Barlow Condensed','Arial Narrow',Inter,system-ui,sans-serif;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:34px;font-weight:800;flex:1;min-width:200px}
.back,.btn{border-radius:12px;font-weight:700}
.back{background:var(--card);border:1px solid var(--line);padding:9px 14px;font-weight:600;font-size:14px}
.back:hover{border-color:var(--c)}
.sub{color:var(--mu);font-size:14px}
.btn{background:var(--c);color:#0d1015;padding:12px 18px;font-size:15px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--c)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.bar{height:8px;border-radius:8px;background:var(--card2);margin:10px 0 6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c);border-radius:8px}
.wk{margin-bottom:14px}
.wk h2{font-size:26px;font-weight:800;display:flex;align-items:baseline;gap:10px}
.wk h2 small{font-family:Inter;font-size:12px;color:var(--mu);font-weight:600}
.sgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:10px}
.stile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;position:relative;min-height:84px;transition:.15s}
.stile:hover{border-color:var(--c);transform:translateY(-2px)}
.stile b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:26px;font-weight:800;display:block;line-height:1}
.stile span{font-size:11.5px;color:var(--mu);display:block;margin-top:6px;line-height:1.3}
.stile.done{background:#12261e;border-color:#245a41}
.stile.done::after{content:"✓";position:absolute;top:8px;right:11px;color:var(--ok);font-weight:800}
.stile.next{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}
.stile.rest{opacity:.8}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mu);font-weight:600}
.chip.c{color:var(--c);border-color:var(--c)}
.chip.lv{color:var(--c2);border-color:var(--c2)}
.block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.bh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bh h3{font-size:22px;font-weight:700}
.obs{color:#c4cddb;font-size:14px;line-height:1.55;white-space:pre-line;margin:6px 0 10px}
.ln{padding:7px 0;border-top:1px solid var(--line);font-size:14.5px;display:flex;gap:10px;flex-wrap:wrap}
.ln .nm{flex:1;min-width:160px;font-weight:600;cursor:pointer}
.ln .nm:hover{color:var(--c)}
.ln .qt{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:20px;font-weight:700;color:var(--c)}
.bigplay{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
.bigplay .btn{font-size:17px;padding:15px 24px}
.pres{color:#c9d2df;font-size:14.5px;line-height:1.65;white-space:pre-line}
.pres h3{font-size:24px;margin:16px 0 4px;color:var(--tx);white-space:normal}
details.card summary{cursor:pointer;font-weight:700}
/* guided */
#g{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#g.on{display:flex}
#g.rest{background:radial-gradient(circle at 50% 35%,#12315e 0,#0b1220 70%)}
#g.work{background:radial-gradient(circle at 50% 35%,#4a1c0d 0,#140b08 70%)}
#g.reps{background:radial-gradient(circle at 50% 35%,#1c2a44 0,#0d1015 72%)}
#g.intro{background:radial-gradient(circle at 50% 30%,#2b2150 0,#0d1015 72%)}
#g.cardio{background:radial-gradient(circle at 50% 35%,#0f3a2a 0,#0a1511 70%)}
.gtop{display:flex;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap}
.gtop .lbl{flex:1;font-size:14.5px;color:#c4cddb;min-width:200px}
.gtop .lbl b{color:var(--c)}
.cap{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--c2);padding:0 8px}
.gbar{height:6px;background:rgba(255,255,255,.1)}
.gbar i{display:block;height:100%;background:var(--c);transition:width .3s}
.gmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 20px;gap:6px;min-height:0;overflow:auto}
.gphase{font-size:clamp(15px,2.2vw,24px);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
.gname{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:clamp(34px,6.5vw,92px);line-height:1.02;text-transform:uppercase}
.gtimer{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:clamp(120px,31vh,400px);line-height:.95;font-variant-numeric:tabular-nums}
.gtimer.low{color:#ffd23d}
.gtimer.pulse{animation:p .5s infinite alternate}
@keyframes p{to{transform:scale(1.05)}}
.gsub{font-size:clamp(15px,1.9vw,22px);color:#c4cddb;max-width:900px;line-height:1.5;white-space:pre-line}
.gintro{max-width:860px;text-align:left;font-size:clamp(15px,1.7vw,20px);line-height:1.6;color:#d3dbe8;white-space:pre-line}
.gnext{padding:12px 20px;text-align:center;color:var(--mu);font-size:clamp(14px,1.7vw,19px);min-height:48px}
.gnext b{color:var(--tx)}
.gctl{display:flex;gap:10px;justify-content:center;padding:6px 16px 22px;flex-wrap:wrap}
.gctl .btn{min-width:110px;font-size:16px;padding:14px 20px}
.gdone{background:var(--ok)!important;font-size:24px!important;padding:18px 44px!important}
.mod{position:fixed;inset:0;background:rgba(5,8,12,.84);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.mod.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.mbox h2{font-size:30px;font-weight:800;text-transform:uppercase}
.mbox .tx{white-space:pre-line;line-height:1.6;color:#c9d2df;font-size:15px;margin:12px 0}
.mbox .tx b{color:var(--tx)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lbl2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-top:12px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sum{text-align:center;max-width:520px;margin:auto;padding:20px}
.sum h2{font-size:clamp(48px,8vw,90px);font-weight:800;color:var(--ok)}
textarea,input,select{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:inherit}
textarea{width:100%;height:110px;font:12px monospace}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px;font-weight:600}
@media (max-width:600px){body{padding:14px 12px 70px}.top h1{font-size:26px}}
</style>
</head>

lemente en la naturaleza."}],"vid":{}},{"n":3,"kind":null,"blocks":[{"k":"wu","title":"Calentamiento y movilidad"},{"k":"sets","title":"Rest-pause con tiempo límite","n":1,"items":[{"ex":"Sentadillas pistol (pierna derecha)","r":"55"},{"ex":"Sentadillas pistol (pierna izquierda)","r":"55"},{"ex":"Remo en suspensión","r":"55"},{"ex":"Flexiones con palmada","r":"55"}],"obs":"Completa la secuencia (55 repeticiones de cada ejercicio) en un tiempo límite de 20 min. Reparte las repeticiones en las series que necesites, con pausas cortas.","rest":0,"lv":null,"cap":1200}],"vid":{"all":"x46ABmgc7Rg"}},{"n":4,"kind":null,"blocks":[{"k":"wu","title":"Calentamiento y movilidad"},{"k":"tab","title":"Tábata de transporte (x4)","structs":[{"ex":["Transporte unilateral (D)"]},{"ex":["Plank clásico"]},{"ex":["Transporte unilateral (I)"]},{"ex":["Sentadas"]}],"obs":"Realiza una sesión tábata para cada uno de estos ejercicios, sin descanso entre ellos. El peso ideal del transporte debería situarse sobre el 30% de tu peso. Si lo haces con banda elástica, el objetivo es mantener la postura erguida de forma estática durante los 20''.","between":0,"rounds":8,"lv":null,"work":20,"rest":10},{"k":"tab","title":"Tábata con goma (Pallof press)","structs":[{"ex":["Pallof press (D)","Pallof press (I)"]}],"obs":"Realiza una sesión tábata alternando estos 2 ejercicios. Mantén la postura erguida y con una rotación neutral soportando la tensión intensa de la goma durante 20''. Alternamos posiciones a cada intervalo de trabajo.","between":60,"rounds":8,"lv":null,"work":20,"rest":10},{"k":"cardio","title":"Ejercicio aeróbico","mins":25,"obs":"Puedes hacerlo en una elíptica, bicicleta, natación o un paseo activo rodeado de naturaleza. Debe ser una intensidad suave que te permita hablar tranquilamente. Esta intensidad se asocia con el transporte de oxígeno y nutrientes a los tejidos y por tanto ayuda a una recuperación de más calidad que un reposo completo. Con pulsómetro suele situarse sobre las 120-13  número de dominadas que te marca la tabla según tu resultado en el test, durante un minuto. Descansa el tiempo que te sobre hasta el siguiente minuto.","expl":null,"lv":null},{"k":"sets","title":"Intervalo a 5 vueltas de 3 ejercicios","n":5,"items":[{"ex":"Saltos a cuerda dobles","r":"10"},{"ex":"Australian pull up","r":"10"},{"ex":"Flexiones manos arriba","r":"10"}],"obs":"Realiza 5 vueltas en 10 minutos de tiempo límite, sin pausas programadas (para solo si necesitas bajar pulsaciones o por fatiga muscular). Busca continuamente el fallo muscular real y que los descansos no superen los 10-15''. Adapta tu carga: debe obligarte a una breve pausa en cada serie. El bloque termina al finalizar las repeticiones o a los 10 minutos.","rest":0,"lv":null,"cap":600},{"k":"sets","title":"Tríceps con peso corporal","n":3,"items":[{"ex":"Tríceps con peso corporal","r":"10"}],"obs":"Realiza 3 series de 10 repeticiones del ejercicio descrito en el vídeo. Los descansos son libres entre series, aunque se recomienda un mínimo de 1 minuto. Cuida mucho la colocación de la cadera.","rest":60,"lv":"m35","cap":null},{"k":"tab","title":"Tábata de sentadilla con salto","structs":[{"ex":["Sentadilla con salto"],"note":"Objetivo: 64 reps en total (por ejemplo, 8 por intervalo de 20'')."}],"obs":"Busca un total de 64 repeticiones, trabajando muy cerca del fallo muscular (o experimentándolo) en cada intervalo. Elige una carga que te exija pero que también te permita llegar a la octava repetición de cada intervalo.","between":60,"rounds":8,"lv":null,"work":20,"rest":10}],"vid":{}},{"n":2,"kind":"rest","blocks":[{"k":"cardio","title":"Descanso activo: paseo","mins":60,"obs":"Es importante darle el tiempo necesario a tu cuerpo para que se adapte a las nuevas rutinas. Para esta sesión se recomienda descansar de forma activa: sal a andar 1 hora, preferiblemente en la naturaleza."}],"vid":{}},{"n":3,"kind":null,"blocks":[{"k":"wu","title":"Calentamiento y movilidad"},{"k":"lad","title":"To the one", a el máximo de repeticiones; anota el total al acabar."}],"obs":"Realiza 8 x 20''-10'' con la intención de sumar el número máximo de repeticiones. Sé estratégico y no te fatigues en exceso en los primeros intervalos: busca una cifra lineal y sostenible hasta el intervalo 6 o 7, y entrégate al 100% en el octavo. Resultado: 24-32 → Nivel 1; 33-44 → Nivel 2; 45 o más → Nivel 3. Si mejoras y subes de nivel, la semana siguiente podrás seguir los parámetros del nivel superior.","between":0,"rounds":8,"lv":null,"work":20,"rest":10},{"k":"sets","title":"Superserie 1","n":3,"items":[{"ex":"Shoulder taps","r":"10"},{"ex":"Fondos en paralelas","r":"6"}],"obs":"Superserie: dos ejercicios sin descanso entre ellos y descansando 1-2 minutos después del segundo. Intenta llegar al fallo -2.","rest":90,"lv":"n1","cap":null},{"k":"sets","title":"Superserie 2","n":3,"items":[{"ex":"Extensiones dorsales pino en pared","r":"6"},{"ex":"Flexiones","r":"6"}],"obs":"Superserie: dos ejercicios sin descanso entre ellos y descansando 1-2 minutos después del segundo. Intenta llegar al fallo -2.","rest":90,"lv":"n1","cap":null},{"k":"sets","title":"Superserie: flexiones pino y fondos","n":4,"items":[{"ex":"Flexiones pino","r":"6-5-4-3"},{"ex":"Fondos en paralelas","r":"6-5-4-3"}],"obs":"Superserie: dos ejercicios sin descanso entre ellos y descansando 1-2 minutos después del segundo. 6, 5, 4 y 3 repeticiones en cada ronda. Intenta llegar al fallo -1.","rest":90,"lv":"n23","cap":null},{"k":"tab","title":"Sentadilla a una pierna (16 intervalos)","structs":[{"ex":["Sentadilla a 1 pierna (D)","Sentadilla a 1 pierna (I)"],"note":"Objetivo: 6 repeticiones al fallo en cada intervalo."}],"obs":"Realiza 16 x 20''-10'' con la intención de hacer 6 repeticiones al fallo, alternando pierna en cada intervalo de trabajo.","between":0,"rounds":16,"lv":null,"work":20,"rest":10}],"vid":{"all":"guG5U_-dVIs"}}]}],"lib":{"5252":{"n":"Flexión","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Desde aquí impúlsate con las manos para elevar el tronco manteniendo el cuerpo alineado y paralelo al suelo. Vuelve a la posición inicial pero sin llegar a apoyar el pecho con el suelo para hacer la siguiente repetición.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/fOOIttCJizc","e":5253,"h":5264,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},"5253":{"n":"Flexión diamante","d":"Túmbate boca abajo con las palmas apoyadas en el suelo y ambas manos cerca, donde índices y pulgares de cada mano se toquen para formar un diamante.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar las manos pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/BOqw8btbzWg","e":5254,"h":5319,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},"5892":{"n":"Zancada con salto con peso","d":"Sujetando la kettlebell con las dos manos a la altura del pecho da un paso largo hacia adelante y desde esta posición, haz un salto vertical para cambiar de pierna . El ejercicio se hace sin desplazamiento. Durante el salto las piernas quedan completamente estiradas y se intercambian en el aire. Amortigua realizando el movimiento de zancada.\n\n**Ten en cuenta:**\n\n- Extiende tu cuerpo durante el salto. \n- Amortigua la caída. \n- Descenso en un plano completamente vertical. \n- Baja suavemente hasta que tu rodilla conecte con el suelo. \n- Que la rodilla de la extremidad avanzada no sobrepase la altura del pie.\n- Cuenta una repetición por salto.","v":"https://youtube.com/shorts/y5KQpmeC3iM","e":null,"h":null,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos"]},"5262":{"n":"Dominada","d":"Colgando de una barra con los dedos de las manos hacia adelante y los brazos estirados, flexiona los codos elevando todo el cuerpo hasta que tu barbilla quede a la altura de la barra. Vuelve a la posición inicial para terminar.\n\n**Ten en cuenta:**\n\n- Extiende bien los brazos al terminar el descenso. \n- El movimiento de flexión debe llevar como mínimo tu barbilla a la altura de la barra. \n- Relaja el cuello. \n- Mantén tu espalda recta. \n- Cuenta una repetición por cada elevación.","v":"https://youtu.be/Ceem40FPgWA","e":5361,"h":5359,"m":["dorsales","trapecios","pectorales"],"j":["codos","hombros"]},"5903":{"n":"Pallof press (derecha)","d":"1. Sujeta una banda a una barra vertical a la altura de los hombros y colócate  a un metro de ella.\n2. Con los brazos flexionados, sujeta la banda a la mitad del pecho. Las piernas deben estar semiflexionadas. \n3. Extiende ambos brazos completamente sujetando al frente la banda, sintiendo la tensión, flexiona los brazos y vuelve otra vez a estirarlos. \n\nTen en cuenta: \n\n- Mantén el core tenso y contraído. \n- Cada flexión es una repetición.","v":"https://youtube.com/shorts/2hGiUKkI2P4","e":null,"h":null,"m":["abdominales"],"j":["codos","hombros"]},"5264":{"n":"Flexión con rodillas","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho, las rodillas en el suelo y las puntas de los piens apoyados. Desde aquí impúlsate con las manos para elevar el tronco manteniendo el cuerpo alineado y paralelo al suelo. \n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe formar una línea recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/jF0UJfweKz4","e":5252,"h":null,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},"5660":{"n":"Flexión con palmada de rodillas","d":"Apóyate en las manos y rodillas, con los brazos extendidos y el cuerpo recto. Flexiona los codos para controlar la bajada, hasta que tu pecho llegue a pocos centímetros del suelo, y empuja con velocidad el suelo para que en la subida tus manos se despeguen del mismo, lo suficiente para dar una palmada y volver a apoyar las manos en el suelo para amortiguar el descenso. \n\n- Si no te da tiempo a dar la palmada, simplemente intenta empujarte con suficiente potencia para que las manos se despeguen momentáneamente del suelo, sin forzar la palmada.\n- Si te resulta imposible, puedes hacer el ejercicio apoyándote en la pared.\n- Si te resulta fácil, configura la versión más difícil, apoyándote sobre los pies en vez de las rodillas","v":"https://youtube.com/shorts/UQ0VPM-Ccmw","e":5585,"h":null,"m":["pectorales","tríceps","deltoides"],"j":["rodillas","codos","hombros","muñecas"]},"5277":{"n":"Sentadilla con salto lateral","d":"Colócate de pie, con la espalda recta y sacando ligeramente el trasero hacia afuera flexiona las piernas unos 90º aproximadamente o hasta que tus muslos estén paralelos al suelo. Desde esta posición realiza un pequeño salto desplazándote lateralmente.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Extiende tu cuerpo durante el salto. \n- Amortigua bien la caída. \n- Durante la flexión tus rodillas deben mirar hacia afuera.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición con cada salto.","v":"https://youtu.be/YzxAE-uPcRw","e":5891,"h":5243,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos"]},"5794":{"n":"Zancadas adelante equilibrio","d":"Empieza de pie con los pies juntos y da un paso largo hacia adelante. Cuando tu pie toque el suelo levanta la pierna trasera y mantente en equilibrio. Desde esta posición, toca suavemente con la mano opuesta al pie que está en contacto con el suelo. Impúlsate hacia atrás para volver a la posición inicial. Repite el movimiento con la otra pierna.\n\n**Ten en cuenta:**\n\n- Descenso en un plano completamente vertical. \n- Que la rodilla de la extremidad avanzada no sobrepase la altura del pie. \n- Cuenta una repetición por paso.","v":"https://youtube.com/shorts/iBrDXEpNb1g","e":null,"h":null,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5290":{"n":"El puente 1 pierna","d":"Colócate tumbado boca arriba con una pierna flexionada y el pie apoyado en el suelo. El tobillo de la otra pierna irá apoyado en la rodilla de la primera para que funcione como punto de apoyo. Desde aquí, realiza una elevación del tronco despegando el trasero del suelo hasta tener el tronco y la pierna completamente alineados. Alterna las piernas entre series.\n\n**Ten en cuenta:**\n\n- Mantén el cuerpo bien alineado. \n- Desciende suavemente. \n- Cuenta una repetición cada extensión.","v":"https://youtu.be/HVdXJNW8PPw","e":5334,"h":5291,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},"5291":{"n":"El puente","d":"Colócate tumbado boca arriba con las piernas flexionadas y los pies apoyados en el suelo. Eleva el tronco despegando el trasero del suelo hasta tener el cuerpo alineado. Desciende volviendo a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén el cuerpo bien alineado. \n- Desciende suavemente.\n- Cuenta una repetición con cada extensión.","v":"https://youtube.com/shorts/KuEVq3OA2ss","e":5290,"h":null,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},"5418":{"n":"Dominada con mesa","d":"1. Colócate bajo una mesa boca arriba, con los pies apoyados en el suelo y las piernas flexionadas. Agárrate a la mesa con las manos y mantén los brazos completamente extendidos.\n2. Desde esta posición, flexiona los brazos para llevar tu pecho a la mesa.\n3. Vuelve a extender los brazos para comenzar la siguiente repetición.\n\nTen en cuenta:\n- Mantén tu cuerpo recto durante la ejecución.\n- Cada flexión es una repetición.","v":"https://youtube.com/shorts/LnXelEDCfWc","e":null,"h":null,"m":["deltoides","dorsales","bíceps"],"j":["codos","hombros"]},"5420":{"n":"Chin ups asistida","d":"1. Colócate de pie frente a la barra, ata una goma elástica a ella, y pásala por debajo de tus pies.\n2. Cuélgate de la barra con las palmas de tus manos mirando hacia ti.\n3. Haz fuerza con los brazos tirando de ti mismo hacia arriba para llevar la barbilla a la altura de la barra. La resistencia de la goma te ayudará a subir.\n\nTen en cuenta:\n- La barbilla debe sobrepasar la altura de la barra.\n- Extiende tus brazos completamente al volver a la posición inicial.\n- Regula la resistencia de la goma para graduar la dificultad.\n- Cuenta una repetición cada vez que la barbilla sobrepase la barra.","v":"https://youtube.com/shorts/S5KFI1AF1RA","e":5356,"h":null,"m":["bíceps","dorsales"],"j":["codos","hombros"]},"5886":{"n":"Flexión pino con deficit","d":"Pon en el suelo, a unos centímetros de la pared una superficie estable de apoyo para las manos o unas barras de suelo.\n\nColócate de cara a la pared, a una distancia que te permita apoyar las manos a 15-20 cm de la pared y patear con las piernas hacia arriba, hasta que quedes cabeza abajo, apoyando únicamente los talones en la pared.\n\nDesde esta posición, flexiona los codos para acercar la cabeza al suelo, y empuja con fuerza para regresar a la posición original.\n\n**Ten en cuenta:**\n\n- Puedes utilizar un cojín para apoyar la cabeza cuando desciendas.\n- La descender no debes realizar una hiper extensión lumbar.\n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/2HCLf3kru6A","e":null,"h":5887,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5425":{"n":"Escalador con rotación (izquierda)","d":"1. Colócate en posición de plancha con ambas manos apoyadas en el suelo, separadas a la anchura de los hombros y las piernas extendidas apoyando la punta de los pies en el suelo. \n2. Flexiona una de las piernas apoyando la planta del pie en el suelo junto a la mano de ese mismo lado por fuera de ella.\n3. Rota hacia fuera la mano de la pierna extendida y, desde esta posición, flexiona el brazo de la pierna flexionada por debajo del pecho\n4. A continuación, rota todo el cuerpo hacia arriba hasta que los dos brazos formen un ángulo superior a 180º.\n5. Deshaz el movimiento para volver a la posición inicial.\n\nTen en cuenta: \n- Extiende tu cuerpo cuando lo rotas.","v":"https://youtube.com/shorts/aapJco2jeFw","e":null,"h":null,"m":["abdominales","pectorales","trapecios","deltoides"],"j":["hombros","codos"]},"5434":{"n":"Sentadilla pistolero con caja","d":"1. Colócate de pie delante de una caja o banco a unos de los lados y con una pierna y ambos brazos extendidos hacías el frente.\n2. Con una sola pierna como punto de apoyo en el suelo comienza el movimiento descendente, llevando la cadera hacia atrás y flexionando la rodilla de la pierna cuyo pie está totalmente en el suelo.\n3. Siéntate ligeramente en el banco con la rodilla de apoyo 90º y la otra extendida.\n4. Impúlsate hacia arriba con la pierna de apoyo para volver a la posición inicial.\n5. Cada vez que subas alterna de pierna.\n\nTen en cuenta: \n- Mantén la espalda recta siempre. \n- Mantén los brazos hacia adelante para que te ayuden a mantener el equilibrio.\n- Evita levantar el talón de pie de apoyo.\n- Cada flexión es una repetición.","v":"https://youtube.com/shorts/im1iTjTI6X8","e":5437,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},"5824":{"n":"Cuclillas con extensión de pierna","d":"Colócate en cuclillas con una apertura de piernas suficiente como para que puedas colocar los brazos por delante hasta apoyarlos en el suelo.\n\nUna vez que las manos estén en el suelo, levanta el trasero hasta estirar por completo las piernas y los brazos. Mantén esta posición durante dos segundos y vuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Al estirar las piernas puedes dejar de tocar el suelo con las manos, ya ganarás más flexibilidad.\n- Cuenta una repetición por estiramiento.","v":"https://youtube.com/shorts/gpS5QHPDA6c","e":null,"h":null,"m":["isquiotibiales","gemelos"],"j":["tobillos","rodillas","cadera"]},"5585":{"n":"Flexión con palmada","d":"Colócate de cara a la pared, a una distancia que te permita apoyar las manos a 15-20 cm de la pared y patear con las piernas hacia arriba, hasta que quedes boca abajo, apoyando únicamente los talones en la pared.\nDesde esta posición, flexiona los codos para acercar la cabeza al suelo, y empuja con fuerza para regresar a la posición original.\n\n- Tensa los abdominales para evitar una excesiva curvatura de la espalda.\n- Si no eres capaz de colocarte en la posición indicada puedes también escalar la pared, y hacer el movimiento de cara a la pared.","v":"https://youtube.com/shorts/0YF4BlSqcfI","e":null,"h":5660,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5339":{"n":"Plancha martillo","d":"Coloca el cuerpo en plancha apoyando los antebrazos y las puntas de los pies en el suelo. Mantén piernas, tronco y cabeza estirados en paralelo al suelo. Sube apoyándote en las manos, primero una y luego la otra, y baja apoyándote en los antebrazos, primero en uno y luego en otro, en el mismo orden que subiste, para acabar en la posición inicial.\n \nRepite el ejercicio empezando con el brazo contrario al que usaste al principio.\n \n**Ten en cuenta:**\n \n- Mira siempre hacia adelante.\n- Mantén la posición horizontal sin dejar caer o subir demasiado la pelvis.\n- Cuenta una repetición por cada cambio de apoyo.","v":"https://youtube.com/shorts/5L1Y-8X4xJA","e":5878,"h":null,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos","tríceps","deltoides"],"j":["hombros","tobillos","codos"]},"5852":{"n":"Dominada australiana","d":"Colócate con el cuerpo inclinado debajo de una barra, de tal manera que barra quede a la altura del pecho, con la planta de los pies apoyada en el suelo.\n\nSujeta la barra con ambas manos y elévate, acercando el pecho hasta tocar la barra. \n\n**Ten en cuenta:**\n\n- Si el pecho no toca la barra no cuenta como repetición.\n- Para elevar la dificultad del ejercicio, puedes añadir una superficie para los pies y hacer las dominadas en posición horizontal.\n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/8wMBInxqhHY","e":null,"h":5418,"m":["deltoides","dorsales","bíceps"],"j":["codos","hombros"]},"5854":{"n":"Tríceps con peso corporal","d":"Usando unas cintas TRX, colócalas en una barra superior y de pie y de espaldas, sujeta las TRX e inclínate hacia adelante con los brazos estirados.\n\nUna vez que tengas una inclinación de 45 grados sobre el suelo, flexiona los brazos y llévalos hacia atrás hasta que las manos sobrepasen la altura de la cabeza, utilizando para estabilizarte la fuerza de tus tríceps durante dos segundos y luego vuelve a estirar tus brazos hacia el frente.\n\n**Ten en cuenta:**\n\n- Mantén el core activo.\n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/Kf3eR6HEi-w","e":null,"h":null,"m":["tríceps"],"j":["codos","hombros"]},"5855":{"n":"Salto a cuerda doble","d":"Empieza realizando un salto de cuerda simple hasta que tengas el ritmo suficiente como para saltar y pasar dos veces la cuerda por debajo de los pies en un solo salto.\n\n**Ten en cuenta:**\n\n- Mantén el core activo.\n- Intenta no alejar los brazos del cuerpo.\n- Cuenta una repetición por salto.","v":"https://youtube.com/shorts/oemwnF9_42Q","e":null,"h":null,"m":["gemelos"],"j":["tobillos","rodillas"]},"5216":{"n":"Plancha","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como puntos de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo. \n\n**Ten en cuenta:**\n\n- Mantén la mirada hacia el suelo. \n- Mantén la posición horizontal sin dejar caer o subir demasiado la pelvis.\n- Concéntrate en que tu ombligo esté hacia adentro para tensar los músculos del abdomen.\n- Manten la columna dorsal recta, sacando pecho con las lumbares alineadas.\n- Cuenta una repetición por segundo.","v":"https://youtu.be/JoMOD6qE9Yw","e":5218,"h":null,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["hombros","tobillos"]},"5217":{"n":"Plancha pivot","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como punto de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo. Deja caer la pelvis hasta tocar el suelo y, seguidamente, elévala al máximo flexionando el tronco.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento completo. \n- Mantén la mirada hacia el suelo. \n- Cuenta una repetición cada vez que bajes la pelvis al suelo.","v":"https://youtu.be/fYwsWQo2Qzg","e":5219,"h":5216,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["cadera","hombros","tobillos"]},"5218":{"n":"Plancha equilibrio","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como punto de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo. Mueve el cuerpo hacia adelante y hacia atrás manteniéndolo paralelo al suelo.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento completo. \n- Mantén la mirada hacia el suelo. \n- Cuenta una repetición cada vez que termines el movimiento hacia atrás.","v":"https://youtu.be/O9nxi2nvmSU","e":5219,"h":5216,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["tobillos","hombros"]},"5859":{"n":"Remo en suspensión","d":"Usando unas cintas TRX, colócalas en una barra superior y colócate de frente, sujeta las TRX e inclínate hacia atrás con los brazos estirados.\n\nUna vez que tengas una inclinación de 45 grados sobre el suelo, flexiona los brazos y lleva tu cuerpo hacia adelante hasta que las manos queden a la altura del pecho.\n\n**Ten en cuenta:**\n\n- Mantén el core activo.\n- Cuenta una repetición por elevación.","v":"https://youtube.com/shorts/OsO5lHpOlFw","e":null,"h":null,"m":["deltoides","dorsales","bíceps"],"j":["codos","hombros"]},"5219":{"n":"Plancha araña","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como punto de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo, realiza una flexión de rodilla para tocar tu rodilla con el codo.\n\n**Ten en cuenta:**\n\n- Mantén la mirada hacia el suelo. \n- Mantén la postura horizontal.\n- Procura no desplazar ni rotar la cadera al flexionar la rodilla. \n- Si no llegas a tocar el codo no te preocupes, ya irás ganando flexibilidad.\n- Cuenta una repetición por flexión de rodilla.","v":"https://youtu.be/y1tu5bxnCEE","e":5220,"h":5217,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["hombros","tobillos","rodillas","cadera"]},"5220":{"n":"Plancha con extensión","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como punto de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo. Extiende el brazo derecho y la pierna izquierda a la vez, y realiza lo mismo después a la inversa.\n\n**Ten en cuenta:**\n\n- Mantén la mirada hacia el suelo. \n- Mantén la postura horizontal.\n- Procura no desplazar ni rotar la cadera al extender brazos y piernas. \n- Cuenta una repetición por cada extensión de brazo con pierna.","v":"https://youtu.be/MQVtlRhTJYk","e":null,"h":5219,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["cadera","hombros","tobillos","codos"]},"5222":{"n":"Mckenzie","d":"Colócate boca abajo con el cuerpo estirado y las manos apoyadas en el suelo a la altura de los Deltoides. Extiende los brazos completamente levantando el tronco superior hasta la cadera, manteniendo el resto del cuerpo en el suelo.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento en su máxima amplitud. \n- Mantén los Deltoides relajados y la cadera en el suelo.\n- Cuenta una repetición por extensión.","v":"https://youtu.be/qjEFCfbCswU","e":5223,"h":null,"m":["tríceps","dorsales"],"j":["muñecas","codos","cadera"]},"5223":{"n":"Supermán","d":"Colócate en el suelo boca abajo, con los brazos estirados por encima de la cabeza como si fueras Superman. Levanta las piernas y los brazos del suelo simultáneamente y bájalos hasta volver a tocar el suelo.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento en su máxima amplitud. \n- Mantén los brazos y piernas bien estirados. \n- Relaja la región de la nuca y Deltoides. \n- La cabeza tiene que seguir el recorrido de los brazos.\n- Cuenta una repetición por cada levantamiento.","v":"https://youtu.be/-MabO15xfoQ","e":null,"h":5222,"m":["erector de la columna"],"j":["cadera","hombros"]},"5866":{"n":"Fondos en paralelas","d":"Sitúate en el centro de las barras en paralelas, toma una barra con cada mano y suspéndete en el aire solo con la fuerza de tus brazos.\n\nLuego desciende suavemente hasta que tus brazos flexionados alcancen los 90 grados como mínimo. Luego vuelve a estirar los brazos completamente.\n\n**Ten en cuenta:**\n\n- Mantén las escápulas activas durante todo el movimiento.\n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/yOL_WmC3XdI","e":null,"h":null,"m":["tríceps","pectorales"],"j":["codos","hombros"]},"5867":{"n":"Sentadillas a una pierna en caja","d":"Desde la posición de pie, parado sobre una sola pierna, espalda recta y sacando ligeramente el trasero hacia afuera, flexiona la cadera y rodilla hasta sentarte en la caja. Equilibrate con la otra pierna en extensión.\nLuego, levántate con la misma pierna que tienes flexionada hasta quedar de pie.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Durante la flexión tus rodillas no deben rotar hacia adentro.  \n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/slsDvxhYNQI","e":null,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},"5356":{"n":"Dominada supina","d":"Cuélgate en la barra con el agarre de manos que sitúe los dedos mirando hacia ti. Haz fuerza con los brazos para llevar la barbilla a la altura de la barra y vuelve a la posición inicial. \n\n**Ten en cuenta**:\n\n- Lleva la barbilla a la altura de la barra\n- Extiende bien los brazos al volver a la posición inicial. \n- Cuenta una repetición cada vez que pase la barbilla por encima de la barra.","v":"https://youtube.com/shorts/ubKpcwzIYU8","e":null,"h":5420,"m":["dorsales","trapecios","tríceps","bíceps"],"j":["codos","hombros"]},"5870":{"n":"Nordic curl","d":"Amarra unas cintas elásticas a una barra horizontal y ajústalas para que terminen a la altura de tu cadera.\n\nLuego, siéntate de rodillas con los pies completamente apoyados sobre la pared (puedes ayudarte con rodillo para ganar estabilidad) y desde esta posición, sujeta los agarres de la cinta, inclínate hacia adelante con los brazos estirados hasta tocar con las manos al suelo. Impúlsate ligeramente con las manos y vuelve a la posición inicial lentamente.\n\n**Ten en cuenta:**\n\n- Mantén el core activo.\n- Cuenta una repetición cada vez que vuelves a la posición inicial.","v":"https://youtube.com/shorts/y4nCxXBEypI","e":null,"h":null,"m":["isquiotibiales"],"j":["rodillas","hombros"]},"5359":{"n":"Dominada asistida","d":"Colgado en la barra con un agarre de manos donde veas el dorso de tus manos y los pies introducidos en la goma de asistencia, realizamos fuerza con los brazos para llevar la barbilla a la altura de la barra y volver a la posición inicial. \n\n**Ten en cuenta**:\n\n- Lleva la barbilla a la altura de la barra\n- Extiende bien los brazos al volver a la posición inicial. \n- Cuenta una repetición cada vez que pasas la barbilla por encima de la barra.","v":"https://youtube.com/shorts/9BY7tofnhSk","e":5262,"h":5418,"m":["dorsales","trapecios","tríceps","bíceps"],"j":["codos","hombros"]},"5361":{"n":"Dominada spider","d":"Colgado en la barra con un agarre de manos donde veas el dorso de ellas, realizamos fuerza con los brazos para llevar la barbilla a la altura de la barra mientras acercamos nuestra rodilla al codo del mismo lado. Volvemos a la posición inicial. Alternamos piernas. \n\n**Ten en cuenta**:\n\n- Lleva la barbilla a la altura de la barra\n- Extiende bien los brazos al volver a la posición inicial. \n- Cuenta una repetición cada vez que pasas la barbilla por encima de la barra.","v":"https://youtube.com/shorts/3v6NibC2VQQ","e":5352,"h":5262,"m":["dorsales","trapecios","tríceps","bíceps","abdominales"],"j":["codos","hombros","cadera","rodillas"]},"5875":{"n":"Bíceps en suspensión","d":"Usando unas cintas TRX, colócalas en una barra superior y colócate de frente, sujeta las TRX, con los dedos apuntando hacia tí, e inclínate hacia atrás con los brazos estirados.\n\nUna vez que tengas una inclinación de 45 grados sobre el suelo, flexiona los brazos y hasta formar un ángulo de 90 grados y las manos cerca del rostro, utilizando la resistencia de tus bíceps. Luego vuelve a estirar los brazos para empezar una nueva repetición.\n\n**Ten en cuenta:**\n\n- Mantén el core y las escápulas activas.\n- Cuenta una repetición por flexión.","v":"https://youtube.com/shorts/6dZjpopCEng","e":null,"h":null,"m":["bíceps"],"j":["codos","tobillos"]},"5878":{"n":"Plancha press","d":"Coloca el cuerpo boca abajo apoyando los antebrazos y las puntas de los pies en el suelo. Mantén piernas, tronco y cabeza estirados en paralelo al suelo. Apoya todo el peso del cuerpo en los antebrazos y desde esta posición, elévate usando la fuerza de tus brazos, especialmente los tríceps, hasta tener los brazos estirados. Luego, vuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta y la mirada al frente. \n- Cuenta una repetición por cada levantamiento.","v":"https://youtube.com/shorts/Yt3aTQLjqTk","e":null,"h":5339,"m":["recto mayor del abdomen","tríceps"],"j":["codos","hombros","muñecas"]},"5242":{"n":"Sentadilla","d":"Colocándote de pie como posición inicial, con la espalda recta y sacando ligeramente el trasero hacia afuera, flexiona la cadera y las rodillas unos 90 grados aproximadamente o hasta que tus muslos estén paralelos al suelo. Vuelve a la posición inicial para terminar el ejercicio.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Durante la flexión tus rodillas deben mirar hacia afuera.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por flexión.","v":"https://youtu.be/snDiZo0Zcko","e":5243,"h":5340,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},"5243":{"n":"Sentadilla con salto","d":"Colocándote de pie como posición inicial, con la espalda recta y sacando ligeramente el trasero hacia afuera, flexiona la cadera y las rodillas unos 90 grados aproximadamente o hasta que tus muslos estén paralelos al suelo. Desde esta posición, realiza un salto vertical extendiendo el cuerpo.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. En el salto, extiende todo tu cuerpo. \n- Amortigua bien la caída. \n- Durante la flexión tus rodillas deben mirar hacia afuera.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por cada salto.","v":"https://youtu.be/eGmFnqFNGfk","e":5277,"h":5242,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},"5244":{"n":"Sentadilla de pistolero","d":"Colocándote de pie como posición inicial y con la espalda recta, flexiona la cadera y baja manteniendo el equilibrio con una pierna apoyada en el suelo y la otra estirada hasta estar paralela al suelo. Mantén la pierna extendida hasta volver a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Mientras que bajas, ayúdate de tus brazos para mantener el equilibrio extendiéndolos hacia delante.\n- Durante la flexión, la rodilla de tu pierna de apoyo debe mirar hacia afuera. \n- Baja hasta que tus Cadera estén por debajo de tus rodillas y tu pierna extendida paralela al suelo.\n- Cuenta una repetición por cada flexión.","v":"https://youtu.be/rr-HnkXXV6E","e":null,"h":5434,"m":["cuád function domReps(b){const keys=Object.keys(b.tbl).map(Number).sort((a,c)=>a-c);let r=b.tbl[keys[0]];keys.forEach(k=>{if(CFG.T>=k)r=b.tbl[k]});return r}

function qtyR(r,i){r=String(r);if(r.includes('-')&&!/^\d+-\d+$/.test(r)===false){const p=r.split('-');return '× '+p[Math.min(i,p.length-1)]}
  if(/^\d+(-\d+)+$/.test(r)){const p=r.split('-');return '× '+p[Math.min(i,p.length-1)]}return '× '+r}
function nRounds(b){let n=b.n;b.items.forEach(it=>{if(/^\d+(-\d+)+$/.test(String(it.r||'')))n=Math.max(n,String(it.r).split('-').length)});return n}

function expandWU(bi,b){
  const st=[{k:'intro',name:b.title,note:'Rutina completa: movilidad, activación de glúteos, estabilidad de hombro y antebrazo. Pulsa «Saltar bloque» si ya vienes calentado. Detalle del vídeo en la guía.',bi,btitle:b.title}];
  WU.forEach(sec=>{
    if(sec.timed){for(let i=0;i<6;i++){const e=sec.timed[i%3];st.push({k:'work',name:e[0],qty:'',t:15,tag:sec.h+' · intervalo '+(i+1)+'/6',note:e[1],bi,btitle:b.title});if(i<5)st.push({k:'rest',name:'Descanso',t:5,tag:sec.h,bi,btitle:b.title})}return}
    for(let v=0;v<sec.rep;v++)sec.steps.forEach(s=>st.push({k:'manual',name:s[0],qty:s[1],tag:sec.h+' · vuelta '+(v+1)+'/'+sec.rep,note:s[2],bi,btitle:b.title}));

function expand(b,bi){
  if(b.k==='wu')return expandWU(bi,b);
  const st=[],T=b.title,intro={k:'intro',name:T,note:b.obs||'',expl:b.expl,bi,btitle:T,bk:b.k};
  if(b.k==='dom'){const r=domReps(b);intro.note=b.obs+'\n\nCon tu resultado del test ('+CFG.T+') te toca: '+r+' dominadas por minuto, '+b.n+' minutos.';st.push(intro);
    for(let i=0;i<b.n;i++)st.push({k:'work',name:'Dominadas',qty:'× '+r,t:60,tag:'Minuto '+(i+1)+'/'+b.n,note:'Haz tus '+r+' dominadas y descansa el tiempo que te sobre.',bi,btitle:T})}
  else if(b.k==='emom'){st.push(intro);for(let i=0;i<b.n;i++)st.push({k:'work',name:b.txt,qty:'',t:60,tag:'Minuto '+(i+1)+'/'+b.n,note:'Descansa el tiempo que te sobre hasta el siguiente minuto.',bi,btitle:T})}
  else if(b.k==='tab'){st.push(intro);const ns=b.structs.length;
    b.structs.forEach((s,si)=>{for(let r=0;r<b.rounds;r++){const j=r%s.ex.length;
      st.push({k:'work',name:s.ex[j],qty:(s.q&&s.q[j])||'',t:b.work,tag:(ns>1?'Tábata '+(si+1)+'/'+ns+' · ':'')+'Intervalo '+(r+1)+'/'+b.rounds,note:s.note||'',bi,btitle:T});
      if(r<b.rounds-1)st.push({k:'rest',name:'Descanso',t:b.rest,tag:'Tábata '+(si+1)+'/'+ns,bi,btitle:T,nx:s.ex[(r+1)%s.ex.length]})}
      if(si<ns-1&&b.between>0)st.push({k:'rest',name:'Descanso entre tábatas',t:b.between,tag:'Siguiente: tábata '+(si+2)+'/'+ns,bi,btitle:T,nx:b.structs[si+1].ex[0]})})}
  else if(b.k==='sets'){st.push(intro);const n=nRounds(b),m=b.items.length;
    for(let i=0;i<n;i++){b.items.forEach((it,j)=>{
      const tag=(b.cap&&i===0&&j===0?'':'')+(m>1?'Ronda ':'Serie ')+(i+1)+'/'+n+(m>1?' · ejercicio '+(j+1)+'/'+m:'');
      if(it.t)st.push({k:'work',name:it.ex,qty:'',t:it.t,tag,note:'Máximo de repeticiones en el tiempo.',bi,btitle:T});
      else st.push({k:'manual',name:it.ex,qty:qtyR(it.r,i),tag,bi,btitle:T})});
      if(i<n-1&&b.rest>0)st.push({k:'rest',name:'Descanso',t:b.rest,tag:'Entre '+(m>1?'rondas':'series')+' · recomendado '+fmtL(b.rest),bi,btitle:T,nx:b.items[0].ex})}}
  else if(b.k==='lad'){st.push(intro);for(let r=b.a;r>=b.b;r--)b.items.forEach((e,j)=>st.push({k:'manual',name:e,qty:'× '+r,tag:'Escalera '+(b.a-r+1)+'/'+(b.a-b.b+1)+(b.items.length>1?' · ejercicio '+(j+1)+'/'+b.items.length:''),bi,btitle:T}))}
  else if(b.k==='hard'){st.push(intro);b.items.forEach((it,i)=>{
    st.push({k:'manual',name:it.ex,qty:'× '+it.r,tag:'Hardstop '+(i+1)+'/'+b.items.length,note:'Hasta el fallo en el mínimo tiempo posible. Cuando llegues al fallo, haz la penalización: '+it.pen+'.',bi,btitle:T});
    if(i<b.items.length-1&&b.rest>0)st.push({k:'rest',name:'Descanso',t:b.rest,tag:'Entre ejercicios (3-5 min)',bi,btitle:T,nx:b.items[i+1].ex})})}
  else if(b.k==='cardio'){st.push(intro);st.push({k:'cardio',name:T,qty:'',t:b.mins*60,tag:'Intensidad suave: podrías hablar tranquilamente',bi,btitle:T})}
  else if(b.k==='task'){st.push(intro);st.push({k:'manual',name:b.title,qty:'',tag:'Tarea del bloque',note:b.txt,bi,btitle:T,btn:'✓ Bloque completado'})}
  if(b.cap){const f=st.find(s=>s.k!=='intro');if(f)f.capStart=b.cap}
  return st}
function visBlocks(S){return S.blocks.filter(vis)}
function blockLines(b){
  const L=[];
  if(b.k==='wu')return [['Rutina completa de calentamiento (movilidad, glúteos, hombro y antebrazo)','']];
  if(b.k==='dom')L.push(['Dominadas',b.n+' min × '+domReps(b)+' (según tu test: '+CFG.T+')']);
  else if(b.k==='emom')L.push([b.txt,'× '+b.n+' minutos']);
  else if(b.k==='tab')b.structs.forEach(s=>L.push([s.ex.map((e,i)=>e+(s.q&&s.q[i]?' '+s.q[i]:'')).join(' + '),b.rounds+' × '+b.work+"''/"+b.rest+"''"]));
  else if(b.k==='sets'){const n=nRounds(b);b.items.forEach(it=>L.push([it.ex,it.t?'1 min':String(it.r).includes('-')?it.r:n+' × '+it.r]))}
  else if(b.k==='lad')b.items.forEach(e=>L.push([e,b.a+' → '+b.b]));
  else if(b.k==='hard')b.items.forEach(it=>L.push([it.ex,'× '+it.r]));
  else if(b.k==='cardio')L.push([b.title,b.mins+' min']);
  else if(b.k==='task')L.push([b.txt,'']);
  return L}

/* guided engine */
let G=null,TM=null,AC=null;
function beep(f,d){if(!G||!G.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
async function wake(){try{if(navigator.wakeLock)G.wl=await navigator.wakeLock.request('screen')}catch(e){}}
function startG(wn,sn,from){
  const W=D.weeks.find(x=>x.n===wn),S=W.ses.find(x=>x.n===sn),bl=visBlocks(S);
  let steps=[];bl.forEach((b,i)=>{if(i>=from)steps=steps.concat(expand(b,i))});
  if(!steps.length)return;
  G={W,S,bl,steps,i:0,sound:true,paused:false,t0:Date.now(),mode:'run',cap:null,last:performance.now(),pm:false};
  $('#g').classList.add('on');document.body.style.overflow='hidden';
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  wake();clearInterval(TM);TM=setInterval(tick,200);enter(0)}
function enter(i){
  if(i>=G.steps.length){finish();return}
  G.i=i;G.paused=false;const st=G.steps[i];G.left=st.t||0;G.lastB=null;G.last=performance.now();
  if(st.capStart){G.cap=st.capStart;G.capOver=false}
  if(st.k==='intro'&&G.steps[i-1]&&G.steps[i-1].bi!==st.bi)G.cap=null;
  if(st.k==='work'&&!(G.steps[i-1]&&G.steps[i-1].k==='rest'&&false))beep(1175,.3);
  drawG()}
function tick(){
  if(!G||G.mode!=='run')return;const now=performance.now(),dt=(now-G.last)/1000;G.last=now;
  if(G.paused)return;
  if(G.cap!=null){G.cap-=dt;const el=$('#cap');if(el)el.textContent=G.cap>=0?'⏱ '+fmt(G.cap):'⏱ tiempo superado'}
  const st=G.steps[G.i];if(!st||!(st.t>0))return;
  G.left-=dt;const r=Math.ceil(G.left-1e-6);
  if(r!==G.lastB){G.lastB=r;if(r<=3&&r>=1)beep(880,.12);const el=$('#gt');if(el){el.textContent=fmt(Math.max(r,0));el.className='gtimer'+(r<=3?' low pulse':'')}}
  if(G.left<=0)next()}
function next(){if(!G||G.mode!=='run')return;enter(G.i+1)}
function prev(){if(G.i>0)enter(G.i-1)}
function skipBlock(){const bi=G.steps[G.i].bi;let j=G.i;while(j<G.steps.length&&G.steps[j].bi===bi)j++;G.cap=null;enter(j)}
function togglePause(){if(!G||G.mode!=='run')return;G.paused=!G.paused;G.last=performance.now();drawG()}
function exitG(force){
  if(!force&&G.mode==='run'){if(!G.paused)togglePause();showM(`<h2>¿Salir de la sesión?</h2><div class="tx">Se perderá el avance de esta sesión guiada.</div><div class="row"><button class="btn" onclick="closeM();exitG(true)">Salir</button><button class="btn ghost" onclick="closeM();if(G&&G.paused)togglePause()">Seguir entrenando</button></div>`);return}
  clearInterval(TM);try{G.wl&&G.wl.release()}catch(e){}G=null;$('#g').classList.remove('on');document.body.style.overflow='';render()}
function finish(){
  G.mode='sum';setDone(G.W.n,G.S.n,true);beep(1175,.5);
  const W=G.W,S=G.S,i=W.ses.indexOf(S),n=i<W.ses.length-1?[W.n,W.ses[i+1].n]:(W.n<12?[W.n+1,D.weeks[W.n].ses[0].n]:null);
  const g=$('#g');g.className='on cardio';g.innerHTML=`<div class="gmid"><div class="sum"><div class="gphase">Semana ${W.n} · Sesión ${S.n}</div><h2 class="big">¡Sesión completada!</h2><div class="gsub" style="margin:10px 0 24px;text-align:center">Tiempo total: <b>${fmtL((Date.now()-G.t0)/1000)}</b></div><div class="row" style="justify-content:center"><button class="btn gdone" onclick="exitG(true)">Terminar</button>${n?`<button class="btn ghost" onclick="const a=${n[0]},b=${n[1]};exitG(true);go(a,b)">Ir a la sesión ${n[1]}</button>`:''}</div></div></div>`}
function nextWork(i){for(let j=i+1;j<G.steps.length;j++){const s=G.steps[j];if(s.k!=='rest'&&s.k!=='intro')return s}return null}
const KL={dom:'Dominadas al minuto',emom:'Por minutos',tab:'Tábata',sets:'Series',lad:'Escalera',hard:'Hardstop',cardio:'Aeróbico',task:'Tarea',wu:'Calentamiento'};
function drawG(){
  const st=G.steps[G.i],n=G.steps.length-1,g=$('#g');
  const cls=st.k==='intro'?'intro':st.k==='rest'?'rest':st.k==='cardio'?'cardio':st.t>0?'work':'reps';
  g.className='on '+cls;
  const nxs=G.steps[G.i+1];let nxt='';
  if(nxs){const q=nxs.t>0?fmt(nxs.t)+(nxs.t>=60?' min':' s'):nxs.qty||'';nxt='Siguiente: <b>'+(nxs.k==='intro'?'Bloque: '+esc(nxs.name):esc(cap1(nxs.name)))+'</b>'+(q?' · '+esc(q):'')}else nxt='Último paso 🎉';
  let phase,name,main,sub='';
  if(st.k==='intro'){phase='Bloque '+(st.bi+1)+' de '+G.bl.length;name=st.name;
    main=`<div class="gintro">${esc(st.note||'')}${st.expl?'\n\n'+esc(typeof st.expl==='string'?st.expl:(st.expl['n'+LV()]||'')):''}</div>`}
  else if(st.k==='rest'){phase=st.name||'Descanso';const w=st.nx||(nextWork(G.i)||{}).name;name=w?'Prepara: '+cap1(w):'Descanso';main=`<div class="gtimer" id="gt">${fmt(G.left)}</div>`;sub=st.tag||''}
  else if(st.k==='cardio'){phase='Aeróbico suave';name=st.name;main=`<div class="gtimer" id="gt">${fmt(G.left)}</div>`;sub=st.tag}
  else if(st.t>0){phase='Trabajo';name=st.name;main=`<div class="gtimer" id="gt">${fmt(G.left)}</div>`;sub=[st.qty,st.tag,st.note].filter(Boolean).join('\n')}
  else{phase=st.tag||'Repeticiones';name=st.name;main=`<div class="gtimer" style="font-size:clamp(90px,24vh,300px)">${esc(st.qty||'✓')}</div>`;sub=st.note||''}
  const tipBtn=(st.k!=='rest'&&st.k!=='intro'&&exId(st.name))?`<button class="btn ghost" onclick="exModal('${esc(st.name).replace(/'/g,'&#39;')}')">Técnica</button>`:'';
  const manual=!(st.t>0);
  g.innerHTML=`<div class="gbar"><i style="width:${Math.max(0,G.i/n*100)}%"></i></div>
  <div class="gtop"><button class="btn ghost small" onclick="exitG()">✕ Salir</button><div class="lbl"><b>S${G.W.n}·${G.S.n}</b> · ${esc(KL[(G.bl[st.bi]||{}).k]||'')} · ${esc(st.btitle||'')}</div><span class="cap" id="cap">${G.cap!=null?(G.cap>=0?'⏱ '+fmt(G.cap):'⏱ tiempo superado'):''}</span>
  <button class="btn ghost small" onclick="G.sound=!G.sound;drawG()">${G.sound?'🔊':'🔇'}</button><button class="btn ghost small" onclick="descModal()">Instrucciones</button><button class="btn ghost small" onclick="skipBlock()">Saltar bloque</button></div>
  <div class="gmid"><div class="gphase">${esc(phase)}</div>${st.k==='intro'?`<div class="gname">${esc(name)}</div>`:`<div class="gname">${esc(cap1(name))}</div>`}${main}${sub&&st.k!=='intro'?`<div class="gsub">${esc(sub)}</div>`:''}</div>
  <div class="gnext">${nxt}</div>
  <div class="gctl"><button class="btn ghost" onclick="prev()">← Atrás</button>${manual?'':`<button class="btn ghost" onclick="togglePause()">${G.paused?'▶ Seguir':'❚❚ Pausa'}</button>`}${tipBtn}
  ${st.k==='intro'?`<button class="btn gdone" onclick="next()">▶ Empezar bloque</button>`:manual?`<button class="btn gdone" onclick="next()">${st.btn||'✓ HECHO'}</button>`:`<button class="btn" onclick="next()">Saltar →</button>`}</div>`}
function descModal(){const b=G.bl[G.steps[G.i].bi];if(!G.paused&&G.steps[G.i].t>0){G.pm=true;togglePause()}
  showM(`<h2>${esc(b.title)}</h2><div class="tx">${esc(b.obs||'')}${b.expl?'\n\n'+esc(typeof b.expl==='string'?b.expl:(b.expl['n'+LV()]||'')):''}</div><div class="row"><button class="btn" onclick="closeM()">Cerrar</button></div>`)}
document.addEventListener('keydown',e=>{
  if($('#m').classList.contains('on')){if(e.key==='Escape')closeM();return}
  if(!G||G.mode!=='run')return;const st=G.steps[G.i];
  if(e.code==='Space'||e.key==='Enter'){e.preventDefault();if(!(st.t>0))next();else togglePause()}
  else if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key==='Escape')exitG()});
render();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script></body>
