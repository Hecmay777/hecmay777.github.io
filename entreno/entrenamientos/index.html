RMc7hU","d":"Coloca la kettlebell en posición de rack: codo pegado al cuerpo, muñeca recta y kettlebell descansando en el triángulo que forma tu brazo con el pecho.\n\nDesciende en una sentadilla normal (recuerda que tus Cadera deben bajar por debajo de tus rodillas) y explota como si fueras a saltar. Cuando tu cadera se abra completamente, la kettlebell empieza a subir, y simplemente completas el movimiento empujando la kettlebell hasta estirar completamente el brazo. Baja la kettlebell de manera controlada, y cuando está a punto de tocar el pecho de nuevo, empieza a descender para realizar la siguiente repetición. Esto amortigua el golpe y hace el movimiento más fluido.\n\nMantén el torso recto y los abdominales tensos. Inhala en la bajada y exhala en la subida.","e":5615,"h":null,"m":["cuádriceps","glúteos","deltoides","trapecios","dorsales"],"j":["cadera","rodillas","codos","tobillos"]},"5651":{"n":"Thruster con KB (izquierda)","v":"https://youtube.com/shorts/DVbqZGPtVbo","d":"Coloca la kettlebell en posición de rack: codo pegado al cuerpo, muñeca recta y kettlebell descansando en el triángulo que forma tu brazo con el pecho.\n\nDesciende en una sentadilla normal (recuerda que tus Cadera deben bajar por debajo de tus rodillas) y explota como si fueras a saltar. Cuando tu cadera se abra completamente, la kettlebell empieza a subir, y simplemente completas el movimiento empujando la kettlebell hasta estirar completamente el brazo. Baja la kettlebell de manera controlada, y cuando está a punto de tocar el pecho de nuevo, empieza a descender para realizar la siguiente repetición. Esto amortigua el golpe y hace el movimiento más fluido.\n\nMantén el torso recto y los abdominales tensos. Inhala en la bajada y exhala en la subida.","e":5615,"h":null,"m":["cuádriceps","glúteos","deltoides","trapecios","dorsales","abdominales oblicuos"],"j":["cadera","rodillas","codos","tobillos"]},"5602":{"n":"Sentadilla con voltereta","v":"https://youtube.com/shorts/pX2pFNaw__g","d":"La postura inicial es de pie, con los pies a la altura de los Deltoides, y las puntas de los pies mirando ligeramente hacia fuera.\n\nDesde esta posición, lleva la cadera hacia atrás y flexiona las rodillas para descender, manteniendo el torso lo más recto que puedas, con una curvatura natural de la espalda. Desciende hasta que tus Cadera bajen por debajo de tus rodillas, y déjate caer hacia atrás, de manera controlada, rodando sobre tu espalda hasta que los pies lleguen al suelo por detrás de tu cabeza, o lo más cerca que permita tu flexibilidad. Rueda ahora hacia delante, con suficiente impulso para volver a la posición de sentadilla profunda, y ponte de pie.","e":null,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},"6031":{"n":"Push press (derecha)","v":"https://youtube.com/shorts/ijQbsM-wWW8","d":"Coloca la kettlebell en posición de rack: codo pegado al cuerpo, muñeca recta y kettlebell descansando en el triángulo que forma tu brazo con el pecho. \n\nEn vez de empezar empujando con los hombros, debes impulsarte primero con las piernas, doblando ligeramente las rodillas (¼ de sentadilla), y abriendo la cadera de manera explosiva. Es este empuje del cuerpo inferior el que lanza la kettlebell hacia arriba inicialmente. El hombro empieza a empujar cuando la cadera se ha extendido completamente y la kettlebell está ‘flotando’ en el aire, no antes. Cuando la kettlebell pasa el nivel de los ojos, adelanta ligeramente el torso. Al igual que en el press, en la posición final el codo debe bloquearse y las rodillas estar completamente extendidas.","e":5605,"h":null,"m":["deltoides","trapecios","dorsales"],"j":["codos","hombros","rodillas"]},"5650":{"n":"Push press (izquierda)","v":"https://youtube.com/shorts/DVbqZGPtVbo","d":"Coloca la kettlebell en posición de rack: codo pegado al cuerpo, muñeca recta y kettlebell descansando en el triángulo que forma tu brazo con el pecho. \n\nEn vez de empezar empujando con los Deltoides, debes impulsarte primero con las piernas, doblando ligeramente las rodillas (¼ de sentadilla), y abriendo la cadera de manera explosiva. Es este empuje del cuerpo inferior el que lanza la kettlebell hacia arriba inicialmente. El hombro empieza a empujar cuando la cadera se ha extendido completamente y la kettlebell está ‘flotando’ en el aire, no antes. Cuando la kettlebell pasa el nivel de los ojos, adelanta ligeramente el torso. Al igual que en el press, en la posición final el codo debe bloquearse y las rodillas estar completamente extendidas.","e":5605,"h":null,"m":["deltoides","trapecios","dorsales"],"j":["codos","hombros","rodillas"]},"5585":{"n":"Flexión con palmada","v":"https://youtube.com/shorts/0YF4BlSqcfI","d":"Colócate de cara a la pared, a una distancia que te permita apoyar las manos a 15-20 cm de la pared y patear con las piernas hacia arriba, hasta que quedes boca abajo, apoyando únicamente los talones en la pared.\nDesde esta posición, flexiona los codos para acercar la cabeza al suelo, y empuja con fuerza para regresar a la posición original.\n\n- Tensa los abdominales para evitar una excesiva curvatura de la espalda.\n- Si no eres capaz de colocarte en la posición indicada puedes también escalar la pared, y hacer el movimiento de cara a la pared.","e":null,"h":5660,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5652":{"n":"Plancha araña","v":"https://youtube.com/shorts/AQ33bYR078o","d":"Colócate en el suelo, apoyado sobre los antebrazos y las puntas de los pies, manteniendo el cuerpo recto. Desde esta posición, flexiona la rodilla derecha y adelántala hasta que llegue casi al codo, manteniendo el pie en el aire. Repite ahora por el lado izquierdo, y alterna lados hasta llegar a las repeticiones indicadas.","e":null,"h":null,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["codos","hombros","rodillas"]},"5229":{"n":"Rodillas a los codos","v":"https://youtu.be/WWqTofl0nCI","d":"Colgado con las manos de una barra, ","cadera"]},"5342":{"n":"Roll a dos","v":"https://youtube.com/shorts/efc9FN8EV0s","d":"Túmbate boca arriba y flexiona las Cadera para llevar las piernas por encima de tu cabeza. Mientras devuelves las piernas a la posición inicial, coge impulso para elevar el tronco y tocar los pies con las manos. \n \n**Ten en cuenta:**\n \n- Mantén la espalda lo más recta posible durante todo el movimiento\n- Cuenta una repetición cada vez que tocas los pies.","e":5238,"h":null,"m":["cuádriceps","glúteos"],"j":["tobillos","rodillas","cadera"]},"5279":{"n":"Semi burpee","v":"https://youtu.be/tnX3DxQ9xHU","d":"Colócate de pie como posición inicial. Agacha el cuerpo llevando las manos al suelo, a la vez que impulsas las piernas hacia atrás, colocándote en la posición inicial de plancha, con el cuerpo recto y apoyado en la punta de los pies.\n\nDesde esta posición, impúlsate con los pies para colocarlos justo detrás de las manos y realiza un salto hacia arriba. Da una palmada por encima de la cabeza para terminar el ejercicio.\n\n**Ten en cuenta:**\n\n- Cuenta una repetición con cada palmada.","e":5419,"h":null,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},"5227":{"n":"Abdominales con giro","v":"https://youtu.be/UB6NB1CM2SY","d":"Inicia el ejercicio sentado en el suelo, con el tronco semiflexionado hacia delante y las piernas semiflexionadas, de forma que ni el tronco ni los pies lleguen a tocar el suelo y el punto de equilibro esté en el trasero.\n\nHaz una rotación del tronco hacia un lado hasta tocar con las dos manos el suelo. Alterna girando hacia el otro lado.\n\n**Ten en cuenta:**\n\n- Extiende bien la espalda manteniendo cuello y nuca relajados. \n- Marca bien el giro.\n- Cuenta una repetición cada vez que toques el suelo con las manos.","e":5335,"h":null,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["cadera"]},"5333":{"n":"Skipping rodillas codos","v":"https://youtube.com/shorts/xgYuOJMjmyI","d":"Colócate de pie con los pies juntos y las m vis.\n- Cuenta una repetición por cada cambio de apoyo.","e":5878,"h":null,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos","tríceps","deltoides"],"j":["hombros","tobillos","codos"]},"5416":{"n":"Cohete con peso (derecha)","v":"https://youtube.com/shorts/xMFbtqD63ZQ","d":"1. Colócate delante de una caja, banco o superficie elevada estable, con un peso cargado a la altura de tu pecho.\n2. Apoya una de las piernas en la caja realizando una flexión de 90º con ella.\n3. Desde esta posición, impúlsate con la pierna de apoyo para situarte de pie encima de la caja.\n4. Termina el movimiento volviendo a la posición inicial.\n\nTen en cuenta:\n- Utiliza un peso que te permita realizar el ejercicio de manera controlada.\n- Extiende completamente tu cuerpo al final de la elevación.\n- Desciende de manera controlada.\n- Cada levantamiento es una repetición.","e":null,"h":5406,"m":["cuádriceps","isquiotibiales"],"j":["cadera","rodillas","tobillos"]},"5417":{"n":"Cohete con peso (izquierda)","v":"https://youtube.com/shorts/IjjwJ0aXEQ8","d":"1. Colócate delante de una caja, banco o superficie elevada estable, con un peso cargado a la altura de tu pecho.\n2. Apoya una de las piernas en la caja realizando una flexión de 90º con ella.\n3. Desde esta posición, impúlsate con la pierna de apoyo para situarte de pie encima de la caja.\n4. Termina el movimiento volviendo a la posición inicial.\n\nTen en cuenta:\n- Utiliza un peso que te permita realizar el ejercicio de manera controlada.\n- Extiende completamente tu cuerpo al final de la elevación.\n- Desciende de manera controlada.\n- Cada levantamiento es una repetición.","e":null,"h":5407,"m":["cuádriceps","isquiotibiales"],"j":["cadera","rodillas","tobillos"]},"5400":{"n":"Zancada saltando (derecha)","v":"https://youtube.com/shorts/bsABRvVkD-M","d":"1. Colócate de pie como posición inicial.\n2. Da un paso amplio hacia adelante con una de tus piernas, dejando la otra atrás. Ambas piernas están extendidas.\n3. Lleva la rodilla de la pierna trasera hacia el suelo, flexionando ambas piernas, de manera que queden aproximadamente en 90º y, desde esta posición, realiza un salto vertical para cambiar de pierna en el aire y quedar en la misma posición.\n\nTen en cuenta:\n- Este ejercicio no requiere desplazamiento.\n- Extiende tu cuerpo durante el salto.\n- Amortigua suavemente la caída acabando en la posición de zancada.\n- La rodilla de la pierna adelantada no debe sobrepasar la punta del pie.\n- Cada salto es una repetición.","e":5906,"h":5819,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5401":{"n":"Zancada saltando (izquierda)","v":"https://youtube.com/shorts/Wb51TRK44qE","d":"1. Colócate de pie como posición inicial.\n2. Da un paso amplio hacia adelante con una de tus piernas, dejando la otra atrás. Ambas piernas están extendidas.\n3. Lleva la rodilla de la pierna trasera hacia el suelo, flexionando ambas piernas, de manera que queden aproximadamente en 90º y, desde esta posición, realiza un salto vertical para cambiar de pierna en el aire y quedar en la misma posición.\n\nTen en cuenta:\n- Este ejercicio no requiere desplazamiento.\n- Extiende tu cuerpo durante el salto.\n- Amortigua suavemente la caída acabando en la posición de zancada.\n- La rodilla de la pierna adelantada no debe sobrepasar la punta del pie.\n- Cada salto es una repetición.","e":5905,"h":5820,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5238":{"n":"Burrol","v":"https://youtu.be/1hfLiTP9IIw","d":"Ejercicio complejo de 3 fases:\n\nColócate de pie como posición inicial. Tírate al suelo boca arriba sentándote primero y seguidamente estirándote completamente, de forma que tus brazos queden estirados por encima de la cabeza.\nLevántate con un impulso colocándote en cuclillas y por último, ponte de pie dando un salto vertical y una palmada por encima de tu cabeza.\n\n**Ten en cuenta:**\n\n- Estira tu cuerpo completamente al tirarte al suelo.\n- La palmada se realiza justo encima de tu cabeza con los brazos estirados.\n- Si puedes, levántate sin usar las manos.\n- Cuenta una repetición con cada palmada.","e":5309,"h":5342,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},"5341":{"n":"Rodillas a de pie","v":"https://youtube.com/shorts/rtqCsinr7m0","d":"Colócate de rodillas con la espalda recta y los pies apoyados solo con la punta, desplaza el peso hacia tus talones para poder levantarte y ponerte de pie. Vuelve a la posición inicial realizando una sentadilla profunda y apoyando las rodillas en el suelo.\n \n**Ten en cuenta:**\n\n- Mantén la mirada hacia el frente. \n- Mantén los pies a la altura de los Deltoides.\n- Si lo necesitas, estira los brazos para mantener el equilibrio.\n- Cuenta una repeticion cada vez que te pongas de pie.","e":null,"h":5340,"m":["cuádriceps","glúteos"],"j":["tobillos","rodillas","cadera"]},"5282":{"n":"¡Levántate!","v":"https://youtu.be/a2WEv8H3MqA","d":"Colócate boca arriba en el suelo con las piernas flexionadas, toma impulso con las piernas echándote un poco hacia atrás para seguidamente, levantar todo el tronco del suelo. Quédate apoyado con el pie de una pierna y la rodilla de la contraria para terminar el levantamiento y vuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Extiende bien tu cuerpo al final de la elevación. \n- Baja de manera controlada.\n- Intercambia la posición de las piernas al finalizar.\n- Cuenta una repetición por cada levantamiento.","e":5343,"h":5342,"m":["abdominales","glúteos"],"j":["cadera","rodillas","tobillos","hombros"]},"5792":{"n":"Zancada atrás con extension","v":"https://youtube.com/shorts/NAhbDr9tvPM","d":"Empieza de pie, con las manos en la cadera o con los brazos estirados a lo largo del cuerpo. Da una zancada hacia atrás con la rodilla derecha bajando el torso, hasta que la rodilla se acerque al suelo. Al mismo tiempo levanta los brazos hasta que queden estirados encima tu cabeza. En la posición final tus piernas han de estar en un ángulo aproximado de 90°, pero puede haber pequeñas variaciones en cada zancada. Desde esta posición, empuja con la punta del pie para regresar a la posición inicial, y repite por el lado izquierdo.\n\n**Ten en cuenta:**\n\n- Descenso en un plano completamente vertical. \n- Baja suavemente hasta que tu rodilla conecte con el suelo. \n- Que la rodilla de la extremidad avanzada no sobrepase la altura del pie. \n- Cuenta una repetición por zancada.","e":null,"h":null,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5854":{"n":"Tríceps con peso corporal","v":"https://youtube.com/shorts/Kf3eR6HEi-w","d":"Usando unas cintas TRX, colócalas en una barra superior y de pie y de espaldas, sujeta las TRX e inclínate hacia adelante con los brazos estirados.\n\nUna vez que tengas una inclinación de 45 grados sobre el suelo, flexiona los brazos y llévalos hacia atrás hasta que las manos sobrepasen la altura de la cabeza, utilizando para estabilizarte la fuerza de tus tríceps durante dos segundos y luego vuelve a estirar tus brazos hacia el frente.\n\n**Ten en cuenta:**\n\n- Mantén el core activo.\n- Cuenta una repetición por flexión.","e":null,"h":null,"m":["tríceps"],"j":["codos","hombros"]},"5334":{"n":"Molino","v":"https://youtube.com/shorts/yGJmDlHSkrA","d":"Colócate de pie, abre las piernas algo más que el ancho de las Cadera, con los pies girados ligeramente hacia afuera. Eleva el brazo derecho por encima de tu cabeza. Gira y baja hacia el lado izquierdo sin mover las piernas hasta que tu mano izquierda toque tu pie izquierdo.\n\nEn esta posición final tus brazos deben estar alineados, formando una línea casi perpendicular al suelo. Mantén el pecho abierto y la mirada en la mano que está elevada. Detente un breve momento en esta posición y realiza el movimiento inverso hasta poner el cuerpo recto.\n\n**Ten en cuenta**\n\n- Inspira al bajar, espira al subir.\n- Si te resulta muy fácil el ejercicio, sujeta un peso con la mano elevada: una mochila con peso, una mancuerna o una kettlebell.\n- Mantén en todo momento la espalda recta.\n- Cuenta una repetición cada vez que subas.","e":null,"h":5956,"m":["isquiotibiales","gemelos","glúteos"],"j":["cadera","hombros","rodillas"]},"5406":{"n":"Cohete (derecha)","v":"https://youtube.com/shorts/pxHirF3FRr8","d":"1. Colócate delante de una caja, banco o superficie elevada estable.\n2. Apoya una de las piernas en la caja realizando una flexión de 90º con ella.\n3. Desde esta posición, impúlsate como si fueras a poner la otra pierna encima de la caja, pero sin llegar a tocarla, de forma que ambas piernas queden totalmente estiradas pero una sola apoyada en la caja.\n4. Termina el movimiento volviendo a la posición inicial.\n\nTen en cuenta:\n- Extiende completamente tu cuerpo al final de la elevación.\n- Desciende de manera controlada.\n- Cada levantamiento es una repetición.","e":5416,"h":null,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5407":{"n":"Cohete (izquierda)","v":"https://youtube.com/shorts/iZN0m2cNKOA","d":"1. Colócate delante de una caja, banco o superficie elevada estable.\n2. Apoya una de las piernas en la caja realizando una flexión de 90º con ella.\n3. Desde esta posición, impúlsate como si fueras a poner la otra pierna encima de la caja, pero sin llegar a tocarla, de forma que ambas piernas queden totalmente estiradas pero una sola apoyada en la caja.\n4. Termina el movimiento volviendo a la posición inicial.\n\nTen en cuenta:\n- Extiende completamente tu cuerpo al final de la elevación.\n- Desciende de manera controlada.\n- Cada levantamiento es una repetición.","e":5417,"h":null,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5371":{"n":"Péndulo americano","v":"https://youtube.com/shorts/3dcGQOLwPtY","d":"Lleva el peso entre las piernas y realiza una ligera flexión de piernas. Con un gesto de cadera impulsa el peso y con los brazos estirados lleva el peso a la vertical por encima de tu cabeza. \n\n* etición por sentadilla.","e":null,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},"5775":{"n":"Plancha cadera","v":"https://youtube.com/shorts/g_8UjLluvyM","d":"Coloca el cuerpo boca abajo apoyando los antebrazos perpendiculares al cuerpo y las puntas de los pies en el suelo. \nMantén piernas, tronco y cabeza estirados en una línea paralela al suelo. \nGira el tronco hasta que tus Cadera toquen el suelo. Alterna los lados.\n\n**Ten en cuenta:**\n\n- Mira hacia adelante. \n- Mantén el core y los Glúteos activados.\n- Cuenta una repetición cada vez tus Cadera toquen el suelo.","e":null,"h":null,"m":["abdominales","lumbares"],"j":["codos","hombros","tobillos"]},"5767":{"n":"Flexión molinos","v":"https://youtube.com/shorts/xTVpcI0AHjc","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Desde aquí:\n\nImpúlsate con las manos para elevar el tronco manteniendo el cuerpo alineado y paralelo al suelo. \nLevanta el brazo izquierdo hasta llevarlo completamente perpendicular al suelo en un movimiento circular.\nVuelve a la posición paralela al suelo.\nDobla los codos lentamente hasta tocar el suelo con tu pecho.\n\nRepite el movimiento con el brazo derecho\n\n**Ten en cuenta:**\n\n- Mirada al frente. \n- Tu cuerpo debe estar en completa línea recta. \n- Cuando eleves el brazo abre el pecho lo máximo que puedas.\n- El pecho debe conectar con el suelo.\n- Cuenta una repetición por extensión de brazo.","e":null,"h":null,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas","rodillas","cadera"]},"5320":{"n":"Flexión con déficit","v":"https://youtube.com/shorts/dB64bAawu44","d":"Túmbate boca abajo con las palmas apoyadas sobre una superficie que las mantenga ligeramente elevadas y te permita que el recorrido del ejercicio sea un poco mayor, como un par de libros o dos piedras de tamaño similar. \nDesde aquí impúlsate con las manos para elevar el tronco manteniendo el cuerpo paralelo al s a.\n- La rodilla de la pierna que da el paso hacia delante no debe sobrepasar la altura del pie.\n- Cuenta una repetición por cada flexión.","e":5248,"h":null,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas"]},"5246":{"n":"Zancada con salto","v":"https://youtu.be/LBBbKa--Aes","d":"Colocándote de pie como posición inicial, da un paso largo hacia adelante y desde esta posición haz un salto vertical para cambiar de pierna. Durante el salto estira completamente las piernas para intercambiarlas en el aire.\n\n**Ten en cuenta:**\n\n- Este ejercicio no requiere desplazamiento.\n- Extiende tu cuerpo durante el salto. \n- Amortigua la caída acabando en la posición de zancada. \n- Baja suavemente después del salto para que tu rodilla toque el suelo. \n- La rodilla de la pierna que avanza no debe sobrepasar la altura del pie. \n- Cuenta una repetición por cada salto.","e":5892,"h":5794,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5803":{"n":"Sentadilla cuclilla trx","v":"https://youtube.com/shorts/qn1Cuc_w8cU","d":"Sujeta un asa del TRX en cada mano. Mantén los brazos estirados y el cuerpo en posición de estar sentado en una silla. Mantén los pies planos en el suelo y, al mismo tiempo que rotas las muñecas ligeramente, flexiona los brazos para empujar tu cuerpo hacia delante.\nVuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén los pies planos en el suelo durante todo el ejercicio.\n- Mantén el cuerpo en la postura correcta mientras flexionas y estiendes los brazos.\n- Mira hacia adelante.\n- Cuenta una repetición con cada flexión de brazos.","e":null,"h":null,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos"]},"5794":{"n":"Zancadas adelante equilibrio","v":"https://youtube.com/shorts/iBrDXEpNb1g","d":"Empieza de pie con los pies juntos y da un paso largo hacia adelante. Cuando tu pie toque el suelo levanta la pierna trasera y mantente en equilibrio. Desde esta posición, toca suavemente con la mano opuesta al pie que está en contacto con el suelo. Impúlsate hacia atrás para volver a la posición inicial. Repite el movimiento con la otra pierna.\n\n**Ten en cuenta:**\n\n- Descenso en un plano completamente vertical. \n- Que la rodilla de la extremidad avanzada no sobrepase la altura del pie. \n- Cuenta una repetición por paso.","e":null,"h":null,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5769":{"n":"Gato a perro","v":"https://youtube.com/shorts/udACzISXaig","d":"Colócate en posición cuadrúpeda, con las rodillas bajo las Cadera y las manos bajo los Deltoides, con los dedos abiertos. \n\nInspira a la vez que “alargas” el cuerpo, como intentando separar la cabeza por un lado (estira el cuello, alejando las orejas de los Deltoides) y el coxis por el otro, a la vez que mantienes el peso distribuido de manera homogénea entre manos y rodillas, presionando contra el suelo.\n\nAguanta esta posición unos segundos y, desde ahí, espira mientras encorvas la espalda y acercas la barbilla al pecho. \n\nA medida que curvas la espalda y escondes la cabeza debes contraer el abdomen, como intentando que los abdominales toquen la columna vertebral. Esto maximiza la contracción del transverso abdominal, tu faja natural. Si tu transverso es fuerte, estarás más protegido de lesiones.\n\n**Ten en cuenta:**\n\n- Sincroniza el movimiento a la respiración. \n- Cuenta una repetición cada vez que pasas por las 2 posiciones.","e":null,"h":null,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["muñecas","hombros","cadera","rodillas"]},"5773":{"n":"Pie a mano cruzada","v":"https://youtube.com/shorts/SfhvBGkNuxA","d":"Túmbate boca arriba brazos en cruz. Flexiona un brazo junto a la pierna del lado contrario para conseguir tocar el pie con tu mano.\n\n**Ten en cuenta:**\n\n- Mantén brazo y pierna estirados en todo momento.\n- Vigila no tensar el cuello durante el movimiento. \n- Cuenta una repetición con cada toque de mano y pie.","e":null,"h":null,"m":["abdominales"],"j":["cadera"]},"5766":{"n":"Flexión y extensión de muñecas","v":"https://youtube.com/shorts/7LPKe3jGMc4","d":"Siéntate en el suelo. Extiende un brazo y realiza flexiones y extensiones de la muñeca elevada. Realiza la mitad de las repeticiones  y cambia de lado.\n\n**Ten en cuenta:**\n\n- Mantén  la espalda estirada.\n- Realiza el movimiento lentamente y en su máxima amplitud.\n- Cuenta una repetición por cada flexión y extensión.","e":null,"h":null,"m":["pronadores","supinadores"],"j":["muñecas"]},"5759":{"n":"Burpee roll","v":"https://youtube.com/shorts/3sYAQgxIfok","d":"La posición inicial es de pie. Desde aquí, agacha el cuerpo llevando las manos al suelo, a la vez que saltas con las piernas hacia atrás, colocándote en la posición inicial de plancha, con el cuerpo recto y apoyado en la punta de los pies.\nPasa uno de los brazos por debajo de tu pecho para rodar por el suelo.\nRealiza una flexión de brazos en su parte concéntrica, alejando el pecho al suelo todo lo que puedas. Al finalizar la flexión salta con los pies para colocarlos justo detrás de las manos, y toma impulso para realizar un salto hacia arriba. Da una palmada por encima de la cabeza.\n \n**Ten en cuenta:**\n \n- Mirada al frente.\n- Amortigua bien la caída pero no realices una flexión.\n- El pecho debe conectar con el suelo.\n- Cuando gires haz un apoyo suave sobre el hombro para no hacerte daño. \n- Cuando te levantes mantén las piernas lo más estiradas posible (sin doblar las rodillas).\n- Palmada detrás de la cabeza.\n-  Cuenta una repetición por burpee más giro.","e":null,"h":5236,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},"5789":{"n":"Patada inferior","v":"https://youtube.com/shorts/IcH9SHJj6dc","d":"Empieza apoyado en tus manos y las puntas de tus pies, con las piernas flexionadas para que tus rodillas estén justo debajo tu trasero.\n\nEleva ligeramente el pie izquierdo y la mano derecha y pivota tu cuerpo hacia la derecha pasando tu pierna por debajo tu cuerpo y extendiendola como si dieras una patada.\n\nVuelve a la posición original y repite el ejercicio hacia el otro lado.\n\n**Ten en cuenta:**\n\n- Mantén la tensión abdominal.\n- Realiza el movimiento con fluidez.\n- Cuenta una repetición por patada","e":null,"h":null,"m":["glúteos"],"j":["rodillas","cadera","hombros"]},"5277":{"n":"Sentadilla con salto lateral","v":"https://youtu.be/YzxAE-uPcRw","d":"Colócate de pie, con la espalda recta y sacando ligeramente el trasero hacia afuera flexiona las piernas unos 90º aproximadamente o hasta que tus muslos estén paralelos al suelo. Desde esta posición realiza un pequeño salto desplazándote lateralmente.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Extiende tu cuerpo durante el salto. \n- Amortigua bien la caída. \n- Durante la flexión tus rodillas deben mirar hacia afuera.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición con cada salto.","e":5891,"h":5243,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos"]},"5232":{"n":"Salto","v":"https://youtu.be/M7gEsdfd6lQ","d":"Colócate de pie en el suelo, haz impulso flexionando las rodillas y salta verticalmente lo más alto posible.\n\n**Ten en cuenta:**\n\n- Amortigua la caída.\n- Cuenta una repetición por salto.","e":5233,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},"5237":{"n":"Burpee doble","v":"https://youtu.be/Nl_vSl91JZs","d":"Ejercicio que combina: sentadilla, flexión y salto.\n\nColócate de pie como posición inicial. Desde aquí, agáchate y coloca las manos en el suelo, haz impulso con tus piernas hacia atrás colocándote en plancha, de forma que tu cuerpo esté en paralelo al suelo y tus puntos de apoyo sean las manos y las puntas de los pies.\n\nRealiza dos flexiones completas, acercando el pecho al suelo todo lo que puedas. Al finalizar la flexión lleva los pies justo detrás de tus manos con un salto, toma impulso y salta hacia arriba, dando una palmada por encima de la cabeza para terminar el ejercicio.\n\n**Ten en cuenta:**\n\n- Intenta hacer el ejercicio lo más fluido posible, sin pausas entre sus partes.\n- Para aumentar la velocidad (más burpees en menos tiempo), haz la plancha impulsando los pies hacia atrás antes de que las manos toquen el suelo, y lo mismo al regresar, levanta las manos antes de que los pies vuelvan a su posición inicial para hacer el salto vertical.\n- Si no puedes realizar la flexión, apóyate en las rodillas en lugar de las puntas de los pies.\n- Toca el suelo con el pecho al hacer cada flexión.\n- Al saltar, asegúrate de que lo haces con el cuerpo recto.\n- La palmada se realiza justo encima de tu cabeza con los brazos estirados.\n- Cuenta una repetición con cada palmada.","e":5352,"h":5236,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},"5259":{"n":"Flexión de reptil","v":"https://youtu.be/037X8ErXQ2g","d":"Realiza una flexión normal pero donde los apoyos de tus manos sean: uno a la atura del pecho y el otro por encima de la cabeza. Tras cada flexión alterna las manos con los puntos de apoyo.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","e":5254,"h":5266,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5267":{"n":"Flexión abierta con rodillas","v":"https://youtu.be/NN22gVu6izA","d":"Realiza una flexión apoyándote en las rodillas y con las manos aproximadamente unos 40 cm más abiertas que en una flexión normal.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar en línea recta\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","e":5260,"h":5264,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},"5254":{"n":"Flexión reloj","v":"https://youtu.be/b7Q_DvETmw4","d":"Túmbate boca abajo con las palmas apoyadas en el suelo, en este ejercicio existen 4 apoyos diferentes de las manos que simulan horas concretas de un reloj. Las cuatro posiciones son: \n\n- Ambas manos en las 12h.\n- Una mano en las 3h y la otra en las 9h.\n- Ambas manos en las 6h. \n- Ambas manos en el centro del reloj.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","e":null,"h":5763,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},"5365":{"n":"Sentada con peso","v":"https://youtube.com/shorts/jSpns9URjzM","d":"Tumbado con las piernas estiradas, brazos por encima de tu cabeza y agarrando un ligero peso con las manos, siéntate mientras flexionas tus piernas simultáneamente. \n\n**Ten en cuenta**:\n \n- Asegúrate de extender la espalda cuando abraces las piernas. \n- Elige un peso que te permita realizar el movimiento con precisión\n- Cuenta una repetición por sentada.","e":null,"h":5345,"m":["abdominales","deltoides","trapecios"],"j":["hombros","cadera","rodillas","tobillos"]},"5315":{"n":"Escalador lateral","v":"https://youtu.be/vrUM2JVnseg","d":"1.- Colócate en posición de plancha con ambas manos apoyadas en el suelo, separadas a la anchura de los hombros y las piernas extendidas apoyando la punta de los pies en el suelo. \n2.- Desde esta posición, realiza un impulso para llevar las piernas hacia delante a un lado de tu cuerpo.\n3.- Mediante un impulso realiza el movimiento inverso para volver a la posición inicial, y repite hacia el otro lado.\n\nTen en cuenta: \n\n- Mantén la espalda recta.\n- Evita que los codos se flexionen.\n- Nota el estiramiento de toda la cadena lateral. \n- Cada salto hacia un lado es una repetición.","e":5273,"h":5316,"m":["recto mayor del abdomen","abdominales oblicuos","deltoides","cuádriceps"],"j":["hombros","cadera","rodillas","tobillos"]},"5225":{"n":"Abdominales en semi V","v":"https://youtu.be/ifqmSnSa5-k","d":"Colócate boca arriba con las manos apoyadas en el suelo a cada lado de tu cadera. Desde esta posición eleva ligeramente las piernas y el tronco apoyándote solo con el trasero. Lleva las rodillas al pecho flexionando las piernas y flexiona el tronco hacia delante al mismo tiempo. Vuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta y extiéndela bien en el momento de estirar las piernas. \n- Intenta que el cuerpo y los pies nunca toquen el suelo después de la contracción.\n- Cuenta una repetición cada vez que completes una contracción.","e":5224,"h":5228,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["cadera","rodillas"]},"5269":{"n":"Andar","v":"https://youtu.be/afu6KiuA9C8","d":"Trasládate de un lugar a otro a un ritmo normal por tu propio pie.","e":5241,"h":null,"m":["isquiotibiales","cuádriceps"],"j":["cadera","tobillos","rodillas"]},"5329":{"n":"Flexión rodillas con palmada","v":"https://youtube.com/shorts/LS_943Qy2-M","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho, las rodillas en el suelo y los pies levantados.\nRealiza una flexión con un gran impulso para realizar una palmada en el aire y volver a la posición inicial con las manos en el suelo.\n\n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- Amortigua bien la caida para no hacerte daño en las muñecas\n- Cuenta una repetición por cada palmada.","e":5328,"h":null,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},"5231":{"n":"Salto caja","v":"https://youtu.be/ZJ3925UnXWA","d":"Colócate delante de una caja, banco u otra elevación estable. Salta para colocarte encima de la caja y extiende bien el cuerpo al llegar arriba. Salta hacia atrás recuperando la posición inicial.\n\n**Ten en cuenta:**\n\n- Marca bien la extensión que va a realizar tu cuerpo hasta colocarte encima de la caja.\n- Amortigua bien la caída.\n- Cuenta una repetición por salto.","e":5243,"h":5233,"m":["glúteos","isquiotibiales","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5886":{"n":"Flexión pino con deficit","v":"https://youtube.com/shorts/2HCLf3kru6A","d":"Pon en el suelo, a unos centímetros de la pared una superficie estable de apoyo para las manos o unas barras de suelo.\n\nColócate de cara a la pared, a una distancia que te permita apoyar las manos a 15-20 cm de la pared y patear con las piernas hacia arriba, hasta que quedes cabeza abajo, apoyando únicamente los talones en la pared.\n\nDesde esta posición, flexiona los codos para acercar la cabeza al suelo, y empuja con fuerza para regresar a la posición original.\n\n**Ten en cuenta:**\n\n- Puedes utilizar un cojín para apoyar la cabeza cuando desciendas.\n- La descender no debes realizar una hiper extensión lumbar.\n- Cuenta una repetición por flexión.","e":null,"h":5887,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"6011":{"n":"Sentadilla búlgara con peso (izquierda)","v":"https://youtube.com/shorts/JOhnxeSzpxY","d":"1. Colócate de pie y de espaldas a una caja, banco o silla, con la pierna derecha apoyada sobre ella y agarra una kettlebell con la mano del mismo lado.\n2. Desciende tu cuerpo lentamente flexionando la pierna apoyada en el suelo y llevando la rodilla de la pierna contraria hacia el suelo.\n3. Cuando la rodilla de atrás toque el suelo, empuja con el talón de la pierna delantera contra el suelo para extender la pierna y elevar de nuevo el cuerpo volviendo a la posición inicial. \n\nTen en cuenta:\n\n- La rodilla no debe sobrepasar la punta del pie. \n- Mantén el pecho erguido, la espalda recta y la vista al frente.\n- Cada sentadilla es una repetición.","e":null,"h":5413,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},"6010":{"n":"Sentadilla búlgara con peso (derecha)","v":"https://youtube.com/shorts/kLamKninjQc","d":"1. Colócate de pie y de espaldas a una caja, banco o silla, con la pierna izquierda apoyada sobre ella y agarra una kettlebell con la mano del mismo lado.\n2. Desciende tu cuerpo lentamente flexionando la pierna apoyada en el suelo y llevando la rodilla de la pierna contraria hacia el suelo.\n3. Cuando la rodilla de atrás toque el suelo, empuja con el talón de la pierna delantera contra el suelo para extender la pierna y elevar de nuevo el cuerpo volviendo a la posición inicial. \n\nTen en cuenta:\n\n- La rodilla no debe sobrepasar la punta del pie. \n- Mantén el pecho erguido, la espalda recta y la vista al frente.\n- Cada sentadilla es una repetición.","e":null,"h":5412,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},"5325":{"n":"Flexión manos arriba con rodillas","v":"https://youtube.com/shorts/7um0yDAWjOE","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Impúlsate con las manos para elevar el tronco manteniendo el cuerpo alineado y paralelo al suelo. Las rodillas en el suelo y los pies levantados. \nCuando el pecho toque el suelo, levanta las manos dejando el peso sobre el pecho. Apoya las manos y elévate de nuevo.\n \n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","e":5324,"h":null,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},"5290":{"n":"El puente 1 pierna","v":"https://youtu.be/HVdXJNW8PPw","d":"Colócate tumbado boca arriba con una pierna flexionada y el pie apoyado en el suelo. El tobillo de la otra pierna irá apoyado en la rodilla de la primera para que funcione como punto de apoyo. Desde aquí, realiza una elevación del tronco despegando el trasero del suelo hasta tener el tronco y la pierna completamente alineados. Alterna las piernas entre series.\n\n**Ten en cuenta:**\n\n- Mantén el cuerpo bien alineado. \n- Desciende suavemente. \n- Cuenta una repetición cada extensión.","e":5334,"h":5291,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},"5994":{"n":"El puente isometrico con carga","v":"https://youtube.com/shorts/Bmb8XWQ7Kt4","d":"1.- Colócate tumbado boca arriba, con las piernas flexionadas y los pies apoyados en el suelo, separados a la anchura de tu cadera. \n2.- Coloca una Kettlebell sobre tu cadera.\n3.- Eleva la cadera hacia el techo despegando glúteos del suelo manteniendo el cuerpo alineado. \n4.- Mantén la posición el tiempo indicado.\n\nTen en cuenta:\n\n- Mantén el cuerpo bien alineado, procura que tus rodillas y muslos estén paralelos. \n- Contrae los glúteos mientras los elevas.","e":null,"h":5993,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},"5682":{"n":"Fondos en anillas 2","v":"https://youtube.com/shorts/KBXYFOQQ67U","d":"Ajusta las anillas para que queden por debajo de tus Cadera. Agarra las anillas a ambos lados de tu cuerpo y lleva los pies hacia delante dos pasos, manteniendo el torso perpendicular al suelo y las piernas rectas, apoyadas sobre los talones. \nDesde aquí, flexiona los codos para que el torso descienda (sin inclinarse mucho hacia delante), hasta que tus tríceps estén paralelos al suelo, y empuja para regresar a la posición de partida. \n\nNotas sobre la técnica:\n\n- Mantén los codos cerca del cuerpo durante todo el movimiento.\n- No inclines mucho el torso hacia delante, ya que puede estresar los Deltoides.\n- No dejes que tu cuello se hunda entre los Deltoides, tensa la espalda superior.\n- No dobles las muñecas, deben estar alineadas con los antebrazos.","e":5683,"h":5681,"m":["dorsales","tríceps","trapecios"],"j":["codos","hombros","muñecas"]},"5674":{"n":"Dominada anillas 2","v":"https://youtube.com/shorts/2f91G1yvyDs","d":"Ajusta las anillas para que al colgarte de ellas, con tus brazos totalmente estirados y el torso perpendicular al suelo, tu cadera quede a unos 30-50 cm del suelo. Las piernas deben estar estiradas y apoyadas sobre los talones.\nFlexiona los codos acercando la cabeza a las anillas, y regresa a la posición de partida.\n\nNotas sobre la técnica:\n\n- Mantén la tensión abdominal.\n- Mantén las piernas rectas, apoyadas sobre los talones.\n\nModificaciones:\n\n- Puedes modificar el agarre para hacer más énfasis en distintos músculos. \n- Ajusta la altura de las anillas para encontrar el nivel de complejidad adecuado.","e":5675,"h":5673,"m":["deltoides","bíceps","tríceps"],"j":["codos","hombros"]},"5671":{"n":"Flexión anillas 2","v":"https://youtube.com/shorts/d5xPHGJnHws","d":"Ajusta las anillas para que queden a la altura de la mitad de tu muslo aproximadamente. Agarra las anillas y aleja tus pies hasta que tu cuerpo quede en línea recta, con los antebrazos perpendiculares al suelo.\nFlexiona los codos hasta que tu pecho quede a la altura de las anillas, y empuja para regresar a la posición inicial.\n\nNotas sobre la técnica:\n\n- Mantén el cuerpo recto, tensa abdominales y Glúteos.\n- Alinea el cuello con el resto del cuerpo (posición neutra).\n- Mantén los codos cerca del cuerpo, no abras mucho los brazos (<45°).\n- No dobles las muñecas, deben estar alineadas con los antebrazos.\n\nModificaciones:\n\n- Además de ajustar la altura de las anillas, puedes abrir un poco más las piernas para facilitar el equilibrio (más estabilidad). Para hacerlo más difícil, junta los pies.","e":5672,"h":5670,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5679":{"n":"Remo en anillas 2","v":"https://youtube.com/shorts/uS9TAxq5BR0","d":"Ajusta las anillas para que queden a la altura de tu ombligo aproximadamente. Agarra las anillas y lleva los pies hacia delante, lo necesario para que el cuerpo quede completamente recto, los brazos estirados y las anillas directamente por encima de tu pecho. \nFlexiona los codos para que tu pecho se acerque lo más posible a las anillas, y regresa a la posición inicial.\n\nNotas sobre la técnica:\n\n- Mantén el cuerpo recto, tensando abdominales y Glúteos.\n\nModificaciones:\n\n- Además de ajustar la altura nción de la altura de la barra puede que no tengas que soltarla en cada salto o que sí.\n\n- El agarre es pronado, con las palmas mirando al frente.\n- Intenta utilizar cada vez menos el impulso del salto y más la fuerza de los brazos.","e":6022,"h":null,"m":["dorsales","trapecios","tríceps","bíceps"],"j":["codos","hombros"]},"5638":{"n":"Levantamiento de piernas Flexiónadas","v":"https://youtube.com/shorts/_aIivdnjpvA","d":"Cuélgate de la barra con agarre pronado (palmas mirando al frente), con una apertura un poco mayor de la altura de tus Deltoides, con los brazos totalmente estirados, pero manteniendo tensión en la zona superior de la espalda.\n\nFlexiona las rodillas a la vez que elevas las piernas, hasta que las rodillas lleguen a la altura del pecho. Desciende de manera controlada hasta la posición de inicio y repite el número de veces indicado.\n\n- Tensa la musculatura abdominal para evitar que se balancee el cuerpo.\n- No te impulses con las piernas.","e":5590,"h":5639,"m":["recto mayor del abdomen","trapecios","cuádriceps"],"j":["cadera","rodillas","hombros"]},"5634":{"n":"Flexión en L","v":"https://youtube.com/shorts/syss7G8iDWg","d":"Apoya las manos en el suelo y los pies en una superficie elevada, de tal manera que tu cadera forme un ángulo de unos 90° aproximadamente. Desde esta posición, flexiona los codos hasta que la cabeza llegue a unos pocos centímetros del suelo, y empuja para regresar a la posición original.\n\n- Si te parece muy difícil, apoya los pies en el suelo y las manos en una superficie elevada, manteniendo los 90° en tu cadera.","e":5584,"h":5635,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5636":{"n":"Dominada supina con salto","v":"https://youtube.com/shorts/Kj_IeUrJD-0","d":"Versión más sencilla de la dominada. Se trata de aprovechar el impulso del salto inicial para elevar la barbilla por encima de la barra. En función de la altura de la barra puede que no tengas que soltarla en cada salto o que sí.\ gue a tocar las manos o muy cerca de ellas, y empuja contra el suelo para volver a la posición inicial, estirando los brazos.\n\n- Mantén los codos cerca del cuerpo, en un ángulo de 45° o menos.\n- No permitas que la cadera colapse hacia abajo. Tensa abdominales y Glúteos para mantener el cuerpo recto.\n- Mantén el cuello neutral, alineado con el resto del cuerpo.","e":5616,"h":null,"m":["pectorales","tríceps","deltoides"],"j":["rodillas","codos","hombros","muñecas"]},"6026":{"n":"Levantamiento turco (derecha)","v":"https://youtube.com/shorts/eF4dxieAut4","d":"La posición inicial es tumbado, con el brazo derecho extendido, perpendicular al cuerpo.\n\nDesde esta posición, dobla la rodilla derecha y apoya completamente la planta del pie, no demasiado cerca de la cadera. Inicia el movimiento con los abdominales, levantando el torso lo suficiente para empezar a llevar tu peso al codo izquierdo y, como si estuvieras girando sobre él, levanta el tronco del suelo, liderando el movimiento con el pecho, no con la cabeza. Te apoyas primero en el codo, después en el antebrazo y finalmente en la palma de la mano, extendiendo completamente el brazo izquierdo hasta bloquear el codo. El codo derecho se mantiene completamente extendido durante todo el movimiento.\n\nAhora levanta la cadera, lo suficiente para cruzar por debajo la pierna izquierda, apoyándote en la rodilla, que quedaría debajo de ti. En este momento ambos brazos deberían estar alineados, cercanos a la perpendicular con el suelo. Despega la mano izquierda del suelo, endereza el torso, acerca el pie derecho y levántate. \n\nDesde esta postura, debes revertir el movimiento, apoyando la rodilla izquierda en el suelo, apoyando la mano izquierda, elevando la cadera para estirar la pierna izquierda, bajando la cadera al suelo y controlando la caída hacia atrás, hasta llegar a la posición inicial. Realiza las repeticiones indicadas por un lado y después por el otro.","e":null,"h":null,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5642":{"n":"Levantamiento turco (izquierda)","v":"https://youtube.com/shorts/U6u-nWfCMn8","d":"La posición inicial es tumbado, con el brazo derecho extendido, perpendicular al cuerpo, sujetando la kettlebell con la mano.\n\nDesde esta posición, dobla la rodilla derecha y apoya completamente la planta del pie, no demasiado cerca de la cadera. Inicia el movimiento con los abdominales, levantando el torso lo suficiente para empezar a llevar tu peso al codo izquierdo y, como si estuvieras girando sobre él, levanta el tronco del suelo, liderando el movimiento con el pecho, no con la cabeza. Te apoyas primero en el codo, después en el antebrazo y finalmente en la palma de la mano, extendiendo completamente el brazo izquierdo hasta bloquear el codo. El codo derecho se mantiene completamente extendido durante todo el movimiento.\n\nAhora levanta la cadera, lo suficiente para cruzar por debajo la pierna izquierda, apoyándote en la rodilla, que quedaría debajo de ti. En este momento ambos brazos deberían estar alineados, cercanos a la perpendicular con el suelo. Despega la mano izquierda del suelo, endereza el torso, acerca el pie derecho y levántate.\n\nDesde esta postura, debes revertir el movimiento, apoyando la rodilla izquierda en el suelo, apoyando la mano izquierda, elevando la cadera para estirar la pierna izquierda, bajando la cadera al suelo y controlando la caída hacia atrás, hasta llegar a la posición inicial. Realiza las repeticiones indicadas por un lado y después por el otro.\n\n- La kettlebell debe estar siempre sobre tu centro de gravedad, de lo contrario será difícil controlarla.\n- Si sientes que pierdes el control de la kettlebell, gira rápido tu torso hacia el lado que se inclina la kettlebell y haz un aterrizaje controlado, sin dejar que te doble el codo.\n- Respira de manera normal durante todo el ejercicio.","e":null,"h":null,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["cadera","rodillas","hombros"]},"6024":{"n":"Peso muerto 1 pierna (derecha)","v":"https://youtube.com/shorts/CjJDrSXH5vs","d":"","e":null,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},"6028":{"n":"Peso muerto 1 pierna (izquierda)","v":"https://youtube.com/shorts/hhIn9-JrQl4","d":"Estando de pie, con el cuerpo recto, eleva ligeramente el pie derecho y, manteniendo el torso recto y la pierna izquierda estirada, acerca el torso hacia el suelo, idealmente hasta que esté paralelo al suelo, y regresa a la posición inicial. Lleva la pierna derecha hacia atrás para actuar como contrapeso, manteniéndola alineada con el torso durante el movimiento.\n\n- Si no tienes suficiente flexibilidad, puedes flexionar ligeramente la rodilla de la pierna de apoyo.\n- Si te resulta muy fácil, carga algún peso con las manos para hacerlo más desafiante.","e":null,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},"5647":{"n":"Molino (derecha)","v":"https://youtube.com/shorts/gsSCQfybHRQ","d":"Estando de pie, abre las piernas algo más que la altura de las Cadera y eleva el brazo derecho por encima de tu cabeza. Gira tu pie izquierdo hacia fuera, unos 45° o un poco más. Lleva la cadera hacia la derecha, cargando el peso hacia ese lado. A la vez que desciendes el tronco, rótalo ligeramente hacia arriba, manteniendo la mirada en la mano derecha. Baja hasta llegar a tocar el suelo con la mano izquierda (o lo más abajo que puedas).\n\nEn esta posición final tus brazos deben estar alineados, formando a su vez una línea casi perpendicular con el suelo. Mantén el pecho abierto, los omoplatos juntos, y la mirada en la mano, que debe bajar totalmente vertical. Detente un breve momento en la posición final y realiza el movimiento inverso hasta volver a la posición de cuerpo recto. \n\nInspira al bajar, espira al subir.\n\n- Si te resulta muy fácil el ejercicio, sujeta un peso con la mano elevada: una mochila con peso, una mancuerna, una kettlebell….","e":null,"h":null,"m":["isquiotibiales","gemelos","glúteos"],"j":["cadera","hombros","rodillas"]},"5661":{"n":"Molino (izquierda)","v":"https://youtube.com/shorts/oASJSZotUnY","d":"Estando de pie, con la kettlebell en posición de rack en el lado derecho, realiza un press para elevarla por encima de la cabeza. Gira tu pie izquierdo hacia fuera, unos 45° o un poco más. Lleva la cadera hacia la derecha, cargando el peso hacia ese lado. A la vez que desciendes, rota ligeramente el tronco hacia arriba, manteniendo la mirada en la kettlebell. Baja hasta llegar a tocar el suelo con la mano izquierda (o lo más abajo que puedas).\n\nEn esta posición final tus brazos deben estar alineados, formando a su vez una línea casi perpendicular con el suelo. Mantén el pecho abierto, los omoplatos juntos, y la mirada en la kettlebell, que debe bajar totalmente vertical. Si se desplaza lateralmente se te hará muy difícil controlarla. Detente un breve momento en la posición final y realiza el movimiento inverso hasta volver a la posición de cuerpo recto. Inspira al bajar, espira al subir.\n\n- Si te resulta muy difícil, utiliza un peso menor, o hazlo directamente sin peso.","e":null,"h":null,"m":["isquiotibiales","gemelos","glúteos"],"j":["cadera","hombros","rodillas"]},"5655":{"n":"Extensión explosiva de cadera","v":"https://youtube.com/shorts/-5hgJBEZGZI","d":"Túmbate en el suelo y eleva las piernas, flexionando las rodillas. \nDesde esta posición, baja de manera explosiva los pies a la vez que elevas la cadera. Debes lograr que la cadera se eleve antes de que los pies lleguen al suelo.\n\nRepite el número de veces indicado, intentando aplicar la mayor velocidad posible en la elevación de cadera.","e":null,"h":null,"m":["isquiotibiales","glúteos","abdominales","cuádriceps"],"j":["tobillos","rodillas","cadera"]},"5615":{"n":"Thruster libre","v":"https://youtube.com/shorts/FcsCLR5VuQc","d":"Empieza de pie, con el cuerpo recto y los codos flexionados, apuntando al s.","e":5374,"h":5229,"m":["abdominales","lumbares"],"j":["cadera","hombros"]},"5996":{"n":"Hip thrust con carga","v":"https://youtube.com/shorts/ZWhOXxqsWeo","d":"1. Colócate sentado con la espalda apoyada sobre un cajón, justo debajo de las escápulas, con las piernas flexionadas y los pies apoyados en el suelo, separados a la anchura de tu cadera. \n2. Coloca una Kettlebell sobre tu cadera.\n3. Eleva la cadera hacia el techo despegando glúteos del suelo manteniendo el cuerpo alineado. \n4. Desciende lentamente y vuelve a la posición inicial.\n\nTen en cuenta:\n\n- Mantén el cuerpo bien alineado, procura que tus rodillas y muslos estén paralelos. \n- Contrae los glúteos mientras los elevas.","e":null,"h":5995,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},"5295":{"n":"Flexión declinada","v":"https://youtu.be/j7JYaVoR-0k","d":"Movimiento de flexión con los pies apoyados sobre una caja, banco o superficie elevada.\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta y la mirada al frente.\n- Cuanto más elevadas estén las piernas, más difícil es el ejercicio.\n- Cuenta una repetición por cada flexión.","e":5320,"h":5289,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5419":{"n":"Semi burpee dos piernas","v":"https://youtube.com/shorts/uroTPKIL8js","d":"1. Colócate de pie como posición inicial.\n2. Realiza un salto vertical a la vez que das una palmada con las manos por encima de tu cabeza.\n3. Apoya las manos en el suelo y con un impulso de piernas, llévalas hacia atrás hasta quedar en posición de plancha.\n4. Lleva de nuevo los pies hacia tu pecho para volver a ponerte de pie.\n\nTen en cuenta:\n\n- Cada vez que vuelvas a la posición inicial es una repetición.","e":5236,"h":5279,"m":["recto mayor del abdomen","cuádriceps","deltoides"],"j":["rodillas","cadera","hombros","muñecas"]},"5335":{"n":"Plancha rotacion","v":"https://youtube.com/shorts/guXQ0krotlA","d":"Coloca el cuerpo boca abajo apoyando los antebrazos perpendiculares
