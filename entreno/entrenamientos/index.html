squiotibiales","cuádriceps","deltoides","trapecios"],"j":["cadera","rodillas","hombros","codos","tobillos"]},"5434":{"n":"Sentadilla pistolero con caja","v":"https://youtube.com/shorts/im1iTjTI6X8","d":"1. Colócate de pie delante de una caja o banco a unos de los lados y con una pierna y ambos brazos extendidos hacías el frente.\n2. Con una sola pierna como punto de apoyo en el suelo comienza el movimiento descendente, llevando la cadera hacia atrás y flexionando la rodilla de la pierna cuyo pie está totalmente en el suelo.\n3. Siéntate ligeramente en el banco con la rodilla de apoyo 90º y la otra extendida.\n4. Impúlsate hacia arriba con la pierna de apoyo para volver a la posición inicial.\n5. Cada vez que subas alterna de pierna.\n\nTen en cuenta: \n- Mantén la espalda recta siempre. \n- Mantén los brazos hacia adelante para que te ayuden a mantener el equilibrio.\n- Evita levantar el talón de pie de apoyo.\n- Cada flexión es una repetición.","e":5437,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},"5265":{"n":"Flexión lateral con rodillas","v":"https://youtu.be/XPMgLyiaKOA","d":"Túmbate boca abajo con las palmas y las rodillas apoyadas en el suelo. Realiza una flexión y desplázate haciendo impulso con tus manos hacia un lado, realiza otra flexión y vuelve a impulsarte hacia tu lugar inicial para hacer otra repetición.\n\n**Ten en cuenta:**\n\n- Para hacer correctamente el cambio de apoyo mantén los brazos estirados, junta las manos y desplaza una de ellas para cambiar de posición, haz lo mismo al volver.\n- Mantén la mirada al frente y tu cuerpo en línea recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","e":5258,"h":5267,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},"5878":{"n":"Plancha press","v":"https://youtube.com/shorts/Yt3aTQLjqTk","d":"Coloca el cuerpo boca abajo apoyando los antebrazos y las puntas de los pies en el suelo. Mantén piernas, tronco y cabeza estirados en paralelo al suelo. Apoya todo el peso del cuerpo en los antebrazos y desde esta posición, elévate usando la fuerza de tus brazos, especialmente los tríceps, hasta tener los brazos estirados. Luego, vuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta y la mirada al frente. \n- Cuenta una repetición por cada levantamiento.","e":null,"h":5339,"m":["recto mayor del abdomen","tríceps"],"j":["codos","hombros","muñecas"]},"5906":{"n":"Zancada con salto con peso (derecha)","v":"https://youtube.com/shorts/xNizrI41-v4","d":"1. Colócate de pie como posición inicial, con una kettlebell apoyada en el suelo entre tus piernas.\n2. Flexiona las piernas, agarra la kettlebell con las manos y realiza una cargada para llevarla a la altura del pecho.\n3. Desde esta posición, da un pequeño salto vertical y lleva una de tus piernas un paso hacia adelante y la otra hacia atrás.\n4. Lleva la rodilla de la pierna trasera hacia el suelo, flexionando ambas piernas, de manera que queden aproximadamente en 90º y, desde esta posición, realiza un salto vertical para cambiar de pierna en el aire y quedar en la misma posición.\n\nTen en cuenta:\n- Este ejercicio no requiere desplazamiento.\n- Realiza los pasos de forma fluida, sin pausa.\n- Extiende tu cuerpo durante el salto.\n- Amortigua suavemente la caída acabando en la posición de zancada.\n- La rodilla de la pierna adelantada no debe sobrepasar la punta del pie.\n- Cada salto es una repetición.","e":null,"h":5819,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5905":{"n":"Zancada con salto con peso (izquierda)","v":"https://youtube.com/shorts/sd5LXeFkwBw","d":"1. Colócate de pie como posición inicial, con una kettlebell apoyada en el suelo entre tus piernas.\n2. Flexiona las piernas, agarra la kettlebell con las manos y realiza una cargada para llevarla a la altura del pecho.\n3. Desde esta posición, da un pequeño salto vertical y lleva una de tus piernas un paso hacia adelante y la otra hacia atrás.\n4. Lleva la rodilla de la pierna trasera hacia el suelo, flexionando ambas piernas, de manera que queden aproximadamente en 90º y, desde esta posición, realiza un salto vertical para cambiar de pierna en el aire y quedar en la misma posición.\n\nTen en cuenta:\n- Este ejercicio no requiere desplazamiento.\n- Realiza los pasos de forma fluida, sin pausa.\n- Extiende tu cuerpo durante el salto.\n- Amortigua suavemente la caída acabando en la posición de zancada.\n- La rodilla de la pierna adelantada no debe sobrepasar la punta del pie.\n- Cada salto es una repetición.","e":null,"h":5820,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5309":{"n":"Bubu","v":"https://youtu.be/j7IIbUwjW0Q","d":"Este ejercicio combina la realización de un Burpee y un Burrol en cada repetición.\n \nBurpee: Movimiento complejo en 3 fases. Inicia el movimiento de pie. \n \n1. Tírate al suelo boca abajo amortiguando la caída con las manos hasta que todo tu cuerpo toque el suelo.\n2. Manteniendo las manos en el suelo, impulsa los pies para llevarlos lo más cerca posible de las manos.\n3. Ponte de pie realizando un salto vertical y dando una palmada por encima de tu cabeza.\n \nBurrol: Movimiento complejo en 3 fases. Inicia el movimiento de pie.\n \n1. Tírate al suelo boca arriba sentándote primero y seguidamente estirándote completamente con los brazos estirados por encima de la cabeza.\n2. Levántate con un impulso para ponerte de cuclillas.\n3. Ponte de pie dando un salto vertical y una palmada por encima de tu cabeza.\n \n \n**Ten en cuenta:**\n \n- Estírate completamente en el suelo al tumbarte.\n- En los Burpees: intenta mantener las piernas estiradas cuando saltes para levantarte.\n- En los Burrols: utiliza las manos para levantarte si lo necesitas.\n- Cuenta una repetición una vez realizado un burpee y un burrol.","e":5311,"h":5238,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},"5956":{"n":"Mesa plegable","v":"https://youtube.com/shorts/DyQOw4lC-Zg","d":"En el suelo apoyando manos y pies y con la barriga mirando hacia arriba, extiéndete todo lo posible hasta forma una línea recta desde las rodillas hasta los Deltoides, manteniendo la cabeza alineada y sin permitir que el pecho se hunda entre los Deltoides. Haz una breve pausa.\n\nLuego, relaja la extensión para transitar a una flexión global del cuerpo, tratando de colocar la pelvis entre tus brazos sin que el trasero toque el suelo, empujando fuerte y extendiendo todo lo que puedas las rodillas (si puedes llegar a bloquearlas, mejor).","e":null,"h":null,"m":["erector de la columna"],"j":["cadera"]},"6044":{"n":"Peso muerto 1 pierna con KB (derecha)","v":"https://youtube.com/shorts/iI1FYaUIYHA","d":"1. Colócate de pie con una kettlebell cogida con las dos manos y los brazos extendidos, los pies separados a una distancia equivalente a la de nuestros hombros y mirando al frente. \n2. Flexiona una de tus piernas y llevándola hacia atrás, quedando en equilibrio sobre la otra pierna.\n3. Desde esa posición, lleva la pierna elevada hacia atrás mientras la extiendes completamente, a la vez que bajas el tronco y apoyas las manos en el suelo, sin flexionar los brazos.\n4. Realiza el movimiento inverso, y apoya de nuevo la pierna en el suelo regresando a la posición inicial.\n\n\nTen en cuenta: \n\n- Mantén la espalda recta en todo momento.\n- Si no tienes flexibilidad, puedes doblar ligeramente la pierna de apoyo. \n- Cada flexión hacia atrás es una repetición.","e":null,"h":5408,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},"6045":{"n":"Peso muerto 1 pierna con KB (izquierda)","v":"https://youtu.be/gG82S0iHYZI","d":"1. Colócate de pie con una kettlebell cogida con las dos manos y los brazos extendidos, los pies separados a una distancia equivalente a la de nuestros hombros y mirando al frente. \n2. Flexiona una de tus piernas y llevándola hacia atrás, quedando en equilibrio sobre la otra pierna.\n3. Desde esa posición, lleva la pierna elevada hacia atrás mientras la extiendes completamente, a la vez que bajas el tronco y apoyas las manos en el suelo, sin flexionar los brazos.\n4. Realiza el movimiento inverso, y apoya de nuevo la pierna en el suelo regresando a la posición inicial.\n\n\nTen en cuenta: \n\n- Mantén la espalda recta en todo momento.\n- Si no tienes flexibilidad, puedes doblar ligeramente la pierna de apoyo. \n- Cada flexión hacia atrás es una repetición.","e":null,"h":5409,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},"5347":{"n":"Flexión spider inversa","v":"https://youtube.com/shorts/zEBgaQxjrkY","d":"Colócate en plancha y haz una flexión normal, cuando termines, lleva una pierna hacia el codo del mismo lado. Repite con la otra pierna.\n \n**Ten en cuenta:**\n\n- Tu cuerpo debe estar en completa línea recta.\n- El pecho debe conectar con el suelo.\n- Flexiona la rodilla hasta tocar el codo, si no llegas no te preocupes ya irás ganando flexibilidad con el tiempo. \n- Cuenta una repetición por flexión.","e":null,"h":5348,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"6043":{"n":"Peso muerto 1 pierna con KB","v":"https://youtube.com/shorts/5hCNNHZKpp4","d":"1. Colócate de pie con una kettlebell cogida con las dos manos y los brazos extendidos, los pies separados a una distancia equivalente a la de nuestros hombros y mirando al frente. \n2. Flexiona una de tus piernas y llevándola hacia atrás, quedando en equilibrio sobre la otra pierna.\n3. Desde esa posición, lleva la pierna elevada hacia atrás mientras la extiendes completamente, a la vez que bajas el tronco y apoyas las manos en el suelo, sin flexionar los brazos.\n4. Realiza el movimiento inverso, y apoya de nuevo la pierna en el suelo regresando a la posición inicial.\n5. Repite el movimiento cambiando la pierna de apoyo.\n\nTen en cuenta: \n\n- Mantén la espalda recta en todo momento.\n- Si no tienes flexibilidad, puedes doblar ligeramente la pierna de apoyo. \n- Cada flexión hacia atrás es una repetición.","e":null,"h":5274,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},"5257":{"n":"Flexión en L","v":"https://youtu.be/TKwuiAJgzzU","d":"Túmbate boca abajo con las palmas apoyadas en el suelo y tus pies apoyados en una caja o superficie lo suficientemente elevada como para que el cuerpo quede en forma de L. Desde esta posición realiza el movimiento de flexión.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al ombligo.\n- Los brazos deben estar extendidos por encima de la cabeza.\n- El cuerpo debe formar una L con piernas y manos.\n- Cuenta una repetición por cada flexión.","e":5879,"h":5255,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},"5247":{"n":"Zancada pivot","v":"https://youtu.be/PxO8aFbJqPU","d":"Colocándote de pie como posición inicial, da un paso largo hacia adelante y desde esta posición, toca suavemente el suelo con la rodilla de la pierna trasera, pivota siempre sobre el mismo pie.\n\n**Ten en cuenta:**\n\n- Realiza el descenso en un plano completamente vertical, con la espalda recta.\n- Este ejercicio no requiere desplazamiento.\n- La rodilla de la pierna que avanza no debe sobrepasar la altura del pie.\n- Haz la mitad de las repeticiones con cada pierna.\n- Cuenta una repetición por cada flexión.","e":5246,"h":5245,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5250":{"n":"Cohete","v":"https://youtu.be/mfAAEQhVO6A","d":"Colócate delante de una caja, banco u otra elevación estable. Como posición inicial, apoya una de las piernas en la caja realizando una flexión de 90º con la misma. Desde esta posición, impúlsate como si fueras a poner la otra pierna encima de la caja, pero sin llegar a tocarla, de forma que ambas piernas estén completamente estiradas y una sola apoyada en la caja. Termina el movimiento volviendo a la posición inicial.\n\n**Ten en cuenta:**\n\n- Extiende tu cuerpo al final de la elevación. \n- Desciende de manera controlada.\n- Cuenta una repetición por cada levantamiento.","e":5355,"h":null,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5892":{"n":"Zancada con salto con peso","v":"https://youtube.com/shorts/y5KQpmeC3iM","d":"Sujetando la kettlebell con las dos manos a la altura del pecho da un paso largo hacia adelante y desde esta posición, haz un salto vertical para cambiar de pierna . El ejercicio se hace sin desplazamiento. Durante el salto las piernas quedan completamente estiradas y se intercambian en el aire. Amortigua realizando el movimiento de zancada.\n\n**Ten en cuenta:**\n\n- Extiende tu cuerpo durante el salto. \n- Amortigua la caída. \n- Descenso en un plano completamente vertical. \n- Baja suavemente hasta que tu rodilla conecte con el suelo. \n- Que la rodilla de la extremidad avanzada no sobrepase la altura del pie.\n- Cuenta una repetición por salto.","e":null,"h":null,"m":["cuádriceps","glúteos"],"j":["cadera","rodillas","tobillos"]}}};
const COLORS={primal:'#ff7a3d',ring:'#35c2ff',unb:'#b36bff',aurum:'#f5c542',elite:'#ff3d5a'};
const TYPES={interval_repetitions:'Intervalo a repeticiones',interval_repetitions_with_pause:'Series con pausa',tabata:'Tábata',super_series:'Superserie',to_the_one:'To the One',paleo_run:'Paleo run',spartan_race:'Spartan race'};
const REST=5968;
const EX=DATA.ex;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>{s=String(s||'').trim();return s.charAt(0).toUpperCase()+s.slice(1)};
const exName=id=>cap((EX[id]||{}).n||'Ejercicio');
const fmt=t=>{t=Math.max(0,Math.round(t));const m=Math.floor(t/60),s=t%60;return m>0?m+':'+String(s).padStart(2,'0'):String(s)};
const fmtLong=t=>{t=Math.round(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
/* progress */
let PR={};
try{PR=JSON.parse(localStorage.getItem('ent_prog_v1')||'{}')}catch(e){PR={}}
function savePR(){try{localStorage.setItem('ent_prog_v1',JSON.stringify(PR))}catch(e){}}
const isDone=(p,n)=>!!(PR[p]&&PR[p][n]);
function setDone(p,n,v){PR[p]=PR[p]||{};if(v)PR[p][n]=Date.now();else delete PR[p][n];savePR()}
function nextSes(p){const P=DATA.progs.find(x=>x.id===p.id||x===p);return P.ses.find(s=>!isDone(P.id,s.n))||null}
/* views */
let view={p:null,s:null};
function render(){
  const a=$('#app');
  if(!view.p){
    a.style.setProperty('--c','#ff6a3d');
    a.innerHTML=`<div class="top"><h1>🏋️ Mis entrenamientos</h1><a class="back" style="text-decoration:none" href="../biblioteca/">📚 Biblioteca</a><button class="back" onclick="backupModal()">Copia de progreso</button></div>
    <p class="sub" style="margin:-10px 0 20px">Elige un programa. Cada sesión se puede hacer en modo guiado, con cronómetro y descansos.</p>
    <div class="grid">`+DATA.progs.map(P=>{
      const d=P.ses.filter(s=>isDone(P.id,s.n)).length,n=nextSes(P);
      return `<button class="pcard" style="--c:${COLORS[P.id]}" onclick="openP('${P.id}')"><span class="tag">${esc(P.sub)}</span><h2>${esc(P.name)}</h2>
      <div class="bar"><i style="width:${d/P.ses.length*100}%"></i></div>
      <div class="sub">${d} de ${P.ses.length} sesiones hechas${n?' · siguiente: sesión '+esc(n.n):' · ¡completado!'}</div></button>`}).join('')+`</div>`;
    return;
  }
  const P=DATA.progs.find(x=>x.id===view.p);
  a.style.setProperty('--c',COLORS[P.id]);
  if(view.s==null){
    const nx=nextSes(P),d=P.ses.filter(s=>isDone(P.id,s.n)).length;
    a.innerHTML=`<div class="top"><button class="back" onclick="go(null,null)">← Programas</button><h1>${esc(P.name)}</h1></div>
    <details class="pres"><summary>Sobre este programa</summary><p>${esc(P.pres.filter(x=>x!==P.pres[0]||P.pres.length<2).join('\n\n'))}</p></details>
    <div class="bar"><i style="width:${d/P.ses.length*100}%"></i></div>
    <p class="sub" style="margin-bottom:14px">${d} de ${P.ses.length} sesiones hechas</p>
    ${nx?`<div class="bigplay"><button class="btn" onclick="go('${P.id}','${nx.n}')">Ir a la sesión ${esc(nx.n)} →</button></div>`:''}
    <div class="sgrid">`+P.ses.map(s=>`<button class="stile ${isDone(P.id,s.n)?'done':''} ${nx&&nx.n===s.n?'next':''}" onclick="go('${P.id}','${s.n}')"><b>${esc(s.n)}</b><span>${esc(sesTitle(s))}</span></button>`).join('')+`</div>`;
    return;
  }
  const S=P.ses.find(x=>x.n===view.s);
  const idx=P.ses.indexOf(S);
  let tot=0;S.b.forEach(b=>b.s.forEach(st=>{tot+=st[1]}));
  a.innerHTML=`<div class="top"><button class="back" onclick="go('${P.id}',null)">← ${esc(P.name)}</button><button class="back" onclick="go(null,null)">🏠 Menú principal</button><h1>Sesión ${esc(S.n)}</h1></div>
  <div class="sub" style="margin:-12px 0 12px">${esc(sesTitle(S))} · ${S.b.length} bloque${S.b.length>1?'s':''}${isDone(P.id,S.n)?' · ✓ hecha':''}</div>
  <div class="bigplay"><button class="btn" onclick="startG('${P.id}','${S.n}',0)">▶ Empezar sesión guiada</button>
  <button class="btn ghost" onclick="toggleDone('${P.id}','${S.n}')">${isDone(P.id,S.n)?'Desmarcar como hecha':'Marcar como hecha'}</button>
  ${idx>0?`<button class="btn ghost" onclick="go('${P.id}','${P.ses[idx-1].n}')">← Anterior</button>`:''}
  ${idx<P.ses.length-1?`<button class="btn ghost" onclick="go('${P.id}','${P.ses[idx+1].n}')">Siguiente →</button>`:''}</div>
  ${S.d?`<div class="desc">${esc(S.d)}</div>`:''}`+S.b.map((b,bi)=>blockHTML(P,S,b,bi)).join('');
}
function sesTitle(s){
  if(s.t)return s.t;
  const u=[];s.b.forEach(b=>{const t=TYPES[b.k]||'';if(t&&!u.includes(t))u.push(t)});
  return u.slice(0,2).join(' · ')||('Sesión '+s.n);
}
function qtxt(t,r){return t>0&&r>0?r+' reps · '+t+' s':t>0?(t>=60&&t%60==0?(t/60)+' min':t+' s'):'× '+r}
function rowH(ex,q){const isR=ex===REST;return `<div class="erow ${isR?'r':''}"><span class="nm" ${isR?'':`onclick="exModal(${ex})"`}>${isR?'Descanso':esc(exName(ex))}</span>${(!isR&&EX[ex]&&EX[ex].v)?`<a class="vl" href="${esc(EX[ex].v)}" target="_blank" rel="noopener" title="Ver vídeo">▶ Vídeo</a>`:''}<span class="qt">${q}</span></div>`}
function blockHTML(P,S,b,bi){
  const sets={};b.s.forEach(st=>{(sets[st[3]]=sets[st[3]]||[]).push(st)});
  const keys=Object.keys(sets).map(Number).sort((a,b)=>a-b);
  const sig=k=>JSON.stringify(sets[k].map(x=>[x[0],x[1],x[2]]));
  const groups=[];
  keys.forEach(k=>{const g=groups[groups.length-1];if(g&&g.sig===sig(k))g.ks.push(k);else groups.push({sig:sig(k),ks:[k]})});
  const nr=k=>sets[k].filter(x=>x[0]!==REST).map(x=>x[0]).join(',');
  const sameEx=keys.every(k=>nr(k)===nr(keys[0]));
  let rows='';
  if(groups.length>2&&sameEx){
    const vals={};sets[keys[0]].forEach((st,i)=>{if(st[0]!==REST)vals[i]=1});
    const base=sets[keys[0]].filter(x=>x[0]!==REST);
    base.forEach((st,i)=>{
      const v=keys.map(k=>sets[k].filter(x=>x[0]!==REST)[i]);
      const f=a=>{const u=v.map(a);return u.every(x=>x===u[0])?String(u[0]):u.length>6?u[0]+' → '+u[u.length-1]:u.join(' · ')};
      const q=v.every(x=>x[1]===v[0][1]&&x[2]===v[0][2])?qtxt(v[0][1],v[0][2]):(v[0][1]>0&&v[0][2]===0?f(x=>x[1])+' s':'× '+f(x=>x[2]));
      rows+=rowH(st[0],q);
    });
    const rs=[];keys.forEach(k=>sets[k].filter(x=>x[0]===REST).forEach(x=>rs.push(x[1])));
    if(rs.length){const u=[...new Set(rs)];rows+=rowH(REST,u.length>4?u.slice(0,4).join(' · ')+' …':u.join(' · ')+' s'.replace(/^/,''))}
  }else{
    rows=groups.map(g=>{
      const lab=g.ks.length>1?`Vueltas ${g.ks[0]}–${g.ks[g.ks.length-1]}`:`Vuelta ${g.ks[0]}`;
      return (groups.length>1?`<div class="lbl2">${lab}</div>`:'')+sets[g.ks[0]].map(st=>rowH(st[0],qtxt(st[1],st[2]))).join('');
    }).join('');
  }
  return `<div class="block"><div class="bh"><h3>Bloque ${bi+1}</h3><span class="chip c">${esc(TYPES[b.k]||b.k||'Bloque')}</span><span class="chip">${keys.length} vuelta${keys.length>1?'s':''}</span><span style="flex:1"></span><button class="btn ghost small" onclick="startG('${P.id}','${S.n}',${bi})">▶ Empezar aquí</button></div>${rows}</div>`;
}
function go(p,s){view={p,s};render();window.scrollTo(0,0)}
function openP(id){go(id,null)}
function toggleDone(p,n){setDone(p,n,!isDone(p,n));render()}
/* modal */
function showM(h){$('#mb').innerHTML=h;$('#m').classList.add('on')}
function closeM(){$('#m').classList.remove('on');if(G&&G.paused&&G.pausedByModal){G.pausedByModal=false;togglePause()}}
$('#m').addEventListener('click',e=>{if(e.target.id==='m')closeM()});
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function exModal(id){
  const e=EX[id];if(!e)return;
  if(G&&!G.paused&&G.mode!=='sum'){G.pausedByModal=true;togglePause()}
  const li=(arr)=>arr&&arr.length?`<div class="tags">${arr.map(x=>`<span class="chip">${esc(x.trim())}</span>`).join('')}</div>`:'';
  showM(`<h2>${esc(cap(e.n))}</h2>
  <div class="row">${e.v?`<a class="btn" style="text-decoration:none" href="${esc(e.v)}" target="_blank" rel="noopener">▶ Ver vídeo</a>`:''}<button class="btn ghost" onclick="closeM()">Cerrar</button></div>
  ${e.d?`<div class="tx">${md(e.d)}</div>`:''}
  ${e.m&&e.m.length?`<div class="lbl2">Músculos</div>${li(e.m)}`:''}
  ${e.j&&e.j.length?`<div class="lbl2">Articulaciones</div>${li(e.j)}`:''}
  ${e.e&&EX[e.e]?`<div class="lbl2">Versión más fácil</div><button class="btn ghost small" onclick="exModal(${e.e})">${esc(cap(EX[e.e].n))}</button>`:''}
  ${e.h&&EX[e.h]?`<div class="lbl2">Versión más difícil</div><button class="btn ghost small" onclick="exModal(${e.h})">${esc(cap(EX[e.h].n))}</button>`:''}`);
}
function backupModal(){
  const t=JSON.stringify(PR);
  showM(`<h2>Copia de progreso</h2><div class="tx">Tu progreso se guarda en este navegador. Si cambias de ordenador o borras los datos del navegador, se pierde. Copia este texto y guárdalo; para recuperarlo, pégalo abajo y pulsa «Restaurar».</div>
  <textarea id="bk">${esc(t)}</textarea>
  <div class="row"><button class="btn" onclick="try{navigator.clipboard.writeText($('#bk').value)}catch(e){$('#bk').select()}">Copiar</button><button class="btn ghost" onclick="restoreBk()">Restaurar</button><button class="btn ghost" onclick="closeM()">Cerrar</button></div>`);
}
function restoreBk(){try{const o=JSON.parse($('#bk').value);if(o&&typeof o==='object'){PR=o;savePR();closeM();render()}}catch(e){$('#bk').value='Texto no válido'}}
/* guided */
let G=null,TM=null,AC=null;
function beep(f,d){if(!G||!G.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.25;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
async function wake(){try{if(navigator.wakeLock)G.wl=await navigator.wakeLock.request('screen')}catch(e){}}
function buildSteps(S,from){
  const steps=[];
  S.b.forEach((b,bi)=>{
    if(bi<from)return;
    const ns=Math.max(...b.s.map(x=>x[3]));
    b.s.forEach(st=>steps.push({ex:st[0],t:st[1],r:st[2],set:st[3],ns,bi,k:b.k,nb:S.b.length}));
  });
  return steps;
}
function startG(pid,sn,from){
  const P=DATA.progs.find(x=>x.id===pid),S=P.ses.find(x=>x.n===sn);
  const steps=buildSteps(S,from);
  if(!steps.length)return;
  const f=steps.find(s=>s.ex!==REST)||steps[0];
  steps.unshift({ex:f.ex,t:5,r:0,set:f.set,ns:f.ns,bi:f.bi,k:f.k,nb:f.nb,ready:true});
  G={P,S,steps,i:0,sound:true,paused:false,t0:Date.now(),from,mode:'run'};
  $('#g').classList.add('on');document.body.style.overflow='hidden';
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  wake();enter(0);
}
function enter(i){
  G.i=i;clearInterval(TM);
  if(i>=G.steps.length){finish();return}
  const st=G.steps[i];G.paused=false;
  if(st.t>0){G.end=Date.now()+st.t*1000;G.left=st.t;G.lastBeep=null;TM=setInterval(tick,100);if(st.ex!==REST&&!st.ready)beep(1175,.35)}
  else{if(!st.ready)beep(1175,.2)}
  drawG();
}
function tick(){
  if(G.paused)return;
  const left=Math.max(0,(G.end-Date.now())/1000);G.left=left;
  const r=Math.ceil(left);
  if(r!==G.lastBeep){G.lastBeep=r;if(r<=3&&r>=1)beep(880,.12);const el=$('#gt');if(el){el.textContent=fmt(r);el.className='gtimer'+(r<=3?' low pulse':'')}}
  if(left<=0){clearInterval(TM);next(true)}
}
function next(auto){
  if(!G||G.mode==='sum')return;
  const st=G.steps[G.i];
  enter(G.i+1);
}
function prev(){if(G.i>0){enter(G.i-1)}}
function togglePause(){
  if(!G||G.mode==='sum')return;
  const st=G.steps[G.i];
  if(G.paused){G.paused=false;if(st.t>0){G.end=Date.now()+G.left*1000}}
  else{G.paused=true;if(st.t>0)G.left=Math.max(0,(G.end-Date.now())/1000)}
  drawG();
}
function exitG(force){
  if(!force&&G.mode!=='sum'){
    if(!G.paused&&G.steps[G.i].t>0)togglePause();
    showM(`<h2>¿Salir de la sesión?</h2><div class="tx">Se perderá el avance de esta sesión guiada.</div><div class="row"><button class="btn" onclick="closeM();exitG(true)">Salir a la sesión</button><button class="btn ghost" onclick="closeM();exitG(true);go(null,null)">🏠 Menú principal</button><button class="btn ghost" onclick="closeM()">Seguir entrenando</button></div>`);
    return;
  }
  clearInterval(TM);try{G.wl&&G.wl.release()}catch(e){}
  G=null;$('#g').classList.remove('on');document.body.style.overflow='';render();
}
function finish(){
  clearInterval(TM);G.mode='sum';setDone(G.P.id,G.S.n,true);
  const el=(Date.now()-G.t0)/1000;beep(1175,.5);
  const P=G.P,S=G.S,idx=P.ses.indexOf(S),nx=P.ses[idx+1];
  const g=$('#g');g.className='on ready';
  g.innerHTML=`<div class="gmid"><div class="sum"><div class="gphase">${esc(P.name)} · Sesión ${esc(S.n)}</div><h2 class="big">¡Sesión completada!</h2><div class="gsub" style="margin:10px 0 24px">Tiempo total: <b>${fmtLong(el)}</b></div>
  <div class="row" style="justify-content:center"><button class="btn gdone" onclick="exitG(true)">Terminar</button><button class="btn ghost" onclick="exitG(true);go(null,null)">🏠 Menú principal</button>${nx?`<button class="btn ghost" onclick="const p='${P.id}',n='${nx.n}';exitG(true);go(p,n)">Ir a la sesión ${esc(nx.n)}</button>`:''}</div></div></div>`;
}
function nextWork(i){for(let j=i+1;j<G.steps.length;j++)if(G.steps[j].ex!==REST)return G.steps[j];return null}
function drawG(){
  const st=G.steps[G.i],n=G.steps.length-1;
  const isRest=st.ex===REST,isReps=!st.ready&&st.t===0&&!isRest,isTime=st.t>0;
  const g=$('#g');
  g.className='on '+(st.ready?'ready':isRest?'rest':isTime?'work':'reps');
  g.style.setProperty('--c',COLORS[G.P.id]);
  const nx=G.steps[G.i+1];
  let nxt='';
  if(nx){
    const q=nx.t>0?(nx.t>=60&&nx.t%60==0?nx.t/60+' min':nx.t+' s'):'× '+nx.r;
    nxt=`Siguiente: <b>${nx.ex===REST?'Descanso':esc(exName(nx.ex))}</b> · ${q}`;
    if(isRest){const w=nextWork(G.i);if(w&&nx.ex===REST){}}
  }else nxt='Último paso 🎉';
  let phase,name,main,sub='';
  if(st.ready){phase='Prepárate';name=exName(st.ex);main=`<div class="gtimer" id="gt">${fmt(Math.ceil(G.left))}</div>`;
    const w=G.steps[1];sub=w?(w.t>0?w.t+' s':'× '+w.r):''}
  else if(isRest){phase='Descanso';const w=nextWork(G.i);name=w?'Prepara: '+exName(w.ex):'Descanso';main=`<div class="gtimer" id="gt">${fmt(Math.ceil(G.left))}</div>`;}
  else if(isTime){phase='Trabajo';name=exName(st.ex);main=`<div class="gtimer" id="gt">${fmt(Math.ceil(G.left))}</div>`;if(st.r>0)sub='× '+st.r+' repeticiones'}
  else{phase='Repeticiones';name=exName(st.ex);main=`<div class="gtimer">× ${st.r||'—'}</div>`;sub='Pulsa HECHO cuando termines (barra espaciadora)'}
  const stepNo=G.steps.slice(0,G.i+1).filter(s=>!s.ready).length,total=G.steps.filter(s=>!s.ready).length;
  let vex=st.ex;if(isRest){const nx=G.steps.slice(G.i+1).find(s=>s.ex&&s.ex!==REST&&!s.ready);vex=nx&&nx.ex}
  const vidBtn=(vex&&EX[vex]&&EX[vex].v)?`<a class="btn" style="text-decoration:none;background:#ffb43d" href="${esc(EX[vex].v)}" target="_blank" rel="noopener">▶ Ver vídeo</a>`:'';
  const tipBtn=(!isRest&&EX[st.ex])?`<button class="btn ghost" onclick="exModal(${st.ex})">Técnica / vídeo</button>`:'';
  g.innerHTML=`<div class="gbar"><i style="width:${Math.max(0,(G.i)/n*100)}%"></i></div>
  <div class="gtop"><button class="btn ghost small" onclick="exitG()">✕ Salir</button>
  <div class="lbl"><b>${esc(G.P.name)}</b> · Sesión ${esc(G.S.n)} · Bloque ${st.bi+1}/${st.nb} · ${esc(TYPES[st.k]||'')} · Vuelta ${st.set}/${st.ns}</div>
  <button class="btn ghost small" onclick="G.sound=!G.sound;drawG()">${G.sound?'🔊':'🔇'}</button>
  <button class="btn ghost small" onclick="descModal()">Instrucciones</button></div>
  <div class="gmid"><div class="gphase">${phase}</div><div class="gname">${esc(name)}</div>${main}<div class="gsub">${sub}</div></div>
  <div class="gnext">${nxt}</div>
  <div class="gctl"><button class="btn ghost" onclick="prev()">← Atrás</button>
  <button class="btn ghost" onclick="togglePause()">${G.paused?'▶ Seguir':'❚❚ Pausa'}</button>
  ${vidBtn}${tipBtn}
  ${isReps?`<button class="btn gdone" onclick="next()">✓ HECHO</button>`:`<button class="btn" onclick="next()">Saltar →</button>`}</div>`;
}
function descModal(){
  if(!G.paused&&G.steps[G.i].t>0){G.pausedByModal=true;togglePause()}
  showM(`<h2>Sesión ${esc(G.S.n)}</h2><div class="tx">${G.S.d?esc(G.S.d):'Esta sesión no trae instrucciones adicionales.'}</div><div class="row"><button class="btn" onclick="closeM()">Cerrar</button></div>`);
}
document.addEventListener('keydown',e=>{
  if($('#m').classList.contains('on')){if(e.key==='Escape')closeM();return}
  if(!G||G.mode==='sum')return;
  if(e.code==='Space'||e.key==='Enter'){e.preventDefault();const st=G.steps[G.i];if(!st.ready&&st.t===0&&st.ex!==REST)next();else togglePause()}
  else if(e.key==='ArrowRight'){next()}
  else if(e.key==='ArrowLeft'){prev()}
  else if(e.key==='Escape'){exitG()}
});
render();
/* botón atrás del móvil */
(function(){
 const cur=()=>JSON.stringify(view),base=go;
 try{history.replaceState({v:cur()},'')}catch(e){}
 window.go=go=function(a,b){base(a,b);try{history.pushState({v:cur()},'')}catch(e){}};
 window.addEventListener('popstate',e=>{
  const m=document.getElementById('m');
  if(m&&m.classList.contains('on')){closeM();try{history.pushState({v:cur()},'')}catch(x){}return}
  if(typeof G!=='undefined'&&G){try{history.pushState({v:cur()},'')}catch(x){}if(G.mode==='sum')exitG(true);else exitG();return}
  let v=null;try{v=JSON.parse(e.state&&e.state.v)}catch(x){}
  view=v||(('p' in view)?{p:null,s:null}:{w:null,s:null});render();window.scrollTo(0,0)});
})();
</script>
