<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis entrenamientos guiados</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d1015"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Entrenos"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1015;--card:#171c24;--card2:#1e2530;--line:#2a3340;--tx:#eef2f7;--mu:#8e9bb0;--ok:#3ddc97;--work:#ff6a3d;--rest:#2f8cff;--c:#ff6a3d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:20px 20px 80px}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3,.big{font-family:'Barlow Condensed','Arial Narrow',Inter,system-ui,sans-serif;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.top h1{font-size:34px;font-weight:800;flex:1}
.back{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px}
.back:hover{border-color:var(--c)}
.sub{color:var(--mu);font-size:14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;overflow:hidden;text-align:left;transition:.15s;display:block;width:100%}
.pcard:hover{transform:translateY(-3px);border-color:var(--c)}
.pcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.pcard h2{font-size:34px;font-weight:800;margin-top:6px}
.pcard .tag{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--c);font-weight:700}
.bar{height:8px;border-radius:8px;background:var(--card2);margin:14px 0 8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c);border-radius:8px}
.btn{background:var(--c);color:#0d1015;font-weight:700;border-radius:12px;padding:12px 18px;font-size:15px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--c)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.pres{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:20px;color:#c4cddb;font-size:14.5px;line-height:1.6}
.pres summary{cursor:pointer;font-weight:700;color:var(--tx)}
.pres p{margin-top:10px;white-space:pre-line}
.sgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.stile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;position:relative;min-height:84px;transition:.15s}
.stile:hover{border-color:var(--c);transform:translateY(-2px)}
.stile b{font-family:'Barlow Condensed','Arial Narrow',Inter,system-ui,sans-serif;font-size:30px;font-weight:800;display:block;line-height:1}
.stile span{font-size:11.5px;color:var(--mu);display:block;margin-top:6px;line-height:1.3}
.stile.done{background:#12261e;border-color:#245a41}
.stile.done::after{content:"✓";position:absolute;top:8px;right:11px;color:var(--ok);font-weight:800}
.stile.next{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}
.stile.next::after{content:"SIGUIENTE";position:absolute;top:10px;right:10px;font-size:9.5px;font-weight:800;color:var(--c);letter-spacing:.08em}
.desc{background:var(--card);border-left:4px solid var(--c);border-radius:12px;padding:14px 18px;margin:14px 0 20px;white-space:pre-line;font-size:14.5px;line-height:1.6;color:#c9d2df}
.block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.bh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bh h3{font-size:22px;font-weight:700}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mu);font-weight:600}
.chip.c{color:var(--c);border-color:var(--c)}
.erow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.erow:first-of-type{border-top:0}
.erow .nm{flex:1;min-width:150px;font-weight:600;cursor:pointer}
.erow .nm:hover{color:var(--c)}
.vl{background:#ffb43d;color:#0d1015;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap}
.erow .qt{font-family:'Barlow Condensed','Arial Narrow',Inter,system-ui,sans-serif;font-size:22px;font-weight:700;color:var(--c)}
.erow.r .nm{color:var(--mu);font-weight:500;cursor:default}
.erow.r .qt{color:var(--rest)}
.bigplay{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
.bigplay .btn{font-size:17px;padding:15px 24px}
/* guided */
#g{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#g.on{display:flex}
#g.rest{background:radial-gradient(circle at 50% 35%,#12315e 0,#0b1220 70%)}
#g.work{background:radial-gradient(circle at 50% 35%,#4a1c0d 0,#140b08 70%)}
#g.reps{background:radial-gradient(circle at 50% 35%,#1c2a44 0,#0d1015 72%)}
#g.ready{background:radial-gradient(circle at 50% 35%,#0f3a2a 0,#0a1511 70%)}
.gtop{display:flex;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap}
.gtop .lbl{flex:1;font-size:15px;color:#c4cddb;min-width:200px}
.gtop .lbl b{color:var(--c)}
.gbar{height:6px;background:rgba(255,255,255,.1)}
.gbar i{display:block;height:100%;background:var(--c);transition:width .3s}
.gmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 20px;gap:6px;min-height:0}
.gphase{font-size:clamp(16px,2.4vw,26px);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--mu)}
.gname{font-family:'Barlow Condensed','Arial Narrow',Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(38px,7.5vw,104px);line-height:1;text-transform:uppercase}
.gtimer{font-family:'Barlow Condensed','Arial Narrow',Inter,system-ui,sans-serif;font-weight:800;font-size:clamp(90px,min(33vh,34vw),420px);line-height:.95;font-variant-numeric:tabular-nums}
.gtimer.low{color:#ffd23d}
.gtimer.pulse{animation:p .5s infinite alternate}
@keyframes p{to{transform:scale(1.05)}}
.gsub{font-size:clamp(15px,2vw,22px);color:#c4cddb}
.gnext{padding:12px 20px;text-align:center;color:var(--mu);font-size:clamp(14px,1.8vw,20px);min-height:50px}
.gnext b{color:var(--tx)}
.gctl{display:flex;gap:10px;justify-content:center;padding:6px 16px 22px;flex-wrap:wrap}
.gctl .btn{min-width:120px;font-size:17px;padding:14px 22px}
.gdone{background:var(--ok)!important;font-size:24px!important;padding:18px 44px!important}
.mod{position:fixed;inset:0;background:rgba(5,8,12,.82);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.mod.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.mbox h2{font-size:32px;font-weight:800;text-transform:uppercase}
.mbox .tx{white-space:pre-line;line-height:1.6;color:#c9d2df;font-size:15px;margin:12px 0}
.mbox .tx b{color:var(--tx)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lbl2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-top:12px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sum{text-align:center;max-width:520px;margin:auto;padding:20px}
.sum h2{font-size:clamp(48px,8vw,90px);font-weight:800;color:var(--ok)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
textarea{width:100%;height:120px;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:12px monospace}
@media (max-width:600px){body{padding:14px 12px 70px}.top h1{font-size:26px}}
</style>
</head>

zar las flexiones y después las dominadas, sin descanso entre los dos ejercicios. Descansa el tiempo indicado entre superSets. \n\n- 4 rondas de planchas con toque, realizando el ejercicio durante 40 segundos y descansando los siguientes 20 segundos, hasta completar las 4 rondas. \n\n- 4 superSets de 10 burpees y 20 abdominales. En cada superSet debes realizar los burpees y después los abdominales, sin descanso entre los dos ejercicios. \n\n- 2 planchas laterales por cada lado, de un minuto cada una. Empieza por el lado derecho y, cuando pase el tiempo indicado, cambia al lado izquierdo, sin descanso. \n\nDescansas una vez hayas completado la plancha por ambos lados. Si no puedes aguantar el tiempo indicado, baja la cadera unos segundos para recuperarte y elévala de nuevo para continuar con la plancha. \n\nNota: recuerda revisar el nivel de los ejercicios, para adaptarlos a tu capacidad.","b":[{"k":"super_series","s":[[5583,0,15,1],[6022,0,6,1],[5968,50,0,1],[5583,0,15,2],[6022,0,6,2],[5968,50,0,2],[5583,0,15,3],[6022,0,6,3],[5968,50,0,3],[5583,0,15,4],[6022,0,6,4],[5968,45,0,4]]},{"k":"tabata","s":[[5611,40,0,1],[5968,20,0,1],[5611,40,0,2],[5968,20,0,2],[5611,40,0,3],[5968,20,0,3],[5611,40,0,4],[5968,45,0,4]]},{"k":"super_series","s":[[5236,0,10,1],[5606,0,20,1],[5968,40,0,1],[5236,0,10,2],[5606,0,20,2],[5968,40,0,2],[5236,0,10,3],[5606,0,20,3],[5968,40,0,3],[5236,0,10,4],[5606,0,20,4],[5968,45,0,4]]},{"k":"interval_repetitions_with_pause","s":[[5662,60,0,1],[5968,40,0,1],[5648,60,0,2]]}]},{"n":"2","t":"","d":"Sesión general, con los siguientes bloques: \n\n- 4 superSets de 20 sentadillas y 10 levantamientos de piernas. En cada superSet debes realizar las sentadillas y después los levantamientos de piernas, sin descanso entre los dos ejercicios. Descansa el tiempo indicado entre superSets. \n\n- 4 superSets de 20 desplantes hacia delante (10 con cada pierna) y 10 sentadillas con salto. En cada superSet debes realizar los desplantes y después los saltos, sin descans 0,5,1],[5297,0,10,1],[5275,0,10,1],[5789,0,10,1],[5291,0,10,1],[5342,0,10,1],[5786,0,10,1],[5787,0,10,1],[5819,0,5,2],[5820,0,5,2],[5297,0,10,2],[5275,0,10,2],[5789,0,10,2],[5291,0,10,2],[5342,0,10,2],[5786,0,10,2],[5787,0,10,2],[5819,0,5,3],[5820,0,5,3],[5297,0,10,3],[5275,0,10,3],[5789,0,10,3],[5291,0,10,3],[5342,0,10,3],[5786,0,10,3],[5787,0,10,3],[5819,0,5,4],[5820,0,5,4],[5297,0,10,4],[5275,0,10,4],[5789,0,10,4],[5291,0,10,4],[5342,0,10,4],[5786,0,10,4],[5787,0,10,4],[5819,0,5,5],[5820,0,5,5],[5297,0,10,5],[5275,0,10,5],[5789,0,10,5],[5291,0,10,5],[5342,0,10,5],[5786,0,10,5],[5787,0,10,5],[5819,0,5,6],[5820,0,5,6],[5297,0,10,6],[5275,0,10,6],[5789,0,10,6],[5291,0,10,6],[5342,0,10,6],[5786,0,10,6],[5787,0,10,6]]}]}]}],"ex":{"5242":{"n":"Sentadilla","v":"https://youtu.be/snDiZo0Zcko","d":"Colocándote de pie como posición inicial, con la espalda recta y sacando ligeramente el trasero hacia afuera, flexiona la cadera y las rodillas unos 90 grados aproximadamente o hasta que tus muslos estén paralelos al suelo. Vuelve a la posición inicial para terminar el ejercicio.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Durante la flexión tus rodillas deben mirar hacia afuera.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por flexión.","e":5243,"h":5340,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},"5968":{"n":"Descanso","v":"https://youtube.com/shorts/1DEFAAyxo6Q","d":"1. Colócate de pie en posición vertical con los brazos relajados delante de ti. \n2. Eleva los brazos por encima de la cabeza inspirando y extendiendo tu cuerpo al máximo. \n3. Exhala y déjalos caer  por inercia, en la bajada flexiona ligeramente las rodillas.","e":null,"h":null,"m":["0"],"j":["0"]},"5243":{"n":"Sentadilla con salto","v":"https://youtu.be/eGmFnqFNGfk","d":"Colocándote de pie como posición inicial, con la espalda recta y sacando ligeramente el trasero hacia afuera, flexiona la cadera y las rodillas unos 90 grados aproximadamente o hasta que tus muslos estén paralelos al suelo. Desde esta posición, realiza un salto vertical extendiendo el cuerpo.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. En el salto, extiende todo tu cuerpo. \n- Amortigua bien la caída. \n- Durante la flexión tus rodillas deben mirar hacia afuera.\n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por cada salto.","e":5277,"h":5242,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},"5235":{"n":"Salto estrella","v":"https://youtu.be/k8StM5bKVeM","d":"Colócate de pie con los brazos hacia abajo, seguidamente haz un salto vertical extendiendo los brazos hacia arriba y piernas hacia afuera simulando la forma de una estrella. Al caer vuelve de nuevo a la posición inicial.\n\n**Ten en cuenta:**\n\n- Extiende bien tus extremidades durante el salto. \n- Amortigua bien la caída.\n- Cuenta una repetición por salto.","e":5233,"h":5232,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},"5236":{"n":"Burpee","v":"https://youtu.be/ldmueYwBkWw","d":"Ejercicio que combina: sentadilla, flexión y salto.\n\nColócate de pie como posición inicial. Desde aquí, agáchate y coloca las manos en el suelo, haz impulso con tus piernas hacia atrás colocándote en plancha, de forma que tu cuerpo esté en paralelo al suelo y tus puntos de apoyo sean las manos y las puntas de los pies.\n\nSeguidamente realiza una flexión completa, acercando el pecho al suelo todo lo que puedas. Al finalizar la flexión lleva los pies justo detrás de tus manos con un salto, toma impulso y salta hacia arriba, dando una palmada por encima de la cabeza para terminar el ejercicio.\n\n**Ten en cuenta**\n\n- Intenta hacer el ejercicio lo más fluido posible, sin pausas entre sus partes.\n- Para aumentar la velocidad (más burpees en menos tiempo), haz la plancha impulsando los pies hacia atrás antes de que las manos toquen el suelo, y lo mismo al regresar, levanta las manos antes de que los pies vuelvan a su posición inicial para hacer el salto vertical.\n- Si no puedes realizar la flexión, apóyate en las rodillas en lugar de las puntas de los pies.\n- Toca el suelo con el pecho al hacer cada flexión.\n- Al saltar, asegúrate de que lo haces con el cuerpo recto.\n- La palmada se realiza justo encima de tu cabeza con los brazos estirados.\n- Cuenta una repetición con cada palmada.","e":5237,"h":5279,"m":["pectorales","tríceps","cuádriceps"],"j":["hombros","cadera"]},"5398":{"n":"Zancada (derecha)","v":"https://youtube.com/shorts/-wwZzuJyrCk","d":"1. Colócate de pie como posición inicial.\n2. Da un paso amplio hacia adelante con una de tus piernas, dejando la otra atrás. Ambas piernas deben estar extendidas.\n3. Desde esta posición lleva la rodilla de la pierna trasera hacia el suelo flexionando ambas piernas, de manera que queden aproximadamente en 90º.\n4. Levanta la rodilla extendiendo las piernas de nuevo y vuelve a la posición inicial.\n\nTen en cuenta:\n- Mantén la espalda recta y vertical mientras realizas la bajada.\n- Baja de forma lenta y controlada.\n- La rodilla de la pierna adelantada no debe sobrepasar la punta del pie.\n- Cada flexión es una repetición.","e":5404,"h":null,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5399":{"n":"Zancada (izquierda)","v":"https://youtube.com/shorts/p3djr364Xmk","d":"1. Colócate de pie como posición inicial.\n2. Da un paso amplio hacia adelante con una de tus piernas, dejando la otra atrás. Ambas piernas deben estar extendidas.\n3. Desde esta posición lleva la rodilla de la pierna trasera hacia el suelo flexionando ambas piernas, de manera que queden aproximadamente en 90º.\n4. Levanta la rodilla extendiendo las piernas de nuevo y vuelve a la posición inicial.\n\nTen en cuenta:\n- Mantén la espalda recta y vertical mientras realizas la bajada.\n- Baja de forma lenta y controlada.\n- La rodilla de la pierna adelantada no debe sobrepasar la punta del pie.\n- Cada flexión es una repetición.","e":5405,"h":null,"m":["glúteos","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5252":{"n":"Flexión","v":"https://youtu.be/fOOIttCJizc","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Desde aquí impúlsate con las manos para elevar el tronco manteniendo el cuerpo alineado y paralelo al suelo. Vuelve a la posición inicial pero sin llegar a apoyar el pecho con el suelo para hacer la siguiente repetición.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","e":5253,"h":5264,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},"5319":{"n":"Flexión cerrada","v":"https://youtube.com/shorts/hvNBltOp6cc","d":"Movimiento de flexión donde los brazos se mantienen más juntos que en una flexión normal, por dentro de la altura de los Deltoides.\n \n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Mantén los brazos pegados al cuerpo durante todo el rango de movimiento.\n- Cuenta una repetición por cada flexión.","e":5253,"h":5264,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5260":{"n":"Flexión abierta","v":"https://youtu.be/r9EJM4m5zro","d":"Realiza una flexión con las manos aproximadamente unos 40 cm más abiertas que en una flexión normal.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","e":5259,"h":5267,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5253":{"n":"Flexión diamante","v":"https://youtu.be/BOqw8btbzWg","d":"Túmbate boca abajo con las palmas apoyadas en el suelo y ambas manos cerca, donde índices y pulgares de cada mano se toquen para formar un diamante.\n\n**Ten en cuenta:**\n\n- Mantén la mirada al frente. \n- Tu cuerpo debe estar estirado y en paralelo al suelo.\n- El pecho debe tocar las manos pero no apoyarse.\n- Cuenta una repetición por cada flexión.","e":5254,"h":5319,"m":["pectorales","tríceps","deltoides"],"j":["hombros","codos","muñecas"]},"5300":{"n":"Sprint","v":"https://youtu.be/JTXLY2voVw4","d":"Corre lo más rápido que puedas durante el tiempo indicado en cada sesión.","e":null,"h":5241,"m":["cuádriceps","isquiotibiales","gemelos"],"j":["tobillos","rodillas","cadera"]},"5761":{"n":"Cuclillas iso","v":"https://youtube.com/shorts/I67jnFmphRk","d":"Desde la posición de pie, espalda recta y sacando ligeramente el trasero hacia afuera flexiona cadera y rodillas unos #90º aproximadamente o hasta que tus muslos estén paralelos al suelo.\nMantén la posición.\n\n**Ten en cuenta:**\n\n- Mantén la espalda siempre recta. \n- Durante la flexión tus rodillas no deben rotar hacia adentro. \n- Baja hasta que tus Cadera estén por debajo de tus rodillas.\n- Cuenta una repetición por segundo.","e":null,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},"5286":{"n":"Thruster libre","v":"https://youtu.be/PYgQA3MNcsc","d":"Colócate de pie, con la espalda recta y sacando ligeramente el trasero hacia afuera, flexiona las piernas hasta tocar las rodillas con los codos. Al volver a la posición de pie, estira los brazos completamente por encima de tu cabeza.\n\n**Ten en cuenta:**\n\n- Extiende bien brazos y espalda en la elevación. \n- Mantén tu espalda recta todo el tiempo.\n- Cuenta una repetición por cada sentadilla.","e":5379,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["tobillos","rodillas","cadera"]},"5345":{"n":"Sentada paleo","v":"https://youtube.com/shorts/tQDKDwDCxl4","d":"Tumbado con piernas estiradas y brazos por encima de tu cabeza, siéntate, flexionas tus piernas y las abrazas con tus manos. \n \n **Ten en cuenta:**\n \n- Asegúrate de extender la espalda cuando abraces las piernas. \n- Cuenta una repetición cada vez que abrazas tus piernas.","e":5365,"h":5227,"m":["abdominales","glúteos"],"j":["cadera","rodillas","hombros"]},"5317":{"n":"Escalador runner","v":"https://youtu.be/ffeDkk1ryZE","d":"Túmbate boca abajo y estira los brazos como si te prepararas para hacer una flexión levantando el tronco del suelo y manteniendo la espalda recta. \nDesde esta posición, lleva una rodilla hacia el codo del mismo lado. Vuelve a la posición inicial y haz lo mismo con la otra extremidad.\n\n**Ten en cuenta:**\n \n- Mantén la espalda recta\n- No abras la pierna durante el desplazamiento, la rodilla se dirige en línea recta al codo. \n- Cuenta una repetición por cada flexión de rodilla.","e":5297,"h":5316,"m":["recto mayor del abdomen","abdominales oblicuos","deltoides","cuádriceps"],"j":["hombros","cadera","rodillas","tobillos"]},"5219":{"n":"Plancha araña","v":"https://youtu.be/y1tu5bxnCEE","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como punto de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo, realiza una flexión de rodilla para tocar tu rodilla con el codo.\n\n**Ten en cuenta:**\n\n- Mantén la mirada hacia el suelo. \n- Mantén la postura horizontal.\n- Procura no desplazar ni rotar la cadera al flexionar la rodilla. \n- Si no llegas a tocar el codo no te preocupes, ya irás ganando flexibilidad.\n- Cuenta una repetición por flexión de rodilla.","e":5220,"h":5217,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["hombros","tobillos","rodillas","cadera"]},"5876":{"n":"Escalada de pared","v":"https://youtube.com/shorts/2kHk2xabk1k","d":"Colócate de espaldas a una pared. Apoya las manos en el suelo y eleva la pierna derecha para apoyarla contra la pared, y después la izquierda.\n\nAcércate a la pared con las manos a la vez que sigues escalando con las piernas. Sigue subiendo hasta que llegues a la posición más vertical posible. Retrocede ahora con las manos hasta que los pies lleguen de nuevo al suelo y repite.\n\n**Ten en cuenta:**\n\n- Mantén el core activo.\n- Intenta acercarte a la pared.\n- Cuenta una repetición por escalada.","e":null,"h":null,"m":["deltoides","trapecios","dorsales"],"j":["hombros","codos"]},"5216":{"n":"Plancha","v":"https://youtu.be/JoMOD6qE9Yw","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como puntos de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo. \n\n**Ten en cuenta:**\n\n- Mantén la mirada hacia el suelo. \n- Mantén la posición horizontal sin dejar caer o subir demasiado la pelvis.\n- Concéntrate en que tu ombligo esté hacia adentro para tensar los músculos del abdomen.\n- Manten la columna dorsal recta, sacando pecho con las lumbares alineadas.\n- Cuenta una repetición por segundo.","e":5218,"h":null,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["hombros","tobillos"]},"5273":{"n":"Surfer","v":"https://youtu.be/fWsekr2ylD4","d":"Tumbado boca abajo en posición de Mckenzie, (piernas apoyadas y brazos estirados generando una extensión de la espalda), realiza un impulso con los brazos para quedar agachado con los pies al lado de las manos, el tronco rotado ligeramente hacia un lado y la mirada al frente.\n\n**Ten en cuenta:**\n\n- Asciende con impulso, de la forma más explosiva que puedas.\n- Mantén la mirada al frente en todo momento.\n- Cuenta una repetición por cada salto.","e":null,"h":5315,"m":["recto mayor del abdomen","cuádriceps","deltoides"],"j":["cadera","rodillas","tobillos","muñecas"]},"5343":{"n":"Roll a pies","v":"https://youtube.com/shorts/FeO1zKJXBOg","d":"Colócate de pie, siéntate y rueda un poco hacia atrás apoyando toda la espalda en el suelo y llevando las piernas lo más cerca de la cabeza que te sea posible. Coge impulso y levántate de nuevo.\n\n**Ten en cuenta:**\n\n- Lleva las piernas hacia atrás mientras coges impulso.\n- Marca bien la extensión de cadera cuando te pongas de pie.\n- Cuenta una repeticion cada vez que te pongas de pie.","e":5238,"h":5342,"m":["abdominales","glúteos"],"j":["cadera"]},"5228":{"n":"Levantar las piernas","v":"https://youtu.be/_-qXAdMECAw","d":"Tumbado boca arriba, eleva las piernas manteniéndolas completamente rectas hasta tenerlas perpendiculares al suelo y seguidamente vuelve a la posición inicial.\n\n**Ten en cuenta:**\n\n- Controla el descenso de las piernas. \n- Mantén las piernas siempre estiradas.\n- Cuenta una repetición cada vez que bajes las piernas.","e":5773,"h":5225,"m":["recto mayor del abdomen"],"j":["cadera"]},"5224":{"n":"Abdominales en V","v":"https://youtu.be/SoCXErO0vM8","d":"Colócate en el suelo boca arriba, con los brazos estirados por encima la cabeza tocando el suelo. Eleva piernas y brazos plegándote hasta tocar los pies con las manos, formando una V con tu cuerpo. Vuelve a la posición inicial sin llegar a tocar el suelo con los pies y manos.\n\n**Ten en cuenta:**\n\n- Mantén pies y brazos bien estirados. \n- Procura que los brazos y la cabeza estén alineados.\n- Controla el movimiento de bajada tensando el abdomen.\n- Si no puedes tocar los pies con las manos no te preocupes, ya irás ganando flexibilidad a medida que entrenes.\n- Cuenta una repetición cada vez que bajes las extremidades.","e":5229,"h":5225,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["cadera","hombros"]},"5392":{"n":"Plancha lateral (derecha)","v":"https://youtube.com/shorts/UWdC0lBXJO8","d":"1.- Colócate lateralmente apoyado en el suelo, con un antebrazo y tus pies como puntos de apoyo. Tu otro brazo irá flexionado con la mano apoyada en la cadera. \n2.- Eleva con la fuerza del abdomen todo tu cuerpo hasta que solo estén en contacto con el suelo tu antebrazo y tus pies.\n3.- Aguanta en esta posición el tiempo estipulado. \n\nTen en cuenta:\n\n- Mantén esta postura procurando que la cadera no se desplace hacia abajo. \n- Activa abdomen y glúteos y no arquees la zona lumbar.\n- Cada lado es una repetición.","e":5216,"h":null,"m":["abdominales transversos","glúteos","adductores"],"j":["hombros","cadera","tobillos"]},"5393":{"n":"Plancha lateral (izquierda)","v":"https://youtube.com/shorts/RbaywqhQKaE","d":"1.- Colócate lateralmente apoyado en el suelo, con un antebrazo y tus pies como puntos de apoyo. Tu otro brazo irá flexionado con la mano apoyada en la cadera. \n2.- Eleva con la fuerza del abdomen todo tu cuerpo hasta que solo estén en contacto con el suelo tu antebrazo y tus pies.\n3.- Aguanta en esta posición el tiempo estipulado. \n\nTen en cuenta:\n\n- Mantén esta postura procurando que la cadera no se desplace hacia abajo. \n- Activa abdomen y glúteos y no arquees la zona lumbar.\n- Cada lado es una repetición.","e":5216,"h":5899,"m":["abdominales transversos","glúteos","adductores"],"j":["hombros","cadera","tobillos"]},"5241":{"n":"Carrera corta","v":"https://youtu.be/TKlvyuOTo50","d":"1. Sal a correr el tiempo o la distancia indicada.","e":5300,"h":5269,"m":["glúteos","cuádriceps","isquiotibiales"],"j":["hombros","cadera","rodillas","tobillos"]},"5328":{"n":"Flexión palmada","v":"https://youtube.com/shorts/7bav26twQmQ","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Realiza una flexión con un gran impulso para realizar una palmada en el aire y volver a la posición inicial con las manos en el suelo.\n\n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- Amortigua bien la caida para no hacerte daño en las muñecas\n- Cuenta una repetición por cada palmada.","e":null,"h":5329,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5233":{"n":"Salto horizontal","v":"https://youtu.be/evWs4AwBCY4","d":"Colocándote de pie, realiza un squat flexionando todo lo posible las piernas (squat profundo) y haz un salto hacia delante (horizontal). Amortigua la caída de nuevo con una squat profundo.\n\n**Ten en cuenta:**\n\n- Ayúdate con los brazos para realizar el impulso durante el salto. \n- Amortigua bien la caída.\n- Cuenta una repetición por salto.","e":5231,"h":5232,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","tobillos","cadera"]},"5887":{"n":"Flexión pino","v":"https://youtube.com/shorts/jtpcUjugWls","d":"Colócate de cara a la pared, a una distancia que te permita apoyar las manos a 15-20 cm de la pared y patear con las piernas hacia arriba, hasta que quedes cabeza abajo, apoyando únicamente los talones en la pared.\n\nDesde esta posición, flexiona los codos para acercar la cabeza al suelo, y empuja con fuerza para regresar a la posición original.\n\n**Ten en cuenta:**\n\n- Puedes utilizar un cojín para apoyar la cabeza cuando desciendas.\n- La descender no debes realizar una hiper extensión lumbar.\n- Cuenta una repetición por flexión.","e":5886,"h":null,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5217":{"n":"Plancha pivot","v":"https://youtu.be/fYwsWQo2Qzg","d":"Coloca el cuerpo boca abajo con los antebrazos y las puntas de los pies en el suelo como punto de apoyo. Mantén piernas, tronco y cabeza estirados para que estén paralelos al suelo. Deja caer la pelvis hasta tocar el suelo y, seguidamente, elévala al máximo flexionando el tronco.\n\n**Ten en cuenta:**\n\n- Realiza el movimiento completo. \n- Mantén la mirada hacia el suelo. \n- Cuenta una repetición cada vez que bajes la pelvis al suelo.","e":5219,"h":5216,"m":["erector de la columna","recto mayor del abdomen","abdominales transversos"],"j":["cadera","hombros","tobillos"]},"5413":{"n":"Sentadilla búlgara (izquierda)","v":"https://youtube.com/shorts/hPvrZ93w8D0","d":"1. Colócate de pie y de espaldas a una caja, banco o silla, con una pierna apoyada sobre ella.\n2. Desciende tu cuerpo lentamente flexionando la pierna apoyada en el suelo y llevando la rodilla de la pierna contraria hacia el suelo.\n3. Cuando la rodilla de atrás toque el suelo, empuja con el talón de la pierna delantera contra el suelo para extender la pierna y elevar de nuevo el cuerpo volviendo a la posición inicial. \n\nTen en cuenta:\n\n- La rodilla no debe sobrepasar la punta del pie. \n- Mantén el pecho erguido, la espalda recta y la vista al frente.\n- Cada sentadilla es una repetición.","e":6011,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},"5412":{"n":"Sentadilla búlgara (derecha)","v":"https://youtube.com/shorts/C-cthQIja1s","d":"1. Colócate de pie y de espaldas a una caja, banco o silla, con una pierna apoyada sobre ella.\n2. Desciende tu cuerpo lentamente flexionando la pierna apoyada en el suelo y llevando la rodilla de la pierna contraria hacia el suelo.\n3. Cuando la rodilla de atrás toque el suelo, empuja con el talón de la pierna delantera contra el suelo para extender la pierna y elevar de nuevo el cuerpo volviendo a la posición inicial. \n\nTen en cuenta:\n\n- La rodilla no debe sobrepasar la punta del pie. \n- Mantén el pecho erguido, la espalda recta y la vista al frente.\n- Cada sentadilla es una repetición.","e":6010,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},"5324":{"n":"Flexión manos arriba","v":"https://youtube.com/shorts/uZV9WHuS5Gc","d":"Túmbate boca abajo con las palmas apoyadas en el suelo a la altura del pecho. Impúlsate con las manos para elevar el tronco manteniendo el cuerpo alineado y paralelo al suelo. \nCuando el pecho toque el suelo, levanta las manos dejando el peso sobre el pecho. Apoya las manos y elévate de nuevo.\n \n**Ten en cuenta:**\n \n- Mantén la mirada al frente y la espalda recta.\n- El pecho debe tocar el suelo pero no apoyarse.\n- Cuenta una repetición por cada flexión.","e":null,"h":5325,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5318":{"n":"Escaleras","v":"https://youtube.com/shorts/arld7dxqaZI","d":"Colócate de pie como posición inicial. Dobla la espalda hacia el suelo llevando las manos lo más cerca posible a los pies y manteniendo las piernas estiradas.  \nDesde esta posición, gatea con las manos hacia delante 4 pasos.\nVuelve atrás con las manos hasta llegar a la posición inicial.\n \n**Ten en cuenta:**\n\n- Mantén el abdomen apretado durante todo el ejercicio.\n- Cuenta una repetición cada vez que te vuelvas a poner de pie.","e":5763,"h":null,"m":["abdominales","isquiotibiales","glúteos"],"j":["muñecas","cadera","tobillos"]},"5291":{"n":"El puente","v":"https://youtube.com/shorts/KuEVq3OA2ss","d":"Colócate tumbado boca arriba con las piernas flexionadas y los pies apoyados en el suelo. Eleva el tronco despegando el trasero del suelo hasta tener el cuerpo alineado. Desciende volviendo a la posición inicial.\n\n**Ten en cuenta:**\n\n- Mantén el cuerpo bien alineado. \n- Desciende suavemente.\n- Cuenta una repetición con cada extensión.","e":5290,"h":null,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},"5993":{"n":"El puente isometrico","v":"https://youtube.com/shorts/AB9zMdPYmOQ","d":"","e":5994,"h":null,"m":["glúteos","isquiotibiales"],"j":["cadera","rodillas"]},"5696":{"n":"Aguante isométrico","v":"https://youtube.com/shorts/F4ICfrvgcCM","d":"Ajusta las anillas para que estén ligeramente por encima de la altura de tus Cadera. Agárralas con ambas manos y estira completamente tus brazos, manteniendo el pecho elevado, los Deltoides hacia atrás y hacia abajo, con ligera rotación externa. El cuerpo debería estar completamente recto, con las puntas de los pies apuntando al suelo. \n\nSi eres incapaz de aguantar la posición más de unos pocos segundos apoya la punta de los pies en el suelo, intentando usar cada vez menos apoyo.\n\nNotas sobre la técnica:\n\n- Mantén tensión abdominal.\n- Mantén la mirada al frente y el cuerpo totalmente recto.\n- Puedes probar a rotar las anillas hacia afuera, de tal manera que tus palmas miren hacia el frente.","e":null,"h":null,"m":["deltoides","abdominales","glúteos","bíceps"],"j":["hombros","muñecas"]},"5681":{"n":"Fondos en anillas 1","v":"https://youtube.com/shorts/PdG20TrwL2A","d":"Ajusta las anillas para que queden a la altura de tus Cadera aproximadamente. Agarra las anillas a ambos lados de tu cuerpo y lleva los pies hacia delante uno o dos pasos, manteniendo el torso perpendicular al suelo y las piernas rectas, apoyadas sobre los talones. \nDesde aquí, flexiona los codos para que el torso descienda (sin inclinarte demasiado hacia delante), hasta que tus tríceps estén paralelos al suelo, y empuja para regresar a la posición de partida.\n\nNotas sobre la técnica:\n\n- Mantén los codos cerca del cuerpo durante todo el movimiento.\n- No inclines mucho el torso hacia delante, ya que puede estresar los Deltoides.\n- No dejes que tu cuello se hunda entre los Deltoides, tensa la espalda superior.\n- No dobles las muñecas, deben estar alineadas con los antebrazos.","e":5682,"h":null,"m":["dorsales","tríceps","trapecios"],"j":["codos","hombros","muñecas"]},"5673":{"n":"Dominada anillas 1","v":"https://youtube.com/shorts/0Hs4sRwkbtw","d":"Ajusta las anillas para que queden un poco por encima de tu cabeza. Agarra las anillas, con las palmas enfrentadas (agarre neutro) y da un paso hacia adelante. Ahora, manteniendo el cuerpo recto, estira los brazos completamente, llevando el cuerpo hacia atrás, sin mover los pies. Desde aquí, flexiona los codos hasta regresar a la posición inicial.\n\nNotas sobre la técnica:\n\n- Mantén el cuerpo recto, tensa abdominales y Glúteos.\n- Mantén el peso del cuerpo en los talones, no apoyes toda la planta.\n\nModificaciones:\n\n- Puedes modificar el agarre para hacer más énfasis en distintos músculos. \n- Ajusta la altura de las anillas para encontrar el nivel de complejidad adecuado.","e":5674,"h":null,"m":["deltoides","bíceps","tríceps"],"j":["codos","hombros"]},"5670":{"n":"Flexión anillas 1","v":"https://youtube.com/shorts/G1EZ8c4xeSc","d":"Ajusta las anillas para que queden a la altura de tus Cadera aproximadamente. Agarra las anillas y aleja tus pies hasta que tu cuerpo quede en línea recta, en el peso hacia la punta de tus pies.\nFlexiona los codos hasta que tu pecho quede a la altura de las anillas, y empuja para regresar a la posición inicial.\n\nNotas sobre la técnica:\n\n- Mantén el cuerpo recto, tensa abdominales y Glúteos.\n- Alinea el cuello con el resto del cuerpo (posición neutra).\n- Mantén los codos cerca del cuerpo, no abras mucho los brazos (<45°).\n- No dobles las muñecas, deben estar alineadas con los antebrazos.\n\nModificaciones:\n\n-Además de ajustar la altura de las anillas, puedes abrir un poco más las piernas para facilitar el equilibrio (más estabilidad). Para hacerlo más difícil, junta los pies.","e":5671,"h":null,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5678":{"n":"Remo en anillas 1","v":"https://youtube.com/shorts/v7AxrOHzbHU","d":"Ajusta las anillas para que queden a la altura de tu pecho aproximadamente. Agarra las anillas y lleva los pies hacia delante uno o dos pasos. Deja caer tu peso hacia atrás, estirando completamente los brazos, manteniendo el cuerpo recto. Flexiona los codos hasta que tu pecho se acerque a las anillas, y regresa de nuevo a la posición inicial estirando los brazos de manera controlada.\n\nNotas sobre la técnica:\n\n- Mantén el cuerpo recto, tensando abdominales y Glúteos.\n\nModificaciones:\n\n- Además de ajustar la altura de las anillas, puedes abrir un poco más las piernas para facilitar el equilibrio (más estabilidad). Para hacerlo más difícil, junta los pies.","e":5679,"h":null,"m":["recto mayor del abdomen","bíceps","pectorales"],"j":["codos","hombros","muñecas"]},"5592":{"n":"Desplante hacia delante","v":"https://youtube.com/shorts/F4ICfrvgcCM","d":"Empieza de pie, con las manos en la cadera o con los brazos estirados a lo largo del cuerpo. Da una zancada hacia delante con la rodilla derecha y agacha el torso, hasta que la rodilla llegue prácticamente al uerpo.\n- Si no puedes llegar con las piernas a la altura del pecho puedes subir solo hasta que estén paralelas al suelo.\n- No te impulses con las piernas. El movimiento debe ser controlado.","e":null,"h":5638,"m":["abdominales","bíceps","pectorales","cuádriceps"],"j":["muñecas","hombros","cadera"]},"5596":{"n":"Limpiaparabrisas","v":"https://youtu.be/QgZVBZnjmMI","d":"Túmbate en el suelo, con los brazos estirados, formando una T. Eleva las piernas, hasta que estén casi perpendiculares con el suelo. Manteniendo las piernas estiradas (o con una leva flexión de rodilla), gíralas hacia la derecha hasta que se acerquen al suelo (sin llegar a tocarlo). Regresa a la posición inicial y lleva ahora las piernas hacia la izquierda.\n\n- No despegues las manos ni los Deltoides del suelo.\n- Mantén la vista hacia arriba, no gires el cuello.\n- Si te resulta muy difícil, flexiona las rodillas en vez de mantenerlas estiradas.","e":null,"h":null,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["cadera"]},"5597":{"n":"Plancha","v":"https://youtube.com/shorts/nI0nuEgJfZ4","d":"Es un ejercicio isométrico, sin movimiento. Colócate en el suelo, apoyado sobre los antebrazos y las puntas de los pies, manteniendo el cuerpo recto. Mantén la posición el tiempo indicado.\n\n- Los codos deberían quedar debajo de los Deltoides.\n- El cuello en posición neutra, mirando hacia abajo.\n- Tensa los abdominales para mantener la cadera elevada, no permitas que colapse hacia abajo.","e":null,"h":null,"m":["recto mayor del abdomen","erector de la columna","abdominales transversos"],"j":["hombros"]},"5584":{"n":"Flexión vertical","v":"https://youtube.com/shorts/6gJLTdeodN8","d":"Colócate de cara a la pared, a una distancia que te permita apoyar las manos a 15-20 cm de la pared y patear con las piernas hacia arriba, hasta que quedes boca abajo, apoyando únicamente los talones en la pared.\nDesde esta posición, flexiona los codos para acercar la cabeza al suelo, y empuja con fuerza para regresar a la posición original.\n\n- Tensa los abdominales para evitar una excesiva curvatura de la espalda.\n- Si no eres capaz de colocarte en la posición indicada puedes también escalar la pared, y hacer el movimiento de cara a la pared.","e":null,"h":5634,"m":["pectorales","tríceps","deltoides","abdominales","erector de la columna"],"j":["codos","hombros","muñecas"]},"5588":{"n":"Dominada supina","v":"https://youtube.com/shorts/W-4XRxOn0EE","d":"Cuélgate de la barra con agarre supino (palmas mirando hacia ti), a la altura de tus Deltoides, con los brazos totalmente estirados. \n\nDesde esta postura, intenta juntar las escápulas, tensando la parte superior de la espalda y elevando el pecho. Eleva ahora todo el cuerpo flexionando los codos, hasta que tu barbilla supere la barra. Desciende de manera controlada, hasta que tus brazos estén casi rectos y vuelve a subir. \n\n- No debes perder la tensión escapular durante el movimiento.\n- Toma aire en la bajada (o antes de empezar a subir) y expúlsalo en la subida.\n- Si no puedes realizar todavía una dominada, utiliza la versión con salto o utiliza una silla de apoyo, ayudándote con las piernas. Intenta utilizar cada vez menos las piernas y cada vez más el cuerpo superior.\n- No hagas kipping. No debería haber movimiento en el cuerpo inferior. Como mucho un poco de impulso para completar la última repetición si vas al límite.","e":null,"h":5636,"m":["deltoides","bíceps","pectorales"],"j":["codos","hombros"]},"5600":{"n":"Escaladores de montaña hacia arriba","v":"https://youtube.com/shorts/YgDHMVEPJEs","d":"Siéntate en el suelo, apoyando las manos detrás de ti, las plantas de los pies delante y despega la cadera del suelo.\n\nDesde esta posición, eleva el pie derecho explosivamente, como dando una patada en el aire. A la vez que regresas el pie al suelo eleva explosivamente el pie izquierdo, y así sucesivamente, de tal manera que nunca estén ambos pies en el suelo a la vez.\n\n- Mantén la tensión en los Deltoides, sin hundir el cuello entre ellos.\n- Si te resulta muy difícil, realiza el movimiento sin explosividad: regresa con un pie al suelo antes de elevar el contrario.","e":null,"h":null,"m":["cuádriceps","recto mayor del abdomen","dorsales"],"j":["rodillas","cadera","hombros"]},"5601":{"n":"Escaladores de montaña hacia abajo","v":"https://youtube.com/shorts/2XoOOS90odQ","d":"La posición inicial es mirando hacia abajo y apoyado en manos y puntas de los pies, con la rodilla derecha adelantada, aproximadamente debajo de tu pecho.\n\nDesde esta posición, realiza un rápido movimiento para intercambiar las piernas en el aire, de tal manera que la pierna derecha queda ahora atrás, y la pierna izquierda delante, con la rodilla debajo de tu pecho, pero sin apoyar el pie. El ejercicio consiste en realizar este movimiento de manera rápida, alternando las piernas hasta completar las repeticiones o tiempo establecidos.\n\n- Si te resulta muy difícil, puedes apoyar el pie delantero en cada repetición, pero intenta hacer énfasis en mantener la estabilidad con los abdominales, en vez de utilizar el apoyo de los pies para saltar en cada cambio.\n- Adapta la velocidad del ejercicio a tu condición física.","e":null,"h":null,"m":["cuádriceps","recto mayor del abdomen","pectorales"],"j":["tobillos","rodillas","cadera","hombros"]},"5610":{"n":"Plancha dinámica","v":"https://youtube.com/shorts/_PFu31TDEn8","d":"Colócate en el suelo, apoyado sobre los antebrazos y las puntas de los pies, manteniendo el cuerpo recto. Desde esta posición, pivota sobre los tobillos, utilizando todo su rango de movimiento para llevar el cuerpo hacia adelante y después hacia atrás. Repite durante el tiempo indicado.","e":null,"h":null,"m":["recto mayor del abdomen","erector de la columna","abdominales transversos","pectorales"],"j":["tobillos","rodillas","cadera","hombros"]},"5603":{"n":"Patadas de burro","v":"https://youtube.com/shorts/SWHmK3J_pUs","d":"Apóyate en el suelo sobre las manos y las puntas de los pies, mirando hacia abajo. Desde esta posición salta con los pies y estiras las piernas, como pateando el aire. Amortigua la caída y repite el número de veces indicado.\n\n- Versión más sencilla: eleva las piernas con salto pero sin estirarlas, manteniendo las rodillas flexionadas durante todo el ejercicio.","e":null,"h":null,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["tobillos","rodillas","cadera","hombros"]},"5622":{"n":"Flexión superman","v":"https://youtube.com/shorts/3JcTt6PCCxU","d":"Apóyate en las manos y puntas de los pies, con los brazos extendidos y el cuerpo recto. La diferencia con la flexión normal es que ahora las manos estarán adelantadas respecto a la cabeza. Flexiona los codos para descender, hasta llegar a apoyarte en tus antebrazos. Desde esta posición tensa el torso y empuja con los brazos para regresar a la posición inicial, manteniendo el torso como un bloque.\n\n- Si te parece muy difícil, coloca las manos más cerca de tu pecho. Si tampoco puedes así, apóyate en las rodillas en vez de las puntas de los pies.","e":null,"h":null,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5658":{"n":"Sentadilla búlgara (izquierda)","v":"https://youtube.com/shorts/o4NCvmGJ6wg","d":"Colócate de espaldas a una silla, sofá o banco, a una zancada de distancia. Eleva el pie izquierdo hasta apoyarlo en la esquina de la silla. Desciende hasta que tu rodilla izquierda quede muy cerca del suelo. Si la rodilla derecha se adelanta mucho respecto a la punta de tus pies sepárate un poco más del banco (zancada más amplia). El torso debería mantenerse recto o ligeramente inclinado hacia adelante. Al subir, cadera y Deltoides se elevan a la vez. Realiza todas las repeticiones indicadas por un lado y después por el otro.","e":null,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},"6020":{"n":"Sentadilla búlgara (derecha)","v":"https://youtube.com/shorts/drJZTTCpOrQ","d":"Colócate de espaldas a una silla, sofá o banco, a una zancada de distancia. Eleva el pie izquierdo hasta apoyarlo en la esquina de la silla. Desciende hasta que tu rodilla izquierda quede muy cerca del suelo. Si la rodilla derecha se adelanta mucho respecto a la punta de tus pies sepárate un poco más del banco (zancada más amplia). El torso debería mantenerse recto o ligeramente inclinado hacia adelante. Al subir, cadera y hombros se elevan a la vez.","e":null,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},"5609":{"n":"Plancha pivote","v":"https://youtube.com/shorts/Xd8H59mwXig","d":"Colócate en el suelo, apoyado sobre los antebrazos y las puntas de los pies, manteniendo el cuerpo recto. Desde esta posición, eleva la cadera todo lo que puedas, formando con el cuerpo una “V” invertida, y regresa a la posición inicial. Repite durante el tiempo (o repeticiones) indicado.","e":null,"h":null,"m":["recto mayor del abdomen","erector de la columna","abdominales transversos","pectorales"],"j":["tobillos","rodillas","cadera","hombros"]},"5654":{"n":"Flow a","v":"https://youtube.com/shorts/qyOCtuwI-Q8","d":"Antes de empezar, revisa bien el video y practica la secuencia. Te costará un poco al principio, pero pronto la interiorizarás.","e":null,"h":null,"m":["cuádriceps","glúteos","abductores","abdominales"],"j":["hombros","cadera","tobillos","rodillas","muñecas","codos"]},"5263":{"n":"Fondos","v":"https://youtu.be/muIQKozJdFA","d":"Sitúate de espaldas a una caja, banco o superficie elevada, apoya las manos en el filo la caja y los pies en el suelo, siendo solo los talones tu punto de apoyo. Desde aquí flexiona los codos dejándote caer controladamente hacia el suelo. Realiza una flexión de codos de 90º y termina con el movimiento inverso, estirándo los brazos completamente.\n\n**Ten en cuenta:**\n\n- Mantén la espalda recta. \n- Realiza el movimiento en la máxima amplitud posible.\n- Cuenta una repetición por cada flexión.","e":5866,"h":null,"m":["tríceps","pectorales"],"j":["codos","hombros","cadera"]},"5607":{"n":"Abdominales en semi V","v":"https://youtube.com/shorts/he2mGB_icCg","d":"Siéntate en el suelo, apoyando las manos detrás de ti y con las piernas flexionadas delante, juntando las rodillas. Desde esta posición lleva el torso hacia atrás y estira las piernas. Sin pausa, adelante ahora el torso y flexiona las rodillas, hasta que lleguen cerca del pecho.","e":5224,"h":null,"m":["recto mayor del abdomen","abdominales oblicuos"],"j":["cadera","rodillas"]},"5608":{"n":"Flexión hindú","v":"https://youtube.com/shorts/P8QnhvYlkKE","d":"Colócate boca abajo, apoyado en manos y punta de los pies, haciendo que tu cuerpo forme una “V” invertida. Flexiona los codos para que tu torso se mueva hacia abajo y hacia delante. Cuando tus codos llegan a unos 90° y tu cuerpo está paralelo al suelo, extiende los brazos para elevar el torso, pero dejando la cadera cerca del suelo. Ahora revierte el movimiento para volver a la posición inicial: flexiona codos, acerca el torso al suelo, eleva cadera y empuja de nuevo con los brazos.\n\n-Si no puedes hacer el ejercicio de esta manera, apoya los brazos en una superficie elevada para hacerlo más fácil.","e":null,"h":null,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","cadera"]},"5641":{"n":"Sentadilla con peso","v":"https://youtube.com/shorts/2F3PLMNkLC0","d":"Sujeta una kettlebell contra el pecho y colócate en la posición inicial de sentadilla: de pie, con los pies a la altura de los Deltoides y las puntas de los pies mirando ligeramente hacia fuera. \n\nDesde esta posición, lleva la cadera hacia atrás y flexiona las rodillas para descender, manteniendo el torso lo más recto que puedas, con una curvatura natural de la espalda. Desciende hasta que tus Cadera bajen por debajo de tus rodillas, y regresa a la posición inicial.\n\n- Si no tienes kettlebell utiliza cualquier peso, por ejemplo un bidón de agua.\n- Al descender, las rodillas deberían ir por encima de los pies, no dejes que colapsen hacia dentro.\n- Juega con la posición de los pies. Algunas personas necesitan separarlos un poco más para poder bajar suficiente.\n- Los talones nunca se despegan del suelo, debes pensar en aplicar fuerza en ellos en la subida.\n- Mantén la mirada al frente y el pecho elevado.\n- Cada vez que subas debes extender completamente la cadera y rodillas antes de volver a bajar.","e":null,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},"5613":{"n":"Desplante atrás con peso","v":"https://youtube.com/shorts/TJw_i4aacXE","d":"Empieza de pie, sujetando un peso delante de ti o con una mochila cargada en los Deltoides. Da una zancada hacia atrás con la rodilla derecha y agacha el torso, hasta que la rodilla se acerque al suelo, formando un ángulo aproximado de 90°, pero puede haber pequeñas variaciones en cada zancada.\n\nDesde esta posición, empuja con la punta del pie para regresar a la posición inicial, y repite por el lado izquierdo.","e":null,"h":null,"m":["glúteos","cuádriceps","isquiotibiales"],"j":["cadera","rodillas","tobillos"]},"5614":{"n":"Desplante lateral con peso","v":"https://youtube.com/shorts/Hoi4iVZ44BA","d":"Empieza de pie, sujetando un peso delante de ti o con una mochila cargada en los Deltoides. Da una zancada amplia hacia la derecha, flexionando la rodilla para llevar el torso hacia ese lado, todo lo que puedas sin perder el equilibrio. Sin pausa, regresa a la posición inicial y repite por el lado opuesto. Utiliza las manos para facilitar el equilibrio.","e":null,"h":null,"m":["glúteos","cuádriceps","isquiotibiales"],"j":["cadera","rodillas","tobillos"]},"5625":{"n":"Press (derecha)","v":"https://youtube.com/shorts/DxJUjjApPww","d":"Coloca la kettlebell en posición de rack: codo pegado al cuerpo, muñeca recta y kettlebell descansando en el triángulo que forma tu brazo con el pecho.\n\nDesde la posición de rack, tensa el abdomen y los Glúteos. Manteniendo las rodillas rectas, empuja con el hombro hasta estirar completamente el brazo. Mantén el hombro hacia atrás y hacia abajo (retracción escapular) para proteger la articulación.\n\nEn la posición final, con el brazo completamente estirado y el codo ‘bloqueado’, la kettlebell debe formar una línea recta con tu hombro, cadera y pie. En este punto la muñeca debe estar totalmente recta y el pulgar ligeramente rotado hacia atrás.\n\nPara bajar la kettlebell echa ligeramente hacia atrás el torso (manteniendo la tensión abdominal), permitiendo a la kettlebell descender de nuevo verticalmente hasta la posición de rack.\n\nInspira en la bajada, espira en la subida.","e":5584,"h":null,"m":["recto mayor del abdomen","glúteos","deltoides","tríceps"],"j":["muñecas","codos","hombros"]},"5656":{"n":"Press (izquierda)","v":"https://youtube.com/shorts/AhITaMJdJ9M","d":"Place kettlebell in rack position (elbow close to body, wrist straight, kettlebell resting on forearm and against chest).\n\nFrom here, engage abs and glutes. Keeping knees straight, push outwards from the shoulder, stretching the arm. Keep shoulders back and down (scapular retraction) to protect your shoulders.\n\nIn the final position (arm extended and elbow locked), the kettlebell should form a straight line with shoulder, hip, and foot. Wrist straight and thumb slightly rotated backwards.\n\nTo lower the kettlebell, shift torso slightly backwards while keeping abs engaged, allowing kettlebell to lower vertically to the rack position.\n\nInhale downwards and exhale while rising.","e":5584,"h":null,"m":["recto mayor del abdomen","glúteos","deltoides","tríceps"],"j":["muñecas","codos","hombros"]},"5626":{"n":"Remo (derecha)","v":"https://youtube.com/shorts/Hg3zOGinyV4","d":"Con la kettlebell entre los pies, da un paso atrás con el pie derecho, y agacha el torso hasta que esté casi paralelo con el suelo, permitiéndote tomar la kettlebell con la mano derecha. Apoya el antebrazo izquierdo sobre la rodilla y, sin mover el torso y manteniendo la retracción escapular (Deltoides hacia abajo y hacia atrás), eleva la kettlebell lo más alto que puedas, idealmente hasta que se acerque a tus costillas.\n\nRecuerda mantener la espalda recta y los abdominales tensos durante todo el movimiento. Realiza todas las repeticiones indicadas por un lado y después por el lado contrario.\n\nInspira antes de empezar el movimiento, espira mientras subes e inspira de nuevo mientras bajas.","e":5640,"h":null,"m":["bíceps","recto mayor del abdomen","pectorales"],"j":["cadera","hombros","codos"]},"5657":{"n":"Remo (izquierda)","v":"https://youtube.com/shorts/NidSpNjjOpA","d":"Con la kettlebell entre los pies, da un paso atrás con el pie derecho, y agacha el torso hasta que esté casi paralelo con el suelo, permitiéndote tomar la kettlebell con la mano derecha. Apoya el antebrazo izquierdo sobre la rodilla y, sin mover el torso y manteniendo la retracción escapular (Deltoides hacia abajo y hacia atrás), eleva la kettlebell lo más alto que puedas, idealmente hasta que se acerque a tus costillas.\n\nRecuerda mantener la espalda recta y los abdominales tensos durante todo el movimiento. Realiza todas las repeticiones indicadas por un lado y después por el lado contrario.\n\nInspira antes de empezar el movimiento, espira mientras subes e inspira de nuevo mientras bajas.","e":5640,"h":null,"m":["bíceps","recto mayor del abdomen","pectorales"],"j":["cadera","hombros","codos"]},"5616":{"n":"Flexión diamante","v":"https://youtube.com/shorts/a1Om0xc9nOU","d":"En este tipo de flexión, debes colocar las manos muy cerca, de tal manera que se toquen los dedos pulgares e índices, formando una especie de diamante (forma romboide).\n\nComo en la flexión normal, apóyate en las manos (colocadas como acabamos de indicar) y puntas de los pies, con los brazos extendidos y el cuerpo recto. Flexiona los codos para controlar la bajada, hasta que tu pecho llegue a tocar las manos o muy cerca de ellas, y empuja contra el suelo para volver a la posición inicial, estirando los brazos.\n\n- Mantén los codos cerca del cuerpo, en un ángulo de 45° o menos.\n- No permitas que la cadera colapse hacia abajo. Tensa abdominales y Glúteos para mantener el cuerpo recto.\n- Mantén el cuello neutral, alineado con el resto del cuerpo.","e":null,"h":5659,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5617":{"n":"Dominada con manos juntas","v":"https://youtube.com/shorts/VcoXOhh5UCo","d":"Cuélgate de la barra con agarre pronado (palmas mirando al frente), de tal manera que tus manos queden muy cerca (unos 5 cm).\n\nEleva ahora todo el cuerpo flexionando los codos, hasta que tu barbilla supere la barra. Desciende de manera controlada, hasta que tus brazos estén casi rectos y vuelve a subir.\n\n- Toma aire en la bajada (o antes de empezar a subir) y expúlsalo en la subida.\n- Si no puedes realizar todavía una dominada, utiliza la versión con salto o utiliza una silla de apoyo, ayudándote con las piernas. Intenta utilizar cada vez menos las piernas y cada vez más el cuerpo superior.\n- No hagas kipping. No debería haber movimiento en el cuerpo inferior. Como mucho un poco de impulso para completar la última repetición si vas al límite.","e":null,"h":6022,"m":["deltoides","bíceps","pectorales"],"j":["codos","hombros"]},"5618":{"n":"Flexión reptíl","v":"https://youtube.com/shorts/P_99QtzPwI0","d":"Apóyate en las manos y puntas de los pies, con los brazos extendidos y el cuerpo recto. Atrasa la mano derecha, apoyándola más cerca de la altura de la cadera. Flexiona los codos para controlar la bajada, hasta que tu pecho llegue a pocos centímetros del suelo, y empuja contra el suelo para volver a la posición inicial, estirando los brazos. Regresa la mano derecha a su lugar, retrasa ahora la izquierda y repite.\n\n- Mantén los codos cerca del cuerpo, en un ángulo de 45° o menos.\n- No permitas que la cadera colapse hacia abajo. Tensa abdominales y Glúteos para mantener el cuerpo recto.\n- Mantén el cuello neutral, alineado con el resto del cuerpo.","e":null,"h":null,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas"]},"5630":{"n":"Levantamiento turco con peso (derecha)","v":"https://youtube.com/shorts/KeNUdFSlcc8","d":"La posición inicial es tumbado, con el brazo derecho extendido, perpendicular al cuerpo, sujetando la kettlebell con la mano.\n\nDesde esta posición, dobla la rodilla derecha y apoya completamente la planta del pie, no demasiado cerca de la cadera. Inicia el movimiento con los abdominales, levantando el torso lo suficiente para empezar a llevar tu peso al codo izquierdo y, como si estuvieras girando sobre él, levanta el tronco del suelo, liderando el movimiento con el pecho, no con la cabeza. Te apoyas primero en el codo, después en el antebrazo y finalmente en la palma de la mano, extendiendo completamente el brazo izquierdo hasta bloquear el codo. El codo derecho se mantiene completamente extendido durante todo el movimiento.\n\nAhora levanta la cadera, lo suficiente para cruzar por debajo la pierna izquierda, apoyándote en la rodilla, que quedaría debajo de ti. En este momento ambos brazos deberían estar alineados, cercanos a la perpendicular con el suelo. Despega la mano izquierda del suelo, endereza el torso, acerca el pie derecho y levántate.\n\nDesde esta postura, debes revertir el movimiento, apoyando la rodilla izquierda en el suelo, apoyando la mano izquierda, elevando la cadera para estirar la pierna izquierda, bajando la cadera al suelo y controlando la caída hacia atrás, hasta llegar a la posición inicial. Realiza las repeticiones indicadas por un lado y después por el otro.\n\n- La kettlebell debe estar siempre sobre tu centro de gravedad, de lo contrario será difícil controlarla.\n- Si sientes que pierdes el control de la kettlebell, gira rápido tu torso hacia el lado que se inclina la kettlebell y haz un aterrizaje controlado, sin dejar que te doble el codo.\n- Respira de manera normal durante todo el ejercicio.","e":6026,"h":null,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["cadera","rodillas","hombros"]},"5653":{"n":"Levantamiento turco con peso (izquierda)","v":"https://youtube.com/shorts/WImTJUJa_8U","d":"La posición inicial es tumbado, con el brazo derecho extendido, perpendicular al cuerpo, sujetando la kettlebell con la mano.\n\nDesde esta posición, dobla la rodilla derecha y apoya completamente la planta del pie, no demasiado cerca de la cadera. Inicia el movimiento con los abdominales, levantando el torso lo suficiente para empezar a llevar tu peso al codo izquierdo y, como si estuvieras girando sobre él, levanta el tronco del suelo, liderando el movimiento con el pecho, no con la cabeza. Te apoyas primero en el codo, después en el antebrazo y finalmente en la palma de la mano, extendiendo completamente el brazo izquierdo hasta bloquear el codo. El codo derecho se mantiene completamente extendido durante todo el movimiento.\n\nAhora levanta la cadera, lo suficiente para cruzar por debajo la pierna izquierda, apoyándote en la rodilla, que quedaría debajo de ti. En este momento ambos brazos deberían estar alineados, cercanos a la perpendicular con el suelo. Despega la mano izquierda del suelo, endereza el torso, acerca el pie derecho y levántate.\n\nDesde esta postura, debes revertir el movimiento, apoyando la rodilla izquierda en el suelo, apoyando la mano izquierda, elevando la cadera para estirar la pierna izquierda, bajando la cadera al suelo y controlando la caída hacia atrás, hasta llegar a la posición inicial. Realiza las repeticiones indicadas por un lado y después por el otro.\n\n- La kettlebell debe estar siempre sobre tu centro de gravedad, de lo contrario será difícil controlarla.\n- Si sientes que pierdes el control de la kettlebell, gira rápido tu torso hacia el lado que se inclina la kettlebell y haz un aterrizaje controlado, sin dejar que te doble el codo.\n- Respira de manera normal durante todo el ejercicio.","e":5642,"h":null,"m":["recto mayor del abdomen","glúteos","cuádriceps"],"j":["hombros","cadera","rodillas"]},"5619":{"n":"Peso muerto 1 pierna con KB (derecha)","v":"https://youtube.com/shorts/5OZQZ8bso-Q","d":"Estando de pie, con el cuerpo recto y la kettlebell en las manos, eleva ligeramente el pie derecho y, manteniendo el torso recto y la pierna izquierda estirada, acerca el torso hacia el suelo, idealmente hasta que la kettlebell toque ligeramente el suelo, y regresa a la posición inicial. Lleva la pierna derecha hacia atrás para actuar como contrapeso, manteniéndola alineada con el torso durante el movimiento.\n\n- Si no tienes suficiente flexibilidad, puedes flexionar ligeramente la rodilla de la pierna de apoyo.\n- Si te resulta muy difícil, empieza haciendo el movimiento sin peso, o con algo que pese menos que la kettlebell.","e":6024,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},"5644":{"n":"Peso muerto 1 pierna con KB (izquierda)","v":"https://youtube.com/shorts/Kr-oL3-kb5Y","d":"Estando de pie, con el cuerpo recto y la kettlebell en las manos, eleva ligeramente el pie derecho y, manteniendo el torso recto y la pierna izquierda estirada, acerca el torso hacia el suelo, idealmente hasta que la kettlebell toque ligeramente el suelo, y regresa a la posición inicial. Lleva la pierna derecha hacia atrás para actuar como contrapeso, manteniéndola alineada con el torso durante el movimiento.\n\n- Si no tienes suficiente flexibilidad, puedes flexionar ligeramente la rodilla de la pierna de apoyo.\n- Si te resulta muy difícil, empieza haciendo el movimiento sin peso, o con algo que pese menos que la kettlebell.","e":6028,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["rodillas","cadera","tobillos"]},"5631":{"n":"Step up con peso","v":"https://youtube.com/shorts/cU7J2A_dFJ4","d":"Sujetando algún peso, colócate delante de una superficie elevada (silla, banco etc.) que esté a la altura de tu rodilla o algo más baja. Coloca el pie derecho sobre la superficie elevada, apoyando completamente la planta. Impúlsate para subir con ambos pies a la plataforma, extendiendo completamente rodillas y cadera. Regresa ahora el pie izquierdo al suelo y después el derecho, volviendo a la posición inicial. Repite el movimiento pero subiendo ahora con el pie izquierdo y descendiendo con el derecho. Alterna cada pierna hasta completar las repeticiones indicadas.\n\n- Si utilizas una silla asegúrate que no resbala. Puedes colocar una alfombra debajo por ejemplo.\n- Si utilizas sólo un peso (kettlebell, bidón de agua…), sujétalo con ambas manos delante del pecho. Si utilizas dos (como mancuernas) sujétalos con las manos a ambos lados del cuerpo.","e":null,"h":null,"m":["cuádriceps","glúteos","isquiotibiales"],"j":["tobillos","rodillas","cadera"]},"6029":{"n":"Molino con peso (derecha)","v":"https://youtube.com/shorts/1DVNc2Ise1M","d":"","e":5647,"h":null,"m":["isquiotibiales","gemelos","glúteos"],"j":["cadera","hombros","rodillas"]},"6036":{"n":"Molino con peso (izquierda)","v":"https://youtube.com/shorts/79JNfTA_GVg","d":"","e":5661,"h":null,"m":["isquiotibiales","gemelos","glúteos"],"j":["cadera","hombros","rodillas"]},"5621":{"n":"Flexión araña","v":"https://youtube.com/shorts/SefHgZJWLsw","d":"Apóyate en las manos y puntas de los pies, con los brazos extendidos y el cuerpo recto. Flexiona los codos para descender, a la vez que flexionas la rodilla derecha para acercarla al codo derecho, manteniendo el pie en el aire. Cuando tu pecho llegue a pocos centímetros del suelo, empuja con los brazos para volver a la posición inicial, regresando también la pierna a su situación de partida. Vuelve a bajar el torso pero adelantando esta vez la pierna izquierda. Continúa hasta completar las repeticiones indicadas, alternando lados.\n\n- Mantén los codos cerca del cuerpo, en un ángulo de 45° o menos.\n- No permitas que la cadera colapse hacia abajo. Tensa abdominales y Glúteos para mantener el cuerpo recto.\n- Mantén el cuello neutral, alineado con el resto del cuerpo.","e":null,"h":null,"m":["pectorales","tríceps","deltoides"],"j":["codos","hombros","muñecas","rodillas"]},"6032":{"n":"Flow b","v":"https://youtube.com/shorts/zllyQs_UxBU","d":"Antes de empezar, revisa bien el video y practica la secuencia. Te costará un poco al principio, pero pronto la interiorizarás.","e":null,"h":null,"m":["cuádriceps","glúteos","abductores","abdominales","tríceps"],"j":["hombros","cadera","tobillos","rodillas","muñecas","codos"]},"5612":{"n":"Desplante adelante con peso","v":"https://youtube.com/shorts/RMWG_V60Ges","d":"Empieza de pie, sujetando un peso delante de ti o con una mochila cargada en los Deltoides. Da una zancada hacia delante con la rodilla derecha y agacha el torso, hasta que la rodilla llegue prácticamente al suelo. En este punto ambas rodillas deberían formar un ángulo aproximado de 90°, pero puede haber pequeñas variaciones en cada zancada.\n\nDesde esta posición, empuja con el talón derecho para regresar a la posición inicial, y repite por el lado izquierdo.","e":null,"h":null,"m":["glúteos","cuádriceps","isquiotibiales"],"j":["cadera","rodillas","tobillos"]},"5604":{"n":"Sentadilla búlgara con peso (derecha)","v":"https://youtube.com/shorts/puJcuKI4KYA","d":"Colócate de espaldas a una silla, sofá o banco, a una zancada de distancia, con algún peso en tus manos o una mochila cargada. Eleva el pie izquierdo hasta apoyarlo en la esquina de la silla. Desciende hasta que tu rodilla izquierda quede muy cerca del suelo. Si la rodilla derecha se adelanta mucho respecto a la punta de tus pies sepárate un poco más del banco (zancada más amplia). El torso debería mantenerse recto o ligeramente inclinado hacia adelante. Al subir, cadera y Deltoides se elevan a la vez. Realiza todas las repeticiones indicadas por un lado y después por el otro.\n\n- Puedes coger un peso delante de ti (pegado al pecho), coger peso con ambas manos (manteniendo los brazos a los lados del cuerpo) o cargar una mochila con peso a la espalda.","e":null,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},"5643":{"n":"Sentadilla búlgara con peso (izquierda)","v":"https://youtube.com/shorts/pjF7iXQwR-c","d":"Colócate de espaldas a una silla, sofá o banco, a una zancada de distancia, con algún peso en tus manos o una mochila cargada. Eleva el pie izquierdo hasta apoyarlo en la esquina de la silla. Desciende hasta que tu rodilla izquierda quede muy cerca del suelo. Si la rodilla derecha se adelanta mucho respecto a la punta de tus pies sepárate un poco más del banco (zancada más amplia). El torso debería mantenerse recto o ligeramente inclinado hacia adelante. Al subir, cadera y Deltoides se elevan a la vez. Realiza todas las repeticiones indicadas por un lado y después por el otro.\n\n- Puedes coger un peso delante de ti (pegado al pecho), coger peso con ambas manos (manteniendo los brazos a los lados del cuerpo) o cargar una mochila con peso a la espalda.","e":null,"h":null,"m":["cuádriceps","isquiotibiales","glúteos"],"j":["cadera","rodillas","tobillos"]},"5627":{"n":"Pendulo","v":"https://youtube.com/shorts/fMRSPGyQeb8","d":"Coloca la kettlebell entre tus pies, ligeramente adelantada respecto a ellos. Flexiona la cadera, manteniendo la espalda recta.\n\nAl agarrar la kettlebell con ambas manos, asegúrate que tienes los Deltoides en posición estable, hacia atrás y hacia abajo, y el pecho elevado, con la espalda recta y una ligera curva lumbar.\n\nLevanta la kettlebell hacia ti, con el peso en los talones y sin adelantar las rodillas. Utiliza los brazos para guiar la kettlebell por debajo de las piernas y cuando tus antebrazos toquen el interior de tus muslos, empuja de manera explosiva con la cadera para lanzar la kettlebell hacia adelante y hacia arriba.\n\nLa fuerza se origina en las Cadera, pero piensa que estás realmente impulsando la kettlebell con todo el cuerpo. Para que esta transmisión sea eficiente, mantén los brazos pegados al cuerpo durante la fase inicial del movimiento.\n\nDurante el ascenso debes mantener los brazos relajados. Una ligera flexión de los codos es admisible, y facilita mantener la retracción escapular. \n\nEl objetivo es llevar la kettlebell más o menos a la altura del pecho, o idealmente a la altura de la frente, pero no más arriba. No te preocupes si te lleva varias repeticiones llegar a ese punto.\n\nDesde esta posición, deja que la gravedad atraiga la kettlebell hacia el suelo, guiando con tus brazos para que pase de nuevo por debajo de las piernas, manteniendo la espalda recta y flexionando la cadera (y rodillas) cuando tus brazos se acercan al cuerpo. Aprovecha la energía elástica acumulada en el descenso para explotar de nuevo con la cadera, que empuja los brazos para la siguiente repetición.","e":5655,"h":null,"m":["glúteos","cuádriceps"],"j":["hombros","muñecas","cadera"]},"5589":{"n":"Salto de skater","v":"https://youtube.com/shorts/17y_A5vd6e0","d":"Empieza de pie, con el cuerpo recto, y da un salto hacia la derecha, aterrizando con el pie derecho a la vez que cruzas por detrás la pierna izquierda. Sin pausa, realiza ahora el mismo movimiento hacia la izquierda, dando un salto lateral y cruzando la pierna derecha por detrás de la izquierda al aterrizar. Alterna saltos por cada lado hasta completar el tiempo indicado.\n\n- Empieza dando saltos pequeños, aumentando la distancia a medida que ganas práctica y equilibrio.\n- Mantén la cadera un poco flexionada, adelantando ligeramente el torso, pero manteniendo la espalda en posición neutra.","e":null,"h":null,"m":["glúteos","isquiotibiales","cuádriceps"],"j":["cadera","rodillas","tobillos"]},"5628":{"n":"Clean (derecha)","v":"https://youtube.com/shorts/t5OG-NLd8No","d":"Coloca la kettlebell entre tus pies, ligeramente adelantada respecto a ellos. Flexiona la cadera, manteniendo la espalda recta.\n\nAgarra la kettlebell con la mano derecha, asegurando que tienes los Deltoides en posición estable, hacia atrás y hacia abajo, y el pecho elevado, con la espalda recta y una ligera curva lumbar.\n\nLevanta la kettlebell hacia ti, con el peso en los talones y sin adelantar las rodillas. Utiliza el brazo para guiar la kettlebell por debajo de las piernas y cuando tu antebrazo toque el interior de tus muslos, empuja de manera explosiva con la cadera para lanzar la kettlebell hacia adelante y hacia arriba, sin permitir que se adelante mucho, sino más cercana a una subida en vertical.\n\nPara lograr esta subida cercana a la vertical debes mantener el codo más flexionado y dar un golpe hacia atrás con la espalda (por el lado donde sujetas la kettlebell), aproximadamente cuando la kettlebell va subiendo a la altura de la cadera.\n\nLa idea es 'recibir' la kettlebell de manera controlada, no permitiendo que te golpee el antebrazo. Cuando estás a punto de entrar en contacto con la kettlebell relaja el agarre y deja que la kettlebell 'ruede' alrededor de tu antebrazo, en vez de girar por encima. Para lograr esto piensa en meter la mano rápidamente a través del asa, haciendo que se apoye en el talón de la mano.\n\nDesde la posición de rack, lleva la cadera ligeramente hacia atrás, dejando caer la kettlebell casi verticalmente, no la lances hacia adelante. En la caída, guía la kettlebell con el brazo, y cuando este se estire completamente flexiona un poco más las rodillas para amortiguar la caída, realizando el swing hacia atrás, por debajo de las piernas. A medida que desciende la kettlebell rota internamente tu mano para que el pulgar apunte hacia atrás (45-90°) al final del swing descendente. En este momento abre de nuevo las Cadera a la vez que extiendes las rodillas para iniciar la siguiente repetición.","e":5233,"h":null,"m":["glúteos","cuádriceps","deltoides"],"j":["rodillas","cadera","hombros"]},"5649":{"n":"Clean (izquierda)","v":"https://youtube.com/shorts/XiUp_ztN_64","d":"Coloca la kettlebell entre tus pies, ligeramente adelantada respecto a ellos. Flexiona la cadera, manteniendo la espalda recta.\n\nA
