name: Compilar app Garmin (Marcador Padel)

on:
  push:
    paths:
      - 'garmin-marcador/**'
      - '.github/workflows/garmin-marcador.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/matco/connectiq-tester:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Compilar para Forerunner 245 Music
        shell: bash
        run: |
          set -e
          MC=$(find / -name monkeyc -type f -not -path '/proc/*' 2>/dev/null | head -1)
          DEV=$(find / -type d -name fr245m -not -path '/proc/*' 2>/dev/null | head -1)
          echo "monkeyc: $MC"
          echo "device:  $DEV"
          test -n "$MC" && test -n "$DEV"
          # monkeyc busca los dispositivos en $HOME/.Garmin/ConnectIQ/Devices
          export HOME=$(dirname "$(dirname "$(dirname "$(dirname "$DEV")")")")
          echo "HOME: $HOME"
          command -v openssl >/dev/null || (apt-get update -qq && apt-get install -y -qq openssl)
          openssl genrsa -out /tmp/key.pem 4096 2>/dev/null
          openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/key.pem -out /tmp/key.der -nocrypt
          mkdir -p out
          cd garmin-marcador
          "$MC" -d fr245m -f monkey.jungle -o ../out/marcador-padel-fr245m.prg -y /tmp/key.der -l 0 -w
          "$MC" -d fr245 -f monkey.jungle -o ../out/marcador-padel-fr245.prg -y /tmp/key.der -l 0 -w
          ls -l ../out

      - uses: actions/upload-artifact@v4
        with:
          name: marcador-padel
          path: out/*.prg

      - name: Probar en el simulador (capturas)
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          export HOME=/root
          apt-get update -qq >/dev/null 2>&1 || true
          apt-get install -y -qq xvfb xdotool imagemagick x11-utils >/dev/null 2>&1 || true
          mkdir -p shots
          Xvfb :9 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          export DISPLAY=:9
          sleep 3
          /connectiq/bin/simulator >/tmp/sim.log 2>&1 &
          sleep 12
          /connectiq/bin/monkeydo out/marcador-padel-fr245m.prg fr245m >/tmp/run.log 2>&1 &
          sleep 20
          shot() { import -window root "shots/$1.png" || true; }
          key() { xdotool key --delay 400 "$@" || true; sleep 1; }
          xdotool search --name . getwindowname %@ 2>/dev/null | sort | uniq | head -20 || true
          WID=$(xdotool search --name 'CIQ Simulator' 2>/dev/null | tail -1); echo "ventana: $WID"
          [ -n "$WID" ] && xdotool windowactivate "$WID" 2>/dev/null; [ -n "$WID" ] && xdotool windowfocus "$WID" 2>/dev/null
          xdotool getwindowgeometry "$WID" || true
          shot 01-inicio
          key Up Up Up Down
          shot 02-puntos
          key Up
          shot 03-juego
          key Return
          shot 04-menu
          key Escape
          key Escape
          shot 05-deshacer
          echo '--- run.log'; tail -30 /tmp/run.log || true
          echo '--- sim.log'; tail -15 /tmp/sim.log || true

      - name: Guardar capturas en una rama temporal
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          command -v git >/dev/null || apt-get install -y -qq git >/dev/null 2>&1
          cd shots && git init -q && git config user.email "actions@github.com" && git config user.name "github-actions"
          git add -A && git commit -q -m "Capturas del simulador" && git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/garmin-capturas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-simulador
          path: shots/*.png
          if-no-files-found: ignore

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: garmin-marcador
          name: Marcador Padel para Garmin
          body: App del reloj (Forerunner 245 / 245 Music). Copiar el archivo .prg a la carpeta GARMIN/APPS del reloj.
          files: out/*.prg
          target_commitish: ${{ github.sha }}
